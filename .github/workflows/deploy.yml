name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "KiloOS/**"
      - "scripts/prune_firebase_versions.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Algorithmic Security Lint & Trademark Check
        run: python scripts/security_lint.py

      - name: Enforce 999KB Limit
        run: python check_sizes.py

      - name: Install Dependencies
        run: |
          cd KiloOS
          npm ci --ignore-scripts

      - name: Build Web App
        run: |
          cd KiloOS
          npm run build

      - name: Prune Old Firebase Hosting Versions
        env:
          FIREBASE_SERVICE_ACCOUNT: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KILOAPPS }}"
        run: python scripts/prune_firebase_versions.py --keep 3 --max-pages 5 --max-delete 50 --workers 8

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KILOAPPS }}"
          projectId: kiloapps
          channelId: live
          entryPoint: KiloOS
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
