name: Byte-Budget Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Byte-Budget Enforcement Gate
        run: python scripts/byte_budget_gate.py

      - name: Verify Tiered Context Packing & Export Integrity
        run: python scripts/pack_tiered_context.py
