name: Gatekeeper PR Verification (Auto-Merge Disabled)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

jobs:
  gatekeeper-verify-only:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Upstream Main Base
        shell: bash
        run: |
          git fetch origin main

      - name: Set up MSVC & Win32 C Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'KiloOS/package-lock.json'

      - name: Gate 0 - Algorithmic Security Lint & Immutability Check (Trusted Main)
        shell: pwsh
        run: |
          git show origin/main:scripts/security_lint.py | Out-File -FilePath "$env:TEMP\trusted_lint.py" -Encoding utf8
          python "$env:TEMP\trusted_lint.py" --pr --base origin/main

      - name: Install Frontend Dependencies (Sandboxed)
        shell: pwsh
        run: |
          cd KiloOS
          npm ci --ignore-scripts

      - name: Gate 1 - Check 999KB Size Ceiling
        shell: pwsh
        run: |
          python check_sizes.py

      - name: Gate 2 - Verify React/Vite Frontend Build
        shell: pwsh
        run: |
          cd KiloOS
          npm run build

      - name: Gate 3 - Manual Review Required (Auto-Merge Disabled)
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host "ALL COMPILER, SIZE, AND SECURITY GATES PASSED."
          Write-Host "Autonomous PR auto-merge is DISABLED by maintainer policy."
          Write-Host "This PR is held for manual human review and merge."
          Write-Host "============================================================"
