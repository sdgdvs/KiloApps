# KiloApps Netlify Redundant Hosting Configuration
# Provides instant failover hosting if Firebase Hosting ever encounters outages or account issues.

[build]
  base = "KiloOS"
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
