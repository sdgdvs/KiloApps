<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMystery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #d3d3d3;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            box-shadow: inset 0 0 100px #000;
        }
        #header {
            background-color: #050505;
            padding: 10px 20px;
            border-bottom: 2px double #444;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 2px 2px 5px #000;
            text-transform: uppercase;
        }
        .hidden {
            display: none !important;
        }
        #start-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }
        .container {
            text-align: center;
            border: 1px solid #333;
            padding: 40px;
            background-color: rgba(0,0,0,0.8);
            box-shadow: 0 0 20px #000;
        }
        #game-screen {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, #151515 0%, #000 100%);
        }
        .panel {
            background-color: rgba(10, 10, 10, 0.9);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 2px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: inset 0 0 20px #000, 0 0 10px #000;
        }
        h2, h3 {
            margin-top: 0;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h2 {
            border-bottom: 2px double #444;
            padding-bottom: 5px;
        }
        ul {
            list-style-type: square;
            padding: 0 0 0 20px;
            margin: 0 0 15px 0;
        }
        li {
            padding: 5px 0;
            border-bottom: 1px dashed #222;
        }
        button {
            background-color: #0f0f0f;
            color: #d3d3d3;
            border: 1px solid #444;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            margin: 5px 0;
            box-shadow: 2px 2px 5px #000;
        }
        button:hover:not(:disabled) {
            background-color: #2a2a2a;
            border-color: #666;
            color: #fff;
        }
        button:disabled {
            color: #555;
            cursor: not-allowed;
            background-color: #050505;
            border-color: #222;
            box-shadow: none;
        }
        #travel-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #location-description {
            margin-bottom: 15px;
            line-height: 1.4;
        }
        #action-area {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #444;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>KMystery</h1>
    </div>
    
    <div id="start-screen">
        <div class="container">
            <p>Detective, a murder has occurred.</p>
            <button onclick="startGame()">Start Investigation</button>
        </div>
    </div>
    
    <div id="game-screen" class="hidden">
        <div class="panel" id="main-panel">
            <h2>Location: <span id="current-location">Office</span></h2>
            <div id="location-description">
                You are in your office. The phone just rang about a murder.
            </div>
            <div id="action-area">
                <button id="search-btn" onclick="searchLocation()">Search for Clues</button>
            </div>
            <h3>Travel</h3>
            <div id="travel-buttons">
                <!-- Travel buttons generated here -->
            </div>
        </div>
        
        <div class="panel" id="notebook-panel">
            <h2>Notebook</h2>
            <h3>Suspects</h3>
            <ul id="suspect-list">
                <li>No suspects yet.</li>
            </ul>
            <h3>Clues</h3>
            <ul id="clue-list">
                <li>No clues found.</li>
            </ul>
        </div>
    </div>

    <script>
        const state = {
            currentLocation: 'Office',
            locations: {
                'Office': {
                    desc: 'Your dingy office. Dust motes dance in the light filtering through the blinds.',
                    searched: false,
                    clue: '',
                    clueFound: false
                },
                'The Manor': {
                    desc: 'The sprawling estate where the victim was found. Yellow police tape blocks the study.',
                    searched: false,
                    clue: '',
                    clueFound: false
                },
                'The Docks': {
                    desc: 'Smells like salt and secrets. The fog here is thick enough to cut with a knife.',
                    searched: false,
                    clue: '',
                    clueFound: false
                }
            },
            suspects: [
                'Mr. Black',
                'Miss Scarlet',
                'Colonel Mustard'
            ],
            foundClues: [],
            knownSuspects: [],
            solution: {}
        };

        const motives = ['Revenge', 'Greed', 'Jealousy'];
        const weapons = ['Revolver', 'Poison', 'Lead Pipe'];
        
        const killerClueMap = {
            'Mr. Black': 'A cufflink with an onyx stone.',
            'Miss Scarlet': 'A faint scent of expensive rose perfume.',
            'Colonel Mustard': 'A polished brass military button.'
        };
        const motiveClueMap = {
            'Revenge': 'A crumpled letter swearing vengeance.',
            'Greed': 'An altered will leaving everything to the killer.',
            'Jealousy': 'A torn photograph of a happy couple, with one face scratched out.'
        };
        const weaponClueMap = {
            'Revolver': 'A spent .38 caliber shell casing.',
            'Poison': 'A discarded vial smelling of bitter almonds.',
            'Lead Pipe': 'A heavy, blood-stained lead pipe hidden in the corner.'
        };

        function generateMystery() {
            const killer = state.suspects[Math.floor(Math.random() * state.suspects.length)];
            const motive = motives[Math.floor(Math.random() * motives.length)];
            const weapon = weapons[Math.floor(Math.random() * weapons.length)];
            
            state.solution = { killer, motive, weapon };
            
            const clues = [
                killerClueMap[killer],
                motiveClueMap[motive],
                weaponClueMap[weapon]
            ];
            
            // Shuffle clues
            for (let i = clues.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [clues[i], clues[j]] = [clues[j], clues[i]];
            }
            
            const locKeys = Object.keys(state.locations);
            for(let i = 0; i < 3; i++) {
                state.locations[locKeys[i]].clue = clues[i];
                state.locations[locKeys[i]].searched = false;
                state.locations[locKeys[i]].clueFound = false;
            }
            state.foundClues = [];
        }

        function startGame() {
            generateMystery();
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            // Add suspects to notebook
            state.knownSuspects = [...state.suspects];
            
            updateNotebook();
            updateLocation();
        }

        function updateLocation() {
            const loc = state.locations[state.currentLocation];
            document.getElementById('current-location').textContent = state.currentLocation;
            document.getElementById('location-description').textContent = loc.desc;
            
            const searchBtn = document.getElementById('search-btn');
            if (loc.searched) {
                searchBtn.disabled = true;
                searchBtn.textContent = "Already searched";
            } else {
                searchBtn.disabled = false;
                searchBtn.textContent = "Search for Clues";
            }

            renderTravelButtons();
        }

        function searchLocation() {
            const loc = state.locations[state.currentLocation];
            if (!loc.searched) {
                loc.searched = true;
                if (loc.clue) {
                    loc.clueFound = true;
                    state.foundClues.push(`[${state.currentLocation}] ${loc.clue}`);
                    alert(`You found a clue: ${loc.clue}`);
                } else {
                    alert("You didn't find anything useful here.");
                }
                updateLocation();
                updateNotebook();
            }
        }

        function travel(locationName) {
            if (state.locations[locationName]) {
                state.currentLocation = locationName;
                updateLocation();
            }
        }

        function renderTravelButtons() {
            const container = document.getElementById('travel-buttons');
            container.innerHTML = '';
            for (const loc in state.locations) {
                if (loc !== state.currentLocation) {
                    const btn = document.createElement('button');
                    btn.textContent = `Travel to ${loc}`;
                    btn.onclick = () => travel(loc);
                    container.appendChild(btn);
                }
            }
        }

        function updateNotebook() {
            const suspectList = document.getElementById('suspect-list');
            if (state.knownSuspects.length > 0) {
                suspectList.innerHTML = state.knownSuspects.map(s => `<li>${s}</li>`).join('');
            } else {
                suspectList.innerHTML = '<li>No suspects yet.</li>';
            }

            const clueList = document.getElementById('clue-list');
            if (state.foundClues.length > 0) {
                clueList.innerHTML = state.foundClues.map(c => `<li>${c}</li>`).join('');
            } else {
                clueList.innerHTML = '<li>No clues found.</li>';
            }
        }
    </script>
</body>
</html>
