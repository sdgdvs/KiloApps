<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KTrader</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #000;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      color: #0ff;
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
    }
    h1 {
      border-bottom: 1px solid #0ff;
      padding-bottom: 10px;
      text-shadow: 0 0 10px #0ff;
      box-shadow: 0 10px 10px -10px #0ff;
    }
    .panel {
      border: 1px solid #0ff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.1);
      padding: 15px;
      margin-top: 15px;
      background-color: rgba(0, 15, 20, 0.85);
      border-radius: 4px;
    }
    .dashboard-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 1.2em;
    }
    button {
      background-color: rgba(0, 30, 40, 0.8);
      color: #0ff;
      border: 1px solid #0ff;
      box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover {
      background-color: #0ff;
      color: #000;
      box-shadow: 0 0 15px #0ff;
    }
    button:disabled {
      border-color: #555;
      color: #555;
      cursor: not-allowed;
      background-color: rgba(0, 0, 0, 0.8);
      box-shadow: none;
    }
    .log-panel {
      height: 150px;
      overflow-y: auto;
      font-size: 0.9em;
      border-top: 1px dashed #0ff;
      padding-top: 10px;
      margin-top: 15px;
    }
    .log-entry { margin: 2px 0; }
    .warning { color: #f00; text-shadow: 0 0 5px #f00; }
  </style>
</head>
<body>
  <h1>KTrader Space Trading Sim</h1>
  
  <div class="panel">
    <div class="dashboard-stats">
      <span id="ui-credits">Credits: 1000</span>
      <span id="ui-fuel">Fuel: 100 / 100</span>
      <span id="ui-cargo">Cargo: 0 / 20</span>
      <span id="ui-weapons">Weapons: Lv 0</span>
    </div>
  </div>

  <div class="panel" style="display: flex; gap: 20px;">
    <div style="flex: 1;">
      <h2 style="margin-top: 0;">Navigation</h2>
      <p>Current Location: <strong id="ui-location">Earth</strong></p>
      <div id="destinations"></div>
    </div>
    
    <div style="flex: 1;">
      <h2 style="margin-top: 0;">Market</h2>
      <table style="width:100%; text-align:left; border-collapse:collapse;" id="market-table">
        <thead>
          <tr style="border-bottom:1px solid #0ff;">
            <th>Good</th>
            <th>Price</th>
            <th>Owned</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="market-body">
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <h2 style="margin-top: 0;">Shipyard</h2>
    <div id="ui-shipyard" style="display: flex; gap: 10px;">
    </div>
  </div>

  <div class="panel log-panel" id="ui-log">
    <div class="log-entry">Welcome to KTrader, Captain.</div>
  </div>

  <script>
    const goods = ["Food", "Water", "Ore", "Tech", "Meds"];
    const state = {
      credits: 1000,
      fuel: 100,
      maxFuel: 100,
      cargo: 0,
      maxCargo: 20,
      location: "Earth",
      inventory: { Food: 0, Water: 0, Ore: 0, Tech: 0, Meds: 0 },
      engineLevel: 0,
      cargoLevel: 0,
      weaponLevel: 0
    };

    const planets = {
      "Earth": { distance: { "Mars": 20, "Venus": 15 } },
      "Mars": { distance: { "Earth": 20, "Venus": 25 } },
      "Venus": { distance: { "Earth": 15, "Mars": 25 } }
    };

    const marketBases = {
      "Earth": { Food: 10, Water: 15, Ore: 60, Tech: 100, Meds: 40 },
      "Mars":  { Food: 40, Water: 50, Ore: 20, Tech: 120, Meds: 50 },
      "Venus": { Food: 50, Water: 40, Ore: 70, Tech: 30, Meds: 90 }
    };

    let currentPrices = {};

    function generatePrices() {
      const bases = marketBases[state.location];
      for (const good of goods) {
        const base = bases[good];
        const variance = Math.floor(base * 0.2);
        currentPrices[good] = base - variance + Math.floor(Math.random() * (variance * 2 + 1));
      }
    }

    function log(msg, isWarning=false) {
      const el = document.getElementById('ui-log');
      const entry = document.createElement('div');
      entry.className = 'log-entry' + (isWarning ? ' warning' : '');
      entry.textContent = '> ' + msg;
      el.appendChild(entry);
      el.scrollTop = el.scrollHeight;
    }

    function updateUI() {
      document.getElementById('ui-credits').textContent = `Credits: ${state.credits}`;
      document.getElementById('ui-fuel').textContent = `Fuel: ${state.fuel} / ${state.maxFuel}`;
      document.getElementById('ui-cargo').textContent = `Cargo: ${state.cargo} / ${state.maxCargo}`;
      document.getElementById('ui-weapons').textContent = `Weapons: Lv ${state.weaponLevel}`;
      document.getElementById('ui-location').textContent = state.location;

      const destContainer = document.getElementById('destinations');
      destContainer.innerHTML = '';
      
      const currentPlanet = planets[state.location];
      for (const [target, cost] of Object.entries(currentPlanet.distance)) {
        let actualCost = cost - state.engineLevel * 2;
        if (actualCost < 1) actualCost = 1;

        const btn = document.createElement('button');
        btn.textContent = `Travel to ${target} (${actualCost} fuel)`;
        if (state.fuel < actualCost) {
          btn.disabled = true;
        }
        btn.onclick = () => travel(target, actualCost);
        destContainer.appendChild(btn);
      }

      const marketBody = document.getElementById('market-body');
      marketBody.innerHTML = '';
      for (const good of goods) {
        const price = currentPrices[good];
        const owned = state.inventory[good];
        
        const tr = document.createElement('tr');
        
        const tdName = document.createElement('td');
        tdName.textContent = good;
        tr.appendChild(tdName);

        const tdPrice = document.createElement('td');
        tdPrice.textContent = `${price} cr`;
        tr.appendChild(tdPrice);

        const tdOwned = document.createElement('td');
        tdOwned.textContent = owned;
        tr.appendChild(tdOwned);

        const tdAction = document.createElement('td');
        const buyBtn = document.createElement('button');
        buyBtn.textContent = 'Buy';
        buyBtn.style.padding = '2px 5px';
        buyBtn.style.margin = '2px';
        buyBtn.disabled = state.credits < price || state.cargo >= state.maxCargo;
        buyBtn.onclick = () => buyGood(good, price);
        
        const sellBtn = document.createElement('button');
        sellBtn.textContent = 'Sell';
        sellBtn.style.padding = '2px 5px';
        sellBtn.style.margin = '2px';
        sellBtn.disabled = owned <= 0;
        sellBtn.onclick = () => sellGood(good, price);

        tdAction.appendChild(buyBtn);
        tdAction.appendChild(sellBtn);
        tr.appendChild(tdAction);

        marketBody.appendChild(tr);
      }

      const shipyard = document.getElementById('ui-shipyard');
      shipyard.innerHTML = '';
      
      const cargoCost = 500 * (state.cargoLevel + 1);
      const engineCost = 1000 * (state.engineLevel + 1);
      const weaponCost = 1500 * (state.weaponLevel + 1);

      const btnCargo = document.createElement('button');
      btnCargo.textContent = `Upgrade Cargo (${cargoCost} cr)`;
      btnCargo.disabled = state.credits < cargoCost;
      btnCargo.onclick = () => buyUpgrade('cargo', cargoCost);
      shipyard.appendChild(btnCargo);

      const btnEngine = document.createElement('button');
      btnEngine.textContent = `Upgrade Engine (${engineCost} cr)`;
      btnEngine.disabled = state.credits < engineCost;
      btnEngine.onclick = () => buyUpgrade('engine', engineCost);
      shipyard.appendChild(btnEngine);

      const btnWeapon = document.createElement('button');
      btnWeapon.textContent = `Upgrade Weapons (${weaponCost} cr)`;
      btnWeapon.disabled = state.credits < weaponCost;
      btnWeapon.onclick = () => buyUpgrade('weapons', weaponCost);
      shipyard.appendChild(btnWeapon);
    }

    function buyGood(good, price) {
      if (state.credits >= price && state.cargo < state.maxCargo) {
        state.credits -= price;
        state.inventory[good]++;
        state.cargo++;
        log(`Bought 1 ${good} for ${price} cr.`);
        updateUI();
      }
    }

    function sellGood(good, price) {
      if (state.inventory[good] > 0) {
        state.credits += price;
        state.inventory[good]--;
        state.cargo--;
        log(`Sold 1 ${good} for ${price} cr.`);
        updateUI();
      }
    }

    function buyUpgrade(type, cost) {
      if (state.credits >= cost) {
        state.credits -= cost;
        if (type === 'cargo') {
          state.cargoLevel++;
          state.maxCargo += 20;
          log(`Cargo Bay upgraded to level ${state.cargoLevel}! Max cargo now ${state.maxCargo}.`);
        } else if (type === 'engine') {
          state.engineLevel++;
          state.maxFuel += 50;
          log(`Engine upgraded to level ${state.engineLevel}! Less fuel used for travel.`);
        } else if (type === 'weapons') {
          state.weaponLevel++;
          log(`Weapons upgraded to level ${state.weaponLevel}!`);
        }
        updateUI();
      }
    }

    function travel(target, actualCost) {
      if (state.fuel >= actualCost) {
        state.fuel -= actualCost;
        state.location = target;
        log(`Hyperspace jump complete. Arrived at ${target}. Used ${actualCost} fuel.`);
        
        if (Math.random() < 0.3) {
          const enc = Math.random();
          if (enc < 0.33) {
            const fuelLoss = Math.floor(Math.random() * 11) + 5;
            state.fuel = Math.max(0, state.fuel - fuelLoss);
            log(`WARNING: Asteroid field encountered! Evasive maneuvers cost ${fuelLoss} fuel.`, true);
          } else if (enc < 0.66) {
            const creditsGained = Math.floor(Math.random() * 101) + 50;
            state.credits += creditsGained;
            log(`Distress signal! Helped a stranded ship and received ${creditsGained} credits.`);
          } else {
            const availableGoods = goods.filter(g => state.inventory[g] > 0);
            if (availableGoods.length > 0) {
              const stolen = availableGoods[Math.floor(Math.random() * availableGoods.length)];
              state.inventory[stolen]--;
              state.cargo--;
              log(`WARNING: Space pirates ambushed you! They stole 1 ${stolen}.`, true);
            } else {
              const creditsLost = Math.min(state.credits, 100);
              if (creditsLost > 0) {
                state.credits -= creditsLost;
                log(`WARNING: Space pirates hacked your accounts! Stole ${creditsLost} credits.`, true);
              } else {
                log(`WARNING: Space pirates attacked, but found nothing of value.`, true);
              }
            }
          }
        }

        generatePrices();
        updateUI();
      } else {
        log(`Insufficient fuel to reach ${target}!`, true);
      }
    }

    generatePrices();
    updateUI();
  </script>
</body>
</html>
