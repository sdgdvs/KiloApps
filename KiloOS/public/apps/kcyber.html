<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KCyber</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      text-shadow: 0 0 5px rgba(0, 255, 0, 0.7); /* Phosphor glow */
    }
    
    /* CRT Scanlines */
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 100;
    }
    #header {
      padding: 10px;
      border-bottom: 1px solid #0f0;
      background-color: #001100;
    }
    #terminal {
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    #output {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-bottom: 10px;
    }
    .line {
      margin-bottom: 2px;
    }
    .prompt-line {
      display: flex;
      align-items: center;
    }
    .prompt {
      margin-right: 8px;
    }
    #input-container {
      display: flex;
    }
    #cmd-input {
      background: transparent;
      border: none;
      color: #0f0;
      font-family: inherit;
      font-size: 16px;
      flex: 1;
      outline: none;
      text-shadow: inherit;
      caret-shape: block;
      caret-color: #0f0;
    }
    #cmd-input:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <div id="header">KCyber v1.0 - Cyberdeck Interface</div>
  <div id="terminal" onclick="document.getElementById('cmd-input').focus()">
    <div id="output"></div>
    <div id="input-container">
      <span class="prompt">root@cyberdeck:~#</span>
      <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus />
    </div>
  </div>
  <div id="visuals" style="position: absolute; right: 25px; top: 25px; width: 180px; height: 160px; pointer-events: none; z-index: 50; background: rgba(0, 15, 5, 0.85); border: 1px solid #00ff6644; border-radius: 4px; box-shadow: 0 0 15px rgba(0, 255, 100, 0.15);">
    <canvas id="gfxCanvas" width="180" height="160"></canvas>
  </div>
  <script>
    const outputDiv = document.getElementById('output');
    const cmdInput = document.getElementById('cmd-input');
    const terminalDiv = document.getElementById('terminal');
    const promptSpan = document.querySelector('.prompt');

    // Web Audio Setup
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playTone(freq, type, duration, vol=0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playKeyClack() { playTone(800, 'square', 0.05, 0.02); }
    function playAccessGranted() {
      playTone(400, 'sine', 0.1, 0.1);
      setTimeout(() => playTone(600, 'sine', 0.1, 0.1), 100);
      setTimeout(() => playTone(800, 'sine', 0.2, 0.1), 200);
    }
    function playAccessDenied() {
      playTone(150, 'sawtooth', 0.3, 0.2);
      setTimeout(() => playTone(150, 'sawtooth', 0.3, 0.2), 400);
    }
    function playAlarm() {
      playTone(600, 'square', 0.2, 0.1);
      setTimeout(() => playTone(400, 'square', 0.2, 0.1), 200);
    }
    function playDialup() {
      for(let i=0; i<10; i++) {
        setTimeout(() => playTone(Math.random()*1000 + 500, 'square', 0.1, 0.05), i*100);
      }
    }

    let hacking_node = null;
    let hacking_target = "";
    let hacking_attempts = 0;
    
    let connected_node = null;
    let player_credits = 0;
    
    let node_files = {
      '02': { name: 'sys_logs.dat', size: 12, value: 100 },
      '03': { name: 'customer_db.sql', size: 45, value: 250 },
      '04': { name: 'r_and_d_schematics.zip', size: 105, value: 600 },
      '05': { name: 'zero_day_exploit.exe', size: 15, value: 1500 }
    };
    
    let player_max_mem = 100;
    let player_mem = player_max_mem;
    let player_max_cpu = 5;
    let player_max_cloak = 3;
    let player_max_slow = 3;
    let tool_cloak = player_max_cloak;
    let tool_slow = player_max_slow;
    let in_shop = false;
    let ice_interval = null;
    let ice_name = "";
    let ice_damage = 0;
    let ice_frozen_ticks = 0;
    let player_heat = 0;
    
    let missions = [];
    let active_mission = null;

    function generateMissions() {
      missions = [];
      const fileNames = ["paydata.zip", "prototype.exe", "blackmail.txt", "employee_db.sql", "admin_creds.dat", "source_code.c", "financials.xls", "auth_keys.rsa"];
      for (let i = 0; i < 3; i++) {
        let node = Math.floor(Math.random() * 4) + 2; // 2 to 5
        let file = fileNames[Math.floor(Math.random() * fileNames.length)];
        let reward = 0;
        let diff = "";
        if (node === 2) { reward = 150 + Math.floor(Math.random()*100); diff = "Easy"; }
        else if (node === 3) { reward = 300 + Math.floor(Math.random()*200); diff = "Medium"; }
        else if (node === 4) { reward = 600 + Math.floor(Math.random()*300); diff = "Hard"; }
        else if (node === 5) { reward = 1200 + Math.floor(Math.random()*800); diff = "Extreme"; }
        
        missions.push({ id: i+1, node: '0'+node, file: file, reward: reward, diff: diff });
      }
    }

    // --- GRAPHICS ENGINE: SPRITE ANIMATIONS, HUD & PARTICLES ---
    let animTick = 0;
    let shakeAmount = 0;
    const particles = [];
    const maxParticles = 140;

    function spawnBurst(x, y, count, type, color, speed=1) {
      for (let i = 0; i < count; i++) {
        if (particles.length >= maxParticles) particles.shift();
        const angle = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 3 + 1.2) * speed;
        particles.push({
          x: x + (Math.random() - 0.5) * 10,
          y: y + (Math.random() - 0.5) * 10,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1.0,
          decay: Math.random() * 0.035 + 0.02,
          color: color,
          type: type, // 'spark', 'bit', 'debris', 'star'
          size: Math.random() * 3 + 2,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.2,
          char: Math.random() > 0.5 ? '1' : '0'
        });
      }
    }

    function spawnAmbient() {
      if (particles.length >= maxParticles) return;
      if (Math.random() < 0.3) {
        const x = 30 + Math.random() * 120;
        const y = 145;
        let color = '#00ff88';
        let type = 'bit';
        if (hacking_node) {
          color = ice_frozen_ticks > 0 ? '#00e5ff' : '#ff3344';
          type = ice_frozen_ticks > 0 ? 'star' : 'spark';
        } else if (connected_node) {
          color = '#00ffff';
          type = 'bit';
        }
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 0.8,
          vy: -(Math.random() * 1.5 + 0.8),
          life: 1.0,
          decay: Math.random() * 0.02 + 0.015,
          color: color,
          type: type,
          size: Math.random() * 2 + 2,
          rot: 0,
          vrot: (Math.random() - 0.5) * 0.1,
          char: Math.random() > 0.5 ? '1' : '0'
        });
      }
    }

    function iceAttack() {
      if (hacking_node || connected_node) {
        if (ice_frozen_ticks > 0) {
          ice_frozen_ticks--;
          printLine(`[${ice_name}] ICE is blinded...`);
          spawnBurst(90, 80, 15, 'star', '#00e5ff');
        } else {
          playAlarm();
          player_mem -= ice_damage;
          shakeAmount = 12;
          spawnBurst(90, 80, 30, 'spark', '#ff3333');
          spawnBurst(90, 80, 16, 'debris', '#ff0044');
          if (player_mem <= 0) {
            player_mem = 0;
            shakeAmount = 24;
            spawnBurst(90, 80, 60, 'debris', '#ff0000');
            spawnBurst(90, 80, 45, 'spark', '#ffffff');
            printLine(`[${ice_name}] FATAL: Memory depleted. Connection forcefully terminated.`);
            playAccessDenied();
            hacking_node = null;
            connected_node = null;
            updatePrompt();
            if (ice_interval) clearInterval(ice_interval);
          } else {
            printLine(`[${ice_name}] attacks! System MEM reduced to ${player_mem}%`);
          }
        }
      }
    }

    const canvas = document.getElementById('gfxCanvas');
    const ctx = canvas.getContext('2d');

    function drawVisuals() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = 90;
      const cy = 82;

      // 1. HUD Reticle & Corner Brackets
      ctx.lineWidth = 2;
      let hudColor = '#00ff66';
      let titleText = '[SYS://DECK.OS]';
      if (hacking_node) {
        hudColor = ice_frozen_ticks > 0 ? '#00e5ff' : '#ff3333';
        titleText = ice_frozen_ticks > 0 ? '[ICE://STUNNED]' : `[ICE://${ice_name.toUpperCase()}]`;
      } else if (connected_node) {
        hudColor = '#00ffff';
        titleText = `[DATA://NODE_0${connected_node}]`;
      }
      ctx.strokeStyle = hudColor;

      // Corner L-brackets
      const bLen = 10;
      // Top-Left
      ctx.beginPath();
      ctx.moveTo(6, 6 + bLen); ctx.lineTo(6, 6); ctx.lineTo(6 + bLen, 6);
      // Top-Right
      ctx.moveTo(174 - bLen, 6); ctx.lineTo(174, 6); ctx.lineTo(174, 6 + bLen);
      // Bottom-Left
      ctx.moveTo(6, 154 - bLen); ctx.lineTo(6, 154); ctx.lineTo(6 + bLen, 154);
      // Bottom-Right
      ctx.moveTo(174 - bLen, 154); ctx.lineTo(174, 154); ctx.lineTo(174, 154 - bLen);
      ctx.stroke();

      // Top Header Title & Status Diode
      ctx.fillStyle = hudColor;
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(titleText, 24, 17);

      // Blinking diode
      const diodeAlpha = 0.5 + Math.sin(animTick * 0.15) * 0.5;
      ctx.fillStyle = hudColor;
      ctx.globalAlpha = diodeAlpha;
      ctx.beginPath();
      ctx.arc(14, 14, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;

      // 2. Animated Sprites
      if (hacking_node) {
        // --- MAIN ENEMY: ICE DAEMON ---
        const pulse = 1.0 + Math.sin(animTick * 0.09) * 0.12;
        const glitchX = (Math.random() < 0.08 ? (Math.random() - 0.5) * 6 : 0);

        if (ice_frozen_ticks > 0) {
          // Frozen Crystalline Barrier
          ctx.strokeStyle = '#00e5ff';
          ctx.fillStyle = 'rgba(0, 40, 70, 0.7)';
          ctx.lineWidth = 2;

          // Outer frost snowflake ring
          for (let a = 0; a < 6; a++) {
            const rad = (animTick * 0.02) + a * (Math.PI / 3);
            const fx = cx + Math.cos(rad) * 45;
            const fy = cy + Math.sin(rad) * 45;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(fx, fy);
            ctx.stroke();

            // Diamond crystal at tip
            ctx.beginPath();
            ctx.arc(fx, fy, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }

          // Frozen Core
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const ang = i * (Math.PI / 3) + (Math.PI / 6);
            const r = 28;
            const px = cx + Math.cos(ang) * r;
            const py = cy + Math.sin(ang) * r;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Frozen Stun Badge
          ctx.fillStyle = '#00e5ff';
          ctx.font = 'bold 9px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('BLINDED', cx, cy + 50);

        } else {
          // ACTIVE ICE DAEMON: Orbiting Razor Defense Shards & Pulsing Core
          const shardCount = 6;
          for (let s = 0; s < shardCount; s++) {
            const sAngle = (animTick * 0.04) + s * ((Math.PI * 2) / shardCount);
            const sDist = 44 * pulse;
            const sx = cx + glitchX + Math.cos(sAngle) * sDist;
            const sy = cy + Math.sin(sAngle) * sDist;

            // Connecting Laser Link
            ctx.strokeStyle = 'rgba(255, 50, 50, 0.35)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cx + glitchX, cy);
            ctx.lineTo(sx, sy);
            ctx.stroke();

            // Razor Shard (triangular polygon pointing outward)
            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(sAngle + Math.PI / 2);
            ctx.fillStyle = '#ff1122';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -9);
            ctx.lineTo(5, 5);
            ctx.lineTo(0, 2);
            ctx.lineTo(-5, 5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          // Central Demonic ICE Polygon
          ctx.save();
          ctx.translate(cx + glitchX, cy);
          ctx.scale(pulse, pulse);

          // Outer Hazard Shield
          ctx.strokeStyle = '#ff3333';
          ctx.fillStyle = 'rgba(120, 0, 0, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          const octVerts = 8;
          for (let i = 0; i < octVerts; i++) {
            const rad = i * ((Math.PI * 2) / octVerts);
            const r = (i % 2 === 0) ? 28 : 18;
            const px = Math.cos(rad) * r;
            const py = Math.sin(rad) * r;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Inner Visor Slit
          ctx.fillStyle = '#000000';
          ctx.fillRect(-18, -4, 36, 8);
          ctx.strokeStyle = '#ff6666';
          ctx.lineWidth = 1;
          ctx.strokeRect(-18, -4, 36, 8);

          // Sweeping Laser Eye
          const eyeX = Math.sin(animTick * 0.08) * 12;
          ctx.fillStyle = '#ff0000';
          ctx.beginPath();
          ctx.arc(eyeX, 0, 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

      } else if (connected_node) {
        // --- KEY ITEM: CLASSIFIED DATA CORE / PAYLOAD ---
        const bobY = Math.sin(animTick * 0.05) * 5;

        // Holographic Extraction Beam
        const grad = ctx.createLinearGradient(cx, 140, cx, cy + bobY);
        grad.addColorStop(0, 'rgba(0, 255, 255, 0.3)');
        grad.addColorStop(1, 'rgba(0, 255, 255, 0.0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx - 30, 140);
        ctx.lineTo(cx + 30, 140);
        ctx.lineTo(cx + 18, cy + bobY + 25);
        ctx.lineTo(cx - 18, cy + bobY + 25);
        ctx.closePath();
        ctx.fill();

        // Dual Intersecting Holographic Data Rings
        ctx.lineWidth = 1.5;
        // Ring 1
        ctx.save();
        ctx.translate(cx, cy + bobY);
        ctx.rotate(animTick * 0.03);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 42, 16, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Ring 2 (tilted counter-rotating)
        ctx.save();
        ctx.translate(cx, cy + bobY);
        ctx.rotate(-animTick * 0.025 + Math.PI / 4);
        ctx.strokeStyle = 'rgba(0, 200, 255, 0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 40, 15, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // High-Tech Data Cartridge
        const cartW = 44;
        const cartH = 58;
        const cartX = cx - cartW / 2;
        const cartY = cy + bobY - cartH / 2;

        ctx.fillStyle = '#011c22';
        ctx.fillRect(cartX, cartY, cartW, cartH);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(cartX, cartY, cartW, cartH);

        // Gold connector pins
        ctx.fillStyle = '#ffd700';
        for (let p = 0; p < 5; p++) {
          ctx.fillRect(cartX + 6 + p * 7, cartY + cartH - 4, 4, 4);
        }

        // Circuit tracks on cartridge
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cartX + 8, cartY + 12); ctx.lineTo(cartX + 22, cartY + 12); ctx.lineTo(cartX + 22, cartY + 24);
        ctx.moveTo(cartX + cartW - 8, cartY + 18); ctx.lineTo(cartX + 28, cartY + 18); ctx.lineTo(cartX + 28, cartY + 28);
        ctx.stroke();

        // Central Microchip
        ctx.fillStyle = '#004455';
        ctx.fillRect(cx - 10, cy + bobY - 8, 20, 16);
        ctx.strokeStyle = '#00ffcc';
        ctx.strokeRect(cx - 10, cy + bobY - 8, 20, 16);

        // Traveling Specular Sheen Stripe
        const sheenOff = (animTick * 2) % (cartH + 30);
        ctx.save();
        ctx.beginPath();
        ctx.rect(cartX, cartY, cartW, cartH);
        ctx.clip();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cartX - 10, cartY + sheenOff - 10);
        ctx.lineTo(cartX + cartW + 10, cartY + sheenOff + 10);
        ctx.stroke();
        ctx.restore();

        // Label
        ctx.fillStyle = '#00ffff';
        ctx.font = 'bold 8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`SEC-DAT`, cx, cartY + cartH - 8);

      } else {
        // --- PLAYER: CYBERDECK CONSOLE ---
        const bobY = Math.sin(animTick * 0.04) * 3.5;

        // Holographic Pedestal Ring
        ctx.save();
        ctx.translate(cx, cy + 42 + bobY * 0.4);
        ctx.strokeStyle = 'rgba(0, 255, 100, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 52, 14, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Rotating radar beacon blip on pedestal
        const pedAng = animTick * 0.05;
        const bx = Math.cos(pedAng) * 52;
        const by = Math.sin(pedAng) * 14;
        ctx.fillStyle = '#00ffaa';
        ctx.beginPath();
        ctx.arc(bx, by, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Cyberdeck Keyboard Base (Wedge / Trapezoid)
        const baseY = cy + 12 + bobY;
        ctx.fillStyle = '#02240b';
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - 40, baseY);
        ctx.lineTo(cx + 40, baseY);
        ctx.lineTo(cx + 50, baseY + 26);
        ctx.lineTo(cx - 50, baseY + 26);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Keyboard Key Grid Lines
        ctx.strokeStyle = 'rgba(0, 255, 100, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 36, baseY + 8); ctx.lineTo(cx + 36, baseY + 8);
        ctx.moveTo(cx - 42, baseY + 16); ctx.lineTo(cx + 42, baseY + 16);
        ctx.stroke();

        // 4 Diagnostic Front Edge Status LEDs
        const ledColors = ['#00ff66', '#ffff00', '#00ffff', '#ff00ff'];
        for (let l = 0; l < 4; l++) {
          const lOn = ((Math.floor(animTick / 8) + l) % 4) === 0;
          ctx.fillStyle = lOn ? ledColors[l] : 'rgba(0, 50, 20, 0.6)';
          ctx.beginPath();
          ctx.arc(cx - 30 + l * 20, baseY + 22, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Angled Cyberdeck Screen Display
        const scrW = 68;
        const scrH = 38;
        const scrX = cx - scrW / 2;
        const scrY = baseY - scrH + 2;

        ctx.fillStyle = '#001405';
        ctx.fillRect(scrX, scrY, scrW, scrH);
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2;
        ctx.strokeRect(scrX, scrY, scrW, scrH);

        // Animated Oscilloscope / Neural Waveform on Screen
        ctx.save();
        ctx.beginPath();
        ctx.rect(scrX + 2, scrY + 2, scrW - 4, scrH - 4);
        ctx.clip();

        // Subtle screen grid
        ctx.strokeStyle = 'rgba(0, 255, 100, 0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(scrX, scrY + scrH / 2); ctx.lineTo(scrX + scrW, scrY + scrH / 2);
        ctx.moveTo(cx, scrY); ctx.lineTo(cx, scrY + scrH);
        ctx.stroke();

        // Green Oscilloscope Sine Wave
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        for (let sx = 0; sx < scrW - 4; sx += 2) {
          const waveY = (scrY + scrH / 2) + Math.sin((sx + animTick * 4) * 0.2) * 8;
          if (sx === 0) ctx.moveTo(scrX + 2 + sx, waveY);
          else ctx.lineTo(scrX + 2 + sx, waveY);
        }
        ctx.stroke();
        ctx.restore();

        // Cyber Antenna / Neural Interface Jack
        const antX = cx - 36;
        const antY = scrY + 6;
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(antX, antY + 8);
        ctx.lineTo(antX - 8, antY - 8);
        ctx.stroke();
        ctx.fillStyle = '#00ffaa';
        ctx.beginPath();
        ctx.arc(antX - 8, antY - 8, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Radiating Concentric Transmission Signal Arcs
        const sigR = (animTick * 1.5) % 24;
        const sigAlpha = 1.0 - (sigR / 24);
        ctx.strokeStyle = `rgba(0, 255, 170, ${sigAlpha})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(antX - 8, antY - 8, sigR, -Math.PI * 0.75, 0.25);
        ctx.stroke();
      }

      // 3. Multi-Layered Particle System
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.type === 'debris') {
          p.vy += 0.12; // gravity
          p.rot += p.vrot;
        } else if (p.type === 'spark') {
          p.vx *= 0.93;
          p.vy *= 0.93;
        }
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);

        if (p.type === 'spark') {
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.size;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
          ctx.stroke();
        } else if (p.type === 'bit') {
          ctx.fillStyle = p.color;
          ctx.font = 'bold 9px monospace';
          ctx.fillText(p.char, p.x, p.y);
        } else if (p.type === 'debris') {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        } else if (p.type === 'star') {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p.x - p.size * 2, p.y); ctx.lineTo(p.x + p.size * 2, p.y);
          ctx.moveTo(p.x, p.y - p.size * 2); ctx.lineTo(p.x, p.y + p.size * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function renderLoop() {
      animTick++;
      spawnAmbient();

      // Procedural Screen Shake
      if (shakeAmount > 0) {
        const sx = (Math.random() - 0.5) * shakeAmount * 2;
        const sy = (Math.random() - 0.5) * shakeAmount * 2;
        terminalDiv.style.transform = `translate(${sx}px, ${sy}px)`;
        shakeAmount = Math.max(0, shakeAmount * 0.88 - 0.05);
      } else {
        terminalDiv.style.transform = '';
      }

      drawVisuals();
      requestAnimationFrame(renderLoop);
    }

    function updatePrompt() {
      if (hacking_node) {
        promptSpan.textContent = `[NODE ${hacking_node}] hack> `;
      } else if (connected_node) {
        promptSpan.textContent = `[NODE ${connected_node}] root> `;
      } else if (in_shop) {
        promptSpan.textContent = `shop> `;
      } else {
        promptSpan.textContent = `root@cyberdeck:~# `;
      }
    }

    function printLine(text) {
      const line = document.createElement('div');
      line.className = 'line';
      line.textContent = text;
      outputDiv.appendChild(line);
      terminalDiv.scrollTop = terminalDiv.scrollHeight;
    }

    function processCommand(cmd) {
      const trimmed = cmd.trim();
      if (!trimmed) return;
      
      if (in_shop) {
        printLine(`shop> ${trimmed}`);
        const args = trimmed.split(' ').filter(Boolean);
        const cmdName = args[0].toLowerCase();
        
        if (cmdName === 'exit' || cmdName === 'abort') {
          in_shop = false;
          printLine("Exiting shop.");
          updatePrompt();
          return;
        }
        
        if (cmdName === 'ls' || cmdName === 'list') {
          printLine("--- UPGRADE SHOP ---");
          printLine(`Credits: ${player_credits} cr`);
          printLine("Available upgrades:");
          printLine("  buy mem   - +50 Max Memory (Cost: 500 cr)");
          printLine("  buy cpu   - +1 Hacking Attempt (Cost: 1000 cr)");
          printLine("  buy cloak - +1 Cloak Charge (Cost: 200 cr)");
          printLine("  buy slow  - +1 Slow Charge (Cost: 300 cr)");
          printLine("  buy proxy - -20% Heat (Cost: 150 cr)");
          updatePrompt();
          return;
        }
        
        if (cmdName === 'buy') {
          if (args.length < 2) {
            printLine("Usage: buy <item>");
          } else {
            const item = args[1].toLowerCase();
            if (item === 'mem') {
              if (player_credits >= 500) {
                player_credits -= 500;
                player_max_mem += 50;
                player_mem += 50;
                printLine(`Purchase successful. Max memory increased to ${player_max_mem}.`);
              } else {
                printLine("Insufficient credits.");
              }
            } else if (item === 'cpu') {
              if (player_credits >= 1000) {
                player_credits -= 1000;
                player_max_cpu += 1;
                printLine(`Purchase successful. Hacking attempts increased to ${player_max_cpu}.`);
              } else {
                printLine("Insufficient credits.");
              }
            } else if (item === 'cloak') {
              if (player_credits >= 200) {
                player_credits -= 200;
                player_max_cloak += 1;
                tool_cloak += 1;
                printLine(`Purchase successful. Max Cloak charges: ${player_max_cloak}.`);
              } else {
                printLine("Insufficient credits.");
              }
            } else if (item === 'slow') {
              if (player_credits >= 300) {
                player_credits -= 300;
                player_max_slow += 1;
                tool_slow += 1;
                printLine(`Purchase successful. Max Slow charges: ${player_max_slow}.`);
              } else {
                printLine("Insufficient credits.");
              }
            } else if (item === 'proxy') {
              if (player_credits >= 150) {
                player_credits -= 150;
                player_heat -= 20;
                if (player_heat < 0) player_heat = 0;
                printLine(`Purchase successful. Heat reduced to ${player_heat}%.`);
              } else {
                printLine("Insufficient credits.");
              }
            } else {
              printLine("Unknown item. Use 'ls' to see available items.");
            }
          }
          updatePrompt();
          return;
        }
        
        printLine("Command not found. Available: ls, buy <item>, exit");
        updatePrompt();
        return;
      }
      
      if (hacking_node) {
        printLine(`[NODE ${hacking_node}] hack> ${trimmed}`);
        
        let guess = trimmed.toLowerCase();
        if (guess === 'abort') {
          hacking_node = null;
          printLine("Hacking aborted.");
          player_heat += 5;
          if (player_heat > 100) player_heat = 100;
          printLine(`[WARNING] Heat increased to ${player_heat}%`);
          if (ice_interval) clearInterval(ice_interval);
          updatePrompt();
          return;
        }
        if (guess === 'cloak') {
          if (tool_cloak > 0) {
            tool_cloak--;
            ice_frozen_ticks += 2;
            spawnBurst(90, 80, 25, 'star', '#00e5ff');
            spawnBurst(90, 80, 20, 'spark', '#00ffff');
            printLine(`[CLOAK] Activated. ${tool_cloak} remaining. ICE blinded for 2 cycles.`);
          } else {
            printLine(`[CLOAK] Out of charges.`);
          }
          updatePrompt();
          return;
        }
        if (guess === 'slow') {
          if (tool_slow > 0) {
            tool_slow--;
            spawnBurst(90, 80, 25, 'spark', '#ffff00');
            printLine(`[SLOW] Activated. ${tool_slow} remaining. Trace speed halved.`);
            if (ice_interval) clearInterval(ice_interval);
            let current_interval = 3000 - (player_heat * 15);
            if (current_interval < 500) current_interval = 500;
            ice_interval = setInterval(iceAttack, current_interval * 2);
          } else {
            printLine(`[SLOW] Out of charges.`);
          }
          updatePrompt();
          return;
        }
        
        if (!/^\d{4}$/.test(guess)) {
          printLine("Invalid input. Enter 4 digits (e.g., 1234) or 'abort' to cancel.");
          return;
        }
        
        let exact = 0;
        let partial = 0;
        let targetArr = hacking_target.split('');
        let guessArr = guess.split('');
        let targetUsed = [false, false, false, false];
        let guessUsed = [false, false, false, false];
        
        for(let i=0; i<4; i++){
          if(guessArr[i] === targetArr[i]){
            exact++;
            targetUsed[i] = true;
            guessUsed[i] = true;
          }
        }
        for(let i=0; i<4; i++){
          if(!guessUsed[i]){
            for(let j=0; j<4; j++){
              if(!targetUsed[j] && guessArr[i] === targetArr[j]){
                partial++;
                targetUsed[j] = true;
                break;
              }
            }
          }
        }
        
        if (exact === 4) {
          playAccessGranted();
          shakeAmount = 6;
          spawnBurst(90, 80, 45, 'star', '#00ffcc');
          spawnBurst(90, 80, 30, 'spark', '#ffff33');
          printLine(`ACCESS GRANTED. Connected to node [${hacking_node}].`);
          connected_node = hacking_node;
          hacking_node = null;
          printLine("Type 'ls' to list files, 'download <file>' to extract, 'disconnect' to exit.");
        } else {
          hacking_attempts--;
          playTone(300, 'square', 0.1, 0.1);
          shakeAmount = 4;
          spawnBurst(90, 80, 15, 'spark', '#ffaa00');
          printLine(`Result: ${exact} EXACT, ${partial} PARTIAL`);
          if (hacking_attempts > 0) {
            printLine(`Attempts remaining: ${hacking_attempts}`);
          } else {
            playAccessDenied();
            shakeAmount = 14;
            spawnBurst(90, 80, 40, 'spark', '#ff2222');
            spawnBurst(90, 80, 20, 'debris', '#aa0000');
            printLine("ACCESS DENIED. TRACE DETECTED. CONNECTION TERMINATED.");
            player_heat += 20;
            if (player_heat > 100) player_heat = 100;
            printLine(`[WARNING] Global heat increased to ${player_heat}%`);
            hacking_node = null;
            if (ice_interval) clearInterval(ice_interval);
          }
        }
        updatePrompt();
        return;
      }
      
      if (connected_node) {
        printLine(`[NODE ${connected_node}] root> ${trimmed}`);
        const args = trimmed.split(' ').filter(Boolean);
        const cmd = args[0].toLowerCase();
        
        if (cmd === 'disconnect' || cmd === 'abort') {
           connected_node = null;
           printLine("Disconnected from node.");
           if (ice_interval) clearInterval(ice_interval);
           updatePrompt();
           return;
        }
        
        if (cmd === 'ls') {
           const file = node_files[connected_node];
           if (file.name === "empty") {
             printLine("No files found. Directory is empty.");
           } else {
             printLine("Files:");
             printLine(`  ${file.name} (${file.size}MB)`);
           }
           updatePrompt();
           return;
        }
        
         if (cmd === 'download') {
           if (args.length < 2) {
             printLine("Usage: download <filename>");
           } else {
             const fname = args[1];
             const file = node_files[connected_node];
             if (file.name !== "empty" && fname === file.name) {
               printLine(`Downloading ${fname}...`);
               player_credits += file.value;
               spawnBurst(90, 80, 35, 'bit', '#00ffff');
               spawnBurst(90, 80, 20, 'star', '#ffffff');
               printLine(`Download complete. Data value: ${file.value} credits.`);
               if (active_mission && active_mission.file === file.name && active_mission.node === connected_node) {
                 printLine(`CONTRACT COMPLETE! Reward transferred.`);
                 active_mission = null;
               }
               file.name = "empty";
             } else {
               printLine("File not found.");
             }
           }
           updatePrompt();
           return;
        }
        
        printLine("Command not found. Available: ls, download, disconnect");
        updatePrompt();
        return;
      }
      
      printLine(`root@cyberdeck:~# ${trimmed}`);
      
      const args = trimmed.split(' ').filter(Boolean);
      const command = args[0].toLowerCase();
      
      switch (command) {
        case 'help':
          printLine("Available commands:");
          printLine("  help      - Show this message");
          printLine("  clear     - Clear terminal output");
          printLine("  status    - Show deck status");
          printLine("  reboot    - Restart deck to restore MEM and software");
          printLine("  map       - Display network topology");
          printLine("  shop      - Enter upgrade shop");
          printLine("  connect   - Attempt connection to network node");
          printLine("  contracts - View available hacking contracts");
          printLine("  accept    - Accept a contract (e.g. 'accept 1')");
          printLine("  guide     - Open Runner's Guide (e.g. 'guide ice')");
          printLine("During hack:");
          printLine("  abort     - Disconnect immediately");
          printLine("  cloak     - Blind ICE for 2 cycles");
          printLine("  slow      - Halve ICE attack speed");
          break;
        case 'guide':
          if (args.length < 2) {
            printLine("--- RUNNER'S GUIDE ---");
            printLine("Usage: guide <topic>");
            printLine("Topics: commands, ice, upgrade, hacking");
          } else {
            const topic = args[1].toLowerCase();
            if (topic === 'commands') {
              printLine("--- GUIDE: COMMANDS ---");
              printLine("connect <node>: Initiates a hack against a target node.");
              printLine("shop: Access the black market to upgrade your cyberdeck.");
              printLine("contracts: List available data theft jobs.");
              printLine("accept <id>: Take a contract, then connect to the node to download.");
            } else if (topic === 'ice') {
              printLine("--- GUIDE: ICE (Intrusion Countermeasures Electronics) ---");
              printLine("ICE defends network nodes by attacking your deck's Memory (MEM).");
              printLine("Basic ICE: Weak damage. Found on low-sec nodes.");
              printLine("Tracer ICE: Moderate damage.");
              printLine("Hunter ICE: High damage. Will rapidly deplete your MEM.");
              printLine("Black ICE: Lethal damage. Reserved for extreme-sec nodes.");
              printLine("If MEM reaches 0, you are forcibly disconnected.");
            } else if (topic === 'upgrade') {
              printLine("--- GUIDE: DECK UPGRADING ---");
              printLine("Spend credits earned from data theft in the 'shop'.");
              printLine("MEM: Increases maximum memory, letting you survive more ICE attacks.");
              printLine("CPU: Gives you more attempts to crack node passwords.");
              printLine("CLOAK: Buy charges to temporarily blind ICE during a hack.");
              printLine("SLOW: Buy charges to permanently slow down ICE attack speed for one hack.");
              printLine("PROXY: Reduces your global HEAT, which makes ICE attack slower.");
            } else if (topic === 'hacking') {
              printLine("--- GUIDE: HACKING ---");
              printLine("1. Connect to a node. You must crack a 4-digit PIN.");
              printLine("2. Enter 4 digits. The system returns EXACT (right number, right place)");
              printLine("   and PARTIAL (right number, wrong place).");
              printLine("3. Use this feedback to deduce the PIN before you run out of attempts.");
              printLine("4. Once in, use 'ls' to find files and 'download <file>' to steal them.");
              printLine("5. Higher HEAT speeds up ICE. Aborting or failing hacks increases HEAT.");
            } else {
              printLine("Unknown topic. Topics: commands, ice, upgrade, hacking");
            }
          }
          break;
        case 'clear':
          outputDiv.innerHTML = '';
          break;
        case 'shop':
          in_shop = true;
          printLine("Entering upgrade shop... Type 'ls' to view items, 'exit' to leave.");
          updatePrompt();
          break;
        case 'status':
          printLine("DECK STATUS:");
          printLine("  CPU: 100%");
          printLine(`  MEM: ${player_mem}%`);
          printLine(`  CLOAK: ${tool_cloak} charges`);
          printLine(`  SLOW: ${tool_slow} charges`);
          printLine(`  CREDITS: ${player_credits} cr`);
          printLine(`  HEAT: ${player_heat}%`);
          printLine("  NET: DISCONNECTED");
          break;
        case 'reboot':
          player_mem = player_max_mem;
          tool_cloak = player_max_cloak;
          tool_slow = player_max_slow;
          if (player_heat > 0) {
              player_heat -= 10;
              if (player_heat < 0) player_heat = 0;
          }
          active_mission = null;
          generateMissions();
          node_files = {
            '02': { name: 'sys_logs.dat', size: 12, value: 100 },
            '03': { name: 'customer_db.sql', size: 45, value: 250 },
            '04': { name: 'r_and_d_schematics.zip', size: 105, value: 600 },
            '05': { name: 'zero_day_exploit.exe', size: 15, value: 1500 }
          };
          printLine("System rebooting...");
          printLine("Memory and software restored to 100%. Nodes and contracts reset.");
          printLine(`Heat cooled down to ${player_heat}%.`);
          break;
        case 'contracts':
          if (missions.length === 0) generateMissions();
          printLine("AVAILABLE CONTRACTS:");
          missions.forEach(m => {
             printLine(` [${m.id}] Target Node: ${m.node} | File: ${m.file} | Diff: ${m.diff} | Reward: ${m.reward} cr`);
          });
          printLine("Use 'accept <id>' to take a contract.");
          break;
        case 'accept':
          if (args.length < 2) {
            printLine("Usage: accept <id>");
          } else {
            let id = parseInt(args[1]);
            let m = missions.find(x => x.id === id);
            if (m) {
              active_mission = m;
              node_files[m.node] = { name: m.file, size: Math.floor(Math.random()*100)+10, value: m.reward };
              printLine(`Contract [${m.id}] accepted.`);
              printLine(`Objective: Download ${m.file} from NODE ${m.node}.`);
              missions = missions.filter(x => x.id !== id);
              if (missions.length === 0) generateMissions();
            } else {
              printLine("Invalid contract ID.");
            }
          }
          break;
        case 'map':
          printLine("NETWORK TOPOLOGY:");
          printLine(" [01] GATEWAY (LOCAL)");
          printLine("   |");
          printLine("   +-- [02] PUB_ROUTER");
          printLine("   |     |");
          printLine("   |     +-- [03] DATA_VAULT");
          printLine("   |");
          printLine("   +-- [04] SEC_SERVER");
          printLine("   |");
          printLine("   +-- [05] BLACK_ICE_NODE");
          printLine("");
          printLine("Use 'connect <node_id>' to access a node.");
          break;
        case 'connect':
          if (args.length < 2) {
            printLine("Error: No target node specified. Usage: connect <node_id>");
          } else {
            const validNodes = ['02', '03', '04', '05'];
            if (validNodes.includes(args[1])) {
              hacking_node = args[1];
              hacking_target = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
              hacking_attempts = player_max_cpu;
              if (args[1] === '02') { ice_name = "Basic ICE"; ice_damage = 5; }
              else if (args[1] === '03') { ice_name = "Tracer ICE"; ice_damage = 10; }
              else if (args[1] === '04') { ice_name = "Hunter ICE"; ice_damage = 15; }
              else if (args[1] === '05') { ice_name = "Black ICE"; ice_damage = 25; }
              
              ice_damage += Math.floor(player_heat / 5);

              printLine(`Attempting connection to node [${args[1]}]...`);
              playDialup();
              printLine("Establishing handshake...");
              printLine(`WARNING: ${ice_name} detected on this node.`);
              printLine("PASSWORD REQUIRED. INITIATING BRUTEFORCE MODULE...");
              printLine("Crack the 4-digit access code (0-9).");
              printLine(`Attempts remaining: ${hacking_attempts}`);
              updatePrompt();
              
              if (ice_interval) clearInterval(ice_interval);
              ice_frozen_ticks = 0;
              let current_interval = 3000 - (player_heat * 15);
              if (current_interval < 500) current_interval = 500;
              ice_interval = setInterval(iceAttack, current_interval);
            } else {
              printLine(`Attempting connection to node [${args[1]}]...`);
              printLine("Establishing handshake...");
              printLine("Error: Connection refused. Invalid node or ICE active.");
            }
          }
          break;
        default:
          printLine(`Command not found: ${command}`);
      }
    }

    cmdInput.addEventListener('keydown', (e) => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (e.key !== 'Enter') {
        playKeyClack();
      } else {
        spawnBurst(90, 80, 8, 'spark', '#00ff66');
        processCommand(cmdInput.value);
        cmdInput.value = '';
      }
    });

    // Boot sequence
    printLine("KCyber OS booting...");
    printLine("Loading modules... OK");
    printLine("Initializing memory... OK");
    printLine("Type 'help' for a list of commands.");
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
