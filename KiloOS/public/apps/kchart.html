<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KChart Studio - Advanced Data Visualization</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #09090b;
    --card-bg: rgba(24, 24, 27, 0.7);
    --card-border: rgba(255, 255, 255, 0.1);
    --text-main: #f4f4f5;
    --text-muted: #a1a1aa;
    --btn-bg: rgba(255, 255, 255, 0.06);
    --btn-hover: rgba(255, 255, 255, 0.14);
    --btn-active: rgba(255, 255, 255, 0.22);
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --focus-ring: #60a5fa;
    --input-bg: rgba(0, 0, 0, 0.3);
    --input-border: rgba(255, 255, 255, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, #09090b 70%);
    color: var(--text-main);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Header Bar */
  header {
    background: rgba(15, 15, 20, 0.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Main Workspace Layout */
  .workspace {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    padding: 20px;
    flex: 1;
    max-width: 1600px;
    width: 100%;
    margin: 0 auto;
  }

  @media (max-width: 1024px) {
    .workspace {
      grid-template-columns: 1fr;
    }
  }

  /* Card Component */
  .panel-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-title {
    font-size: 15px;
    font-weight: 600;
    color: #e4e4e7;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn-group {
    display: flex;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  button, .btn {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    color: var(--text-main);
    background: var(--btn-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    outline: none;
    user-select: none;
  }

  button:hover, .btn:hover {
    background: var(--btn-hover);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-1px);
  }

  button:active, .btn:active {
    transform: translateY(1px);
    background: var(--btn-active);
  }

  .btn-group button {
    border: none;
    background: transparent;
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--text-muted);
  }

  .btn-group button.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
  }

  select {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    color: var(--text-main);
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    outline: none;
    cursor: pointer;
  }

  select:focus {
    border-color: var(--focus-ring);
  }

  /* Canvas Area */
  .canvas-container {
    position: relative;
    width: 100%;
    height: 480px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    overflow: hidden;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
  }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
  }

  .stat-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stat-value {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
  }

  /* Table Editor */
  .table-wrapper {
    max-height: 320px;
    overflow-y: auto;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: rgba(0, 0, 0, 0.15);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  th {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-muted);
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .color-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }

  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 6px 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text-main);
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    outline: none;
  }

  input[type="text"]:focus, input[type="number"]:focus {
    border-color: var(--focus-ring);
  }

  .btn-sm {
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 6px;
  }

  .btn-danger {
    background: rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.3);
  }

  .btn-danger:hover {
    background: rgba(239, 68, 68, 0.4);
  }

  .file-input-hidden {
    display: none;
  }

  .drop-zone {
    border: 2px dashed rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.1);
    color: #ffffff;
  }

  /* Custom scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.2);
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.25);
  }
</style>
</head>
<body>

<header>
  <div class="logo-title">
    <div class="logo-icon">📊</div>
    <span>KChart Studio</span>
  </div>
  <div class="header-actions">
    <select id="presetSelect" aria-label="Load Sample Presets">
      <option value="">-- Sample Presets --</option>
      <option value="sales">Quarterly Revenue</option>
      <option value="tech">Tech Stack Share</option>
      <option value="weather">Monthly Temperature</option>
      <option value="grades">Exam Score Dist</option>
      <option value="fitness">Weekly Activity (Hrs)</option>
    </select>

    <select id="themeSelect" aria-label="Select Color Theme">
      <option value="teal">Cyber Teal</option>
      <option value="neon">Neon Sunset</option>
      <option value="emerald">Emerald Forest</option>
      <option value="warm">Sunset Warmth</option>
      <option value="synth">Synthwave</option>
      <option value="slate">Dark Slate</option>
    </select>

    <button id="btnHelp" aria-label="Help">❔ Help</button>
    <button id="btnExportSvg" title="Export Scalable Vector Graphic">📐 SVG</button>
    <button id="btnExportPng">📷 PNG</button>
    <button id="btnExportCsv">📄 CSV</button>
    <button id="btnExportJson">📦 JSON</button>
    <button id="btnImportTrigger">📥 Import</button>
    <input type="file" id="fileInput" class="file-input-hidden" accept=".csv,.json">
  </div>
</header>

<div class="workspace">
  <!-- Left Side: Main Chart & Controls -->
  <div class="panel-card">
    <div class="panel-title">
      <span>Visualization Canvas <span style="font-size: 12px; color: var(--accent); font-weight: 600; margin-left: 10px; background: rgba(59,130,246,0.1); padding: 2px 6px; border-radius: 4px;">[Press 'H' for Help | 'T' for Trend]</span></span>
      <div class="toolbar">
        <div class="btn-group" id="chartTypeGroup">
          <button data-type="bar" class="active">Bar</button>
          <button data-type="line">Line</button>
          <button data-type="area">Area</button>
          <button data-type="pie">Pie</button>
          <button data-type="donut">Doughnut</button>
          <button data-type="radar">Radar</button>
        </div>
        <div class="btn-group" id="trendGroup" title="Trendline & Regression Analysis Overlay">
          <button data-trend="none" class="active">Trend: Off</button>
          <button data-trend="linear">Linear Fit</button>
          <button data-trend="movavg">Mov Avg</button>
          <button data-trend="mean">Mean</button>
        </div>
        <button id="btnRandomize">🎲 Randomize</button>
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="chartCanvas" tabindex="0" aria-label="Interactive Chart Canvas"></canvas>
    </div>

    <!-- Statistical Analysis Suite -->
    <div class="panel-title" style="margin-top: 4px;">
      <span>Statistical Analysis & Regression Suite</span>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><span class="stat-label">Count</span><span class="stat-value" id="statCount">0</span></div>
      <div class="stat-box"><span class="stat-label">Total</span><span class="stat-value" id="statTotal">0</span></div>
      <div class="stat-box"><span class="stat-label">Mean</span><span class="stat-value" id="statMean">0</span></div>
      <div class="stat-box"><span class="stat-label">Median</span><span class="stat-value" id="statMedian">0</span></div>
      <div class="stat-box"><span class="stat-label">Std Dev</span><span class="stat-value" id="statStdDev">0</span></div>
      <div class="stat-box"><span class="stat-label">Min / Max</span><span class="stat-value" id="statMinMax">0 / 0</span></div>
      <div class="stat-box"><span class="stat-label">Slope (m)</span><span class="stat-value" id="statSlope">-</span></div>
      <div class="stat-box"><span class="stat-label">R² Fit</span><span class="stat-value" id="statR2">-</span></div>
    </div>
  </div>

  <!-- Right Side: Data Table Editor & Import -->
  <div class="panel-card">
    <div class="panel-title">
      <span>Data Table Editor</span>
      <button id="btnAddRow" class="btn-sm">+ Add Point</button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 24px;"></th>
            <th>Label</th>
            <th style="width: 90px;">Value</th>
            <th style="width: 32px;"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Rows dynamically rendered -->
        </tbody>
      </table>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button id="btnSortAsc" class="btn-sm">▲ Sort Asc</button>
      <button id="btnSortDesc" class="btn-sm">▼ Sort Desc</button>
      <button id="btnClear" class="btn-sm btn-danger">Clear All</button>
    </div>

    <div class="drop-zone" id="dropZone">
      Drag & Drop CSV / JSON file here to load
    </div>
  </div>
</div>

<script>
  window.resizeTo(1024, 768);

  // Palettes
  const THEMES = {
    teal: ["rgb(20, 184, 166)", "rgb(245, 158, 11)", "rgb(236, 72, 153)", "rgb(139, 92, 246)", "rgb(59, 130, 246)", "rgb(16, 185, 129)", "rgb(244, 63, 94)"],
    neon: ["rgb(244, 114, 182)", "rgb(56, 189, 248)", "rgb(250, 204, 21)", "rgb(74, 222, 128)", "rgb(192, 132, 252)", "rgb(251, 146, 60)", "rgb(34, 211, 238)"],
    emerald: ["rgb(16, 185, 129)", "rgb(52, 211, 153)", "rgb(5, 150, 105)", "rgb(110, 231, 183)", "rgb(20, 83, 45)", "rgb(167, 243, 208)", "rgb(4, 120, 87)"],
    warm: ["rgb(245, 158, 11)", "rgb(239, 68, 68)", "rgb(217, 119, 6)", "rgb(249, 115, 22)", "rgb(252, 211, 77)", "rgb(185, 28, 28)", "rgb(253, 186, 116)"],
    synth: ["rgb(236, 72, 153)", "rgb(168, 85, 247)", "rgb(6, 182, 212)", "rgb(234, 179, 8)", "rgb(244, 63, 94)", "rgb(99, 102, 241)", "rgb(34, 197, 94)"],
    slate: ["rgb(99, 102, 241)", "rgb(59, 130, 246)", "rgb(14, 165, 233)", "rgb(100, 116, 139)", "rgb(168, 85, 247)", "rgb(71, 85, 105)", "rgb(38, 38, 38)"]
  };

  const PRESETS = {
    sales: [
      { label: "Q1 Rev", value: 450 },
      { label: "Q2 Rev", value: 680 },
      { label: "Q3 Rev", value: 520 },
      { label: "Q4 Rev", value: 890 }
    ],
    tech: [
      { label: "React", value: 42 },
      { label: "Vue", value: 24 },
      { label: "Svelte", value: 18 },
      { label: "Angular", value: 16 }
    ],
    weather: [
      { label: "Jan", value: 12 }, { label: "Feb", value: 14 },
      { label: "Mar", value: 18 }, { label: "Apr", value: 22 },
      { label: "May", value: 27 }, { label: "Jun", value: 31 },
      { label: "Jul", value: 35 }, { label: "Aug", value: 34 }
    ],
    grades: [
      { label: "Grade A", value: 28 },
      { label: "Grade B", value: 45 },
      { label: "Grade C", value: 32 },
      { label: "Grade D", value: 12 },
      { label: "Grade F", value: 5 }
    ],
    fitness: [
      { label: "Mon", value: 1.5 }, { label: "Tue", value: 2.0 },
      { label: "Wed", value: 0.5 }, { label: "Thu", value: 2.5 },
      { label: "Fri", value: 1.8 }, { label: "Sat", value: 3.2 },
      { label: "Sun", value: 2.1 }
    ]
  };

  // Dataset State
  let data = [
    { label: "Q1", value: 20 },
    { label: "Q2", value: 60 },
    { label: "Q3", value: 45 },
    { label: "Q4", value: 80 },
    { label: "Q5", value: 30 }
  ];

  let currentTheme = "teal";
  let chartType = "bar"; // bar, line, area, pie, donut, radar
  let trendMode = "none"; // none, linear, movavg, mean
  let trendStats = { slope: 0, intercept: 0, r2: 0 };
  let hoveredIndex = -1;
  let hoverX = -1, hoverY = -1;

  // DOM Elements
  const canvas = document.getElementById('chartCanvas');
  const ctx = canvas.getContext('2d');
  const tableBody = document.getElementById('tableBody');

  // Stats DOM
  const statCount = document.getElementById('statCount');
  const statTotal = document.getElementById('statTotal');
  const statMean = document.getElementById('statMean');
  const statMedian = document.getElementById('statMedian');
  const statStdDev = document.getElementById('statStdDev');
  const statMinMax = document.getElementById('statMinMax');
  const statSlope = document.getElementById('statSlope');
  const statR2 = document.getElementById('statR2');

  let canvasW = 600, canvasH = 480;

  function getColor(index) {
    const palette = THEMES[currentTheme] || THEMES.teal;
    return palette[index % palette.length];
  }

  function resizeCanvas() {
    const parent = canvas.parentElement;
    const rect = parent.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvasW = rect.width || 600;
    canvasH = rect.height || 480;
    canvas.width = canvasW * dpr;
    canvas.height = canvasH * dpr;
    ctx.resetTransform();
    ctx.scale(dpr, dpr);
    renderChart();
  }

  function computeStats() {
    if (data.length === 0) {
      statCount.textContent = "0";
      statTotal.textContent = "0";
      statMean.textContent = "0";
      statMedian.textContent = "0";
      statStdDev.textContent = "0";
      if (statMinMax) statMinMax.textContent = "0 / 0";
      if (statSlope) statSlope.textContent = "-";
      if (statR2) statR2.textContent = "-";
      trendStats = { slope: 0, intercept: 0, r2: 0 };
      return;
    }
    const vals = data.map(d => Number(d.value) || 0);
    const count = vals.length;
    const total = vals.reduce((a, b) => a + b, 0);
    const mean = total / count;

    const sorted = [...vals].sort((a, b) => a - b);
    let median = 0;
    if (count % 2 === 0) {
      median = (sorted[count / 2 - 1] + sorted[count / 2]) / 2;
    } else {
      median = sorted[Math.floor(count / 2)];
    }

    const variance = vals.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / count;
    const stdDev = Math.sqrt(variance);
    const min = sorted[0];
    const max = sorted[sorted.length - 1];

    // Linear Regression & Correlation
    if (count >= 2) {
      let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
      for (let i = 0; i < count; i++) {
        sumX += i;
        sumY += vals[i];
        sumXY += i * vals[i];
        sumXX += i * i;
      }
      const denom = count * sumXX - sumX * sumX;
      if (denom !== 0) {
        const slope = (count * sumXY - sumX * sumY) / denom;
        const intercept = (sumY - slope * sumX) / count;
        let ssTot = 0, ssRes = 0;
        for (let i = 0; i < count; i++) {
          const yHat = slope * i + intercept;
          ssTot += Math.pow(vals[i] - mean, 2);
          ssRes += Math.pow(vals[i] - yHat, 2);
        }
        const r2 = ssTot > 0.0001 ? Math.max(0, Math.min(1, 1 - ssRes / ssTot)) : 1.0;
        trendStats = { slope, intercept, r2 };
        if (statSlope) statSlope.textContent = (slope >= 0 ? "+" : "") + slope.toFixed(2);
        if (statR2) statR2.textContent = r2.toFixed(3);
      } else {
        trendStats = { slope: 0, intercept: mean, r2: 0 };
        if (statSlope) statSlope.textContent = "0.00";
        if (statR2) statR2.textContent = "0.000";
      }
    } else {
      trendStats = { slope: 0, intercept: count === 1 ? vals[0] : 0, r2: 0 };
      if (statSlope) statSlope.textContent = "-";
      if (statR2) statR2.textContent = "-";
    }

    statCount.textContent = count;
    statTotal.textContent = total.toLocaleString(undefined, { maximumFractionDigits: 2 });
    statMean.textContent = mean.toLocaleString(undefined, { maximumFractionDigits: 2 });
    statMedian.textContent = median.toLocaleString(undefined, { maximumFractionDigits: 2 });
    statStdDev.textContent = stdDev.toLocaleString(undefined, { maximumFractionDigits: 2 });
    if (statMinMax) statMinMax.textContent = `${min.toLocaleString(undefined, { maximumFractionDigits: 1 })} / ${max.toLocaleString(undefined, { maximumFractionDigits: 1 })}`;
  }

  function renderTable() {
    tableBody.innerHTML = '';
    data.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="color-dot" style="background: ${getColor(index)}"></span></td>
        <td><input type="text" value="${escapeHtml(item.label)}" data-index="${index}" class="lbl-input"></td>
        <td><input type="number" value="${item.value}" data-index="${index}" class="val-input" step="any"></td>
        <td><button class="btn-sm btn-danger del-btn" data-index="${index}">✕</button></td>
      `;
      tableBody.appendChild(tr);
    });

    // Attach listeners
    tableBody.querySelectorAll('.lbl-input').forEach(input => {
      input.oninput = (e) => {
        const idx = parseInt(e.target.dataset.index);
        data[idx].label = e.target.value;
        renderChart();
      };
    });
    tableBody.querySelectorAll('.val-input').forEach(input => {
      input.oninput = (e) => {
        const idx = parseInt(e.target.dataset.index);
        data[idx].value = parseFloat(e.target.value) || 0;
        computeStats();
        renderChart();
      };
    });
    tableBody.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = (e) => {
        const idx = parseInt(e.target.dataset.index);
        data.splice(idx, 1);
        updateAll();
      };
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function drawRoundedRect(ctx, x, y, w, h, r) {
    if (w <= 0 || h <= 0) return;
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // Render Engine
  function renderChart() {
    ctx.clearRect(0, 0, canvasW, canvasH);

    if (data.length === 0) {
      ctx.font = "14px 'Inter', sans-serif";
      ctx.fillStyle = "#71717a";
      ctx.textAlign = "center";
      ctx.fillText("No data available. Add items in the table editor.", canvasW / 2, canvasH / 2);
      return;
    }

    if (chartType === 'pie' || chartType === 'donut') {
      renderPieOrDonut(chartType === 'donut');
    } else if (chartType === 'radar') {
      renderRadar();
    } else {
      renderAxesAndCartesian();
    }
  }

  function renderAxesAndCartesian() {
    const padL = 50, padR = 25, padT = 30, padB = 45;
    const chartW = canvasW - padL - padR;
    const chartH = canvasH - padT - padB;

    const vals = data.map(d => Math.max(0, Number(d.value) || 0));
    const maxVal = Math.max(1, ...vals);

    // Y Axis Grid & Labels
    ctx.font = "11px 'Inter', sans-serif";
    ctx.fillStyle = "#71717a";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    const ticks = 5;
    for (let i = 0; i <= ticks; i++) {
      const y = padT + (chartH / ticks) * i;
      const valNum = Math.round(maxVal - (maxVal / ticks) * i);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.07)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + chartW, y);
      ctx.stroke();

      ctx.fillText(valNum.toString(), padL - 8, y);
    }

    // Draw Axes
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + chartH);
    ctx.lineTo(padL + chartW, padT + chartH);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const n = data.length;
    const step = chartW / n;
    const barW = Math.min(48, Math.max(16, step * 0.6));

    if (chartType === 'bar') {
      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      for (let i = 0; i < n; i++) {
        const val = vals[i];
        const bh = (val / maxVal) * chartH;
        const bx = padL + i * step + (step - barW) / 2;
        const by = padT + chartH - bh;
        const isHov = hoveredIndex === i;

        if (bh > 0.5) {
          ctx.shadowBlur = isHov ? 16 : 6;
          ctx.shadowColor = getColor(i);
          ctx.fillStyle = getColor(i);
          drawRoundedRect(ctx, bx, by, barW, bh, 6);
          ctx.fill();
        }

        ctx.shadowBlur = 0;
        ctx.fillStyle = isHov ? "#ffffff" : "#a1a1aa";
        ctx.font = isHov ? "600 12px 'Inter', sans-serif" : "400 12px 'Inter', sans-serif";
        ctx.fillText(data[i].label, bx + barW / 2, padT + chartH + 8);
      }
    } else if (chartType === 'line' || chartType === 'area') {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const val = vals[i];
        const bh = (val / maxVal) * chartH;
        const bx = padL + i * step + step / 2;
        const by = padT + chartH - bh;
        pts.push({ x: bx, y: by });
      }

      if (chartType === 'area') {
        const grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
        grad.addColorStop(0, getColor(0).replace("rgb", "rgba").replace(")", ", 0.4)"));
        grad.addColorStop(1, getColor(0).replace("rgb", "rgba").replace(")", ", 0.0)"));

        ctx.beginPath();
        ctx.moveTo(pts[0].x, padT + chartH);
        pts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(pts[pts.length - 1].x, padT + chartH);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
      }

      // Line path
      ctx.beginPath();
      pts.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.strokeStyle = getColor(0);
      ctx.lineWidth = 3;
      ctx.stroke();

      // Dots & Labels
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      pts.forEach((p, i) => {
        const isHov = hoveredIndex === i;
        ctx.beginPath();
        ctx.arc(p.x, p.y, isHov ? 8 : 5, 0, Math.PI * 2);
        ctx.fillStyle = getColor(i);
        ctx.shadowBlur = isHov ? 14 : 0;
        ctx.shadowColor = getColor(i);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = isHov ? "#ffffff" : "#a1a1aa";
        ctx.font = isHov ? "600 12px 'Inter', sans-serif" : "400 12px 'Inter', sans-serif";
        ctx.fillText(data[i].label, p.x, padT + chartH + 8);
      });
    }

    if (trendMode !== 'none') {
      renderTrendOverlay(padL, padT, chartW, chartH, maxVal, step, barW, vals);
    }

    drawTooltipCartesian(padL, padT, chartW, chartH, maxVal, step, barW);
  }

  function renderTrendOverlay(padL, padT, chartW, chartH, maxVal, step, barW, vals) {
    const n = data.length;
    if (n < 2 || trendMode === 'none') return;

    ctx.save();
    if (trendMode === 'linear') {
      const x0 = padL + step / 2;
      const x1 = padL + (n - 1) * step + step / 2;
      const yHat0 = trendStats.slope * 0 + trendStats.intercept;
      const yHat1 = trendStats.slope * (n - 1) + trendStats.intercept;
      const y0 = padT + chartH - (Math.max(0, yHat0) / maxVal) * chartH;
      const y1 = padT + chartH - (Math.max(0, yHat1) / maxVal) * chartH;

      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 5]);
      ctx.shadowColor = "#facc15";
      ctx.shadowBlur = 8;
      ctx.stroke();

      // Endpoints
      ctx.setLineDash([]);
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(x0, y0, 4, 0, Math.PI * 2);
      ctx.arc(x1, y1, 4, 0, Math.PI * 2);
      ctx.fill();

      // Badge
      const badgeTxt = `Fit: y = ${trendStats.slope >= 0 ? '+' : ''}${trendStats.slope.toFixed(2)}x + ${trendStats.intercept.toFixed(2)}  (R² = ${trendStats.r2.toFixed(3)})`;
      ctx.font = "600 11px 'Inter', sans-serif";
      const bMetrics = ctx.measureText(badgeTxt);
      const bx = padL + chartW - bMetrics.width - 16;
      const by = padT + 8;
      ctx.fillStyle = "rgba(24, 24, 27, 0.88)";
      ctx.strokeStyle = "rgba(250, 204, 21, 0.5)";
      ctx.lineWidth = 1;
      drawRoundedRect(ctx, bx, by, bMetrics.width + 12, 22, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#fde047";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(badgeTxt, bx + 6, by + 11);

    } else if (trendMode === 'movavg') {
      const maPts = [];
      for (let i = 0; i < n; i++) {
        const start = Math.max(0, i - 1);
        const end = Math.min(n - 1, i + 1);
        let sum = 0, count = 0;
        for (let k = start; k <= end; k++) {
          sum += vals[k];
          count++;
        }
        const maVal = sum / count;
        const x = padL + i * step + step / 2;
        const y = padT + chartH - (maVal / maxVal) * chartH;
        maPts.push({ x, y });
      }

      ctx.beginPath();
      maPts.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 8;
      ctx.stroke();

      const badgeTxt = "Moving Average (Window: 3)";
      ctx.font = "600 11px 'Inter', sans-serif";
      const bMetrics = ctx.measureText(badgeTxt);
      const bx = padL + chartW - bMetrics.width - 16;
      const by = padT + 8;
      ctx.fillStyle = "rgba(24, 24, 27, 0.88)";
      ctx.strokeStyle = "rgba(56, 189, 248, 0.5)";
      ctx.lineWidth = 1;
      drawRoundedRect(ctx, bx, by, bMetrics.width + 12, 22, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#7dd3fc";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(badgeTxt, bx + 6, by + 11);

    } else if (trendMode === 'mean') {
      const total = vals.reduce((a, b) => a + b, 0);
      const mean = total / n;
      const yMean = padT + chartH - (mean / maxVal) * chartH;

      ctx.beginPath();
      ctx.moveTo(padL, yMean);
      ctx.lineTo(padL + chartW, yMean);
      ctx.strokeStyle = "#ec4899";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.shadowColor = "#ec4899";
      ctx.shadowBlur = 8;
      ctx.stroke();

      const badgeTxt = `Mean Baseline: ${mean.toFixed(2)}`;
      ctx.font = "600 11px 'Inter', sans-serif";
      const bMetrics = ctx.measureText(badgeTxt);
      const bx = padL + chartW - bMetrics.width - 16;
      const by = padT + 8;
      ctx.fillStyle = "rgba(24, 24, 27, 0.88)";
      ctx.strokeStyle = "rgba(236, 72, 153, 0.5)";
      ctx.lineWidth = 1;
      drawRoundedRect(ctx, bx, by, bMetrics.width + 12, 22, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#f472b6";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(badgeTxt, bx + 6, by + 11);
    }
    ctx.restore();
  }

  function renderPieOrDonut(isDonut) {
    const total = data.reduce((a, b) => a + Math.max(0, Number(b.value) || 0), 0) || 1;
    const cx = canvasW / 2 - 60;
    const cy = canvasH / 2;
    const outerR = Math.min(canvasW, canvasH) * 0.35;
    const innerR = isDonut ? outerR * 0.55 : 0;

    let startAngle = -Math.PI / 2;
    data.forEach((item, i) => {
      const val = Math.max(0, Number(item.value) || 0);
      const sliceAngle = (val / total) * Math.PI * 2;
      const endAngle = startAngle + sliceAngle;
      const isHov = hoveredIndex === i;
      const offsetR = isHov ? 8 : 0;

      const midAngle = startAngle + sliceAngle / 2;
      const dx = Math.cos(midAngle) * offsetR;
      const dy = Math.sin(midAngle) * offsetR;

      ctx.beginPath();
      ctx.arc(cx + dx, cy + dy, outerR, startAngle, endAngle);
      if (isDonut) {
        ctx.arc(cx + dx, cy + dy, innerR, endAngle, startAngle, true);
      } else {
        ctx.lineTo(cx + dx, cy + dy);
      }
      ctx.closePath();

      ctx.fillStyle = getColor(i);
      ctx.shadowBlur = isHov ? 16 : 0;
      ctx.shadowColor = getColor(i);
      ctx.fill();
      ctx.shadowBlur = 0;

      startAngle = endAngle;
    });

    // Donut Center Text
    if (isDonut) {
      ctx.font = "700 18px 'Inter', sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(total.toLocaleString(undefined, { maximumFractionDigits: 1 }), cx, cy);
      ctx.font = "11px 'Inter', sans-serif";
      ctx.fillStyle = "#a1a1aa";
      ctx.fillText("TOTAL", cx, cy + 18);
    }

    // Legend
    const legX = canvasW - 130;
    const legY = cy - (data.length * 22) / 2;
    ctx.font = "12px 'Inter', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    data.forEach((item, i) => {
      const y = legY + i * 22;
      const isHov = hoveredIndex === i;

      ctx.fillStyle = getColor(i);
      ctx.beginPath();
      ctx.arc(legX, y, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = isHov ? "#ffffff" : "#a1a1aa";
      ctx.font = isHov ? "600 12px 'Inter', sans-serif" : "400 12px 'Inter', sans-serif";
      const pct = Math.round(((Number(item.value) || 0) / total) * 100);
      ctx.fillText(`${item.label}: ${item.value} (${pct}%)`, legX + 12, y);
    });

    drawTooltipPolar(cx, cy, outerR, innerR, total);
  }

  function renderRadar() {
    const cx = canvasW / 2;
    const cy = canvasH / 2;
    const radius = Math.min(canvasW, canvasH) * 0.35;
    const n = data.length;

    if (n < 3) {
      ctx.font = "14px 'Inter', sans-serif";
      ctx.fillStyle = "#71717a";
      ctx.textAlign = "center";
      ctx.fillText("Radar chart requires at least 3 data points.", cx, cy);
      return;
    }

    const vals = data.map(d => Math.max(0, Number(d.value) || 0));
    const maxVal = Math.max(1, ...vals);
    const angleStep = (Math.PI * 2) / n;

    // Web Grid concentric polygons
    const gridLevels = 4;
    for (let level = 1; level <= gridLevels; level++) {
      const r = (radius / gridLevels) * level;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const angle = -Math.PI / 2 + i * angleStep;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Spokes & Axis Labels
    ctx.font = "12px 'Inter', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (let i = 0; i < n; i++) {
      const angle = -Math.PI / 2 + i * angleStep;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x, y);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
      ctx.stroke();

      const labelDist = radius + 20;
      const lx = cx + Math.cos(angle) * labelDist;
      const ly = cy + Math.sin(angle) * labelDist;
      const isHov = hoveredIndex === i;
      ctx.fillStyle = isHov ? "#ffffff" : "#a1a1aa";
      ctx.font = isHov ? "600 12px 'Inter', sans-serif" : "400 12px 'Inter', sans-serif";
      ctx.fillText(data[i].label, lx, ly);
    }

    // Data Polygon
    const dataPts = [];
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const val = vals[i];
      const r = (val / maxVal) * radius;
      const angle = -Math.PI / 2 + i * angleStep;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      dataPts.push({ x, y });
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();

    ctx.fillStyle = getColor(0).replace("rgb", "rgba").replace(")", ", 0.35)");
    ctx.fill();
    ctx.strokeStyle = getColor(0);
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Data Points
    dataPts.forEach((p, i) => {
      const isHov = hoveredIndex === i;
      ctx.beginPath();
      ctx.arc(p.x, p.y, isHov ? 7 : 4, 0, Math.PI * 2);
      ctx.fillStyle = getColor(i);
      ctx.fill();
    });

    drawTooltipRadar(dataPts);
  }

  function drawTooltipCartesian(padL, padT, chartW, chartH, maxVal, step, barW) {
    if (hoveredIndex === -1 || hoveredIndex >= data.length) return;
    const item = data[hoveredIndex];
    drawTooltipBox(`${item.label}: ${item.value}`);
  }

  function drawTooltipPolar(cx, cy, outerR, innerR, total) {
    if (hoveredIndex === -1 || hoveredIndex >= data.length) return;
    const item = data[hoveredIndex];
    const pct = Math.round(((Number(item.value) || 0) / total) * 100);
    drawTooltipBox(`${item.label}: ${item.value} (${pct}%)`);
  }

  function drawTooltipRadar(pts) {
    if (hoveredIndex === -1 || hoveredIndex >= data.length) return;
    const item = data[hoveredIndex];
    drawTooltipBox(`${item.label}: ${item.value}`);
  }

  function drawTooltipBox(txt) {
    ctx.font = "600 12px 'Inter', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const tw = ctx.measureText(txt).width;
    const th = 26;
    let tx = hoverX + 12;
    let ty = hoverY - 12 - th;

    if (tx + tw + 16 > canvasW - 8) tx = hoverX - tw - 20;
    if (tx < 8) tx = 8;
    if (ty < 8) ty = hoverY + 16;
    if (ty + th > canvasH - 8) ty = canvasH - th - 8;

    ctx.shadowBlur = 12;
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.fillStyle = "rgba(18, 18, 22, 0.95)";
    drawRoundedRect(ctx, tx, ty, tw + 16, th, 6);
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(txt, tx + (tw + 16) / 2, ty + th / 2);
  }

  // Hover detection
  function handlePointerMove(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    hoverX = clientX - rect.left;
    hoverY = clientY - rect.top;

    let newHover = -1;
    const n = data.length;
    if (n === 0) return;

    if (chartType === 'pie' || chartType === 'donut') {
      const cx = canvasW / 2 - 60;
      const cy = canvasH / 2;
      const dx = hoverX - cx;
      const dy = hoverY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const outerR = Math.min(canvasW, canvasH) * 0.35;
      const innerR = chartType === 'donut' ? outerR * 0.55 : 0;
      const total = data.reduce((a, b) => a + Math.max(0, Number(b.value) || 0), 0) || 1;

      if (dist >= innerR && dist <= outerR + 10) {
        let angle = Math.atan2(dy, dx);
        if (angle < -Math.PI / 2) angle += Math.PI * 2;
        let currAngle = -Math.PI / 2;

        for (let i = 0; i < n; i++) {
          const sliceAngle = (Math.max(0, Number(data[i].value) || 0) / total) * Math.PI * 2;
          if (angle >= currAngle && angle <= currAngle + sliceAngle) {
            newHover = i;
            break;
          }
          currAngle += sliceAngle;
        }
      }
    } else if (chartType === 'radar') {
      const cx = canvasW / 2;
      const cy = canvasH / 2;
      const angleStep = (Math.PI * 2) / n;
      const dx = hoverX - cx;
      const dy = hoverY - cy;
      let angle = Math.atan2(dy, dx);
      if (angle < -Math.PI / 2) angle += Math.PI * 2;

      for (let i = 0; i < n; i++) {
        const spokeAngle = -Math.PI / 2 + i * angleStep;
        let diff = Math.abs(angle - spokeAngle);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        if (diff < angleStep / 2) {
          newHover = i;
          break;
        }
      }
    } else {
      const padL = 50, padR = 25, padT = 30, padB = 45;
      const chartW = canvasW - padL - padR;
      const step = chartW / n;
      for (let i = 0; i < n; i++) {
        const bx = padL + i * step;
        if (hoverX >= bx && hoverX <= bx + step && hoverY >= padT && hoverY <= canvasH - padB) {
          newHover = i;
          break;
        }
      }
    }

    if (newHover !== hoveredIndex) {
      hoveredIndex = newHover;
      renderChart();
    }
  }

  canvas.onmousemove = (e) => handlePointerMove(e.clientX, e.clientY);
  canvas.onmouseleave = () => {
    if (hoveredIndex !== -1) {
      hoveredIndex = -1;
      renderChart();
    }
  };

  // State update wrapper
  function updateAll() {
    renderTable();
    computeStats();
    renderChart();
  }

  // Button Listeners
  document.getElementById('btnHelp').onclick = () => {
    alert("KChart Studio Help:\n\n- Select Chart Type from toolbar (Bar, Line, Area, Pie, Donut, Radar).\n- Use Trendline & Regression overlay buttons (Off, Linear Fit y=mx+b, Moving Avg, Mean).\n- Statistical Suite displays Count, Mean, Median, StdDev, Slope, and R² Fit.\n- Export options: SVG Vector (.svg), PNG Image (.png), CSV (.csv), JSON (.json).\n- Use the table editor to modify data points or drag & drop CSV/JSON files.\n- Hotkeys: 'H' for Help, 'T' to cycle Trendline overlays.");
  };

  document.getElementById('chartTypeGroup').onclick = (e) => {
    if (e.target.tagName === 'BUTTON') {
      document.querySelectorAll('#chartTypeGroup button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      chartType = e.target.dataset.type;
      renderChart();
    }
  };

  document.getElementById('trendGroup').onclick = (e) => {
    if (e.target.tagName === 'BUTTON') {
      document.querySelectorAll('#trendGroup button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      trendMode = e.target.dataset.trend;
      renderChart();
    }
  };

  document.getElementById('themeSelect').onchange = (e) => {
    currentTheme = e.target.value;
    updateAll();
  };

  document.getElementById('presetSelect').onchange = (e) => {
    const val = e.target.value;
    if (val && PRESETS[val]) {
      data = JSON.parse(JSON.stringify(PRESETS[val]));
      updateAll();
    }
  };

  document.getElementById('btnRandomize').onclick = () => {
    data.forEach(item => {
      item.value = Math.floor(10 + Math.random() * 90);
    });
    updateAll();
  };

  document.getElementById('btnAddRow').onclick = () => {
    data.push({ label: `Item ${data.length + 1}`, value: Math.floor(10 + Math.random() * 50) });
    updateAll();
  };

  document.getElementById('btnSortAsc').onclick = () => {
    data.sort((a, b) => a.value - b.value);
    updateAll();
  };

  document.getElementById('btnSortDesc').onclick = () => {
    data.sort((a, b) => b.value - a.value);
    updateAll();
  };

  document.getElementById('btnClear').onclick = () => {
    data = [];
    updateAll();
  };

  // Export handlers
  document.getElementById('btnExportSvg').onclick = () => {
    exportSvg();
  };

  function exportSvg() {
    const n = data.length;
    if (n === 0) {
      alert("No data available to export SVG.");
      return;
    }
    const width = 800;
    const height = 500;
    const padL = 60, padR = 40, padT = 40, padB = 60;
    const chartW = width - padL - padR;
    const chartH = height - padT - padB;
    const vals = data.map(d => Math.max(0, Number(d.value) || 0));
    const maxVal = Math.max(1, ...vals);
    const palette = THEMES[currentTheme] || THEMES.teal;

    let svg = `<?xml version="1.0" encoding="UTF-8"?>\n`;
    svg += `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" style="background:#09090b; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">\n`;
    
    // Gradient definitions
    svg += `  <defs>\n`;
    svg += `    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">\n`;
    svg += `      <stop offset="0%" stop-color="${palette[0]}" stop-opacity="0.6"/>\n`;
    svg += `      <stop offset="100%" stop-color="${palette[0]}" stop-opacity="0.0"/>\n`;
    svg += `    </linearGradient>\n`;
    svg += `  </defs>\n`;

    // Chart Background & Title
    svg += `  <rect width="${width}" height="${height}" fill="#09090b"/>\n`;
    svg += `  <text x="${padL}" y="26" fill="#f4f4f5" font-size="16" font-weight="bold">KChart Studio - ${chartType.toUpperCase()} View</text>\n`;
    svg += `  <text x="${width - padR}" y="26" fill="#a1a1aa" font-size="12" text-anchor="end">Theme: ${currentTheme.toUpperCase()} | Total: ${vals.reduce((a,b)=>a+b,0)}</text>\n`;

    if (chartType === 'pie' || chartType === 'donut') {
      const cx = width / 2 - 60;
      const cy = height / 2;
      const outerR = Math.min(width, height) * 0.35;
      const innerR = (chartType === 'donut') ? outerR * 0.55 : 0;
      const total = vals.reduce((a, b) => a + b, 0) || 1;
      let startAngle = -Math.PI / 2;

      for (let i = 0; i < n; i++) {
        const sliceAngle = (vals[i] / total) * Math.PI * 2;
        const endAngle = startAngle + sliceAngle;
        const x1 = cx + outerR * Math.cos(startAngle);
        const y1 = cy + outerR * Math.sin(startAngle);
        const x2 = cx + outerR * Math.cos(endAngle);
        const y2 = cy + outerR * Math.sin(endAngle);
        const largeArc = sliceAngle > Math.PI ? 1 : 0;
        const col = palette[i % palette.length];

        if (chartType === 'donut') {
          const ix1 = cx + innerR * Math.cos(endAngle);
          const iy1 = cy + innerR * Math.sin(endAngle);
          const ix2 = cx + innerR * Math.cos(startAngle);
          const iy2 = cy + innerR * Math.sin(startAngle);
          const d = `M ${x1} ${y1} A ${outerR} ${outerR} 0 ${largeArc} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix2} ${iy2} Z`;
          svg += `  <path d="${d}" fill="${col}" stroke="#09090b" stroke-width="2"/>\n`;
        } else {
          const d = `M ${cx} ${cy} L ${x1} ${y1} A ${outerR} ${outerR} 0 ${largeArc} 1 ${x2} ${y2} Z`;
          svg += `  <path d="${d}" fill="${col}" stroke="#09090b" stroke-width="2"/>\n`;
        }
        startAngle = endAngle;

        // Legend
        const legY = cy - 40 + i * 22;
        svg += `  <rect x="${width - 150}" y="${legY - 10}" width="12" height="12" rx="3" fill="${col}"/>\n`;
        svg += `  <text x="${width - 130}" y="${legY}" fill="#e4e4e7" font-size="12">${escapeHtml(data[i].label)}: ${vals[i]}</text>\n`;
      }
    } else if (chartType === 'radar') {
      const cx = width / 2;
      const cy = height / 2 + 15;
      const radius = Math.min(chartW, chartH) * 0.42;
      const angleStep = (Math.PI * 2) / n;

      for (let level = 1; level <= 4; level++) {
        const r = (radius * level) / 4;
        const polyPts = [];
        for (let i = 0; i < n; i++) {
          const a = -Math.PI / 2 + i * angleStep;
          polyPts.push(`${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`);
        }
        svg += `  <polygon points="${polyPts.join(' ')}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>\n`;
      }

      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + i * angleStep;
        const sx = cx + radius * Math.cos(a);
        const sy = cy + radius * Math.sin(a);
        svg += `  <line x1="${cx}" y1="${cy}" x2="${sx}" y2="${sy}" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>\n`;
        const lx = cx + (radius + 20) * Math.cos(a);
        const ly = cy + (radius + 20) * Math.sin(a);
        svg += `  <text x="${lx}" y="${ly + 4}" fill="#a1a1aa" font-size="11" text-anchor="middle">${escapeHtml(data[i].label)}</text>\n`;
      }

      const dpts = [];
      for (let i = 0; i < n; i++) {
        const r = (vals[i] / maxVal) * radius;
        const a = -Math.PI / 2 + i * angleStep;
        dpts.push(`${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`);
      }
      svg += `  <polygon points="${dpts.join(' ')}" fill="${palette[0]}" fill-opacity="0.3" stroke="${palette[0]}" stroke-width="2.5"/>\n`;
    } else {
      // Cartesian (Bar, Line, Area)
      const ticks = 5;
      for (let i = 0; i <= ticks; i++) {
        const y = padT + (chartH / ticks) * i;
        const valNum = Math.round(maxVal - (maxVal / ticks) * i);
        svg += `  <line x1="${padL}" y1="${y}" x2="${padL + chartW}" y2="${y}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>\n`;
        svg += `  <text x="${padL - 10}" y="${y + 4}" fill="#71717a" font-size="11" text-anchor="end">${valNum}</text>\n`;
      }

      svg += `  <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + chartH}" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>\n`;
      svg += `  <line x1="${padL}" y1="${padT + chartH}" x2="${padL + chartW}" y2="${padT + chartH}" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>\n`;

      const step = chartW / n;
      const barW = Math.min(48, Math.max(16, step * 0.6));

      if (chartType === 'bar') {
        for (let i = 0; i < n; i++) {
          const bh = (vals[i] / maxVal) * chartH;
          const bx = padL + i * step + (step - barW) / 2;
          const by = padT + chartH - bh;
          const col = palette[i % palette.length];
          svg += `  <rect x="${bx}" y="${by}" width="${barW}" height="${bh}" rx="4" fill="${col}"/>\n`;
          svg += `  <text x="${bx + barW / 2}" y="${padT + chartH + 18}" fill="#a1a1aa" font-size="11" text-anchor="middle">${escapeHtml(data[i].label)}</text>\n`;
        }
      } else if (chartType === 'line' || chartType === 'area') {
        const pts = [];
        for (let i = 0; i < n; i++) {
          const bh = (vals[i] / maxVal) * chartH;
          const bx = padL + i * step + step / 2;
          const by = padT + chartH - bh;
          pts.push({ x: bx, y: by });
        }

        if (chartType === 'area') {
          const polyStr = `${pts[0].x},${padT + chartH} ` + pts.map(p => `${p.x},${p.y}`).join(' ') + ` ${pts[n-1].x},${padT + chartH}`;
          svg += `  <polygon points="${polyStr}" fill="url(#chartGrad)"/>\n`;
        }

        const pathStr = pts.map((p, idx) => (idx === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
        svg += `  <path d="${pathStr}" fill="none" stroke="${palette[0]}" stroke-width="3"/>\n`;

        pts.forEach((p, i) => {
          svg += `  <circle cx="${p.x}" cy="${p.y}" r="5" fill="${palette[i % palette.length]}" stroke="#09090b" stroke-width="1.5"/>\n`;
          svg += `  <text x="${p.x}" y="${padT + chartH + 18}" fill="#a1a1aa" font-size="11" text-anchor="middle">${escapeHtml(data[i].label)}</text>\n`;
        });
      }

      // Trendline in SVG if active
      if (trendMode === 'linear' && n >= 2) {
        const x0 = padL + step / 2;
        const x1 = padL + (n - 1) * step + step / 2;
        const yHat0 = trendStats.slope * 0 + trendStats.intercept;
        const yHat1 = trendStats.slope * (n - 1) + trendStats.intercept;
        const y0 = padT + chartH - (Math.max(0, yHat0) / maxVal) * chartH;
        const y1 = padT + chartH - (Math.max(0, yHat1) / maxVal) * chartH;
        svg += `  <line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#facc15" stroke-width="2.5" stroke-dasharray="6,4"/>\n`;
        svg += `  <text x="${padL + chartW}" y="${padT + 16}" fill="#fde047" font-size="11" text-anchor="end" font-weight="bold">Fit: y = ${trendStats.slope.toFixed(2)}x + ${trendStats.intercept.toFixed(2)} (R² = ${trendStats.r2.toFixed(3)})</text>\n`;
      } else if (trendMode === 'mean') {
        const mean = vals.reduce((a, b) => a + b, 0) / n;
        const yMean = padT + chartH - (mean / maxVal) * chartH;
        svg += `  <line x1="${padL}" y1="${yMean}" x2="${padL + chartW}" y2="${yMean}" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4"/>\n`;
        svg += `  <text x="${padL + chartW}" y="${yMean - 6}" fill="#f472b6" font-size="11" text-anchor="end">Mean: ${mean.toFixed(2)}</text>\n`;
      }
    }

    svg += `</svg>\n`;

    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const link = document.createElement('a');
    link.download = 'kchart_vector.svg';
    link.href = URL.createObjectURL(blob);
    link.click();
  }

  document.getElementById('btnExportPng').onclick = () => {
    const link = document.createElement('a');
    link.download = 'KChart_export.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  document.getElementById('btnExportCsv').onclick = () => {
    let csv = "Label,Value\n";
    data.forEach(d => {
      csv += `"${d.label.replace(/"/g, '""')}",${d.value}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement('a');
    link.download = 'kchart_data.csv';
    link.href = URL.createObjectURL(blob);
    link.click();
  };

  document.getElementById('btnExportJson').onclick = () => {
    const jsonStr = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const link = document.createElement('a');
    link.download = 'kchart_data.json';
    link.href = URL.createObjectURL(blob);
    link.click();
  };

  // Import handlers
  const fileInput = document.getElementById('fileInput');
  document.getElementById('btnImportTrigger').onclick = () => fileInput.click();

  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file) loadFile(file);
  };

  const dropZone = document.getElementById('dropZone');
  dropZone.onclick = () => fileInput.click();

  dropZone.ondragover = (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  };
  dropZone.ondragleave = () => dropZone.classList.remove('dragover');
  dropZone.ondrop = (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      loadFile(e.dataTransfer.files[0]);
    }
  };

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const content = event.target.result;
      if (file.name.endsWith('.json') || content.trim().startsWith('[')) {
        try {
          const parsed = JSON.parse(content);
          if (Array.isArray(parsed)) {
            data = parsed.map((item, i) => ({
              label: item.label || item.name || `Point ${i + 1}`,
              value: Number(item.value || item.val || 0)
            }));
            updateAll();
          }
        } catch (err) {
          alert("Invalid JSON format.");
        }
      } else {
        // Parse CSV
        const lines = content.split(/\r?\n/).filter(line => line.trim() !== '');
        const newData = [];
        lines.forEach((line, idx) => {
          if (idx === 0 && (line.toLowerCase().includes('label') || line.toLowerCase().includes('name'))) return;
          const parts = line.split(',');
          if (parts.length >= 2) {
            const lbl = parts[0].replace(/^"|"$/g, '').trim();
            const val = parseFloat(parts[1].replace(/^"|"$/g, '').trim()) || 0;
            newData.push({ label: lbl, value: val });
          }
        });
        if (newData.length > 0) {
          data = newData;
          updateAll();
        }
      }
    };
    reader.readAsText(file);
  }

  // Window resize
  window.addEventListener('resize', resizeCanvas);
  
  // Shortcuts
  window.addEventListener('keydown', (e) => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

    if (e.key === 'F1' || e.key === 'h' || e.key === 'H') {
      if (e.key === 'F1') e.preventDefault();
      alert("KChart Studio Help:\n\n- Select Chart Type from toolbar (Bar, Line, Area, Pie, Donut, Radar).\n- Use Trendline & Regression overlay buttons (Off, Linear Fit y=mx+b, Moving Avg, Mean).\n- Statistical Suite displays Count, Mean, Median, StdDev, Slope, and R² Fit.\n- Export options: SVG Vector (.svg), PNG Image (.png), CSV (.csv), JSON (.json).\n- Use the table editor to modify data points or drag & drop CSV/JSON files.\n- Hotkeys: 'H' for Help, 'T' to cycle Trendline overlays.");
    } else if (e.key === 't' || e.key === 'T') {
      const modes = ['none', 'linear', 'movavg', 'mean'];
      const nextIdx = (modes.indexOf(trendMode) + 1) % modes.length;
      trendMode = modes[nextIdx];
      document.querySelectorAll('#trendGroup button').forEach(b => {
        if (b.dataset.trend === trendMode) b.classList.add('active');
        else b.classList.remove('active');
      });
      renderChart();
    }
  });
  
  // Init
  resizeCanvas();
  updateAll();
</script>
</body>
</html>
