<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KStellar</title>
    <style>
        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            text-shadow: 0 0 5px #00ffcc;
        }
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        #dashboard {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #00ffcc;
            box-shadow: 0 2px 10px rgba(0, 255, 204, 0.5);
            padding-bottom: 10px;
            margin-bottom: 20px;
            z-index: 1;
        }
        .stat {
            font-size: 1.2em;
            font-weight: bold;
        }
        #main-view {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
            z-index: 1;
        }
        #map-container {
            flex: 2;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            position: relative;
            background-color: #020a10;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle, rgba(0,255,204,0.05) 0%, rgba(0,0,0,0.8) 100%);
        }
        #info-panel {
            flex: 1;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: rgba(0, 20, 30, 0.8);
        }
        h2, h3 { margin-top: 0; color: #00ffcc; text-shadow: 0 0 8px #00ffcc; }
        .system {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.2s;
        }
        .system:hover {
            box-shadow: 0 0 20px #00ffcc;
            background-color: #00ffcc;
            transform: translate(-50%, -50%) scale(1.5);
        }
        .system-label {
            position: absolute;
            color: #00ffcc;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            transform: translate(15px, -7px);
            white-space: nowrap;
            text-shadow: 0 0 5px #000, 0 0 8px #00ffcc;
        }
        .action-btn {
            background-color: #000;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            margin-top: 15px;
            text-transform: uppercase;
            transition: all 0.2s;
            position: relative;
            z-index: 10;
        }
        .action-btn:hover {
            background-color: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }
    </style>
</head>
<body>
    <div id="app" style="display: flex; flex-direction: column; height: 100%;">
        <div id="dashboard">
            <div class="stat">FUEL: <span id="fuel">100</span>%</div>
            <div class="stat">CREDITS: ₭<span id="credits">1,000</span></div>
            <div class="stat">CARGO: <span id="cargo-used">0</span>/<span id="cargo-max">50</span> TONS</div>
        </div>
        <div id="main-view">
            <div id="map-container">
                <div id="map"></div>
            </div>
            <div id="info-panel">
                <h2>LOCAL SYSTEMS</h2>
                <div id="system-info">
                    Select a system on the map for details.
                </div>
            </div>
        </div>
    </div>

    <script>
        const systems = [
            { id: 1, name: "Sol", x: 50, y: 50, desc: "Cradle of humanity. Highly developed planetary system with a stable economy.", market: {food: 20, minerals: 40, tech: 150} },
            { id: 2, name: "Alpha Centauri", x: 30, y: 70, desc: "Primary mining colony. Resource rich, but known for pirate activity on the outskirts.", market: {food: 40, minerals: 15, tech: 200} },
            { id: 3, name: "Sirius", x: 75, y: 35, desc: "Major trading hub. High tech goods are cheap here.", market: {food: 30, minerals: 60, tech: 80} },
            { id: 4, name: "Proxima", x: 20, y: 80, desc: "Remote outpost. Dangerous but offers high rewards for smugglers.", market: {food: 50, minerals: 30, tech: 300} },
            { id: 5, name: "Vega", x: 80, y: 80, desc: "Agricultural world. Supplies food to neighboring industrial systems.", market: {food: 5, minerals: 80, tech: 180} }
        ];

        const mapEl = document.getElementById('map');
        const infoEl = document.getElementById('system-info');

        let currentSystemId = 1;
        let fuel = 100;
        let credits = 1000;
        let cargo = { food: 0, minerals: 0, tech: 0 };
        let cargoMax = 50;

        function getCargoUsed() {
            return cargo.food + cargo.minerals + cargo.tech;
        }

        function updateDashboard() {
            document.getElementById('fuel').innerText = fuel;
            document.getElementById('credits').innerText = credits;
            document.getElementById('cargo-used').innerText = getCargoUsed();
            document.getElementById('cargo-max').innerText = cargoMax;
        }

        window.buy = function(item) {
            const sys = systems.find(s => s.id === currentSystemId);
            const price = sys.market[item];
            if (credits >= price && getCargoUsed() < cargoMax) {
                credits -= price;
                cargo[item]++;
                updateDashboard();
                showSystemInfo(sys);
            } else if (getCargoUsed() >= cargoMax) {
                alert("Cargo hold is full!");
            } else {
                alert("Not enough credits!");
            }
        };

        window.sell = function(item) {
            const sys = systems.find(s => s.id === currentSystemId);
            const price = sys.market[item];
            if (cargo[item] > 0) {
                credits += price;
                cargo[item]--;
                updateDashboard();
                showSystemInfo(sys);
            } else {
                alert("You don't have any " + item + " to sell!");
            }
        };

        window.travelTo = function(sysId) {
            if (sysId === currentSystemId) {
                alert("You are already in this system.");
                return;
            }
            const target = systems.find(s => s.id === sysId);
            const current = systems.find(s => s.id === currentSystemId);
            const dist = Math.sqrt(Math.pow(target.x - current.x, 2) + Math.pow(target.y - current.y, 2));
            const fuelCost = Math.round(dist * 0.5);
            
            if (fuel < fuelCost) {
                alert("Not enough fuel! You need " + fuelCost + "% fuel to reach " + target.name + ".");
                return;
            }
            
            fuel -= fuelCost;
            currentSystemId = sysId;
            updateDashboard();
            
            const randomEncounter = Math.random();
            let msg = "Traveled to " + target.name + ".\nFuel consumed: " + fuelCost + "%.";
            
            if (randomEncounter < 0.3) {
                msg += "\n\nAlert: Hostile pirate vessel encountered!";
                const stolen = Math.floor(Math.random() * 50) + 10;
                if (credits >= stolen) {
                    credits -= stolen;
                    msg += "\nThey extorted ₭" + stolen + " before warping away.";
                } else {
                    msg += "\nThey found you have no money and left you alone.";
                }
            } else if (randomEncounter < 0.5) {
                msg += "\n\nNotice: You found drifting debris.";
                const found = Math.floor(Math.random() * 100) + 20;
                credits += found;
                msg += "\nSalvaged ₭" + found + " in raw materials.";
            } else {
                msg += "\n\nThe journey was uneventful.";
            }
            
            updateDashboard();
            alert(msg);
            renderMap();
            infoEl.innerHTML = "Select a system on the map for details.";
        };

        function showSystemInfo(sys) {
            let html = `
                <h3>${sys.name.toUpperCase()}</h3>
                <p>${sys.desc}</p>
                <p><strong>Coordinates:</strong> X:${sys.x} Y:${sys.y}</p>
            `;
            
            if (sys.id !== currentSystemId) {
                html += `<button class="action-btn" onclick="travelTo(${sys.id})">Set Course</button>`;
            } else {
                html += `<p style="color:#00ffff; font-weight:bold; margin-bottom:5px;">Currently Docked - Local Market</p>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.5); padding:5px;">
                        <span>Food (₭${sys.market.food}) [Inv: ${cargo.food}]</span>
                        <div>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="buy('food')">Buy</button>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="sell('food')">Sell</button>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.5); padding:5px;">
                        <span>Minerals (₭${sys.market.minerals}) [Inv: ${cargo.minerals}]</span>
                        <div>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="buy('minerals')">Buy</button>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="sell('minerals')">Sell</button>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.5); padding:5px;">
                        <span>Tech (₭${sys.market.tech}) [Inv: ${cargo.tech}]</span>
                        <div>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="buy('tech')">Buy</button>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="sell('tech')">Sell</button>
                        </div>
                    </div>
                </div>`;
            }
            infoEl.innerHTML = html;
        }

        function renderMap() {
            mapEl.innerHTML = '';
            systems.forEach(sys => {
                const dot = document.createElement('div');
                dot.className = 'system';
                dot.style.left = sys.x + '%';
                dot.style.top = sys.y + '%';
                
                if (sys.id === currentSystemId) {
                    dot.style.backgroundColor = '#00ffff';
                    dot.style.boxShadow = '0 0 15px #00ffff';
                }
                
                const label = document.createElement('div');
                label.className = 'system-label';
                label.style.left = sys.x + '%';
                label.style.top = sys.y + '%';
                label.innerText = sys.name + (sys.id === currentSystemId ? " (YOU ARE HERE)" : "");
                if (sys.id === currentSystemId) {
                    label.style.color = '#00ffff';
                }

                dot.addEventListener('click', () => showSystemInfo(sys));

                mapEl.appendChild(dot);
                mapEl.appendChild(label);
            });
        }

        renderMap();
        updateDashboard();
    </script>
</body>
</html>
