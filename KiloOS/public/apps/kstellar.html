<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KStellar</title>
    <style>
        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            text-shadow: 0 0 5px #00ffcc;
        }
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        #dashboard {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #00ffcc;
            box-shadow: 0 2px 10px rgba(0, 255, 204, 0.5);
            padding-bottom: 10px;
            margin-bottom: 20px;
            z-index: 1;
        }
        .stat {
            font-size: 1.2em;
            font-weight: bold;
        }
        #main-view {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
            z-index: 1;
        }
        #map-container {
            flex: 2;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            position: relative;
            background-color: #020a10;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle, rgba(0,255,204,0.05) 0%, rgba(0,0,0,0.8) 100%);
        }
        #info-panel {
            flex: 1;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: rgba(0, 20, 30, 0.8);
        }
        h2, h3 { margin-top: 0; color: #00ffcc; text-shadow: 0 0 8px #00ffcc; }
        .system {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.2s;
        }
        .system:hover {
            box-shadow: 0 0 20px #00ffcc;
            background-color: #00ffcc;
            transform: translate(-50%, -50%) scale(1.5);
        }
        .system-label {
            position: absolute;
            color: #00ffcc;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            transform: translate(15px, -7px);
            white-space: nowrap;
            text-shadow: 0 0 5px #000, 0 0 8px #00ffcc;
        }
        .action-btn {
            background-color: #000;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            margin-top: 15px;
            text-transform: uppercase;
            transition: all 0.2s;
            position: relative;
            z-index: 10;
        }
        .action-btn:hover {
            background-color: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }
        .phenom-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-sizing: border-box;
        }
        .phenom-blackhole {
            border: 2px dashed #ff00ff;
            box-shadow: 0 0 10px #ff00ff, inset 0 0 6px #ff00ff;
            animation: phenom-spin 6s linear infinite;
        }
        .phenom-solarflare {
            border: 2px dashed #ffaa00;
            box-shadow: 0 0 10px #ffaa00, inset 0 0 6px #ffaa00;
            animation: phenom-pulse 2s ease-in-out infinite;
        }
        .phenom-derelict {
            border: 2px dashed #b0d0ff;
            box-shadow: 0 0 10px #b0d0ff;
            animation: phenom-pulse 3s ease-in-out infinite;
        }
        @keyframes phenom-spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes phenom-pulse { 0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } }
    </style>
</head>
<body>
    <div id="app" style="display: flex; flex-direction: column; height: 100%;">
        <div id="dashboard">
            <div class="stat">HULL: <span id="hull">100</span>/<span id="max-hull">100</span></div>
            <div class="stat">FUEL: <span id="fuel">100</span>%</div>
            <div class="stat">CREDITS: ₭<span id="credits">1,000</span></div>
            <div class="stat">CARGO: <span id="cargo-used">0</span>/<span id="cargo-max">50</span> TONS</div>
        </div>
        <div id="faction-bar" style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px; padding:6px 10px; border:1px solid #00ffcc; background:rgba(0,25,35,0.7); box-shadow: 0 0 10px rgba(0,255,204,0.2);">
            <span>FEDERATION: <span id="rep-fed" style="color:#00ffff; font-weight:bold;">+10 (Neutral)</span></span>
            <span>TRADERS GUILD: <span id="rep-trd" style="color:#00ff00; font-weight:bold;">+15 (Friendly)</span></span>
            <span>PIRATE SYNDICATE: <span id="rep-pir" style="color:#ff6666; font-weight:bold;">-15 (Unfriendly)</span></span>
        </div>
        <div id="mission-status" style="color: #ff00ff; font-weight: bold; margin-bottom: 10px; min-height: 1.2em; text-shadow: 0 0 5px #ff00ff;"></div>
        <div id="main-view">
            <div id="map-container">
                <div id="map"></div>
            </div>
            <div id="info-panel">
                <h2>LOCAL SYSTEMS</h2>
                <div id="system-info">
                    Select a system on the map for details.
                </div>
            </div>
        </div>
        <div id="combat-overlay" style="display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); z-index:100; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
            <h2 style="color:red; text-shadow:0 0 10px red;">PIRATE ATTACK</h2>
            <div style="display:flex; justify-content:space-around; width:100%; margin-bottom:20px;">
                <div style="text-align:center;">
                    <h3>YOU</h3>
                    <p>Hull: <span id="combat-player-hull">100</span></p>
                </div>
                <div style="text-align:center; color:red;">
                    <h3>PIRATE</h3>
                    <p>Hull: <span id="combat-enemy-hull">50</span></p>
                </div>
            </div>
            <div id="combat-log" style="width:80%; height:150px; border:1px solid #00ffcc; overflow-y:auto; padding:10px; margin-bottom:20px; font-size:14px; background:rgba(0,20,30,0.8);"></div>
            <div style="display:flex; gap:10px;">
                <button class="action-btn" onclick="combatAction('attack')">Attack</button>
                <button class="action-btn" onclick="combatAction('evade')">Evade</button>
                <button class="action-btn" onclick="combatAction('tech')">Use Tech</button>
                <button class="action-btn" onclick="combatAction('flee')">Flee</button>
            </div>
        </div>
    </div>

    <script>
        let systems = [];
        const economyTypes = [
            { name: "Agricultural", foodMult: 0.5, minMult: 1.5, techMult: 1.8 },
            { name: "Mining", foodMult: 1.5, minMult: 0.5, techMult: 1.5 },
            { name: "Industrial", foodMult: 1.3, minMult: 1.2, techMult: 0.8 },
            { name: "Tech Hub", foodMult: 1.5, minMult: 1.5, techMult: 0.5 },
            { name: "Trading Hub", foodMult: 1.0, minMult: 1.0, techMult: 1.0 }
        ];
        const sysNames = ["Aegis", "Borealis", "Cygnus", "Draco", "Eridanus", "Fenrir", "Goliath", "Helios", "Icarus", "Juno", "Krypton", "Lyra", "Orion", "Pegasus", "Rigel", "Sirius", "Taurus", "Ursa", "Vega", "Wolf"];
        const sectorNames = ["Alpha", "Beta", "Gamma", "Delta", "Omega"];

        function generateGalaxy() {
            systems.push({
                id: 1, name: "Sol", sector: "Alpha", x: 50, y: 50, 
                desc: "Cradle of humanity. Highly developed planetary system.", economy: "Trading Hub", 
                phenomenon: "None",
                market: {food: 20, minerals: 40, tech: 150}
            });
            for (let i = 2; i <= 30; i++) {
                let sec = sectorNames[Math.floor(Math.random() * sectorNames.length)];
                let namePrefix = sysNames[Math.floor(Math.random() * sysNames.length)];
                let nameSuffix = ["Prime", "Secundus", "Tertius", "Minor", "Major", "Station", "Outpost", "Belt"][Math.floor(Math.random() * 8)];
                let eco = economyTypes[Math.floor(Math.random() * economyTypes.length)];
                let baseFood = 20 + Math.floor(Math.random() * 10);
                let baseMin = 40 + Math.floor(Math.random() * 20);
                let baseTech = 100 + Math.floor(Math.random() * 50);
                let phenom = "None";
                if (i % 3 === 0) {
                    const pList = ["Black Hole", "Solar Flare", "Derelict Salvage"];
                    phenom = pList[Math.floor((i / 3)) % pList.length];
                }
                systems.push({
                    id: i,
                    name: `${namePrefix} ${nameSuffix}`,
                    sector: sec,
                    x: Math.floor(Math.random() * 90) + 5,
                    y: Math.floor(Math.random() * 90) + 5,
                    desc: `A ${eco.name} system in the ${sec} sector.`,
                    economy: eco.name,
                    phenomenon: phenom,
                    market: {
                        food: Math.floor(baseFood * eco.foodMult),
                        minerals: Math.floor(baseMin * eco.minMult),
                        tech: Math.floor(baseTech * eco.techMult)
                    }
                });
            }
        }
        generateGalaxy();

        const mapEl = document.getElementById('map');
        const infoEl = document.getElementById('system-info');

        let currentSystemId = 1;
        let fuel = 100;
        let credits = 1000;
        let cargo = { food: 0, minerals: 0, tech: 0 };
        let cargoMax = 50;
        let hull = 100;
        let maxHull = 100;
        let enemyHull = 0;
        let enemyMaxHull = 0;
        let inCombat = false;

        let engineLevel = 1;
        let cargoLevel = 1;
        let weaponLevel = 1;
        let shieldLevel = 1;

        let activeMission = null;
        let currentStationMissions = [];

        let repFed = 10;
        let repTraders = 15;
        let repPirates = -15;

        function getFactionTier(rep) {
            if (rep >= 50) return "Allied";
            if (rep >= 15) return "Friendly";
            if (rep > -15) return "Neutral";
            if (rep > -50) return "Unfriendly";
            return "Hostile";
        }

        function getRepColor(rep) {
            if (rep >= 15) return "#00ff66";
            if (rep > -15) return "#00ffff";
            return "#ff5555";
        }

        function adjustRep(fed, trd, pir) {
            repFed = Math.max(-100, Math.min(100, repFed + fed));
            repTraders = Math.max(-100, Math.min(100, repTraders + trd));
            repPirates = Math.max(-100, Math.min(100, repPirates + pir));
        }

        function getBuyPrice(basePrice) {
            let p = basePrice;
            if (repTraders >= 15) p = Math.round(p * 0.9);
            else if (repTraders <= -15) p = Math.round(p * 1.1);
            return Math.max(1, p);
        }

        function getSellPrice(basePrice) {
            let p = basePrice;
            if (repTraders >= 15) p = Math.round(p * 1.1);
            else if (repTraders <= -15) p = Math.round(p * 0.9);
            return Math.max(1, p);
        }

        function generateStationMissions() {
            currentStationMissions = [];
            for (let i = 0; i < 2; i++) {
                let type = Math.random() > 0.5 ? 'delivery' : 'bounty';
                let target = systems[Math.floor(Math.random() * systems.length)];
                if (target.id === currentSystemId) {
                    target = systems[(currentSystemId % systems.length)];
                }
                let reward = 300 + Math.floor(Math.random() * 500);
                currentStationMissions.push({ id: Date.now() + i, type: type, targetId: target.id, targetName: target.name, reward: reward });
            }
        }
        
        generateStationMissions(); // Initial missions

        function getCargoUsed() {
            return cargo.food + cargo.minerals + cargo.tech;
        }

        function updateDashboard() {
            document.getElementById('hull').innerText = hull;
            document.getElementById('max-hull').innerText = maxHull;
            document.getElementById('fuel').innerText = fuel;
            document.getElementById('credits').innerText = credits;
            document.getElementById('cargo-used').innerText = getCargoUsed();
            document.getElementById('cargo-max').innerText = cargoMax;
            
            const fedEl = document.getElementById('rep-fed');
            const trdEl = document.getElementById('rep-trd');
            const pirEl = document.getElementById('rep-pir');
            if (fedEl) {
                fedEl.innerText = `${repFed > 0 ? '+' : ''}${repFed} (${getFactionTier(repFed)})`;
                fedEl.style.color = getRepColor(repFed);
            }
            if (trdEl) {
                trdEl.innerText = `${repTraders > 0 ? '+' : ''}${repTraders} (${getFactionTier(repTraders)})`;
                trdEl.style.color = getRepColor(repTraders);
            }
            if (pirEl) {
                pirEl.innerText = `${repPirates > 0 ? '+' : ''}${repPirates} (${getFactionTier(repPirates)})`;
                pirEl.style.color = getRepColor(repPirates);
            }

            const mStatus = document.getElementById('mission-status');
            if (activeMission) {
                mStatus.innerText = `ACTIVE MISSION: ${activeMission.type === 'delivery' ? 'Deliver to' : 'Hunt bounty in'} ${activeMission.targetName} for ₭${activeMission.reward}`;
            } else {
                mStatus.innerText = '';
            }
        }

        window.upgrade = function(type) {
            let cost = 0;
            if (type === 'engine') cost = 1000 * engineLevel;
            else if (type === 'cargo') cost = 1500 * cargoLevel;
            else if (type === 'weapon') cost = 2000 * weaponLevel;
            else if (type === 'shield') cost = 2000 * shieldLevel;

            if (credits >= cost) {
                credits -= cost;
                if (type === 'engine') engineLevel++;
                else if (type === 'cargo') { cargoLevel++; cargoMax = 50 * cargoLevel; }
                else if (type === 'weapon') weaponLevel++;
                else if (type === 'shield') { shieldLevel++; maxHull = 100 + (shieldLevel - 1) * 50; hull = maxHull; }
                updateDashboard();
                showSystemInfo(systems.find(s => s.id === currentSystemId));
                alert(type.toUpperCase() + " upgraded!");
            } else {
                alert("Not enough credits!");
            }
        };

        window.buy = function(item) {
            const sys = systems.find(s => s.id === currentSystemId);
            const price = getBuyPrice(sys.market[item]);
            if (credits >= price && getCargoUsed() < cargoMax) {
                credits -= price;
                cargo[item]++;
                adjustRep(0, 1, 0);
                updateDashboard();
                showSystemInfo(sys);
            } else if (getCargoUsed() >= cargoMax) {
                alert("Cargo hold is full!");
            } else {
                alert("Not enough credits!");
            }
        };

        window.sell = function(item) {
            const sys = systems.find(s => s.id === currentSystemId);
            const price = getSellPrice(sys.market[item]);
            if (cargo[item] > 0) {
                credits += price;
                cargo[item]--;
                adjustRep(0, 1, 0);
                updateDashboard();
                showSystemInfo(sys);
            } else {
                alert("You don't have any " + item + " to sell!");
            }
        };

        window.travelTo = function(sysId) {
            if (sysId === currentSystemId) {
                alert("You are already in this system.");
                return;
            }
            const target = systems.find(s => s.id === sysId);
            const current = systems.find(s => s.id === currentSystemId);
            const dist = Math.sqrt(Math.pow(target.x - current.x, 2) + Math.pow(target.y - current.y, 2));
            let fuelCost = Math.round((dist * 0.5) / engineLevel);
            if (fuelCost < 1) fuelCost = 1;
            
            if (fuel < fuelCost) {
                alert("Not enough fuel! You need " + fuelCost + "% fuel to reach " + target.name + ".");
                return;
            }
            
            fuel -= fuelCost;
            currentSystemId = sysId;
            generateStationMissions();
            updateDashboard();
            
            let forcedCombat = false;
            let missionMsg = "";
            if (activeMission && activeMission.targetId === sysId) {
                if (activeMission.type === 'delivery') {
                    credits += activeMission.reward;
                    adjustRep(2, 8, 0);
                    missionMsg = `\n\nMission Complete: Delivery made to ${activeMission.targetName}. Earned ₭${activeMission.reward}.\nReputation: +8 Traders Guild, +2 Federation.`;
                    activeMission = null;
                } else if (activeMission.type === 'bounty') {
                    forcedCombat = true;
                }
            }
            
            const randomEncounter = Math.random();
            let msg = "Traveled to " + target.name + ".\nFuel consumed: " + fuelCost + "%." + missionMsg;
            
            if (forcedCombat || randomEncounter < 0.25) {
                updateDashboard();
                if (forcedCombat) {
                    alert(msg + "\n\nAlert: Bounty target located! Intercepting pirate vessel!");
                    startCombat();
                    return;
                } else if (repPirates >= 15) {
                    credits += 150;
                    adjustRep(0, 0, 1);
                    msg += `\n\n[PIRATE SYNDICATE HAIL]\nA pirate corsair intercepts your course, but recognizes your friendly colors!\n"Greetings, corsair brother! The Syndicate honors our friends."\nThey grant safe passage and offer ₭150 in tribute!`;
                } else {
                    alert(msg + "\n\nAlert: Hostile pirate vessel encountered!");
                    startCombat();
                    return;
                }
            } else if (randomEncounter < 0.40) {
                let salvageCreds = Math.floor(Math.random() * 150) + 200;
                credits += salvageCreds;
                let hullRepair = 20;
                hull = Math.min(maxHull, hull + hullRepair);
                let cargoMsg = "";
                if (getCargoUsed() < cargoMax) {
                    cargo.tech++;
                    cargoMsg = " and salvaged 1 ton of intact Tech cargo";
                }
                msg += `\n\n[STELLAR PHENOMENON: DERELICT STARSHIP]\nSensors detected an abandoned freighter drifting in deep space. Boarding drones salvaged ₭${salvageCreds}${cargoMsg}, and used hull scrap to repair +${hullRepair} Hull!`;
            } else if (randomEncounter < 0.55) {
                let dmg = Math.max(5, 22 - shieldLevel * 3);
                hull -= dmg;
                let fuelGain = 25;
                fuel = Math.min(100, fuel + fuelGain);
                msg += `\n\n[STELLAR PHENOMENON: SOLAR FLARE]\nA violent coronal mass ejection swept across your hyperspace corridor! Radiation waves buffeted your vessel (-${dmg} Hull), but emergency collectors absorbed +${fuelGain}% Fuel!`;
            } else if (randomEncounter < 0.70) {
                let dmg = Math.max(5, 25 - shieldLevel * 4);
                hull -= dmg;
                let credsGain = Math.floor(Math.random() * 150) + 300;
                credits += credsGain;
                msg += `\n\n[STELLAR PHENOMENON: BLACK HOLE GRAVITATIONAL SHEAR]\nYour ship skirted the accretion disk of a micro Black Hole! Tidal forces stressed your bulkheads (-${dmg} Hull), but the gravity slingshot accelerated flight and sensors recorded Hawking radiation telemetry worth ₭${credsGain}!`;
            } else if (randomEncounter < 0.85) {
                msg += "\n\nNotice: You found drifting debris.";
                const found = Math.floor(Math.random() * 100) + 20;
                credits += found;
                msg += "\nSalvaged ₭" + found + " in raw materials.";
            } else {
                msg += "\n\nThe journey was uneventful.";
            }
            
            if (hull <= 0) {
                msg += "\n\nCRITICAL: Hull integrity lost during transit! Emergency tow to Sol.";
                hull = maxHull;
                credits = Math.max(0, credits - 500);
                currentSystemId = 1;
            }

            updateDashboard();
            alert(msg);
            renderMap();
            infoEl.innerHTML = "Select a system on the map for details.";
        };

        function startCombat() {
            inCombat = true;
            enemyMaxHull = 30 + currentSystemId * 20;
            enemyHull = enemyMaxHull;
            document.getElementById('combat-overlay').style.display = 'flex';
            document.getElementById('combat-log').innerHTML = '<p>Pirate intercepts your ship! Tactical combat initiated.</p>';
            updateCombatUI();
        }

        function updateCombatUI() {
            document.getElementById('combat-player-hull').innerText = hull;
            document.getElementById('combat-enemy-hull').innerText = enemyHull;
            const logEl = document.getElementById('combat-log');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function logCombat(msg) {
            document.getElementById('combat-log').innerHTML += `<p>${msg}</p>`;
            updateCombatUI();
        }

        window.combatAction = function(action) {
            if (!inCombat) return;
            let playerEvading = false;
            
            if (action === 'attack') {
                let baseDmg = 10 + weaponLevel * 10;
                let fedBonus = repFed >= 15 ? 1.2 : 1.0;
                let dmg = Math.floor(baseDmg * fedBonus * (0.8 + Math.random() * 0.4));
                enemyHull -= dmg;
                let aidText = repFed >= 15 ? " (Federation escort aids attack!)" : "";
                logCombat(`You attack and deal ${dmg} damage!${aidText}`);
            } else if (action === 'evade') {
                playerEvading = true;
                logCombat(`You take evasive maneuvers.`);
            } else if (action === 'tech') {
                if (cargo.tech > 0) {
                    cargo.tech--;
                    let heal = 40;
                    hull = Math.min(maxHull, hull + heal);
                    logCombat(`Used 1 Tech cargo to repair ${heal} hull.`);
                } else {
                    logCombat(`No Tech cargo available to use!`);
                    return;
                }
            } else if (action === 'flee') {
                if (Math.random() < 0.5) {
                    logCombat(`Successfully escaped!`);
                    setTimeout(endCombat, 1500);
                    return;
                } else {
                    logCombat(`Failed to escape!`);
                }
            }
            
            if (enemyHull <= 0) {
                let bounty = 100 + currentSystemId * 50;
                credits += bounty;
                adjustRep(6, 3, -8);
                let logMsg = `Pirate destroyed! Claimed ₭${bounty} standard bounty.<br>Reputation: +6 Federation, +3 Traders, -8 Pirates.`;
                if (activeMission && activeMission.type === 'bounty' && activeMission.targetId === currentSystemId) {
                    let fedBonus = repFed >= 15 ? Math.round(activeMission.reward * 0.15) : 0;
                    let totalReward = activeMission.reward + fedBonus;
                    credits += totalReward;
                    adjustRep(10, 4, -12);
                    let bonusStr = fedBonus > 0 ? ` (includes ₭${fedBonus} Fed Friendly Bonus)` : "";
                    logMsg += `<br>Mission Complete! Earned extra ₭${totalReward}${bonusStr}.<br>Bounty Rep: +10 Federation, +4 Traders, -12 Pirates.`;
                    activeMission = null;
                }
                logCombat(logMsg);
                setTimeout(endCombat, 1500);
                return;
            }
            
            // Enemy turn
            let hitChance = playerEvading ? 0.5 : 0.9;
            if (Math.random() < hitChance) {
                let eDmg = Math.floor((5 + currentSystemId * 5) * (0.8 + Math.random() * 0.4));
                hull -= eDmg;
                logCombat(`Pirate hits you for ${eDmg} damage!`);
            } else {
                logCombat(`Pirate's attack misses!`);
            }
            
            updateCombatUI();
            
            if (hull <= 0) {
                logCombat(`CRITICAL: Hull integrity lost! Emergency tow to Sol.`);
                setTimeout(() => {
                    hull = maxHull;
                    credits = Math.max(0, credits - 500);
                    currentSystemId = 1;
                    endCombat();
                }, 2000);
            }
        };

        function endCombat() {
            inCombat = false;
            document.getElementById('combat-overlay').style.display = 'none';
            updateDashboard();
            renderMap();
            infoEl.innerHTML = "Select a system on the map for details.";
        };

        window.viewMissions = function() {
            let html = `<h3>MISSION BOARD</h3>`;
            if (activeMission) {
                html += `<p style="color:#ff00ff;"><strong>Active Mission:</strong> ${activeMission.type === 'delivery' ? 'Deliver to' : 'Hunt bounty in'} ${activeMission.targetName} for ₭${activeMission.reward}</p>`;
                html += `<button class="action-btn" style="margin-bottom:15px;" onclick="abandonMission()">Abandon Mission</button><br>`;
            } else {
                html += `<p style="color:#aaaaaa;">No active missions.</p>`;
            }
            
            html += `<h4 style="color:#00ffff; margin-bottom:5px;">Available Missions</h4>`;
            if (currentStationMissions.length === 0) {
                html += `<p>No missions available at this station.</p>`;
            } else {
                currentStationMissions.forEach((m, idx) => {
                    let title = m.type === 'delivery' ? 'Delivery to ' + m.targetName : 'Bounty in ' + m.targetName;
                    html += `<div style="border:1px solid #00ffcc; padding:10px; margin-bottom:10px; background:rgba(0,0,0,0.5);">
                        <p style="margin:0 0 5px 0; font-weight:bold;">${title}</p>
                        <p style="margin:0 0 5px 0; color:#00ff00;">Reward: ₭${m.reward}</p>
                        <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="acceptMission(${idx})">Accept</button>
                    </div>`;
                });
            }
            html += `<button class="action-btn" style="margin-top:15px;" onclick="showSystemInfo(systems.find(s=>s.id===currentSystemId))">Back to Station</button>`;
            infoEl.innerHTML = html;
        };

        window.acceptMission = function(idx) {
            if (activeMission) {
                alert("You already have an active mission! Abandon it first to accept a new one.");
                return;
            }
            activeMission = currentStationMissions[idx];
            currentStationMissions.splice(idx, 1);
            updateDashboard();
            viewMissions();
        };

        window.abandonMission = function() {
            activeMission = null;
            updateDashboard();
            viewMissions();
        };

        function showSystemInfo(sys) {
            let phenomBadge = "";
            if (sys.phenomenon && sys.phenomenon !== "None") {
                let pColor = sys.phenomenon === "Black Hole" ? "#ff00ff" : (sys.phenomenon === "Solar Flare" ? "#ffaa00" : "#aaccff");
                phenomBadge = `<div style="margin: 8px 0; padding: 6px; border: 1px dashed ${pColor}; color: ${pColor}; background: rgba(0,0,0,0.4); font-size: 13px;">
                    <strong>[★ PHENOMENON DETECTED]</strong><br>${sys.phenomenon.toUpperCase()}
                </div>`;
            }

            let html = `
                <h3>${sys.name.toUpperCase()}</h3>
                <p>${sys.desc}</p>
                ${phenomBadge}
                <p><strong>Sector:</strong> ${sys.sector} | <strong>Economy:</strong> ${sys.economy}</p>
                <p><strong>Coordinates:</strong> X:${sys.x} Y:${sys.y}</p>
            `;
            
            if (sys.id !== currentSystemId) {
                html += `<button class="action-btn" onclick="travelTo(${sys.id})">Set Course</button>`;
            } else {
                let phenomAction = "";
                if (sys.phenomenon && sys.phenomenon !== "None") {
                    let pColor = sys.phenomenon === "Black Hole" ? "#ff00ff" : (sys.phenomenon === "Solar Flare" ? "#ffaa00" : "#aaccff");
                    let btnText = sys.phenomenon === "Black Hole" ? "PROBE EVENT HORIZON" : (sys.phenomenon === "Solar Flare" ? "HARVEST SOLAR PLASMA" : "SALVAGE DERELICT STARSHIP");
                    phenomAction = `
                    <p style="color:${pColor}; font-weight:bold; margin-bottom:5px; margin-top:15px;">Phenomenon Operations</p>
                    <button class="action-btn" style="margin:0; padding:10px; border-color:${pColor}; color:${pColor}; width:100%;" onclick="investigatePhenomenon()">${btnText}</button>
                    `;
                }

                html += `<p style="color:#00ffff; font-weight:bold; margin-bottom:5px;">Currently Docked - Local Market</p>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.5); padding:5px;">
                        <span>Food [Inv: ${cargo.food}] (Buy ₭${getBuyPrice(sys.market.food)} / Sell ₭${getSellPrice(sys.market.food)})</span>
                        <div>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="buy('food')">Buy</button>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="sell('food')">Sell</button>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.5); padding:5px;">
                        <span>Minerals [Inv: ${cargo.minerals}] (Buy ₭${getBuyPrice(sys.market.minerals)} / Sell ₭${getSellPrice(sys.market.minerals)})</span>
                        <div>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="buy('minerals')">Buy</button>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="sell('minerals')">Sell</button>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.5); padding:5px;">
                        <span>Tech [Inv: ${cargo.tech}] (Buy ₭${getBuyPrice(sys.market.tech)} / Sell ₭${getSellPrice(sys.market.tech)})</span>
                        <div>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="buy('tech')">Buy</button>
                            <button class="action-btn" style="margin:0; padding:5px 10px;" onclick="sell('tech')">Sell</button>
                        </div>
                    </div>
                </div>
                <p style="color:#00ffff; font-weight:bold; margin-bottom:5px; margin-top:15px;">Shipyard (Upgrades)</p>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <button class="action-btn" style="margin:0; padding:5px;" onclick="upgrade('engine')">Upg Engine (₭${1000*engineLevel}) [Lvl ${engineLevel}]</button>
                    <button class="action-btn" style="margin:0; padding:5px;" onclick="upgrade('cargo')">Upg Cargo (₭${1500*cargoLevel}) [Lvl ${cargoLevel}]</button>
                    <button class="action-btn" style="margin:0; padding:5px;" onclick="upgrade('weapon')">Upg Weapons (₭${2000*weaponLevel}) [Lvl ${weaponLevel}]</button>
                    <button class="action-btn" style="margin:0; padding:5px;" onclick="upgrade('shield')">Upg Shields (₭${2000*shieldLevel}) [Lvl ${shieldLevel}]</button>
                </div>
                ${phenomAction}
                <p style="color:#ff00ff; font-weight:bold; margin-bottom:5px; margin-top:15px;">Station Services</p>
                <div style="display:flex; gap:10px;">
                    <button class="action-btn" style="flex:1; margin:0; padding:10px; border-color:#ff00ff; color:#ff00ff;" onclick="viewMissions()">MISSIONS</button>
                    <button class="action-btn" style="flex:1; margin:0; padding:10px; border-color:#00ffff; color:#00ffff;" onclick="viewFactions()">FACTIONS</button>
                </div>`;
            }
            infoEl.innerHTML = html;
        }

        window.viewFactions = function() {
            let fedTier = getFactionTier(repFed);
            let trdTier = getFactionTier(repTraders);
            let pirTier = getFactionTier(repPirates);
            
            let fedColor = getRepColor(repFed);
            let trdColor = getRepColor(repTraders);
            let pirColor = getRepColor(repPirates);

            let html = `<h3>FACTION DIPLOMACY</h3>
            <p style="font-size:12px; color:#aaa; margin-top:-5px;">Standing affects combat assistance, trade margins, and pirate hostility.</p>
            
            <div style="border:1px solid #005577; padding:8px; margin-bottom:10px; background:rgba(0,10,20,0.6);">
                <div style="display:flex; justify-content:space-between;">
                    <strong style="color:#00ffff;">GALACTIC FEDERATION</strong>
                    <span style="color:${fedColor}; font-weight:bold;">${repFed > 0 ? '+' : ''}${repFed} (${fedTier})</span>
                </div>
                <p style="font-size:12px; margin:4px 0;"><strong>Perks:</strong> +20% Combat attack damage & +15% Bounty reward bonus when Friendly (≥+15).</p>
                <button class="action-btn" style="margin:4px 0 0 0; padding:4px 8px; font-size:12px;" onclick="donateFed()">Donate to Naval Patrol (₭350) [+15 Fed, -8 Pir]</button>
            </div>

            <div style="border:1px solid #007733; padding:8px; margin-bottom:10px; background:rgba(0,20,10,0.6);">
                <div style="display:flex; justify-content:space-between;">
                    <strong style="color:#00ff88;">TRADERS GUILD</strong>
                    <span style="color:${trdColor}; font-weight:bold;">${repTraders > 0 ? '+' : ''}${repTraders} (${trdTier})</span>
                </div>
                <p style="font-size:12px; margin:4px 0;"><strong>Perks:</strong> 10% buy discount & +10% sell markup on all commodities when Friendly (≥+15).</p>
                <button class="action-btn" style="margin:4px 0 0 0; padding:4px 8px; font-size:12px;" onclick="payGuildDues()">Pay Guild Dues (₭300) [+15 Traders]</button>
            </div>

            <div style="border:1px solid #772222; padding:8px; margin-bottom:10px; background:rgba(25,0,0,0.6);">
                <div style="display:flex; justify-content:space-between;">
                    <strong style="color:#ff6666;">PIRATE SYNDICATE</strong>
                    <span style="color:${pirColor}; font-weight:bold;">${repPirates > 0 ? '+' : ''}${repPirates} (${pirTier})</span>
                </div>
                <p style="font-size:12px; margin:4px 0;"><strong>Perks:</strong> Random pirate encounters grant safe passage and ₭150 tribute when Friendly (≥+15).</p>
                <button class="action-btn" style="margin:4px 0 0 0; padding:4px 8px; font-size:12px;" onclick="bribePirates()">Bribe Syndicate Smuggler (₭400) [+15 Pir, -8 Fed]</button>
            </div>

            <button class="action-btn" style="margin-top:10px;" onclick="showSystemInfo(systems.find(s=>s.id===currentSystemId))">Back to Station</button>
            `;
            infoEl.innerHTML = html;
        };

        window.donateFed = function() {
            if (credits >= 350) {
                credits -= 350;
                adjustRep(15, 0, -8);
                updateDashboard();
                viewFactions();
                alert("You donated ₭350 to the Galactic Federation Naval Fleet.\nReputation: +15 Federation, -8 Pirate Syndicate.");
            } else {
                alert("Not enough credits to donate!");
            }
        };

        window.payGuildDues = function() {
            if (credits >= 300) {
                credits -= 300;
                adjustRep(0, 15, 0);
                updateDashboard();
                viewFactions();
                alert("You paid ₭300 in Traders Guild annual dues.\nReputation: +15 Traders Guild.");
            } else {
                alert("Not enough credits for guild dues!");
            }
        };

        window.bribePirates = function() {
            if (credits >= 400) {
                credits -= 400;
                adjustRep(-8, 0, 15);
                updateDashboard();
                viewFactions();
                alert("You slipped ₭400 to a Syndicate shadow contact.\nReputation: +15 Pirate Syndicate, -8 Galactic Federation.");
            } else {
                alert("Not enough credits for bribe!");
            }
        };

        window.investigatePhenomenon = function() {
            const sys = systems.find(s => s.id === currentSystemId);
            if (!sys || !sys.phenomenon || sys.phenomenon === "None") return;

            let title = "";
            let details = "";
            if (sys.phenomenon === "Black Hole") {
                let dmg = Math.max(5, 25 - shieldLevel * 3);
                hull -= dmg;
                let reward = Math.floor(Math.random() * 200) + 600;
                credits += reward;
                adjustRep(5, 0, 0);
                title = "BLACK HOLE PROBE OPERATION";
                details = `Your scientific probe pierced the event horizon accretion disk.\nSevere gravitational shear caused -${dmg} Hull damage to your vessel.\nHowever, rare Dark Matter & Chroniton telemetry earned you ₭${reward} credits from the Science Academy!\nFederation reputation increased (+5 Fed).`;
            } else if (sys.phenomenon === "Solar Flare") {
                let dmg = Math.max(5, 18 - shieldLevel * 2);
                hull -= dmg;
                let fuelGain = 35;
                fuel = Math.min(100, fuel + fuelGain);
                let reward = Math.floor(Math.random() * 100) + 350;
                credits += reward;
                adjustRep(0, 4, 0);
                title = "SOLAR FLARE HARVESTING";
                details = `Magnetic scoops deployed into the massive coronal mass ejection.\nSolar radiation inflicted -${dmg} Hull damage.\nSuperheated plasma harvested: +${fuelGain}% Fuel and ₭${reward} in synthesized plasma cells!\nTraders Guild reputation increased (+4 Traders).`;
            } else if (sys.phenomenon === "Derelict Salvage") {
                let reward = Math.floor(Math.random() * 150) + 400;
                credits += reward;
                let hullRepair = 30;
                hull = Math.min(maxHull, hull + hullRepair);
                let cargoMsg = "No free cargo space for raw parts.";
                if (getCargoUsed() + 2 <= cargoMax) {
                    cargo.tech++;
                    cargo.minerals++;
                    cargoMsg = "Recovered 1 ton of Tech and 1 ton of Minerals!";
                }
                adjustRep(-2, 1, 5);
                title = "DERELICT BOARDING OPERATION";
                details = `Your salvage crew boarded the derelict starship hull.\nRecovered ₭${reward} in salvageable components.\nRestored +${hullRepair} Hull using structural plating.\n${cargoMsg}\nReputation changed: +5 Pirates, +1 Traders, -2 Federation.`;
            }

            sys.phenomenon = "None";
            updateDashboard();
            renderMap();
            showSystemInfo(sys);
            alert(`[${title}]\n\n${details}`);

            if (hull <= 0) {
                alert("CRITICAL: Fatal damage sustained during operation! Emergency tow to Sol.");
                hull = maxHull;
                credits = Math.max(0, credits - 500);
                currentSystemId = 1;
                updateDashboard();
                renderMap();
                showSystemInfo(systems.find(s => s.id === 1));
            }
        };

        function renderMap() {
            mapEl.innerHTML = '';
            systems.forEach(sys => {
                if (sys.phenomenon && sys.phenomenon !== "None") {
                    const ring = document.createElement('div');
                    let pClass = sys.phenomenon === "Black Hole" ? "phenom-blackhole" : (sys.phenomenon === "Solar Flare" ? "phenom-solarflare" : "phenom-derelict");
                    ring.className = `phenom-ring ${pClass}`;
                    ring.style.left = sys.x + '%';
                    ring.style.top = sys.y + '%';
                    ring.style.width = '24px';
                    ring.style.height = '24px';
                    mapEl.appendChild(ring);
                }

                const dot = document.createElement('div');
                dot.className = 'system';
                dot.style.left = sys.x + '%';
                dot.style.top = sys.y + '%';
                
                if (sys.id === currentSystemId) {
                    dot.style.backgroundColor = '#00ffff';
                    dot.style.boxShadow = '0 0 15px #00ffff';
                }
                
                const label = document.createElement('div');
                label.className = 'system-label';
                label.style.left = sys.x + '%';
                label.style.top = sys.y + '%';
                let labelText = sys.name + (sys.id === currentSystemId ? " (YOU ARE HERE)" : "");
                if (sys.phenomenon && sys.phenomenon !== "None") {
                    labelText += ` [★ ${sys.phenomenon}]`;
                }
                label.innerText = labelText;
                if (sys.id === currentSystemId) {
                    label.style.color = '#00ffff';
                    label.style.display = 'block';
                } else {
                    label.style.display = 'none';
                }

                dot.addEventListener('mouseover', () => { label.style.display = 'block'; });
                dot.addEventListener('mouseout', () => { if (sys.id !== currentSystemId) label.style.display = 'none'; });
                dot.addEventListener('click', () => showSystemInfo(sys));

                mapEl.appendChild(dot);
                mapEl.appendChild(label);
            });
        }

        renderMap();
        updateDashboard();
    </script>
</body>
</html>
