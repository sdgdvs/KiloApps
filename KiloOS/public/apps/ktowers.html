<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTowers</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --freeze-color: #06b6d4;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: var(--accent-color);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 900px;
            width: 100%;
        }

        .mode-toggle {
            display: flex;
            background: #0f172a;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: #0f172a;
        }

        .stage-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select, button {
            background: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:focus, button:focus {
            outline: 2px solid var(--accent-color);
        }

        button:hover:not(:disabled) {
            background: var(--border-color);
            border-color: var(--accent-color);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-powerup {
            background: #1e1b4b;
            border-color: #4338ca;
            color: #c7d2fe;
        }

        .btn-powerup:hover:not(:disabled) {
            background: #312e81;
            border-color: #6366f1;
        }

        .btn-freeze {
            background: #083344;
            border-color: #0891b2;
            color: #cffaff;
        }

        .btn-freeze:hover:not(:disabled) {
            background: #155e75;
            border-color: #22d3ee;
        }

        .stage-banner {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            color: #e2e8f0;
            margin-bottom: 12px;
            max-width: 900px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stage-title {
            font-weight: 700;
            color: var(--accent-color);
        }

        .stage-rules {
            font-size: 13px;
            color: var(--warning-color);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            font-size: 15px;
            font-weight: 600;
            background: var(--panel-bg);
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .frozen-badge {
            background: var(--freeze-color);
            color: #042f2e;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0 15px 0;
            padding: 10px;
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            max-width: 900px;
            width: 100%;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #ktowersCanvas {
            width: 100%;
            height: auto;
            max-width: 860px;
            border-radius: 12px;
            background: #090d16;
            cursor: pointer;
        }

        .controls-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .modal-stars {
            font-size: 32px;
            color: #f59e0b;
            margin: 10px 0;
        }

        .modal-body {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: left;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .message-toast {
            min-height: 24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--danger-color);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h1>🏰 KTowers</h1>

    <div class="header-bar">
        <div class="mode-toggle">
            <button class="mode-btn active" id="modeCampaignBtn" onclick="setMode('campaign')">Campaign</button>
            <button class="mode-btn" id="modeFreeBtn" onclick="setMode('free')">Free Play</button>
        </div>

        <div id="campaignControls" class="stage-selector">
            <label for="stageSelect">Stage: </label>
            <select id="stageSelect" onchange="changeStage()"></select>
        </div>

        <div id="freeControls" class="stage-selector" style="display: none;">
            <label for="freePegs">Pegs: </label>
            <select id="freePegs" onchange="initGame()">
                <option value="3">3 Pegs</option>
                <option value="4">4 Pegs</option>
                <option value="5">5 Pegs</option>
            </select>
            <label for="freeDiscs" style="margin-left: 8px;">Discs: </label>
            <select id="freeDiscs" onchange="initGame()">
                <option value="3">3 Discs</option>
                <option value="4" selected>4 Discs</option>
                <option value="5">5 Discs</option>
                <option value="6">6 Discs</option>
                <option value="7">7 Discs</option>
                <option value="8">8 Discs</option>
                <option value="9">9 Discs</option>
                <option value="10">10 Discs</option>
            </select>
        </div>
    </div>

    <div class="stage-banner">
        <div class="stage-title" id="stageTitle">Stage 1: Beginner's Stack</div>
        <div class="stage-rules" id="stageRules"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">⏱️ Time: <span id="timeDisplay">00:00</span> <span id="frozenBadge" class="frozen-badge" style="display:none;">FROZEN</span></div>
        <div class="stat-item">🎯 Moves: <span id="moveDisplay">0</span> / <span id="parDisplay">7</span></div>
        <div class="stat-item">⭐ Best: <span id="bestDisplay">--</span></div>
    </div>

    <div class="message-toast" id="messageToast"></div>

    <div class="game-container">
        <canvas id="ktowersCanvas" width="860" height="380"></canvas>
    </div>

    <div class="controls-grid">
        <button class="btn-powerup" onclick="undoMove()" id="undoBtn" disabled>↩️ Undo [U]</button>
        <button class="btn-powerup" onclick="applyHint()" id="hintBtn">💡 Hint [H]</button>
        <button class="btn-freeze" onclick="useTimeFreeze()" id="freezeBtn">🧊 Freeze [F] (<span id="freezeChargesDisplay">3</span>)</button>
        <button class="btn-powerup" onclick="useDiskSwap()" id="swapBtn">⚡ Swap [S] (<span id="swapChargesDisplay">3</span>)</button>
        <button onclick="toggleAutoSolve()" id="autoBtn">🤖 Auto-Solve [A]</button>
        <button onclick="initGame()">🔄 Restart [R]</button>
        <button onclick="showHelp()">❓ Help</button>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="modalOverlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">STAGE CLEARED!</div>
            <div class="modal-stars" id="modalStars">⭐⭐⭐</div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-btns" id="modalBtns"></div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // Stage Definitions (20 Campaign Stages)
        // ----------------------------------------------------
        const CAMPAIGN_STAGES = [
            { id: 1,  name: "Beginner's Stack", disks: 3, pegs: 3, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 7 },
            { id: 2,  name: "Step Up",          disks: 4, pegs: 3, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 15 },
            { id: 3,  name: "Linear Steps",      disks: 3, pegs: 3, timeLimit: 0,  moveLimit: 0,  adjOnly: true,  cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 26 },
            { id: 4,  name: "Reve's Intro",      disks: 5, pegs: 4, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 13 },
            { id: 5,  name: "Sprint Trial",      disks: 4, pegs: 3, timeLimit: 40, moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 15 },
            { id: 6,  name: "Move Efficiency",  disks: 4, pegs: 3, timeLimit: 0,  moveLimit: 20, adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 15 },
            { id: 7,  name: "Quad Towers",       disks: 6, pegs: 4, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 17 },
            { id: 8,  name: "Locked Foundation", disks: 4, pegs: 3, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 4, lockDuration: 5, par: 15 },
            { id: 9,  name: "Penta Realm",       disks: 7, pegs: 5, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 19 },
            { id: 10, name: "Chain Migration",   disks: 4, pegs: 4, timeLimit: 0,  moveLimit: 0,  adjOnly: true,  cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 34 },
            { id: 11, name: "Clockwork Tower",   disks: 5, pegs: 3, timeLimit: 60, moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 31 },
            { id: 12, name: "Cyclic Orbit",       disks: 4, pegs: 3, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: true,  colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 59 },
            { id: 13, name: "Reve's Master",     disks: 8, pegs: 4, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 33 },
            { id: 14, name: "Spectrum Filter",    disks: 4, pegs: 4, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 1, lockedDisk: 0, lockDuration: 0, par: 9 },
            { id: 15, name: "Precision Stack",   disks: 5, pegs: 3, timeLimit: 0,  moveLimit: 38, adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 31 },
            { id: 16, name: "Heavy Chains",      disks: 5, pegs: 4, timeLimit: 0,  moveLimit: 0,  adjOnly: true,  cyclic: false, colorRestr: 0, lockedDisk: 5, lockDuration: 8, par: 57 },
            { id: 17, name: "Cyclic Cascade",     disks: 5, pegs: 4, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: true,  colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 75 },
            { id: 18, name: "Chromatic Citadel",  disks: 6, pegs: 4, timeLimit: 90, moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 1, lockedDisk: 0, lockDuration: 0, par: 21 },
            { id: 19, name: "Pentagonal Matrix",  disks: 9, pegs: 5, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 27 },
            { id: 20, name: "Tower Grandmaster", disks: 10,pegs: 5, timeLimit: 0,  moveLimit: 0,  adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0, par: 31 }
        ];

        const DISK_THEMES = [
            { main: '#ef4444', side: '#b91c1c', top: '#fca5a5', name: 'Ruby Glass' },
            { main: '#f97316', side: '#c2410c', top: '#fdba74', name: 'Amber Copper' },
            { main: '#f59e0b', side: '#b45309', top: '#fde047', name: 'Gold Terrace' },
            { main: '#10b981', side: '#047857', top: '#6ee7b7', name: 'Emerald Prism' },
            { main: '#06b6d4', side: '#0e7490', top: '#67e8f9', name: 'Cyan Glass' },
            { main: '#3b82f6', side: '#1d4ed8', top: '#93c5fd', name: 'Sapphire Tower' },
            { main: '#6366f1', side: '#4338ca', top: '#a5b4fc', name: 'Cobalt Plaza' },
            { main: '#8b5cf6', side: '#6d28d9', top: '#c4b5fd', name: 'Amethyst Skyscraper' },
            { main: '#ec4899', side: '#be185d', top: '#f9a8d4', name: 'Neon Rose' },
            { main: '#f43f5e', side: '#be123c', top: '#fda4af', name: 'Crimson Pinnacle' }
        ];

        // ----------------------------------------------------
        // Frame-Stewart & Optimal Solvers
        // ----------------------------------------------------
        const FS_DP = Array.from({ length: 12 }, () => Array(6).fill(0));
        const FS_SPLIT = Array.from({ length: 12 }, () => Array(6).fill(0));

        function initFrameStewartDP() {
            for (let k = 3; k <= 5; k++) {
                FS_DP[1][k] = 1;
                FS_SPLIT[1][k] = 1;
            }
            for (let n = 1; n <= 10; n++) {
                FS_DP[n][3] = (1 << n) - 1;
                FS_SPLIT[n][3] = 1;
            }
            for (let k = 4; k <= 5; k++) {
                for (let n = 2; n <= 10; n++) {
                    let minCost = 999999;
                    let bestK = 1;
                    for (let r = 1; r < n; r++) {
                        let cost = 2 * FS_DP[n - r][k] + FS_DP[r][k - 1];
                        if (cost < minCost) {
                            minCost = cost;
                            bestK = r;
                        }
                    }
                    FS_DP[n][k] = minCost;
                    FS_SPLIT[n][k] = bestK;
                }
            }
        }
        initFrameStewartDP();

        function getOptimalMovesCount(n, k, adjOnly = false) {
            if (adjOnly && k === 3) return Math.pow(3, n) - 1;
            return FS_DP[n][k] || (1 << n) - 1;
        }

        // ----------------------------------------------------
        // Game State Variables
        // ----------------------------------------------------
        let currentMode = 'campaign';
        let currentStageIdx = 0;
        let numPegs = 3;
        let numDiscs = 4;

        let pegs = [];
        let selectedPeg = null;
        let moves = 0;
        let won = false;
        let gameOver = false;
        let moveHistory = [];

        let elapsedSeconds = 0;
        let freezeSeconds = 0;
        let freezeCharges = 3;
        let swapCharges = 3;
        let timerInterval = null;
        let autoSolveInterval = null;
        let hintHighlight = null;

        // Visual / Physics Animation State
        let discAnimPos = {}; // pegIdx_discVal -> currentY
        let fireworks = [];
        let dustParticles = [];
        let screenShake = 0;
        let globalAnimTime = 0;
        let hoverPeg = -1;

        // Local Storage
        let campaignStats = JSON.parse(localStorage.getItem('ktowers_campaign_v2') || '{}');

        // Audio System
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!window.AudioContext && !window.webkitAudioContext) return;
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                let now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'pickup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'drop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(700, now);
                    osc.frequency.exponentialRampToValueAtTime(450, now + 0.08);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(120, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'freeze') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'win') {
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.value = f;
                        g.gain.setValueAtTime(0, now + i*0.1);
                        g.gain.linearRampToValueAtTime(0.25, now + i*0.1 + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.25);
                        o.start(now + i*0.1); o.stop(now + i*0.1 + 0.25);
                    });
                }
            } catch(e) {}
        }

        // ----------------------------------------------------
        // Initialization & Mode Setup
        // ----------------------------------------------------
        function populateStageDropdown() {
            const select = document.getElementById('stageSelect');
            select.innerHTML = '';
            CAMPAIGN_STAGES.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                const stats = campaignStats[s.id];
                const stars = stats ? '★'.repeat(stats.stars) : '';
                const isUnlocked = idx === 0 || campaignStats[CAMPAIGN_STAGES[idx - 1].id];
                opt.textContent = `${s.id}. ${s.name} ${stars} ${!isUnlocked ? '🔒' : ''}`;
                opt.disabled = !isUnlocked;
                select.appendChild(opt);
            });
            select.value = currentStageIdx;
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeCampaignBtn').classList.toggle('active', mode === 'campaign');
            document.getElementById('modeFreeBtn').classList.toggle('active', mode === 'free');
            document.getElementById('campaignControls').style.display = mode === 'campaign' ? 'flex' : 'none';
            document.getElementById('freeControls').style.display = mode === 'free' ? 'flex' : 'none';
            if (mode === 'campaign') populateStageDropdown();
            initGame();
        }

        function changeStage() {
            currentStageIdx = parseInt(document.getElementById('stageSelect').value, 10);
            initGame();
        }

        function getCurrentStageConfig() {
            if (currentMode === 'campaign') {
                return CAMPAIGN_STAGES[currentStageIdx];
            } else {
                const p = parseInt(document.getElementById('freePegs').value, 10);
                const d = parseInt(document.getElementById('freeDiscs').value, 10);
                return {
                    id: 0, name: `Free Play (${d} Discs, ${p} Pegs)`,
                    disks: d, pegs: p, timeLimit: 0, moveLimit: 0,
                    adjOnly: false, cyclic: false, colorRestr: 0, lockedDisk: 0, lockDuration: 0,
                    par: getOptimalMovesCount(d, p)
                };
            }
        }

        function isValidMove(config, from, to, topDisc, currentMoves) {
            if (from === to) return false;
            if (config.adjOnly && Math.abs(from - to) !== 1) return false;
            if (config.cyclic && ((from + 1) % numPegs !== to)) return false;
            if (config.lockedDisk > 0 && topDisc === config.lockedDisk && currentMoves < config.lockDuration) return false;
            if (config.colorRestr === 1 && to === 1 && (topDisc % 2 !== 0)) return false;
            return true;
        }

        function initGame() {
            const config = getCurrentStageConfig();
            numPegs = config.pegs;
            numDiscs = config.disks;

            pegs = Array.from({ length: numPegs }, () => []);
            for (let i = numDiscs; i >= 1; i--) {
                pegs[0].push(i);
            }

            selectedPeg = null;
            moves = 0;
            won = false;
            gameOver = false;
            moveHistory = [];
            elapsedSeconds = 0;
            freezeSeconds = 0;
            freezeCharges = 3;
            swapCharges = 3;
            hintHighlight = null;
            fireworks = [];
            dustParticles = [];
            screenShake = 0;
            discAnimPos = {};

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            if (autoSolveInterval) {
                clearInterval(autoSolveInterval);
                autoSolveInterval = null;
                document.getElementById('autoBtn').innerText = "🤖 Auto-Solve [A]";
            }

            // Update UI
            document.getElementById('stageTitle').innerText = config.name;
            let rulesText = [];
            if (config.adjOnly) rulesText.push("⚡ Adjacent Pegs Only");
            if (config.cyclic) rulesText.push("🔄 Cyclic Move Rule");
            if (config.colorRestr === 1) rulesText.push("🎨 Peg 2 Even Disks Only");
            if (config.moveLimit > 0) rulesText.push(`🎯 Max ${config.moveLimit} Moves`);
            if (config.timeLimit > 0) rulesText.push(`⏳ ${config.timeLimit}s Time Limit`);
            if (config.lockedDisk > 0) rulesText.push(`🔒 Disk ${config.lockedDisk} Locked for ${config.lockDuration} moves`);
            document.getElementById('stageRules').innerHTML = rulesText.join(' | ') || 'Standard Rules';

            document.getElementById('parDisplay').innerText = config.par;
            document.getElementById('freezeChargesDisplay').innerText = freezeCharges;
            document.getElementById('swapChargesDisplay').innerText = swapCharges;
            document.getElementById('messageToast').innerText = '';
            document.getElementById('modalOverlay').style.display = 'none';

            updateStatsDisplay();
            render();
        }

        function updateStatsDisplay() {
            const config = getCurrentStageConfig();
            if (currentMode === 'campaign') {
                const stats = campaignStats[config.id];
                document.getElementById('bestDisplay').innerText = stats ? `${'★'.repeat(stats.stars)} (${stats.moves}m, ${formatTime(stats.time)})` : '--';
            } else {
                document.getElementById('bestDisplay').innerText = 'Free Play Mode';
            }
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimer() {
            if (won || gameOver) return;

            if (freezeSeconds > 0) {
                freezeSeconds--;
                document.getElementById('frozenBadge').style.display = 'inline-block';
                document.getElementById('frozenBadge').innerText = `FROZEN (${freezeSeconds}s)`;
            } else {
                document.getElementById('frozenBadge').style.display = 'none';
                elapsedSeconds++;
            }

            document.getElementById('timeDisplay').innerText = formatTime(elapsedSeconds);

            const config = getCurrentStageConfig();
            if (config.timeLimit > 0 && elapsedSeconds >= config.timeLimit) {
                triggerGameOver("Time limit expired!");
            }
        }

        // ----------------------------------------------------
        // Power-ups & Gameplay Mechanics
        // ----------------------------------------------------
        function useTimeFreeze() {
            if (won || gameOver) return;
            if (freezeCharges <= 0) {
                document.getElementById('messageToast').innerText = "No Freeze charges remaining!";
                playSound('error');
                return;
            }
            freezeCharges--;
            freezeSeconds += 15;
            document.getElementById('freezeChargesDisplay').innerText = freezeCharges;
            document.getElementById('frozenBadge').style.display = 'inline-block';
            document.getElementById('frozenBadge').innerText = `FROZEN (${freezeSeconds}s)`;
            playSound('freeze');
            if (!timerInterval) timerInterval = setInterval(updateTimer, 1000);
        }

        function useDiskSwap() {
            if (won || gameOver) return;
            if (swapCharges <= 0) {
                document.getElementById('messageToast').innerText = "No Swap charges remaining!";
                playSound('error');
                return;
            }

            const config = getCurrentStageConfig();
            let srcPeg = -1, targetPeg = -1;

            if (selectedPeg !== null && pegs[selectedPeg].length > 0) {
                srcPeg = selectedPeg;
                const topDisc = pegs[srcPeg][pegs[srcPeg].length - 1];
                const defaultTarget = numPegs - 1;
                if (defaultTarget !== srcPeg && isValidMove(config, srcPeg, defaultTarget, topDisc, moves)) {
                    const destPeg = pegs[defaultTarget];
                    if (destPeg.length === 0 || destPeg[destPeg.length - 1] > topDisc) {
                        targetPeg = defaultTarget;
                    }
                }
                if (targetPeg === -1) {
                    for (let p = 0; p < numPegs; p++) {
                        if (p === srcPeg) continue;
                        if (isValidMove(config, srcPeg, p, topDisc, moves)) {
                            const destPeg = pegs[p];
                            if (destPeg.length === 0 || destPeg[destPeg.length - 1] > topDisc) {
                                targetPeg = p;
                                break;
                            }
                        }
                    }
                }
            } else {
                const nextMove = getBFSNextMove();
                if (nextMove) {
                    srcPeg = nextMove.from;
                    targetPeg = nextMove.to;
                }
            }

            if (srcPeg !== -1 && targetPeg !== -1) {
                const movingDisc = pegs[srcPeg][pegs[srcPeg].length - 1];
                moveHistory.push({ from: srcPeg, to: targetPeg });
                pegs[targetPeg].push(pegs[srcPeg].pop());
                moves++;
                swapCharges--;
                selectedPeg = null;
                hintHighlight = null;
                document.getElementById('swapChargesDisplay').innerText = swapCharges;
                document.getElementById('messageToast').innerText = "⚡ Disk Teleported!";
                playSound('freeze');

                if (!timerInterval) timerInterval = setInterval(updateTimer, 1000);

                if (config.moveLimit > 0 && moves > config.moveLimit && pegs[numPegs - 1].length !== numDiscs) {
                    render();
                    triggerGameOver(`Exceeded move limit of ${config.moveLimit}!`);
                    return;
                }

                if (!checkWin()) {
                    render();
                }
            } else {
                document.getElementById('messageToast').innerText = "No valid target peg for Teleport!";
                playSound('error');
            }
        }

        function undoMove() {
            if (moveHistory.length === 0 || won || gameOver) return;
            const lastMove = moveHistory.pop();
            pegs[lastMove.from].push(pegs[lastMove.to].pop());
            moves--;
            selectedPeg = null;
            hintHighlight = null;
            render();
            playSound('drop');
        }

        function handlePegClick(pegIdx) {
            if (won || gameOver) return;
            document.getElementById('messageToast').innerText = '';

            const config = getCurrentStageConfig();

            if (selectedPeg === null) {
                // Pick up top disc
                if (pegs[pegIdx].length > 0) {
                    const topDisc = pegs[pegIdx][pegs[pegIdx].length - 1];
                    if (config.lockedDisk > 0 && topDisc === config.lockedDisk && moves < config.lockDuration) {
                        document.getElementById('messageToast').innerText = `🔒 Disk ${config.lockedDisk} is locked for ${config.lockDuration - moves} more moves!`;
                        playSound('error');
                        return;
                    }
                    selectedPeg = pegIdx;
                    hintHighlight = null;
                    playSound('pickup');
                    render();
                } else {
                    playSound('error');
                }
            } else if (selectedPeg === pegIdx) {
                // Deselect
                selectedPeg = null;
                playSound('drop');
                render();
            } else {
                if (config.adjOnly && Math.abs(selectedPeg - pegIdx) !== 1) {
                    document.getElementById('messageToast').innerText = "⚡ Adjacent pegs only!";
                    playSound('error');
                    selectedPeg = null;
                    render();
                    return;
                }
                if (config.cyclic && ((selectedPeg + 1) % numPegs !== pegIdx)) {
                    document.getElementById('messageToast').innerText = "🔄 Cyclic Move Only (Clockwise)!";
                    playSound('error');
                    selectedPeg = null;
                    render();
                    return;
                }

                const fromPeg = pegs[selectedPeg];
                const toPeg = pegs[pegIdx];
                const movingDisc = fromPeg[fromPeg.length - 1];

                if (config.colorRestr === 1 && pegIdx === 1 && (movingDisc % 2 !== 0)) {
                    document.getElementById('messageToast').innerText = "🎨 Peg 2 accepts Even Disks only!";
                    playSound('error');
                    selectedPeg = null;
                    render();
                    return;
                }

                if (toPeg.length === 0 || toPeg[toPeg.length - 1] > movingDisc) {
                    moveHistory.push({ from: selectedPeg, to: pegIdx });
                    toPeg.push(fromPeg.pop());
                    moves++;
                    selectedPeg = null;
                    hintHighlight = null;

                    if (!timerInterval) timerInterval = setInterval(updateTimer, 1000);

                    if (config.moveLimit > 0 && moves > config.moveLimit && pegs[numPegs - 1].length !== numDiscs) {
                        render();
                        triggerGameOver(`Exceeded move limit of ${config.moveLimit}!`);
                        return;
                    }

                    if (!checkWin()) {
                        playSound('drop');
                    }
                    render();
                } else {
                    document.getElementById('messageToast').innerText = "Cannot place larger disc on smaller disc!";
                    selectedPeg = null;
                    playSound('error');
                    render();
                }
            }
        }

        // ----------------------------------------------------
        // Optimal Solver & Hint Engine
        // ----------------------------------------------------
        function getBFSNextMove() {
            const targetPeg = numPegs - 1;
            const config = getCurrentStageConfig();
            if (pegs[targetPeg].length === numDiscs) return null;

            const queue = [];
            const visited = new Set();

            function encodeState(pState) {
                let code = [];
                for (let d = 1; d <= numDiscs; d++) {
                    for (let p = 0; p < numPegs; p++) {
                        if (pState[p].includes(d)) {
                            code.push(p);
                            break;
                        }
                    }
                }
                return code.join(',');
            }

            const initialCode = encodeState(pegs);
            queue.push({ state: pegs.map(p => [...p]), path: [] });
            visited.add(initialCode);

            let steps = 0;
            while (queue.length > 0 && steps < 4000) {
                steps++;
                const { state, path } = queue.shift();

                if (state[targetPeg].length === numDiscs) {
                    return path[0];
                }

                for (let from = 0; from < numPegs; from++) {
                    if (state[from].length === 0) continue;
                    const topDisc = state[from][state[from].length - 1];

                    if (config.lockedDisk > 0 && topDisc === config.lockedDisk && (moves + path.length) < config.lockDuration) {
                        continue;
                    }

                    for (let to = 0; to < numPegs; to++) {
                        if (from === to) continue;
                        if (config.adjOnly && Math.abs(from - to) !== 1) continue;
                        if (config.cyclic && ((from + 1) % numPegs !== to)) continue;
                        if (config.colorRestr === 1 && to === 1 && (topDisc % 2 !== 0)) continue;

                        if (state[to].length === 0 || state[to][state[to].length - 1] > topDisc) {
                            const nextState = state.map(p => [...p]);
                            nextState[to].push(nextState[from].pop());
                            const nextCode = encodeState(nextState);

                            if (!visited.has(nextCode)) {
                                visited.add(nextCode);
                                queue.push({ state: nextState, path: [...path, { from, to }] });
                            }
                        }
                    }
                }
            }
            return null;
        }

        function applyHint() {
            if (won || gameOver) return;
            const nextMove = getBFSNextMove();
            if (nextMove) {
                hintHighlight = nextMove;
                render();
            } else {
                document.getElementById('messageToast').innerText = "No hint available!";
            }
        }

        function toggleAutoSolve() {
            if (autoSolveInterval) {
                clearInterval(autoSolveInterval);
                autoSolveInterval = null;
                document.getElementById('autoBtn').innerText = "🤖 Auto-Solve [A]";
            } else {
                if (won || gameOver) return;
                document.getElementById('autoBtn').innerText = "🛑 Stop Auto";
                autoSolveInterval = setInterval(() => {
                    if (won || gameOver) {
                        toggleAutoSolve();
                        return;
                    }
                    const nextMove = getBFSNextMove();
                    if (nextMove) {
                        selectedPeg = null;
                        handlePegClick(nextMove.from);
                        handlePegClick(nextMove.to);
                    } else {
                        toggleAutoSolve();
                    }
                }, 400);
            }
        }

        // ----------------------------------------------------
        // Win / Game Over Checks & Modals
        // ----------------------------------------------------
        function checkWin() {
            const targetPeg = numPegs - 1;
            if (pegs[targetPeg].length === numDiscs) {
                won = true;
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = null;

                const config = getCurrentStageConfig();
                let stars = 1;
                if (moves <= config.par * 1.2) stars = 3;
                else if (moves <= config.par * 1.6) stars = 2;

                if (currentMode === 'campaign') {
                    const existing = campaignStats[config.id];
                    if (!existing || stars > existing.stars || (stars === existing.stars && moves < existing.moves)) {
                        campaignStats[config.id] = { stars, moves, time: elapsedSeconds };
                        localStorage.setItem('ktowers_campaign_v2', JSON.stringify(campaignStats));
                        populateStageDropdown();
                    }
                }

                // Spawn victory fireworks
                spawnVictoryFireworks();

                playSound('win');
                showWinModal(stars);
                return true;
            }
            return false;
        }

        function triggerGameOver(reason) {
            gameOver = true;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            playSound('error');

            document.getElementById('modalTitle').innerText = "STAGE FAILED!";
            document.getElementById('modalTitle').style.color = "var(--danger-color)";
            document.getElementById('modalStars').innerText = "❌";
            document.getElementById('modalBody').innerHTML = `<strong>Reason:</strong> ${reason}<br><br>Moves used: ${moves} | Time: ${formatTime(elapsedSeconds)}`;
            document.getElementById('modalBtns').innerHTML = `
                <button onclick="initGame()" style="background: var(--accent-color); color: #0f172a;">🔄 Retry Stage</button>
            `;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function showWinModal(stars) {
            const config = getCurrentStageConfig();
            document.getElementById('modalTitle').innerText = "STAGE CLEARED!";
            document.getElementById('modalTitle').style.color = "var(--success-color)";
            document.getElementById('modalStars').innerText = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
            document.getElementById('modalBody').innerHTML = `
                <strong>${config.name} Completed!</strong><br><br>
                🎯 <strong>Moves:</strong> ${moves} (Par: ${config.par})<br>
                ⏱️ <strong>Time:</strong> ${formatTime(elapsedSeconds)}
            `;

            let btnsHtml = `<button onclick="initGame()">🔄 Replay</button>`;
            if (currentMode === 'campaign' && currentStageIdx < CAMPAIGN_STAGES.length - 1) {
                btnsHtml += `<button onclick="nextStage()" style="background: var(--success-color); color: #0f172a;">➡️ Next Stage</button>`;
            }
            document.getElementById('modalBtns').innerHTML = btnsHtml;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function nextStage() {
            if (currentStageIdx < CAMPAIGN_STAGES.length - 1) {
                currentStageIdx++;
                document.getElementById('stageSelect').value = currentStageIdx;
                initGame();
            }
        }

        // ----------------------------------------------------
        // Victory Fireworks System
        // ----------------------------------------------------
        function spawnVictoryFireworks() {
            fireworks = [];
            for (let i = 0; i < 6; i++) {
                spawnExplosion(150 + Math.random() * 560, 60 + Math.random() * 120);
            }
        }

        function spawnExplosion(x, y) {
            const colors = ['#f43f5e', '#38bdf8', '#f59e0b', '#10b981', '#a855f7', '#f472b6', '#fef08a'];
            for (let i = 0; i < 45; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                fireworks.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.02,
                    size: 2.5 + Math.random() * 3
                });
            }
        }

        function updateAndDrawFireworks(ctx) {
            if (won && Math.random() < 0.12 && fireworks.length < 150) {
                spawnExplosion(100 + Math.random() * 660, 50 + Math.random() * 140);
            }
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const p = fireworks[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08; // gravity
                p.life -= p.decay;
                if (p.life <= 0) {
                    fireworks.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ----------------------------------------------------
        // Canvas 3D Graphics Engine & Renderer
        // ----------------------------------------------------
        const canvas = document.getElementById('ktowersCanvas');
        const ctx = canvas.getContext('2d');

        let rainParticles = [];
        for(let i=0; i<80; i++) {
            rainParticles.push({
                x: Math.random() * 1000,
                y: Math.random() * 500,
                vy: 12 + Math.random() * 8,
                length: 10 + Math.random() * 10
            });
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const pegAreaW = canvas.width / numPegs;
            hoverPeg = Math.floor(mouseX / pegAreaW);
        });

        canvas.addEventListener('mouseleave', () => { hoverPeg = -1; });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const pegAreaW = canvas.width / numPegs;
            const clickedPeg = Math.floor(mouseX / pegAreaW);
            handlePegClick(clickedPeg);
        });

        function render() {
            document.getElementById('moveDisplay').innerText = moves;
            document.getElementById('undoBtn').disabled = moveHistory.length === 0 || won || gameOver;
            document.getElementById('hintBtn').disabled = won || gameOver || !!autoSolveInterval;
            document.getElementById('freezeBtn').disabled = won || gameOver || freezeCharges <= 0;
            document.getElementById('swapBtn').disabled = won || gameOver || swapCharges <= 0;
        }

        function draw3DSkyscraperBlock(ctx, x, y, width, height, theme, discSize, isLocked, isTopDisc, targetY, isWarning) {
            const depth = 12; // 3D depth extrusion
            const slant = 10; // isometric slant
            const isGlass = discSize % 2 === 0;

            // Dynamic 3D Shadow underneath
            const dropDist = targetY ? Math.max(0, targetY - y) : 0;
            const shadowScale = 1 + dropDist / 100;
            const shadowAlpha = Math.max(0.1, 0.4 - dropDist / 400);
            ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
            ctx.beginPath();
            const sy = targetY ? targetY + height + 2 : y + height + 2;
            ctx.ellipse(x, sy, (width/2 + 4) * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();

            // 1. Side Facade (Right 3D Wall)
            ctx.fillStyle = theme.side;
            ctx.beginPath();
            ctx.moveTo(x + width/2, y);
            ctx.lineTo(x + width/2 + slant, y - depth);
            ctx.lineTo(x + width/2 + slant, y + height - depth);
            ctx.lineTo(x + width/2, y + height);
            ctx.closePath();
            ctx.fill();

            // 2. Top Roof Facade
            ctx.fillStyle = theme.top;
            ctx.beginPath();
            ctx.moveTo(x - width/2, y);
            ctx.lineTo(x - width/2 + slant, y - depth);
            ctx.lineTo(x + width/2 + slant, y - depth);
            ctx.lineTo(x + width/2, y);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.stroke();

            // Rooftop Helipad & Solar Panel details for top/larger discs
            if (width > 60) {
                ctx.save();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.ellipse(x + slant/2, y - depth/2, 10, 4, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 8px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('H', x + slant/2, y - depth/2);
                ctx.restore();
            }

            // Antenna spire with blinking red light on top disc block
            if (isTopDisc || discSize === 1) {
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y - depth);
                ctx.lineTo(x, y - depth - 16);
                ctx.stroke();

                // Blinking Beacon
                const blink = Math.floor(globalAnimTime / 20) % 2 === 0;
                ctx.fillStyle = blink ? '#ef4444' : '#7f1d1d';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = blink ? 8 : 0;
                ctx.beginPath();
                ctx.arc(x, y - depth - 16, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // 3. Front Facade Main Wall
            if (isGlass) {
                const grad = ctx.createLinearGradient(x - width/2, y, x + width/2, y + height);
                grad.addColorStop(0, theme.main);
                grad.addColorStop(1, theme.side);
                ctx.fillStyle = grad;
            } else {
                ctx.fillStyle = theme.side;
            }
            ctx.fillRect(x - width/2, y, width, height);

            ctx.strokeStyle = 'rgba(0,0,0,0.6)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x - width/2, y, width, height);

            if (isGlass) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(x - width/2, y, width, height);
                ctx.clip();
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.moveTo(x - width/2, y - height);
                ctx.lineTo(x + width/2, y + height);
                ctx.lineTo(x + width/2, y + height * 2);
                ctx.lineTo(x - width/2, y);
                ctx.fill();
                ctx.restore();
            } else {
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                for (let ty = y + 4; ty < y + height; ty += 4) {
                    ctx.moveTo(x - width/2, ty);
                    ctx.lineTo(x + width/2, ty);
                }
                ctx.stroke();
            }

            // 4. Window Lighting Animation Grid
            const cols = Math.max(3, Math.floor(width / 16));
            const rows = 2;
            const wWidth = isGlass ? 4 : 3;
            const wHeight = isGlass ? 5 : 4;
            const padX = (width - cols * wWidth) / (cols + 1);
            const padY = (height - rows * wHeight) / (rows + 1);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const wx = (x - width/2) + padX + c * (wWidth + padX);
                    const wy = y + padY + r * (wHeight + padY);

                    // Dynamic flickering window light
                    const winSeed = Math.sin(discSize * 17 + r * 5 + c * 3 + globalAnimTime * 0.05);
                    const isLit = winSeed > -0.2;
                    if (isGlass) {
                        ctx.fillStyle = isLit ? (winSeed > 0.6 ? '#a5f3fc' : '#fef08a') : '#1e293b';
                    } else {
                        ctx.fillStyle = isLit ? '#fef08a' : '#0f172a';
                    }
                    if (isLit) {
                        ctx.shadowColor = ctx.fillStyle;
                        ctx.shadowBlur = isGlass ? 4 : 2;
                    }
                    ctx.fillRect(wx, wy, wWidth, wHeight);
                    ctx.shadowBlur = 0;
                }
            }

            // 5. Special Locked Disc Steel Cage / Armor
            if (isLocked) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                ctx.fillRect(x - width/2, y, width, height);

                // Steel cage stripes
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x - width/2, y); ctx.lineTo(x + width/2, y + height);
                ctx.moveTo(x - width/2, y + height); ctx.lineTo(x + width/2, y);
                ctx.stroke();

                // Lock icon badge
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🔒', x, y + height/2 + 4);
            } else {
                // Skyscraper Level Number Tag
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(discSize, x, y + height/2 + 1);
                ctx.shadowBlur = 0;
            }
            
            if (isWarning) {
                const blinkWarn = Math.floor(globalAnimTime / 10) % 2 === 0;
                ctx.fillStyle = blinkWarn ? '#ef4444' : '#facc15';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 10;
                ctx.fillRect(x - width/2 - 2, y + height/2 - 2, 4, 4);
                ctx.fillRect(x + width/2 - 2, y + height/2 - 2, 4, 4);
                ctx.shadowBlur = 0;
            }
        }

        // Continuous Animation Loop
        function animateLoop() {
            globalAnimTime++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let shakeX = 0, shakeY = 0;
            if (screenShake > 0) {
                shakeX = (Math.random() - 0.5) * screenShake * 2;
                shakeY = (Math.random() - 0.5) * screenShake * 2;
                screenShake *= 0.9;
                if (screenShake < 0.5) screenShake = 0;
            }
            ctx.save();
            ctx.translate(shakeX, shakeY);

            const config = getCurrentStageConfig();
            const w = canvas.width;
            const h = canvas.height;
            const pegAreaWidth = w / numPegs;
            const groundY = h - 65;

            // ----------------------------------------------------
            // 1. City Night Sky & Stars Background
            // ----------------------------------------------------
            const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, '#090d16');
            bgGrad.addColorStop(0.7, '#0f172a');
            bgGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // Twinkling Stars
            for (let i = 0; i < 30; i++) {
                const sx = (i * 37) % w;
                const sy = (i * 19) % (h * 0.4);
                const alpha = 0.3 + 0.7 * Math.sin(globalAnimTime * 0.04 + i);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }

            // Cyber-grid backdrop
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < w; i += 40) {
                ctx.moveTo(i, 0); ctx.lineTo(i, h);
            }
            for (let i = 0; i < h; i += 40) {
                ctx.moveTo(0, i); ctx.lineTo(w, i);
            }
            ctx.stroke();

            // Lightning Flash
            if ((globalAnimTime % 180) === 0 || (globalAnimTime % 180) === 4) {
                ctx.fillStyle = 'rgba(200, 200, 255, 0.3)';
                ctx.fillRect(0, 0, w, h);
            }

            // Passing Cloud Shadows / Smog
            ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
            for (let i = 0; i < 3; i++) {
                let cloudX = ((globalAnimTime * (0.2 + i * 0.1)) + i * 200) % (w + 400) - 200;
                ctx.beginPath();
                ctx.ellipse(cloudX, h * 0.2 + i * 40, 150 + i * 50, 40 + i * 10, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Distant City Skyline Silhouettes
            ctx.fillStyle = '#0f172a';
            for (let i = 0; i < 16; i++) {
                const bx = i * 60 - 20;
                const bw = 50;
                const bh = 40 + ((i * 31) % 60);
                ctx.fillRect(bx, groundY - 120 - bh, bw, bh);
                // Tiny yellow windows on distant skyline
                if (i % 2 === 0) {
                    ctx.fillStyle = 'rgba(253, 224, 71, 0.2)';
                    ctx.fillRect(bx + 10, groundY - 110 - bh, 6, 8);
                    ctx.fillRect(bx + 25, groundY - 95 - bh, 6, 8);
                    ctx.fillStyle = '#0f172a';
                }
            }

            // Neon Advertising Holograms
            ctx.textAlign = 'center';
            ctx.font = 'bold 24px monospace';
            if (Math.floor(globalAnimTime / 60) % 4 !== 0) {
                ctx.fillStyle = 'rgba(236, 72, 153, 0.8)';
                ctx.shadowColor = '#ec4899';
                ctx.shadowBlur = 10;
                ctx.fillText('>> KILO_CORP <<', w - 150, h * 0.3);
            }
            if (Math.floor(globalAnimTime / 40) % 3 !== 0) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.8)';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.fillText('SYS.ONLINE', 120, h * 0.25);
            }
            if (Math.floor(globalAnimTime / 50) % 5 !== 0) {
                ctx.fillStyle = 'rgba(250, 204, 21, 0.8)';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 10;
                ctx.fillText('O R B I T A L', w / 2, h * 0.2);
            }
            ctx.shadowBlur = 0;

            // Animated Flying Traffic (Hover Cars)
            for (let i = 0; i < 5; i++) {
                let dir = (i % 2 === 0) ? 1 : -1;
                let speed = 1.5 + (i * 0.5);
                let trafficX = (w / 2) + ((globalAnimTime * speed * dir + i * 300) % (w + 100)) - (w / 2 * dir);
                if (dir === -1) trafficX = w - (((globalAnimTime * speed + i * 300) % (w + 100)));
                let trafficY = groundY - 150 - (i * 30);
                
                // Hover car body
                ctx.fillStyle = (i % 3 === 0) ? '#38bdf8' : ((i % 3 === 1) ? '#ef4444' : '#f59e0b');
                ctx.fillRect(trafficX, trafficY, 12, 4);
                
                // Engine glow
                ctx.fillStyle = '#a5f3fc';
                if (dir === 1) {
                    ctx.fillRect(trafficX - 3, trafficY + 1, 3, 2);
                } else {
                    ctx.fillRect(trafficX + 12, trafficY + 1, 3, 2);
                }
                
                // Motion blur trail
                ctx.fillStyle = `rgba(165, 243, 252, 0.4)`;
                if (dir === 1) {
                    ctx.fillRect(trafficX - 15, trafficY + 1, 12, 2);
                } else {
                    ctx.fillRect(trafficX + 15, trafficY + 1, 12, 2);
                }
            }

            // ----------------------------------------------------
            // 2. 3D Asphalt Street Grid & Sidewalk Kerbs
            // ----------------------------------------------------
            const roadGrad = ctx.createLinearGradient(0, groundY, 0, h);
            roadGrad.addColorStop(0, '#1e293b');
            roadGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = roadGrad;
            ctx.fillRect(0, groundY, w, h - groundY);

            // Sidewalk Kerb Top Line
            ctx.fillStyle = '#475569';
            ctx.fillRect(0, groundY - 6, w, 6);
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, groundY, w, 3);

            // Yellow Lane Markings
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.setLineDash([16, 12]);
            ctx.beginPath();
            ctx.moveTo(0, groundY + 30);
            ctx.lineTo(w, groundY + 30);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // Street Lamps at side borders
            [15, w - 15].forEach(lx => {
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(lx, groundY);
                ctx.lineTo(lx, groundY - 70);
                ctx.lineTo(lx + (lx < 100 ? 10 : -10), groundY - 75);
                ctx.stroke();

                // Street Lamp Glow Light Cone
                const lampGlow = ctx.createRadialGradient(lx, groundY - 75, 2, lx, groundY - 75, 25);
                lampGlow.addColorStop(0, 'rgba(254, 240, 138, 0.8)');
                lampGlow.addColorStop(1, 'rgba(254, 240, 138, 0)');
                ctx.fillStyle = lampGlow;
                ctx.beginPath();
                ctx.arc(lx, groundY - 75, 25, 0, Math.PI * 2);
                ctx.fill();
            });

            // Compass Clues
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 11px Segoe UI, monospace';
            ctx.textAlign = 'left';
            ctx.fillText('🧭 STREET GRID: [WEST] ⬅️', 25, groundY + 52);
            ctx.textAlign = 'right';
            ctx.fillText('➡️ [EAST] | EYE VIEW 👁️', w - 25, groundY + 52);

            // ----------------------------------------------------
            // 3. Peg Foundations & Pylons
            // ----------------------------------------------------
            for (let p = 0; p < numPegs; p++) {
                const baseX = pegAreaWidth * p + pegAreaWidth / 2;
                const isTarget = (p === numPegs - 1);
                const isHovered = (hoverPeg === p);

                // Peg Selection Beam
                if (selectedPeg === p || hintHighlight?.from === p || hintHighlight?.to === p || isHovered) {
                    let beamColor = 'rgba(56, 189, 248, 0.15)';
                    let borderColor = 'rgba(56, 189, 248, 0.5)';
                    if (selectedPeg === p) {
                        beamColor = 'rgba(56, 189, 248, 0.25)';
                        borderColor = '#38bdf8';
                    } else if (hintHighlight?.from === p) {
                        beamColor = 'rgba(245, 158, 11, 0.25)';
                        borderColor = '#f59e0b';
                    } else if (hintHighlight?.to === p) {
                        beamColor = 'rgba(34, 197, 94, 0.25)';
                        borderColor = '#22c55e';
                    }

                    const beamGrad = ctx.createLinearGradient(baseX - 45, 0, baseX + 45, 0);
                    beamGrad.addColorStop(0, 'rgba(0,0,0,0)');
                    beamGrad.addColorStop(0.5, beamColor);
                    beamGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = beamGrad;
                    ctx.fillRect(baseX - 50, 40, 100, groundY - 40);

                    ctx.strokeStyle = borderColor;
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([6, 6]);
                    ctx.strokeRect(baseX - 48, 40, 96, groundY - 40);
                    ctx.setLineDash([]);
                }

                // Concrete Launchpad Foundation Pedestal
                ctx.fillStyle = '#334155';
                ctx.fillRect(baseX - pegAreaWidth * 0.4, groundY - 12, pegAreaWidth * 0.8, 12);
                ctx.fillStyle = '#475569';
                ctx.fillRect(baseX - pegAreaWidth * 0.4 + 4, groundY - 12, pegAreaWidth * 0.8 - 8, 3);

                // Steel Lattice Pole / Pylon
                const poleGrad = ctx.createLinearGradient(baseX - 5, 0, baseX + 5, 0);
                poleGrad.addColorStop(0, '#475569');
                poleGrad.addColorStop(0.5, '#cbd5e1');
                poleGrad.addColorStop(1, '#334155');
                ctx.fillStyle = poleGrad;
                ctx.fillRect(baseX - 5, groundY - 220, 10, 208);

                // Pole Cap Spire
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(baseX, groundY - 220, 5, 0, Math.PI * 2);
                ctx.fill();

                // Color Restriction Badge on Peg 2
                if (config.colorRestr === 1 && p === 1) {
                    ctx.fillStyle = '#ec4899';
                    ctx.font = 'bold 10px Segoe UI, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🎨 EVEN DISKS ONLY', baseX, groundY - 228);
                }

                // Peg Label Badge below foundation
                ctx.fillStyle = isTarget ? '#38bdf8' : (config.colorRestr === 1 && p === 1 ? '#ec4899' : '#e2e8f0');
                ctx.font = 'bold 12px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`PEG ${p + 1}${isTarget ? ' (TARGET)' : ''}`, baseX, groundY + 18);
            }

            // ----------------------------------------------------
            // 4. Skyscraper Building Blocks (Discs) Rendering & Physics
            // ----------------------------------------------------
            const blockHeight = 24;
            const spacing = 4;

            pegs.forEach((peg, pIdx) => {
                const baseX = pegAreaWidth * pIdx + pegAreaWidth / 2;

                peg.forEach((discSize, stackIdx) => {
                    const isLocked = (config.lockedDisk > 0 && discSize === config.lockedDisk && moves < config.lockDuration);
                    const theme = DISK_THEMES[(discSize - 1) % DISK_THEMES.length];
                    const isTopDisc = (stackIdx === peg.length - 1);

                    // Target Y for disc stack
                    let targetY = groundY - 12 - (stackIdx + 1) * (blockHeight + spacing);

                    // If this top disc is selected on selectedPeg, float it higher up the pole
                    if (selectedPeg === pIdx && isTopDisc) {
                        targetY = groundY - 220;
                    }

                    // Key for tracking drop physics interpolation
                    const key = `${pIdx}_${discSize}`;
                    if (discAnimPos[key] === undefined) {
                        discAnimPos[key] = targetY - 40;
                    }
                    // Smooth lerp physics towards target Y
                    const distBefore = Math.abs(discAnimPos[key] - targetY);
                    discAnimPos[key] += (targetY - discAnimPos[key]) * 0.3;
                    const renderY = discAnimPos[key];
                    const distAfter = Math.abs(renderY - targetY);

                    // Proportional Skyscraper Block Width
                    const widthPct = 0.35 + (discSize / numDiscs) * 0.55;
                    const blockWidth = pegAreaWidth * widthPct;

                    // Landing check
                    if (distBefore > 5.0 && distAfter <= 5.0 && selectedPeg !== pIdx) {
                        screenShake = 12;
                        for (let d = 0; d < 15; d++) {
                            dustParticles.push({
                                x: baseX + (Math.random() - 0.5) * blockWidth,
                                y: targetY + blockHeight,
                                vx: (Math.random() - 0.5) * 6,
                                vy: -Math.random() * 3,
                                life: 1.0,
                                decay: 0.03 + Math.random() * 0.05
                            });
                        }
                    }

                    // Aura for dropping block
                    if (distAfter > 2.0 && selectedPeg !== pIdx) {
                        const pulseRadius = blockWidth / 2 + 15 + 5 * Math.sin(globalAnimTime * 0.5);
                        ctx.strokeStyle = 'rgba(250, 204, 21, 0.6)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.ellipse(baseX, renderY + blockHeight / 2, pulseRadius, pulseRadius * 0.5, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Aura for selected top block
                    if (selectedPeg === pIdx && isTopDisc) {
                        const pulseRadius = blockWidth / 2 + 10 + 5 * Math.sin(globalAnimTime * 0.3);
                        ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.ellipse(baseX, renderY + blockHeight / 2, pulseRadius, pulseRadius * 0.5, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    let isWarning = false;
                    if (selectedPeg === pIdx && isTopDisc && hoverPeg !== -1 && hoverPeg !== selectedPeg) {
                        let valid = isValidMove(config, selectedPeg, hoverPeg, discSize, moves);
                        if (valid) {
                            const destPeg = pegs[hoverPeg];
                            if (destPeg.length > 0 && destPeg[destPeg.length - 1] < discSize) {
                                valid = false;
                            }
                        }
                        isWarning = !valid;
                    }

                    draw3DSkyscraperBlock(ctx, baseX, renderY, blockWidth, blockHeight, theme, discSize, isLocked, isTopDisc, targetY, isWarning);
                });
            });

            // Structural Dust Particles
            for (let i = dustParticles.length - 1; i >= 0; i--) {
                const p = dustParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) {
                    dustParticles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = `rgba(148, 163, 184, ${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2 + p.life * 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // ----------------------------------------------------
            // 5. Environmental Rain Particles
            // ----------------------------------------------------
            ctx.strokeStyle = 'rgba(100, 150, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i < rainParticles.length; i++) {
                let p = rainParticles[i];
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - p.length * 0.2, p.y + p.length);
                p.y += p.vy;
                p.x -= p.vy * 0.2;
                if (p.y > h) {
                    p.y = -20;
                    p.x = Math.random() * (w + 200);
                }
            }
            ctx.stroke();

            // ----------------------------------------------------
            // 6. Victory Celebration Fireworks Update
            // ----------------------------------------------------
            updateAndDrawFireworks(ctx);

            ctx.restore();

            requestAnimationFrame(animateLoop);
        }

        // Start render loop
        requestAnimationFrame(animateLoop);

        // ----------------------------------------------------
        // Keyboard Hotkeys
        // ----------------------------------------------------
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5') {
                const idx = parseInt(e.key, 10) - 1;
                if (idx < numPegs) handlePegClick(idx);
            } else if (e.key === 'u' || e.key === 'U') {
                undoMove();
            } else if (e.key === 'h' || e.key === 'H') {
                applyHint();
            } else if (e.key === 'f' || e.key === 'F') {
                useTimeFreeze();
            } else if (e.key === 's' || e.key === 'S') {
                useDiskSwap();
            } else if (e.key === 'r' || e.key === 'R') {
                initGame();
            } else if (e.key === 'a' || e.key === 'A') {
                toggleAutoSolve();
            }
        });

        function showHelp() {
            document.getElementById('modalTitle').innerText = "How to Play KTowers";
            document.getElementById('modalTitle').style.color = "var(--accent-color)";
            document.getElementById('modalStars').innerText = "🏰";
            document.getElementById('modalBody').innerHTML = `
                <p><strong>Goal:</strong> Move all skyscraper blocks to the target peg (last peg).</p>
                <p><strong>Rules & Modifiers:</strong></p>
                <ul>
                    <li>Only top skyscraper blocks can be moved.</li>
                    <li>Cannot place a larger block on a smaller block.</li>
                    <li><strong>Adjacent Only:</strong> Blocks can only move to neighboring pegs.</li>
                    <li><strong>Cyclic Move:</strong> Blocks can only move clockwise (Peg 1 ➔ 2 ➔ 3 ➔ 1).</li>
                    <li><strong>Color Restriction:</strong> Peg 2 accepts even-numbered disks only.</li>
                    <li><strong>Locked Disks:</strong> Certain blocks cannot move until turn requirement is met.</li>
                </ul>
                <p><strong>Power-ups & Keys:</strong></p>
                <ul>
                    <li><strong>1-5:</strong> Select / Move to Peg 1..5</li>
                    <li><strong>[U] Undo:</strong> Takes back last move.</li>
                    <li><strong>[H] Hint:</strong> Highlights optimal next move.</li>
                    <li><strong>[F] Freeze:</strong> Pauses timer for 15s.</li>
                    <li><strong>[S] Swap:</strong> Teleports top disk to valid peg.</li>
                </ul>
            `;
            document.getElementById('modalBtns').innerHTML = `<button onclick="document.getElementById('modalOverlay').style.display='none'">Close</button>`;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        // Start initial game
        populateStageDropdown();
        initGame();
    </script>
</body>
</html>
