<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KScript</title>
<style>
    :root {
        --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b);
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --accent: #8b5cf6;
        --accent-hover: #a78bfa;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --error: #f43f5e;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg-gradient);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 15px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        backdrop-filter: blur(12px);
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        background: linear-gradient(to right, #c4b5fd, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .panels {
        display: flex;
        gap: 15px;
        flex: 1;
        min-height: 0;
    }

    .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        border: 1px solid var(--glass-border);
        overflow: hidden;
    }
    
    .panel-header {
        padding: 10px 15px;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid var(--glass-border);
        font-size: 0.85rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    textarea {
        flex: 1;
        background: transparent;
        border: none;
        padding: 15px;
        color: #e2e8f0;
        font-family: "Consolas", "Monaco", "Courier New", monospace;
        font-size: 14px;
        resize: none;
        outline: none;
    }

    textarea::placeholder {
        color: rgba(148, 163, 184, 0.5);
    }

    .output {
        flex: 1;
        padding: 15px;
        font-family: "Consolas", "Monaco", "Courier New", monospace;
        font-size: 14px;
        overflow-y: auto;
        white-space: pre-wrap;
        color: #a78bfa;
    }
    
    .output.error {
        color: var(--error);
    }

    button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 8px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    button:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
    }
    
    button:active {
        transform: translateY(0);
    }
    
    .find-replace input {
        background: rgba(255,255,255,0.1);
        border: 1px solid var(--glass-border);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        width: 80px;
    }

    @media (max-width: 768px) {
        body {
            height: auto;
            overflow: auto;
        }
        .container {
            height: auto;
            min-height: calc(100vh - 40px);
        }
        .panels {
            flex-direction: column;
            overflow: visible;
        }
        .panel {
            min-height: 300px;
            flex: none !important;
        }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>KScript</h1>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button id="btnRec" style="background:#f43f5e">⏺ Rec Macro</button>
            <button id="btnPlay" style="background:#10b981">▶ Play</button>
            <button id="btnStep" style="background:#f59e0b">⏭ Step</button>
            <button id="btnRun">Run All</button>
            <button id="btnLoad">Load</button>
            <button id="btnSave">Save</button>
            <button id="btnHelp" style="background:#3b82f6">? Help</button>
        </div>
    </div>
    
    <div class="panels">
        <div class="panel" style="flex: 1.2;">
            <div class="panel-header">
                <span>Input</span>
                <div class="find-replace" style="display:flex; gap:5px;">
                    <input id="regexFind" placeholder="/pattern/" title="Regex Find">
                    <input id="regexRep" placeholder="replace" title="Replace With">
                    <button id="btnRep" style="padding:4px 8px; font-size:11px;">Rep All</button>
                </div>
            </div>
            <textarea id="exprInput" spellcheck="false" placeholder="Enter script here...
Variables: a = 10
Math: a * 2 + 5
print a % 3"></textarea>
        </div>
        <div class="panel">
            <div class="panel-header">Output</div>
            <div id="outputArea" class="output"></div>
        </div>
        <div class="panel" style="flex: 0.8;">
            <div class="panel-header">Memory Inspector</div>
            <div id="memoryArea" class="output" style="color:#38bdf8;"></div>
        </div>
    </div>
</div>

<script>
    const exprInput = document.getElementById('exprInput');
    const btnRun = document.getElementById('btnRun');
    const btnLoad = document.getElementById('btnLoad');
    const btnSave = document.getElementById('btnSave');
    const btnStep = document.getElementById('btnStep');
    const btnRec = document.getElementById('btnRec');
    const btnPlay = document.getElementById('btnPlay');
    const btnRep = document.getElementById('btnRep');
    const btnHelp = document.getElementById('btnHelp');
    const outputArea = document.getElementById('outputArea');
    const memoryArea = document.getElementById('memoryArea');

    exprInput.value = "// Welcome to KScript!\n// Press F1, Alt+H, or click Help for instructions\na = 10\nb = 20\nprint a * b + 5\nprint a % 3";

    document.addEventListener('keydown', (e) => {
        if ((e.altKey && (e.key === 'h' || e.key === 'H')) || e.key === 'F1') {
            btnHelp.click();
            e.preventDefault();
        }
    });

    // Generator-based Parser for Step-Through Debugging
    function* runParserGen(str) {
        let vars = new Array(26).fill(0);
        let outStr = "";
        let nodeCount = 0;
        
        let idx = 0;
        const peek = () => idx < str.length ? str[idx] : '\0';
        const advance = () => { if (idx < str.length) idx++; };
        const skipSpace = () => { 
            while ([' ', '\t', '\r', '\n', ';'].includes(peek())) advance(); 
        };
        
        const parseFactor = () => {
            nodeCount++;
            skipSpace();
            let val = 0;
            let c = peek();
            if (c === '(') {
                advance(); val = parseExpr(); skipSpace();
                if (peek() === ')') advance();
            } else if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) {
                let vIdx = c.toUpperCase().charCodeAt(0) - 65;
                advance(); val = vars[vIdx];
            } else {
                let start = idx;
                while (peek() >= '0' && peek() <= '9') advance();
                if (idx > start) val = parseInt(str.substring(start, idx), 10);
                else if (idx < str.length) advance();
            }
            skipSpace(); return val;
        };
        
        const parseTerm = () => {
            nodeCount++;
            let val = parseFactor();
            while (peek() === '*' || peek() === '/' || peek() === '%') {
                let op = peek(); advance();
                let nextVal = parseFactor();
                if (op === '*') val *= nextVal;
                else if (op === '/') { if (nextVal !== 0) val = Math.trunc(val / nextVal); }
                else if (op === '%') { if (nextVal !== 0) val = val % nextVal; }
            }
            return val;
        };
        
        const parseExpr = () => {
            nodeCount++;
            let val = parseTerm();
            while (peek() === '+' || peek() === '-') {
                let op = peek(); advance();
                let nextVal = parseTerm();
                if (op === '+') val += nextVal;
                else val -= nextVal;
            }
            return val;
        };
        
        let lastVal = 0;
        while (idx < str.length) {
            skipSpace();
            if (idx >= str.length) break;
            
            let isAssign = false;
            let varIdx = -1;
            let startIdx = idx;
            
            if (str.substring(idx, idx + 5) === "print") {
                let after = str[idx + 5];
                if (after === ' ' || after === '\t' || after === '(' || after === undefined || after === '\r' || after === '\n' || after === ';') {
                    idx += 5;
                    let val = parseExpr();
                    outStr += `Print: ${val}\n`;
                    lastVal = val;
                    yield {vars, outStr, nodeCount, lastVal};
                    continue;
                }
            }
            
            let c = peek();
            if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) {
                let vIdx = c.toUpperCase().charCodeAt(0) - 65;
                advance();
                while (peek() === ' ' || peek() === '\t') advance();
                if (peek() === '=') {
                    isAssign = true;
                    varIdx = vIdx;
                    advance();
                } else {
                    idx = startIdx;
                }
            } else {
                idx = startIdx;
            }
            
            let val = parseExpr();
            if (isAssign) {
                vars[varIdx] = val;
                outStr += `${String.fromCharCode(varIdx + 65)} = ${val}\n`;
            }
            lastVal = val;
            yield {vars, outStr, nodeCount, lastVal};
        }
        
        outStr += `\nReturn: ${lastVal}`;
        return {vars, outStr, nodeCount, lastVal};
    }

    function updateUI(state) {
        if (!state) return;
        outputArea.textContent = state.outStr;
        let mem = `AST Nodes: ${state.nodeCount}\n\n`;
        for(let i=0; i<26; i++){
            if (state.vars[i] !== 0) {
                mem += `${String.fromCharCode(65+i)} = ${state.vars[i]}\n`;
            }
        }
        memoryArea.textContent = mem;
    }

    let debugGen = null;
    
    btnStep.onclick = () => {
        if (!debugGen) {
            outputArea.classList.remove('error');
            debugGen = runParserGen(exprInput.value);
        }
        try {
            let res = debugGen.next();
            if (res.value) updateUI(res.value);
            if (res.done) debugGen = null;
        } catch(err) {
            outputArea.classList.add('error');
            outputArea.textContent = `Parse Error:\n${err.message}`;
            debugGen = null;
        }
    };

    btnRun.onclick = () => {
        outputArea.classList.remove('error');
        let gen = runParserGen(exprInput.value);
        let lastState = null;
        try {
            while (true) {
                let res = gen.next();
                if (res.value) lastState = res.value;
                if (res.done) break;
            }
            updateUI(lastState);
        } catch(err) {
            outputArea.classList.add('error');
            outputArea.textContent = `Parse Error:\n${err.message}`;
        }
        debugGen = null;
    };

    // Regex Replace
    btnRep.onclick = () => {
        try {
            let pat = document.getElementById('regexFind').value;
            let rep = document.getElementById('regexRep').value;
            if (!pat) return;
            let regex = new RegExp(pat, 'g');
            exprInput.value = exprInput.value.replace(regex, rep);
        } catch(e) {
            alert("Regex Error: " + e.message);
        }
    };

    btnHelp.onclick = () => {
        alert("Welcome to KScript!\n\nWrite equations, assign variables (a-z), and use 'print' to output values.\n\nExample:\na = 10\nprint a * 2\n\nControls:\n- Rec Macro: Record keystrokes\n- Play Macro: Replay them\n- Step: Run line-by-line\n- Run All: Run everything\n- Find/Replace: Supports standard regex");
    };

    // Macro Engine
    let isRecording = false;
    let macroKeys = [];
    
    exprInput.addEventListener('keydown', (e) => {
        if (isRecording) {
            if (e.key.length === 1 || e.key === 'Enter' || e.key === 'Backspace') {
                macroKeys.push(e.key);
            }
        }
    });

    btnRec.onclick = () => {
        isRecording = !isRecording;
        btnRec.style.opacity = isRecording ? '0.5' : '1';
        btnRec.textContent = isRecording ? '⏹ Stop' : '⏺ Rec Macro';
        if(isRecording) macroKeys = [];
    };

    btnPlay.onclick = async () => {
        if (isRecording) btnRec.click();
        exprInput.focus();
        for (let key of macroKeys) {
            if (key === 'Enter') {
                exprInput.value += '\n';
            } else if (key === 'Backspace') {
                exprInput.value = exprInput.value.slice(0, -1);
            } else {
                exprInput.value += key;
            }
            await new Promise(r => setTimeout(r, 30));
        }
    };

    btnLoad.onclick = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.ksc,.txt';
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => { exprInput.value = e.target.result; };
            reader.readAsText(file);
        };
        input.click();
    };

    btnSave.onclick = () => {
        const blob = new Blob([exprInput.value], {type: 'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'script.ksc';
        a.click();
        URL.revokeObjectURL(url);
    };
</script>
</body>
</html>
