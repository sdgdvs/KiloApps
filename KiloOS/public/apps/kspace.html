    playSound(3);

    if (modeIndex === 2) {
      setTimeout(() => { if (gameState === STATE_PLAYING) spawnBoss(wave); }, 2500);
    } else {
      pathGatesActive = true;
      pathGatesY = -50;
    }
  }

  // --- SHOOTING LOGIC ---
  function shoot() {
    shotsFired++;
    playSound(laserTimer > 0 ? 5 : 0);
    if (laserTimer > 0) return;

    if (spreadTimer > 0 || p.weaponType === 1) {
      let maxB = 3 + weaponLevel * 2;
      let dxs = [0, -2.5, 2.5, -1.25, 1.25, -3.75, 3.75];
      let dys = [-9, -8, -8, -8.5, -8.5, -7, -7];
      for (let i = 0; i < maxB; i++) {
        bullets.push({ x: p.x + 8, y: p.y, dx: dxs[i], dy: dys[i], type: 0 });
      }
      addMuzzleFlash(p.x + 10, p.y - 2, '#00e5ff', 8);
    } else if (p.weaponType === 3) {
      let maxB = 1 + weaponLevel;
      let dxs = [0, -2, 2];
      for (let i = 0; i < maxB; i++) {
        bullets.push({ x: p.x + 6, y: p.y, dx: dxs[i], dy: -5, type: 1 });
      }
      addMuzzleFlash(p.x + 10, p.y - 2, '#d500f9', 10);
    } else {
      let maxB = 2 + weaponLevel;
      let offsets = [3, 13, 8, 8];
      let dys = [-8, -8, -9, -7];
      let dxs = [0, 0, 0, 0];
      if (weaponLevel === 2) { dxs[2] = -1.5; dxs[3] = 1.5; }
      for (let i = 0; i < maxB; i++) {
        bullets.push({ x: p.x + offsets[i], y: p.y, dx: dxs[i], dy: dys[i], type: 0 });
      }
      addMuzzleFlash(p.x + 4, p.y, '#00e5ff', 5);
      addMuzzleFlash(p.x + 14, p.y, '#00e5ff', 5);
    }
  }

  // --- UPDATE GAME LOOP ---
  function update() {
    if (bombFlash > 0) bombFlash--;
    if (bossDeathFlash > 0) bossDeathFlash -= 5;
    if (screenShake > 0) {
      screenShake *= 0.88;
      if (screenShake < 0.15) screenShake = 0;
    }
    if (hyperJumpTimer > 0) hyperJumpTimer--;

    if (gameState !== STATE_PLAYING) {
      skillBar.style.display = 'none';
      return;
    }
    timeSurvivedFrames++;

    if (comboTimer > 0) {
      comboTimer--;
      if (comboTimer === 0) comboMultiplier = 1;
    }

    if (overchargeTimer > 0) {
      overchargeTimer--;
      // Overcharge deflection aura
      for (let i = eBullets.length - 1; i >= 0; i--) {
        let eb = eBullets[i];
        let dx = eb.x - (p.x + 10);
        let dy = eb.y - (p.y + 10);
        if (dx * dx + dy * dy < 576) {
          eBullets.splice(i, 1);
          addExplosion(eb.x, eb.y, 3, '#00e5ff');
        }
      }
    }

    if (bombardmentBanner > 0) bombardmentBanner--;
    if (eliteSquadTimer > 0) eliteSquadTimer--;

    // Loop 11: Drone Companion Wings Update & Support Systems
    for (let d = 0; d < drones.length; d++) {
      let drone = drones[d];
      let targetX = p.x + (d === 0 ? -22 : 22);
      let floatOffset = Math.sin(frameCount * 0.1 + d * Math.PI) * 3;
      let targetY = p.y + 6 + floatOffset;
      drone.x += (targetX - drone.x) * 0.25;
      drone.y += (targetY - drone.y) * 0.25;

      // Auto-firing twin support plasma vulcan bolts
      drone.shootTimer++;
      if (drone.shootTimer % 14 === 0) {
        bullets.push({ x: drone.x + 4, y: drone.y - 2, dx: (d === 0 ? -0.4 : 0.4), dy: -8.5, type: 0 });
        playSound(8);
        addMuzzleFlash(drone.x + 4, drone.y - 2, '#00e5ff', 4);
      }

      // Point-Defense: destroy incoming enemy bullets in 16px radius
      for (let i = eBullets.length - 1; i >= 0; i--) {
        let eb = eBullets[i];
        let dx = eb.x - (drone.x + 5);
        let dy = eb.y - (drone.y + 5);
        if (dx * dx + dy * dy < 256) {
          eBullets.splice(i, 1);
          addExplosion(eb.x, eb.y, 3, '#00e5ff');
          playSound(8);
        }
      }
    }

    // Planetary Bombardment Simulation
    if (bombardmentActive) {
      bombardmentTimer--;
      if (frameCount % 45 === 0) {
        strikes.push({ x: 25 + Math.floor(randomFloat() * (W - 50)), timer: 55 });
      }
      for (let k = strikes.length - 1; k >= 0; k--) {
        let st = strikes[k];
        st.timer--;
        if (st.timer === 15) {
          playSound(4);
          addShockwave(st.x, H - 30, 35, '#ff3d00');
          addExplosion(st.x, H - 30, 15, '#ff1744');
          if (p.x + 20 > st.x - 12 && p.x < st.x + 12) playerHit();
          for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            if (e.x + 20 > st.x - 14 && e.x < st.x + 14) {
              e.hp -= 25;
              addExplosion(e.x + 10, e.y + 10, 10, '#ff3d00');
              if (e.hp <= 0) handleEnemyDefeat(e, i);
            }
          }
        }
        if (st.timer <= 0) strikes.splice(k, 1);
      }
      if (frameCount % 80 === 0) {
        enemies.push({ x: randomFloat() * (W - 35), y: -30, type: 13, hp: 24, maxHp: 24, dx: 0, dy: 3.0, timer: 0, cloaked: false, isElite: false });
      }
      if (bombardmentTimer <= 0) {
        bombardmentActive = false;
        score += 3000 * comboMultiplier;
        overchargeEnergy = Math.min(100, overchargeEnergy + 25);
        hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 25);
        playSound(6);
      }
    }

    // Elite Squad Tracking
    if (eliteSquadActive) {
      let aliveElites = enemies.filter(e => e.isElite).length;
      if (aliveElites === 0) {
        eliteSquadActive = false;
        score += 2500 * comboMultiplier;
        overchargeEnergy = Math.min(100, overchargeEnergy + 35);
        hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 35);
        playSound(6);
        powerups.push({ x: W / 2 - 15, y: 50, dy: 1.5, type: 10 }); // Drone Pod
      }
    }

    if (isReplaying && currentReplay) {
      if (replayIndex < currentReplay.frames.length) {
        let fData = currentReplay.frames[replayIndex++];
        p.x = fData.x; p.y = fData.y;
        if (fData.f) shoot();
        if (fData.b) useSmartBomb();
        if (fData.d) useTacticalDash();
        if (fData.t) useTimeStop();
        if (fData.s) useHyperShield();
        if (fData.j) useHyperJump();
        if (fData.w) deployDroneWing();
        if (fData.o) useOvercharge();
      } else {
        gameState = STATE_GAMEOVER;
      }
    } else {
      let isFire = (keys[keybinds.fire] || keys['enter'] || keys['spacebar'] || keys[' ']);
      let fireRate = (overchargeTimer > 0) ? 3 : ((rapidTimer > 0) ? 3 : 7);
      let willFire = (isFire && frameCount % fireRate === 0);

      const speed = (keys['shift'] || keys['ShiftLeft']) ? 7 : 4.5;
      if (keys[keybinds.left] || keys['arrowleft']) p.x -= speed;
      if (keys[keybinds.right] || keys['arrowright']) p.x += speed;
      if (keys[keybinds.up] || keys['arrowup']) p.y -= speed;
      if (keys[keybinds.down] || keys['arrowdown']) p.y += speed;
      p.x = Math.max(0, Math.min(W - 20, p.x));
      p.y = Math.max(0, Math.min(H - 20, p.y));

      currentReplay.frames.push({ x: parseFloat(p.x.toFixed(1)), y: parseFloat(p.y.toFixed(1)), f: willFire ? 1 : 0 });

      if (willFire) { shoot(); }
    }

    skillBar.style.display = 'flex';
    updateSkillButtonsUI();

    // Mode Progression (20 Waves)
    if (modeIndex === 0) {
      let targetWave = Math.min(20, 1 + Math.floor(score / 650));
      if (targetWave > wave) {
        wave = targetWave;
        playSound(3);
        if (wave === 3 && !eliteSquadActive && !boss) spawnEliteSquad(0);
        else if (wave === 4 && !bombardmentActive && !boss) triggerBombardment();
        else if (wave === 5 && !boss) spawnBoss(1);
        else if (wave === 7 && !eliteSquadActive && !boss) spawnEliteSquad(1);
        else if (wave === 8 && !boss) spawnBoss(2); // Dreadnought Siege!
        else if (wave === 10 && !boss) spawnBoss(3);
        else if (wave === 11 && !eliteSquadActive && !boss) spawnEliteSquad(2);
        else if (wave === 12 && !bombardmentActive && !boss) triggerBombardment();
        else if (wave === 15 && !boss) spawnBoss(4);
        else if (wave === 16 && !boss) spawnBoss(5); // Dreadnought Siege Rematch!
        else if (wave === 17 && !eliteSquadActive && !boss) spawnEliteSquad(Math.floor(randomFloat() * 3));
        else if (wave === 20 && !boss) spawnBoss(6); // Alien Mothership Boss
        else if (wave % 4 === 0) spawnFormation(randomFloat() < 0.33 ? 9 : (randomFloat() < 0.5 ? 7 : 8));
      }
    } else if (modeIndex === 1) {
      wave = 1 + Math.floor(score / 600);
      if (wave % 5 === 0 && frameCount % 300 === 0 && !eliteSquadActive && !boss) spawnEliteSquad(Math.floor(randomFloat() * 3));
      if (wave % 7 === 0 && frameCount % 400 === 0 && !bombardmentActive && !boss) triggerBombardment();
    }

    // Scroll Starfield
    for (let s of stars) {
      s.y += s.speed * (modeIndex === 1 ? 1.5 : 1.0);
      if (s.y > H) { s.y = 0; s.x = randomFloat() * W; }
    }

    if (pathGatesActive) {
      pathGatesY += 1.0;
      if (pathGatesY > H + 50) pathGatesActive = false;
      if (p.x < W/4 + 20 && p.x + 20 > W/4 - 20 && p.y < pathGatesY + 20 && p.y + 20 > pathGatesY - 20) {
        pathGatesActive = false; wave += 1; score += 2000; playSound(2);
      } else if (p.x < 3*W/4 + 20 && p.x + 20 > 3*W/4 - 20 && p.y < pathGatesY + 20 && p.y + 20 > pathGatesY - 20) {
        pathGatesActive = false; p.hp = p.maxHp; playSound(2);
      }
    }

    if (frameCount % 600 === 0 && !escort.active && !boss && wave % 2 === 0) {
      escort.active = true; escort.x = W / 2 - 15; escort.y = -30; escort.dy = 0.5;
      escort.maxHp = 20; escort.hp = 20;
    }

    if (escort.active) {
      escort.y += escort.dy;
      for (let i = eBullets.length - 1; i >= 0; i--) {
        let eb = eBullets[i];
        if (eb.x >= escort.x && eb.x <= escort.x + 30 && eb.y >= escort.y && eb.y <= escort.y + 30) {
          eBullets.splice(i, 1); escort.hp--; addExplosion(eb.x, eb.y, 3, '#ffea00');
        }
      }
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        if (e.x + 20 >= escort.x && e.x <= escort.x + 30 && e.y + 20 >= escort.y && e.y <= escort.y + 30) {
          enemies.splice(i, 1); escort.hp -= 5; addExplosion(e.x + 10, e.y + 10, 10, '#ff9800');
        }
      }
      if (escort.hp <= 0) {
        escort.active = false; addExplosion(escort.x + 15, escort.y + 15, 30, '#ff1744');
      } else if (escort.y > H) {
        escort.active = false; score += 5000 * comboMultiplier; playSound(6);
      }
    }

    updateExplosions();

    // Timers
    if (spreadTimer > 0) spreadTimer--;
    if (laserTimer > 0) laserTimer--;
    if (rapidTimer > 0) rapidTimer--;
    if (timeStopTimer > 0) timeStopTimer--;
    if (timeStopCooldown > 0) timeStopCooldown--;
    if (hyperShieldTimer > 0) hyperShieldTimer--;
    if (hyperShieldCooldown > 0) hyperShieldCooldown--;
    if (dashCooldown > 0) dashCooldown--;
    if (invincibleTimer > 0) invincibleTimer--;

    // Bullets Movement
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.y += b.dy;
      b.x += b.dx;
      if (b.y < -10 || b.x < -10 || b.x > W + 10) bullets.splice(i, 1);
    }

    // Boss & Dreadnought Sieges Logic
    if (boss) {
      if (boss.isDreadnought) {
        if (boss.y < boss.targetY) boss.y += 0.8;
        else {
          boss.x += boss.dx;
          if (boss.x < 5 || boss.x > W - boss.w - 5) boss.dx = -boss.dx;
        }

        boss.attackTimer++;
        boss.flakTimer++;

        // Mega-Ion Cannon Charging & Firing
        if (timeStopTimer === 0) {
          boss.ionCharge += 1;
          if (boss.ionCharge >= 100) {
            boss.ionCharge = 0;
            boss.ionBeamTimer = 45; // 0.75s beam
            playSound(9);
            screenShake = 15;
          }
        }

        if (boss.ionBeamTimer > 0) {
          boss.ionBeamTimer--;
          let beamX = boss.x + 60;
          if (p.x + 18 > beamX - 14 && p.x + 2 < beamX + 14) {
            if (frameCount % 6 === 0) playerHit();
          }
        }

        // Dreadnought Flak & Salvos
        if (timeStopTimer === 0 && boss.flakTimer % 38 === 0) {
          eBullets.push({ x: boss.x + 20, y: boss.y + 40, dx: -1.8, dy: 3.2 });
          eBullets.push({ x: boss.x + 100, y: boss.y + 40, dx: 1.8, dy: 3.2 });
          eBullets.push({ x: boss.x + 60, y: boss.y + 50, dx: (frameCount % 2 === 0 ? -0.8 : 0.8), dy: 3.8 });
        }

        // Bullets vs Dreadnought Subsystems
        for (let j = bullets.length - 1; j >= 0; j--) {
          let b = bullets[j];
          // Check Left Shield Generator
          if (boss.genL > 0 && b.x >= boss.x + 8 && b.x <= boss.x + 42 && b.y >= boss.y + 12 && b.y <= boss.y + 46) {
            bullets.splice(j, 1);
            let dmg = (b.type === 1 ? 10 : 3) * (overchargeTimer > 0 ? 3 : 1);
            boss.genL -= dmg;
            shotsHit++;
            addExplosion(b.x, b.y, 4, '#00e5ff');
            if (boss.genL <= 0) {
              boss.genL = 0;
              addExplosion(boss.x + 25, boss.y + 30, 25, '#ff1744');
              score += 1500 * comboMultiplier;
              hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 25);
            }
            continue;
          }
          // Check Right Shield Generator
          if (boss.genR > 0 && b.x >= boss.x + 78 && b.x <= boss.x + 112 && b.y >= boss.y + 12 && b.y <= boss.y + 46) {
            bullets.splice(j, 1);
            let dmg = (b.type === 1 ? 10 : 3) * (overchargeTimer > 0 ? 3 : 1);
            boss.genR -= dmg;
            shotsHit++;
            addExplosion(b.x, b.y, 4, '#00e5ff');
            if (boss.genR <= 0) {
              boss.genR = 0;
              addExplosion(boss.x + 95, boss.y + 30, 25, '#ff1744');
              score += 1500 * comboMultiplier;
              hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 25);
            }
            continue;
          }

          // Check Central Hull
          if (b.x >= boss.x && b.x <= boss.x + boss.w && b.y >= boss.y && b.y <= boss.y + boss.h) {
            bullets.splice(j, 1);
            let isShielded = (boss.genL > 0 || boss.genR > 0);
            if (isShielded) {
              addExplosion(b.x, b.y, 3, '#00e5ff');
            } else {
              shotsHit++;
              let dmg = (b.type === 1 ? 8 : 2) * (overchargeTimer > 0 ? 3 : 1);
              boss.hp -= dmg;
              overchargeEnergy = Math.min(100, overchargeEnergy + 1);
              hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 1);
              addExplosion(b.x, b.y, 4, '#ff1744');
              if (boss.hp <= 0) {
                destroyBoss();
                break;
              }
            }
          }
        }
      } else {
        // Mothership & Normal Boss Logic
        if (boss.y < boss.targetY) boss.y += 1;
        else {
          boss.x += boss.dx;
          if (boss.x < 10 || boss.x > W - boss.w - 10) boss.dx = -boss.dx;
        }

        boss.attackTimer++;
        if (timeStopTimer === 0 && boss.attackTimer % (boss.isMothership ? 35 : 45) === 0) {
          if (boss.isMothership) {
            let tOffsets = [5, 25, 65, 85];
            for (let tIdx = 0; tIdx < 4; tIdx++) {
              if (boss.turrets[tIdx] && boss.turrets[tIdx].active) {
                eBullets.push({ x: boss.x + tOffsets[tIdx], y: boss.y + 35, dx: (tIdx === 0 ? -1.5 : (tIdx === 3 ? 1.5 : 0)), dy: 3.5 });
              }
            }
            if (!isMothershipShieldActive() && (boss.attackTimer % 50 === 0)) {
              for (let a = -2; a <= 2; a++) {
                eBullets.push({ x: boss.x + 45, y: boss.y + 45, dx: a * 1.5, dy: 3.8 });
              }
            }
          } else {
            eBullets.push({ x: boss.x + 10, y: boss.y + boss.h, dx: -1.5, dy: 3.5 });
            eBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h, dx: 0, dy: 4 });
            eBullets.push({ x: boss.x + boss.w - 10, y: boss.y + boss.h, dx: 1.5, dy: 3.5 });
          }
        }

        // Bullets vs Mothership/Boss
        for (let j = bullets.length - 1; j >= 0; j--) {
          let b = bullets[j];
          if (boss.isMothership) {
            let tOffsetsX = [5, 25, 65, 85];
            let hitTurret = false;
            for (let tIdx = 0; tIdx < 4; tIdx++) {
              if (boss.turrets[tIdx] && boss.turrets[tIdx].active) {
                let tx = boss.x + tOffsetsX[tIdx];
                let ty = boss.y + 25;
                if (b.x >= tx - 6 && b.x <= tx + 18 && b.y >= ty - 6 && b.y <= ty + 18) {
                  bullets.splice(j, 1);
                  shotsHit++;
                  let dmg = (b.type === 1 ? 12 : 3) * (overchargeTimer > 0 ? 3 : 1);
                  boss.turrets[tIdx].hp -= dmg;
                  overchargeEnergy = Math.min(100, overchargeEnergy + 1);
                  hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 1);
                  addExplosion(b.x, b.y, 4, '#ff9100');
                  if (boss.turrets[tIdx].hp <= 0) {
                    boss.turrets[tIdx].active = false;
                    overchargeEnergy = Math.min(100, overchargeEnergy + 15);
                    hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 15);
                    addExplosion(tx, ty, 20, '#ff1744');
                  }
                  hitTurret = true;
                  break;
                }
              }
            }
            if (!hitTurret && b.x >= boss.x && b.x <= boss.x + boss.w && b.y >= boss.y && b.y <= boss.y + boss.h) {
              bullets.splice(j, 1);
              if (isMothershipShieldActive()) {
                addExplosion(b.x, b.y, 3, '#00e5ff');
              } else {
                shotsHit++;
                let dmg = (b.type === 1 ? 8 : 2) * (overchargeTimer > 0 ? 3 : 1);
                boss.hp -= dmg;
                overchargeEnergy = Math.min(100, overchargeEnergy + 1);
                hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 1);
                addExplosion(b.x, b.y, 4, '#ff1744');
                if (boss.hp <= 0) {
                  if (boss.phase === 1) {
                    boss.phase = 2; boss.maxHp *= 1.5; boss.hp = boss.maxHp;
                    boss.dx = boss.dx > 0 ? boss.dx + 0.5 : boss.dx - 0.5;
                    addExplosion(boss.x + boss.w/2, boss.y + boss.h/2, 40, '#ffea00');
                    break;
                  } else { destroyBoss(); break; }
                }
              }
            }
          } else {
            if (b.x >= boss.x && b.x <= boss.x + boss.w && b.y >= boss.y && b.y <= boss.y + boss.h) {
              shotsHit++;
              let dmg = (b.type === 1 ? 8 : 2) * (overchargeTimer > 0 ? 3 : 1);
              boss.hp -= dmg;
              overchargeEnergy = Math.min(100, overchargeEnergy + 1);
              hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 1);
              addExplosion(b.x, b.y, 3, '#00e5ff');
              bullets.splice(j, 1);
              if (boss.hp <= 0) {
                if (boss.phase === 1) {
                  boss.phase = 2; boss.maxHp *= 1.5; boss.hp = boss.maxHp;
                  boss.dx = boss.dx > 0 ? boss.dx + 0.5 : boss.dx - 0.5;
                  addExplosion(boss.x + boss.w/2, boss.y + boss.h/2, 40, '#ffea00');
                  break;
                } else { destroyBoss(); break; }
              }
            }
          }
        }
      }
    }

    // Spawning regular enemies
    let spawnRate = Math.max(8, 30 - Math.floor(score / 200) - (modeIndex === 1 ? 8 : 0));
    if (frameCount % spawnRate === 0) spawnEnemy();

    // Regular & Elite Enemies Update
    let baseEnemySpeed = 1.8 + (score / 300) + (modeIndex === 1 ? 1.0 : 0);
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      let ew = (e.type === 6 || e.type === 9 || e.type === 11 || e.type === 12) ? 36 : 20;
      let eh = (e.type === 6 || e.type === 9 || e.type === 11 || e.type === 12) ? 36 : 20;

      if (e.type === 8 || e.type === 11) {
        e.timer++;
        if (e.timer % 40 === 0) e.cloaked = !e.cloaked;
      }

      if (timeStopTimer === 0) {
        if (e.type === 0) e.y += baseEnemySpeed * 1.2;
        else if (e.type === 1) {
          e.y += baseEnemySpeed * 0.8;
          if (e.x < p.x) e.x += 0.8;
          if (e.x > p.x) e.x -= 0.8;
        } else if (e.type === 2) e.y += baseEnemySpeed * 0.5;
        else if (e.type === 3) e.y += baseEnemySpeed * 0.4;
        else if (e.type === 4) {
          e.y += baseEnemySpeed * 0.9;
          e.x += e.dx;
          if (e.x < 0 || e.x > W - ew) e.dx = -e.dx;
        } else if (e.type === 5 || e.type === 9) e.y += baseEnemySpeed * 1.3;
        else if (e.type === 6) {
          if (e.y < 60) e.y += 0.8;
          else {
            e.x += e.dx;
            if (e.x < 0 || e.x > W - ew) e.dx = -e.dx;
          }
        } else if (e.type === 7) { // Kamikaze
          e.y += baseEnemySpeed * 2.0;
          if (e.x < p.x) e.x += 1.4;
          if (e.x > p.x) e.x -= 1.4;
        } else if (e.type === 8) {
          e.y += baseEnemySpeed * 1.0;
        } else if (e.type === 10) { // Crimson Valkyrie
          e.y += baseEnemySpeed * 1.0;
          e.x += e.dx;
          if (e.x < 10 || e.x > W - ew - 10) e.dx = -e.dx;
          if (frameCount % 45 === 0) eBullets.push({ x: e.x + 10, y: e.y + 20, dx: (randomFloat() < 0.5 ? -1.0 : 1.0), dy: 4.0 });
        } else if (e.type === 11) { // Void Phantom
          e.y += baseEnemySpeed * 0.7;
          e.x += e.dx;
          if (e.x < 15 || e.x > W - ew - 15) e.dx = -e.dx;
          if (frameCount % 55 === 0) eBullets.push({ x: e.x + 15, y: e.y + 25, dx: (p.x > e.x ? 1.0 : -1.0), dy: 3.2 });
        } else if (e.type === 12) { // Command Cruiser
          if (e.y < 70) e.y += 0.6;
          e.x += e.dx;
          if (e.x < 20 || e.x > W - ew - 20) e.dx = -e.dx;
          if (frameCount % 40 === 0) {
            for (let a = -1; a <= 1; a++) eBullets.push({ x: e.x + 18, y: e.y + 30, dx: a * 1.5, dy: 3.6 });
          }
        } else if (e.type === 13) {
          e.y += baseEnemySpeed * 2.2;
        }

        // Enemy Firing
        if (e.type === 2 && frameCount % 60 === 0 && randomFloat() < 0.5) {
          eBullets.push({ x: e.x + 10, y: e.y + 20, dx: 0, dy: 3.5 });
        }
      }

      // Laser Beam Collision
      if (laserTimer > 0) {
        if (p.x + 10 >= e.x && p.x + 10 <= e.x + ew && p.y > e.y) {
          if (!e.cloaked) {
            e.hp -= (overchargeTimer > 0 ? 1.5 : 0.5);
            overchargeEnergy = Math.min(100, overchargeEnergy + 0.5);
            hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 0.5);
          }
          addExplosion(p.x + 10, e.y + eh / 2, 2, '#00e5ff');
          if (e.hp <= 0) { handleEnemyDefeat(e, i); continue; }
        }
      }

      // Player Collision with Enemy
      if (p.x < e.x + ew && p.x + 20 > e.x && p.y < e.y + eh && p.y + 20 > e.y) {
        addExplosion(e.x + ew / 2, e.y + eh / 2, 16);
        enemies.splice(i, 1);
        playerHit();
        continue;
      }

      // Bullets vs Enemy
      for (let j = bullets.length - 1; j >= 0; j--) {
        let b = bullets[j];
        if (b.x < e.x + ew && b.x + 4 > e.x && b.y < e.y + eh && b.y + 10 > e.y) {
          if (e.cloaked && randomFloat() < 0.75) {
            // Miss cloaked fighter
          } else {
            shotsHit++;
            let dmg = (b.type === 1 ? 6 : 1) * (overchargeTimer > 0 ? 3 : 1);
            e.hp -= dmg;
            overchargeEnergy = Math.min(100, overchargeEnergy + 1);
            hyperJumpEnergy = Math.min(100, hyperJumpEnergy + 1);
            addExplosion(b.x, b.y, b.type === 1 ? 6 : 3, (overchargeTimer > 0 ? '#ffea00' : '#00e5ff'));
            bullets.splice(j, 1);
          }

          if (e.hp <= 0) {
            handleEnemyDefeat(e, i);
            break;
          }
        }
      }

      if (e.y > H + 20) enemies.splice(i, 1);
    }

    // Enemy Bullets Update
    for (let i = eBullets.length - 1; i >= 0; i--) {
      let eb = eBullets[i];
      if (timeStopTimer === 0) {
        eb.y += eb.dy;
        eb.x += eb.dx;
      }

      if (eb.y > H || eb.x < 0 || eb.x > W) {
        eBullets.splice(i, 1);
        continue;
      }

      if (p.x < eb.x + 4 && p.x + 20 > eb.x && p.y < eb.y + 10 && p.y + 20 > eb.y) {
        eBullets.splice(i, 1);
        playerHit();
      }
    }

    // Power-ups Update
    for (let i = powerups.length - 1; i >= 0; i--) {
      let pu = powerups[i];
      pu.y += pu.dy;

      if (p.x < pu.x + 16 && p.x + 20 > pu.x && p.y < pu.y + 16 && p.y + 20 > pu.y) {
        applyPowerup(pu.type);
        addExplosion(pu.x + 8, pu.y + 8, 12, '#00e5ff');
        powerups.splice(i, 1);
        score += 50;
        playSound(2);
        continue;
      }

      if (pu.y > H) powerups.splice(i, 1);
    }

    frameCount++;
  }

  function updateSkillButtonsUI() {
    let bJump = document.getElementById('btnHyperJump');
    let bDrone = document.getElementById('btnDrone');
    let bOc = document.getElementById('btnOvercharge');
    let bStop = document.getElementById('btnTimeStop');
    let bDash = document.getElementById('btnDash');
    let bBomb = document.getElementById('btnBomb');
    let bShield = document.getElementById('btnShield');

    if (bJump) {
      if (hyperJumpTimer > 0) { bJump.className = 'skill-btn'; bJump.innerText = '[J] WARP'; }
      else if (hyperJumpEnergy >= 100) { bJump.className = 'skill-btn'; bJump.innerText = '[J] JUMP (RDY)'; }
      else { bJump.className = 'skill-btn cooldown'; bJump.innerText = `[J] ${hyperJumpEnergy}%`; }
    }

    if (bDrone) {
      bDrone.innerText = `[W] DRONES (${droneCount}/2)`;
      bDrone.className = droneCount < 2 ? 'skill-btn' : 'skill-btn cooldown';
    }

    if (bOc) {
      if (overchargeTimer > 0) { bOc.className = 'skill-btn'; bOc.innerText = `[O] ${Math.ceil(overchargeTimer/60)}s`; }
      else if (overchargeEnergy >= 100) { bOc.className = 'skill-btn'; bOc.innerText = '[O] OVERCHARGE'; }
      else { bOc.className = 'skill-btn cooldown'; bOc.innerText = `[O] ${overchargeEnergy}%`; }
    }

    if (timeStopTimer > 0) { bStop.className = 'skill-btn'; bStop.innerText = '[T] ACTIVE'; }
    else if (timeStopCooldown > 0) { bStop.className = 'skill-btn cooldown'; bStop.innerText = `[T] ${Math.ceil(timeStopCooldown/60)}s`; }
    else { bStop.className = 'skill-btn'; bStop.innerText = '[T] STOP'; }

    if (invincibleTimer > 0) { bDash.className = 'skill-btn'; bDash.innerText = '[D] WARP'; }
    else if (dashCooldown > 0) { bDash.className = 'skill-btn cooldown'; bDash.innerText = `[D] ${Math.ceil(dashCooldown/60)}s`; }
    else { bDash.className = 'skill-btn'; bDash.innerText = '[D] DASH'; }

    bBomb.innerText = `[B] BOMB (${p.bombs})`;
    if (p.bombs <= 0) bBomb.className = 'skill-btn cooldown';
    else bBomb.className = 'skill-btn';

    if (hyperShieldTimer > 0) { bShield.className = 'skill-btn'; bShield.innerText = '[S] BARRIER'; }
    else if (hyperShieldCooldown > 0) { bShield.className = 'skill-btn cooldown'; bShield.innerText = `[S] ${Math.ceil(hyperShieldCooldown/60)}s`; }
    else { bShield.className = 'skill-btn'; bShield.innerText = '[S] SHIELD'; }
  }

  function handleEnemyDefeat(e, index) {
    comboTimer = 180;
    if (comboMultiplier < 10) comboMultiplier++;
    let baseScore = (e.type === 12 ? 800 : (e.type === 11 ? 500 : (e.type === 10 ? 400 : (e.type === 13 ? 250 : (e.type === 6 ? 300 : (e.type === 9 ? 200 : (e.type === 8 ? 150 : (e.type === 7 ? 120 : 30))))))));
    score += baseScore * comboMultiplier;
    enemiesKilled++;
    totalKills++;
    overchargeEnergy = Math.min(100, overchargeEnergy + (e.isElite ? 12 : 4));
    hyperJumpEnergy = Math.min(100, hyperJumpEnergy + (e.isElite ? 15 : 3));
    playSound(1);
    addExplosion(e.x + 10, e.y + 10, e.isElite ? 24 : (e.type === 6 ? 20 : 12), e.isElite ? '#ffd700' : '#ff9100');

    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem('kspace_highscore', highScore); } catch (ex) {}
    }
    try { localStorage.setItem('kspace_totalkills', totalKills); } catch (ex) {}

    // Powerup Drop Chance
    let dropChance = e.isElite ? 0.8 : 0.22;
    if (randomFloat() < dropChance) {
      powerups.push({ x: e.x, y: e.y, dy: 1.8, type: Math.floor(randomFloat() * 11) });
    }

    enemies.splice(index, 1);
  }

  function applyPowerup(type) {
    if (type === 0) { spreadTimer = 350; p.weaponType = 1; }
    else if (type === 1) { laserTimer = 300; p.weaponType = 2; }
    else if (type === 2) { p.shield = true; addShieldRipple(p.x + 10, p.y + 10, '#00e5ff'); }
    else if (type === 3) { p.bombs = Math.min(p.maxBombs, p.bombs + 1); }
    else if (type === 4) { rapidTimer = 350; }
    else if (type === 5) { useTimeStop(); }
    else if (type === 6) { useHyperShield(); addShieldRipple(p.x + 10, p.y + 10, '#ffea00'); }
    else if (type === 7) { dashCooldown = 0; useTacticalDash(); }
    else if (type === 8) { if (weaponLevel < 2) weaponLevel++; }
    else if (type === 9) { overchargeEnergy = Math.min(100, overchargeEnergy + 50); }
    else if (type === 10) { deployDroneWing(); }
  }

  function playerHit() {
    if (hyperShieldTimer > 0 || invincibleTimer > 0 || hyperJumpTimer > 0) return;

    if (p.shield) {
      p.shield = false;
      addShieldRipple(p.x + 10, p.y + 10, '#00e5ff');
      addExplosion(p.x + 10, p.y + 10, 16, '#00e5ff');
      playSound(1);
    } else {
      p.hp--;
      weaponLevel = 0;
      addExplosion(p.x + 10, p.y + 10, 30, '#ff1744');
      playSound(1);
      if (p.hp <= 0) {
        gameState = STATE_GAMEOVER;
        clearSavedGame();
        addScoreToLeaderboard(score, wave, MODES[modeIndex].name);
        if (!isReplaying) lastReplaySaved = currentReplay;
      }
    }
  }

  // --- DRAWING FUNCTIONS ---
  function drawDroneWings(frame) {
    for (let d = 0; d < drones.length; d++) {
      let dr = drones[d];
      ctx.save();
      ctx.translate(dr.x, dr.y);

      // Thruster flame
      let flame = 3 + (frame % 3) * 2;
      ctx.fillStyle = (frame % 2 === 0) ? '#00e5ff' : '#ffea00';
      ctx.beginPath(); ctx.moveTo(3, 10); ctx.lineTo(5, 10 + flame); ctx.lineTo(7, 10); ctx.closePath(); ctx.fill();

      // Drone Body
      ctx.fillStyle = '#00b0ff';
      ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(10, 8); ctx.lineTo(8, 10); ctx.lineTo(2, 10); ctx.lineTo(0, 8); ctx.closePath(); ctx.fill();

      // Specular sheen sweep on drone wing
      let dSheen = ((frame * 1.5 + d * 10) % 20) - 5;
      ctx.save();
      ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(10, 8); ctx.lineTo(8, 10); ctx.lineTo(2, 10); ctx.lineTo(0, 8); ctx.closePath();
      ctx.clip();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.fillRect(0, dSheen, 12, 3);
      ctx.restore();

      // Cockpit
      ctx.fillStyle = '#ffea00';
      ctx.beginPath(); ctx.arc(5, 5, 2.5, 0, Math.PI * 2); ctx.fill();

      // Point Defense aura ring
      ctx.strokeStyle = (frame % 4 < 2) ? '#00e5ff' : '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(5, 5, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  function drawHyperJumpEffect(frame) {
    if (hyperJumpTimer <= 0) return;
    ctx.save();
    ctx.strokeStyle = (frame % 2 === 0) ? '#00e5ff' : '#ffffff';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10; ctx.shadowColor = '#00e5ff';

    for (let i = 0; i < 16; i++) {
      let angle = i * (Math.PI * 2 / 16);
      let len1 = 15 + Math.sin(frame + i) * 10;
      let len2 = len1 + 60;
      ctx.beginPath();
      ctx.moveTo(p.x + 10 + Math.cos(angle) * len1, p.y + 10 + Math.sin(angle) * len1);
      ctx.lineTo(p.x + 10 + Math.cos(angle) * len2, p.y + 10 + Math.sin(angle) * len2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayerShip(x, y, shield, frame) {
    ctx.save();
    ctx.translate(x, y);

    // Multi-Stage Animated Thruster Flames
    let flameH = 6 + Math.sin(frame * 0.4) * 3;
    if (overchargeTimer > 0) flameH += 4;
    ctx.fillStyle = (frame % 2 === 0) ? (overchargeTimer > 0 ? '#ffea00' : '#ff3d00') : '#ff9100';
    ctx.beginPath(); ctx.moveTo(4, 20); ctx.lineTo(10, 20 + flameH + 3); ctx.lineTo(16, 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = overchargeTimer > 0 ? '#00e5ff' : '#ffea00';
    ctx.beginPath(); ctx.moveTo(6, 20); ctx.lineTo(10, 20 + flameH); ctx.lineTo(14, 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(8, 20); ctx.lineTo(10, 20 + flameH * 0.6); ctx.lineTo(12, 20); ctx.closePath(); ctx.fill();

    // Trailing ion plume motes behind main thrusters
    for (let m = 0; m < 3; m++) {
      let my = 21 + ((frame * 2 + m * 6) % 16);
      let mx = 10 + Math.sin(frame * 0.6 + m * 1.5) * 2.5;
      let mAlpha = Math.max(0, 1.0 - (my - 21) / 16);
      ctx.fillStyle = (frame % 2 === 0) ? `rgba(0, 229, 255, ${mAlpha})` : `rgba(255, 234, 0, ${mAlpha})`;
      ctx.fillRect(mx - 1, my, 2, 2);
    }

    // Wingtip Thrusters
    ctx.fillStyle = overchargeTimer > 0 ? '#ffea00' : '#00e5ff';
    ctx.fillRect(0, 16, 2, 4 + (frame % 2) * 2);
    ctx.fillRect(18, 16, 2, 4 + (frame % 2) * 2);

    // Ship Hull
    ctx.fillStyle = overchargeTimer > 0 ? '#ffd700' : '#00b0ff';
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(20, 16); ctx.lineTo(15, 20); ctx.lineTo(10, 15); ctx.lineTo(5, 20); ctx.lineTo(0, 16);
    ctx.closePath(); ctx.fill();

    // Specular Sheen Sweep Highlight Across Hull Facets
    let sheenY = ((frame * 1.6) % 36) - 8;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(20, 16); ctx.lineTo(15, 20); ctx.lineTo(10, 15); ctx.lineTo(5, 20); ctx.lineTo(0, 16);
    ctx.closePath();
    ctx.clip();
    let sheenGrad = ctx.createLinearGradient(0, sheenY, 15, sheenY + 10);
    sheenGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
    sheenGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.7)');
    sheenGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = sheenGrad;
    ctx.fillRect(0, 0, 20, 24);
    ctx.restore();

    // Cockpit Canopy
    ctx.fillStyle = overchargeTimer > 0 ? '#00e5ff' : '#ffffff';
    ctx.beginPath(); ctx.ellipse(10, 7, 3, 5, 0, 0, Math.PI * 2); ctx.fill();

    // Overcharge Field / Hyper Shield Barrier / Shield
    if (overchargeTimer > 0) {
      let r = 18 + Math.sin(frame * 0.3) * 3;
      ctx.strokeStyle = (frame % 2 === 0) ? '#ffea00' : '#00e5ff';
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 12; ctx.shadowColor = '#ffea00';
      ctx.beginPath(); ctx.arc(10, 10, r, 0, Math.PI * 2); ctx.stroke();
    } else if (hyperShieldTimer > 0) {
      let rPulse = 20 + Math.sin(frame * 0.3) * 2;
      ctx.strokeStyle = '#ffea00';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 10; ctx.shadowColor = '#ffea00';
      ctx.beginPath(); ctx.arc(10, 10, rPulse, 0, Math.PI * 2); ctx.stroke();
    } else if (shield) {
      let rot = (frame * 0.1) % (Math.PI * 2);
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 8; ctx.shadowColor = '#00e5ff';
      ctx.beginPath(); ctx.arc(10, 10, 16, rot, rot + Math.PI * 1.6); ctx.stroke();
    }

    ctx.restore();

    // Laser Beam Ray
    if (laserTimer > 0 && gameState === STATE_PLAYING) {
      ctx.save();
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 5 + Math.sin(frame * 0.5) * 3;
      ctx.shadowBlur = 14; ctx.shadowColor = '#00e5ff';
      ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + 10, 0); ctx.stroke();
      ctx.restore();
    }
  }

  function drawEnemyShip(e, frame) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.cloaked) ctx.globalAlpha = 0.25;

    // Enemy Rear Thruster Flames
    if (e.type !== 5 && e.type !== 9 && e.type !== 13) {
      let eFlame = 4 + (frame % 3) * 2;
      ctx.fillStyle = (e.type === 4 ? '#00e5ff' : (e.type === 7 ? '#ffea00' : (e.type === 10 ? '#ffd700' : (e.type === 11 ? '#d500f9' : '#ff3d00'))));
      ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(10, -eFlame); ctx.lineTo(13, 0); ctx.closePath(); ctx.fill();
    }

    let isDamaged = (e.hp < e.maxHp / 2) && (frame % 4 < 2);
    if (isDamaged && e.type !== 5 && e.type !== 9) {
      ctx.filter = 'brightness(2) drop-shadow(0 0 5px red)';
    }

    if (e.type === 0) { // Red Interceptor
      ctx.fillStyle = '#ff1744';
      ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(10, 18); ctx.lineTo(20, 2); ctx.lineTo(13, 6); ctx.lineTo(10, 0); ctx.lineTo(7, 6); ctx.closePath(); ctx.fill();
    } else if (e.type === 1) { // Orange Chaser
      ctx.fillStyle = '#ff9100';
      ctx.beginPath(); ctx.moveTo(10, 20); ctx.lineTo(20, 4); ctx.lineTo(10, 0); ctx.lineTo(0, 4); ctx.closePath(); ctx.fill();
    } else if (e.type === 2) { // Purple Saucer
      ctx.fillStyle = '#d500f9';
      ctx.beginPath(); ctx.ellipse(10, 12, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#00e5ff'; ctx.beginPath(); ctx.arc(10, 12, 3, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 3) { // Heavy Armored
      ctx.fillStyle = '#78909c'; ctx.fillRect(2, 2, 16, 16);
      ctx.fillStyle = '#ff1744'; ctx.fillRect(8, 6, 4, 8);
    } else if (e.type === 4) { // Zigzag
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath(); ctx.moveTo(10, 18); ctx.lineTo(20, 0); ctx.lineTo(10, 6); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    } else if (e.type === 5 || e.type === 9) { // Asteroids
      ctx.fillStyle = '#8d6e63';
      let r = (e.type === 9) ? 15 : 9;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        let a = i * Math.PI * 2 / 8;
        let pR = r * (0.8 + ((Math.floor(e.x + i * 77) % 100) / 250));
        if (i === 0) ctx.moveTo(r + Math.cos(a)*pR, r + Math.sin(a)*pR);
        else ctx.lineTo(r + Math.cos(a)*pR, r + Math.sin(a)*pR);
      }
      ctx.closePath(); ctx.fill();
    } else if (e.type === 6) { // Frigate
      ctx.fillStyle = '#c62828';
      ctx.beginPath(); ctx.moveTo(18, 34); ctx.lineTo(34, 8); ctx.lineTo(18, 12); ctx.lineTo(2, 8); ctx.closePath(); ctx.fill();
    } else if (e.type === 7) { // Kamikaze Spike
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath(); ctx.moveTo(10, 22); ctx.lineTo(20, 0); ctx.lineTo(10, 4); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    } else if (e.type === 8) { // Stealth Fighter
      ctx.fillStyle = '#673ab7';
      ctx.beginPath(); ctx.moveTo(10, 18); ctx.lineTo(20, 2); ctx.lineTo(10, 8); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
    } else if (e.type === 10) { // Elite Valkyrie
      ctx.fillStyle = '#ff2828';
      ctx.beginPath(); ctx.moveTo(10, 22); ctx.lineTo(20, 2); ctx.lineTo(14, 8); ctx.lineTo(10, 0); ctx.lineTo(6, 8); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (e.type === 11) { // Elite Void Phantom
      ctx.fillStyle = '#aa00ff';
      ctx.beginPath(); ctx.moveTo(18, 32); ctx.lineTo(34, 12); ctx.lineTo(28, 2); ctx.lineTo(18, 8); ctx.lineTo(8, 2); ctx.lineTo(2, 12); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (e.type === 12) { // Elite Command Cruiser
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.moveTo(18, 34); ctx.lineTo(36, 18); ctx.lineTo(32, 2); ctx.lineTo(22, 6); ctx.lineTo(18, 0); ctx.lineTo(14, 6); ctx.lineTo(4, 2); ctx.lineTo(0, 18); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffea00'; ctx.beginPath(); ctx.arc(18, 17, 5, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 13) { // Siege Drop Pod
      ctx.fillStyle = '#646478'; ctx.fillRect(4, 4, 16, 16);
      ctx.fillStyle = '#ff3d00'; ctx.fillRect(8, 6, 8, 4);
    }

    ctx.restore();
  }

  function drawBoss(b, frame) {
    ctx.save();
    ctx.translate(b.x, b.y);

    let isEnraged = (b.hp < b.maxHp * 0.5);
    let isCritical = (b.hp < b.maxHp * 0.25);

    if (b.isDreadnought) {
      // Dreadnought Flagship
      ctx.fillStyle = isEnraged ? '#a01428' : '#3c465a';
      ctx.beginPath();
      ctx.moveTo(60, 62); ctx.lineTo(100, 45); ctx.lineTo(120, 25); ctx.lineTo(115, 5); ctx.lineTo(85, 2);
      ctx.lineTo(60, 10); ctx.lineTo(35, 2); ctx.lineTo(5, 5); ctx.lineTo(0, 25); ctx.lineTo(20, 45);
      ctx.closePath(); ctx.fill();

      // Armor Plates
      ctx.fillStyle = isCritical ? '#5a1414' : '#647387';
      ctx.beginPath(); ctx.moveTo(15, 12); ctx.lineTo(45, 12); ctx.lineTo(40, 38); ctx.lineTo(10, 30); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(75, 12); ctx.lineTo(105, 12); ctx.lineTo(110, 30); ctx.lineTo(80, 38); ctx.closePath(); ctx.fill();

      // Left Shield Generator
      if (b.genL > 0) {
        ctx.fillStyle = '#00e5ff';
        ctx.beginPath(); ctx.arc(28, 28, 10, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = (frame % 4 < 2) ? '#00e5ff' : '#80d8ff';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(28, 28, 18, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(28, 28, 10, 0, Math.PI * 2); ctx.fill();
      }

      // Right Shield Generator
      if (b.genR > 0) {
        ctx.fillStyle = '#00e5ff';
        ctx.beginPath(); ctx.arc(92, 28, 10, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = (frame % 4 < 2) ? '#00e5ff' : '#80d8ff';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(92, 28, 18, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(92, 28, 10, 0, Math.PI * 2); ctx.fill();
      }

      // Central Mega-Ion Cannon
      ctx.fillStyle = b.ionCharge >= 70 ? '#ffea00' : '#00e5ff';
      ctx.fillRect(52, 35, 16, 23);

      // Telegraph laser line
      if (b.ionCharge >= 70 && b.ionBeamTimer <= 0) {
        ctx.strokeStyle = (frame % 4 < 2) ? '#ff1744' : '#ffea00';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(60, 58); ctx.lineTo(60, H); ctx.stroke();
      }

      // Active Mega-Ion Beam
      if (b.ionBeamTimer > 0) {
        ctx.fillStyle = (frame % 2 === 0) ? '#00e5ff' : '#00b0ff';
        ctx.fillRect(48, 58, 24, H);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(55, 58, 10, H);
      }

      // Flak Turrets
      ctx.fillStyle = '#ff9100';
      ctx.beginPath(); ctx.arc(17, 42, 7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(103, 42, 7, 0, Math.PI * 2); ctx.fill();

    } else if (b.isMothership) {
      if (isCritical) {
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.moveTo(45, 58); ctx.lineTo(85, 35); ctx.lineTo(90, 10); ctx.lineTo(65, 2); ctx.lineTo(45, 12); ctx.lineTo(25, 2); ctx.lineTo(0, 10); ctx.lineTo(5, 35);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(20, 20); ctx.lineTo(30, 30); ctx.lineTo(40, 20); ctx.stroke();
      } else {
        ctx.fillStyle = isEnraged ? '#b71c1c' : '#880e4f';
        ctx.beginPath();
        ctx.moveTo(45, 58); ctx.lineTo(85, 35); ctx.lineTo(90, 10); ctx.lineTo(65, 2); ctx.lineTo(45, 12); ctx.lineTo(25, 2); ctx.lineTo(0, 10); ctx.lineTo(5, 35);
        ctx.closePath(); ctx.fill();
      }

      // Core Eye
      let coreCol = isEnraged ? ((frame % 4 < 2) ? '#ffea00' : '#ff1744') : ((frame % 8 < 4) ? '#00e5ff' : '#ff1744');
      ctx.fillStyle = coreCol;
      ctx.beginPath(); ctx.arc(45, 30, 12, 0, Math.PI * 2); ctx.fill();

      // Turrets
      let tOffsetsX = [5, 25, 65, 85];
      for (let i = 0; i < 4; i++) {
        if (b.turrets[i] && b.turrets[i].active) {
          ctx.fillStyle = '#ff9100';
          ctx.beginPath(); ctx.arc(tOffsetsX[i], 28, 7, 0, Math.PI * 2); ctx.fill();
        }
      }

      // Deflector Shield
      if (isMothershipShieldActive()) {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 12; ctx.shadowColor = '#00e5ff';
        ctx.beginPath(); ctx.arc(45, 30, 50, 0, Math.PI * 2); ctx.stroke();
        ctx.shadowBlur = 0;
      }
    } else {
      ctx.fillStyle = isEnraged ? '#d500f9' : '#b71c1c';
      ctx.beginPath();
      ctx.moveTo(30, 48); ctx.lineTo(58, 12); ctx.lineTo(45, 2); ctx.lineTo(30, 14); ctx.lineTo(15, 2); ctx.lineTo(2, 12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = isEnraged ? '#ffea00' : '#ff1744';
      ctx.beginPath(); ctx.arc(30, 24, 10, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
  }

  function drawPowerupItem(pu, frame) {
    ctx.save();
    ctx.translate(pu.x + 8, pu.y + 8);
    let pulse = 1 + Math.sin(frame * 0.15) * 0.15;
    ctx.scale(pulse, pulse);

    const colors = ['#00e676', '#00e5ff', '#3d5aff', '#ff1744', '#ffea00', '#d500f9', '#ffd700', '#00b0ff', '#ff64c8', '#ffea00', '#00e5ff'];
    const labels = ['S', 'L', 'H', 'B', 'R', 'T', 'Y', 'D', 'W', 'O', 'W'];

    ctx.fillStyle = colors[pu.type] || '#fff';
    ctx.beginPath();
    let pulseAmt = (frame % 20 < 10) ? 1 : 0;
    if (pu.type === 10) {
      ctx.moveTo(0, -8 - pulseAmt); ctx.lineTo(8+pulseAmt, 4); ctx.lineTo(4, 8+pulseAmt); ctx.lineTo(0, 4); ctx.lineTo(-4, 8+pulseAmt); ctx.lineTo(-8-pulseAmt, 4); ctx.closePath();
    } else if (pu.type === 9) {
      ctx.moveTo(0, -8 - pulseAmt); ctx.lineTo(8+pulseAmt, 0); ctx.lineTo(0, 8+pulseAmt); ctx.lineTo(-8-pulseAmt, 0); ctx.closePath();
    } else if (pu.type % 3 === 0) {
      ctx.moveTo(0, -7 - pulseAmt); ctx.lineTo(7+pulseAmt, 7+pulseAmt); ctx.lineTo(-7-pulseAmt, 7+pulseAmt); ctx.closePath();
    } else if (pu.type % 3 === 1) {
      ctx.rect(-7 - pulseAmt, -7 - pulseAmt, 14 + pulseAmt*2, 14 + pulseAmt*2);
    } else {
      ctx.arc(0, 0, 8 + pulseAmt, 0, Math.PI * 2);
    }
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labels[pu.type] || 'P', 0, 1);
    ctx.restore();
  }

  // --- RENDER LOOP ---
  function draw() {
    if (bombFlash > 0 || bossDeathFlash > 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      return;
    }

    ctx.save();
    if (screenShake > 0.1) {
      let shakeRot = Math.sin(frameCount * 1.3) * (screenShake / 25) * 0.035;
      let dx = Math.sin(frameCount * 1.7) * screenShake * 0.75;
      let dy = Math.cos(frameCount * 1.5) * screenShake * 0.75;
      ctx.translate(W / 2, H / 2);
      ctx.rotate(shakeRot);
      ctx.translate(-W / 2 + dx, -H / 2 + dy);
    }

    // Dynamic Background
    let bgR = bombardmentActive ? (65 + (frameCount % 20)) : (5 + (wave * 4) % 25);
    let bgG = bombardmentActive ? (25 + (frameCount % 10)) : (5 + (wave * 6) % 25);
    let bgB = bombardmentActive ? 12 : (18 + (wave * 10) % 40);
    ctx.fillStyle = `rgb(${bgR}, ${bgG}, ${bgB})`;
    ctx.fillRect(0, 0, W, H);

    // Deep Space Nebulae
    for (let n of nebulae) {
      n.x += n.vx; n.y += n.vy; n.phase += 0.015;
      if (n.x < -n.r) n.x = W + n.r;
      if (n.x > W + n.r) n.x = -n.r;
      if (n.y < -n.r) n.y = H + n.r;
      if (n.y > H + n.r) n.y = -n.r;
      let pr = n.r + Math.sin(n.phase) * 12;
      let g = ctx.createRadialGradient(n.x, n.y, 5, n.x, n.y, pr);
      g.addColorStop(0, n.col1); g.addColorStop(1, n.col2);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, pr, 0, Math.PI * 2); ctx.fill();
    }

    // Planets
    for (let p of planets) {
      p.x += p.vx; p.y += p.vy; p.rot += 0.005;
      if (p.x < -p.r*2) p.x = W + p.r*2;
      if (p.x > W + p.r*2) p.x = -p.r*2;
      if (p.y < -p.r*2) p.y = H + p.r*2;
      if (p.y > H + p.r*2) p.y = -p.r*2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
      if (p.type === 'ringed') {
        ctx.strokeStyle = p.ringCol; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.8, p.r * 0.4, Math.PI/6, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }

    // Planetary Surface during Bombardment
    if (bombardmentActive) {
      ctx.fillStyle = '#aa2d0f'; ctx.fillRect(0, H - 35, W, 35);
      ctx.strokeStyle = '#ffea00'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, H - 35); ctx.lineTo(W, H - 35); ctx.stroke();
    }

    // Orbital Bombardment Strikes
    for (let st of strikes) {
      if (st.timer > 15) {
        ctx.strokeStyle = (frameCount % 4 < 2) ? '#ff1744' : '#ffea00';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(st.x, 0); ctx.lineTo(st.x, H); ctx.stroke();
      } else {
        ctx.fillStyle = (frameCount % 2 === 0) ? '#ff3d00' : '#ffea00';
        ctx.fillRect(st.x - 12, 0, 24, H);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(st.x - 4, 0, 8, H);
      }
    }

    // Starfield
    for (let s of stars) {
      if (s.layer === 2) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + 4); ctx.stroke();
      } else if (s.layer === 1) {
        ctx.fillStyle = `rgba(180, 230, 255, 0.8)`; ctx.fillRect(s.x, s.y, s.size, s.size);
      } else {
        ctx.fillStyle = timeStopTimer > 0 ? '#00e5ff' : `rgba(120, 150, 200, ${s.alpha * 0.7})`; ctx.fillRect(s.x, s.y, s.size, s.size);
      }
    }

    if (gameState === STATE_MENU) drawMenuScreen();
    else if (gameState === STATE_MODE_SELECT) drawModeSelectScreen();
    else if (gameState === STATE_LEADERBOARD) drawLeaderboardScreen();
    else if (gameState === STATE_HELP) drawHelpScreen();
    else if (gameState === STATE_KEYBINDS) drawKeybindsScreen();
    else if (gameState === STATE_PLAYING || gameState === STATE_PAUSED || gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) {
      drawDroneWings(frameCount);
      drawPlayerShip(p.x, p.y, p.shield, frameCount);
      drawHyperJumpEffect(frameCount);

      // Player Bullets
      for (let b of bullets) {
        ctx.save();
        ctx.fillStyle = (overchargeTimer > 0) ? '#ffea00' : '#00e5ff';
        ctx.fillRect(b.x, b.y, 4, 10);
        ctx.restore();
      }

      // Enemy Bullets
      for (let eb of eBullets) {
        ctx.save();
        ctx.fillStyle = '#ff1744';
        ctx.fillRect(eb.x, eb.y, 4, 10);
        ctx.restore();
      }

      for (let e of enemies) drawEnemyShip(e, frameCount);
      if (boss) drawBoss(boss, frameCount);
      for (let pu of powerups) drawPowerupItem(pu, frameCount);

      // Debris & Particles
      for (let i = debris.length - 1; i >= 0; i--) {
        let d = debris[i];
        d.x += d.vx; d.y += d.vy; d.rot += d.vrot; d.life -= d.decay;
        if (d.life <= 0) { debris.splice(i, 1); continue; }
        ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot);
        ctx.globalAlpha = Math.max(0, d.life); ctx.fillStyle = d.color;
        ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size * 0.6);
        ctx.restore();
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        let sw = shockwaves[i];
        sw.r += sw.speed;
        sw.alpha -= (sw.isOuter ? 0.035 : 0.04);
        if (sw.alpha <= 0 || sw.r >= sw.maxR) { shockwaves.splice(i, 1); continue; }
        ctx.save();
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.lineWidth = sw.isOuter ? 1.5 : 2.5;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        let mf = muzzleFlashes[i]; mf.life--;
        if (mf.life <= 0) { muzzleFlashes.splice(i, 1); continue; }
        ctx.save(); ctx.fillStyle = mf.color;
        ctx.beginPath(); ctx.arc(mf.x, mf.y, mf.size * (mf.life / mf.maxLife), 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // Top Banner Alerts
      if (eliteSquadTimer > 0) {
        ctx.fillStyle = '#b41414'; ctx.fillRect(15, 38, W - 30, 20);
        ctx.fillStyle = (frameCount % 4 < 2) ? '#ffea00' : '#ffffff';
        ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
        ctx.fillText(`! ELITE SQUAD: ${eliteSquadName} !`, W / 2, 52);
      } else if (bombardmentBanner > 0 || bombardmentActive) {
        ctx.fillStyle = '#b43c00'; ctx.fillRect(15, 38, W - 30, 20);
        ctx.fillStyle = (frameCount % 4 < 2) ? '#ffea00' : '#ffffff';
        ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
        ctx.fillText('! ORBITAL BOMBARDMENT ACTIVE !', W / 2, 52);
      }

      drawExplosions();
      drawHUD();
      drawSciFiHUDFrame(ctx, frameCount);

      if (gameState === STATE_PAUSED) drawPauseScreen();
      if (gameState === STATE_GAMEOVER) drawGameOverScreen();
      if (gameState === STATE_VICTORY) drawVictoryScreen();
    }
    
    ctx.restore();
  }

  function drawSciFiHUDFrame(ctx, frame) {
    ctx.save();
    // Pulsating Energy Perimeter Inlay
    let borderAlpha = 0.25 + Math.sin(frame * 0.08) * 0.12;
    ctx.strokeStyle = `rgba(0, 229, 255, ${borderAlpha})`;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(5, 5, W - 10, H - 10);

    ctx.strokeStyle = `rgba(0, 229, 255, ${borderAlpha * 0.4})`;
    ctx.lineWidth = 1;
    ctx.strokeRect(8, 8, W - 16, H - 16);

    // Traveling Specular Glint along Perimeter
    let perimW = W - 10;
    let perimH = H - 10;
    let totalLen = 2 * (perimW + perimH);
    let glintPos = (frame * 3.5) % totalLen;
    let gx = 5, gy = 5;
    if (glintPos < perimW) {
      gx = 5 + glintPos; gy = 5;
    } else if (glintPos < perimW + perimH) {
      gx = 5 + perimW; gy = 5 + (glintPos - perimW);
    } else if (glintPos < 2 * perimW + perimH) {
      gx = 5 + perimW - (glintPos - perimW - perimH); gy = 5 + perimH;
    } else {
      gx = 5; gy = 5 + perimH - (glintPos - 2 * perimW - perimH);
    }
    
    let glintGrad = ctx.createRadialGradient(gx, gy, 0, gx, gy, 8);
    glintGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
    glintGrad.addColorStop(0.4, 'rgba(0, 229, 255, 0.7)');
    glintGrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
    ctx.fillStyle = glintGrad;
    ctx.beginPath();
    ctx.arc(gx, gy, 8, 0, Math.PI * 2);
    ctx.fill();

    // 4 Ornate Cybernetic Corner Reticles (L-Brackets)
    drawCyberReticle(ctx, 5, 5, 0);                 // Top-Left
    drawCyberReticle(ctx, W - 5, 5, Math.PI / 2);     // Top-Right
    drawCyberReticle(ctx, W - 5, H - 5, Math.PI);     // Bottom-Right
    drawCyberReticle(ctx, 5, H - 5, -Math.PI / 2);    // Bottom-Left
    ctx.restore();
  }

  function drawCyberReticle(ctx, x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // Primary Bracket L-Bar
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 20);
    ctx.lineTo(0, 5);
    ctx.lineTo(5, 0);
    ctx.lineTo(20, 0);
    ctx.stroke();

    // Tech Chamfer and Tick Marks
    ctx.strokeStyle = '#ffea00';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(9, 2);
    ctx.lineTo(9, 5);
    ctx.moveTo(15, 2);
    ctx.lineTo(15, 5);
    ctx.moveTo(2, 9);
    ctx.lineTo(5, 9);
    ctx.moveTo(2, 15);
    ctx.lineTo(5, 15);
    ctx.stroke();

    // Illuminated Corner Status Diode
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(4, 4, 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(isReplaying ? `REPLAY - SCORE: ${score}` : `SCORE: ${score}`, 10, 18);
    ctx.fillText(`HIGH: ${highScore}`, 120, 18);
    ctx.fillText(`WAVE: ${wave}/20`, W - 85, 18);

    ctx.fillStyle = '#ff1744';
    for (let i = 0; i < p.hp; i++) ctx.fillRect(10 + i * 12, 26, 8, 8);

    ctx.fillStyle = '#ffea00';
    for (let i = 0; i < p.bombs; i++) ctx.fillRect(60 + i * 12, 26, 8, 8);

    ctx.fillStyle = '#00e5ff';
    ctx.fillText(`Drones:[W]${droneCount}/2`, 110, 34);

    // Overcharge & Hyper-Jump status
    if (hyperJumpTimer > 0) {
      ctx.fillStyle = (frameCount % 4 < 2) ? '#ffea00' : '#00e5ff';
      ctx.fillText('[J]HYPER-JUMP WARP ACTIVE!', 10, H - 45);
    } else if (overchargeTimer > 0) {
      ctx.fillStyle = (frameCount % 4 < 2) ? '#ffea00' : '#00e5ff';
      ctx.fillText(`[O]OVERCHARGE: (${Math.ceil(overchargeTimer/60)}s) [J]Jump:${hyperJumpEnergy}%`, 10, H - 45);
    } else {
      ctx.fillStyle = (overchargeEnergy >= 100 || hyperJumpEnergy >= 100) ? '#ffea00' : '#00e676';
      ctx.fillText(`[O]OC:${overchargeEnergy}% ${overchargeEnergy>=100?'[RDY]':''} [J]Jump:${hyperJumpEnergy}% ${hyperJumpEnergy>=100?'[RDY]':''}`, 10, H - 45);
    }

    if (boss) {
      ctx.fillStyle = '#111';
      ctx.fillRect(40, 42, W - 80, 12);
      let pct = Math.max(0, boss.hp / boss.maxHp);
      ctx.fillStyle = boss.isDreadnought ? '#ff1744' : (boss.isMothership ? '#d500f9' : '#ff9100');
      ctx.fillRect(42, 44, (W - 84) * pct, 8);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(40, 42, W - 80, 12);
      ctx.fillStyle = '#fff';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      if (boss.isDreadnought) {
        ctx.fillText(`DREADNOUGHT SIEGE [L:${boss.genL>0?'ON':'OFF'} R:${boss.genR>0?'ON':'OFF'}]`, W / 2, 51);
      } else {
        ctx.fillText(boss.isMothership ? 'ALIEN MOTHERSHIP' : `FLAGSHIP Lvl ${boss.level}`, W / 2, 51);
      }
      ctx.textAlign = 'left';
    }
  }

  function drawMenuScreen() {
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('KSPACE', W / 2, 80);

    ctx.fillStyle = '#80d8ff';
    ctx.font = '12px monospace';
    ctx.fillText('Loop 11 Space Command', W / 2, 110);

    let saved = hasSavedGame();
    let options = ['START NEW GAME'];
    if (saved) options.push('RESUME SAVED GAME');
    options.push('HIGH SCORES', 'SELECT GAME MODE', 'KEYBINDS', 'LOAD REPLAY');

    for (let i = 0; i < options.length; i++) {
      let y = 170 + i * 40;
      if (i === menuIndex) {
        ctx.fillStyle = '#ffea00';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`> ${options[i]} <`, W / 2, y);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.font = '14px monospace';
        ctx.fillText(options[i], W / 2, y);
      }
    }

    ctx.fillStyle = '#ffea00';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('PRESS [H] OR [F1] FOR HELP', W / 2, H - 30);
    ctx.textAlign = 'left';
  }

  function drawHelpScreen() {
    ctx.fillStyle = 'rgba(5, 5, 18, 0.95)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HOW TO PLAY', W / 2, 50);

    ctx.fillStyle = '#ffffff';
    ctx.font = '12px monospace';
    let instructions = [
      "ARROWS / DRAG : Move Ship",
      "SPACE / CLICK : Fire Weapon",
      "",
      "--- LOOP 11 SYSTEMS ---",
      "[J] : Hyper-Jump Warp Drive",
      "[W] : Deploy Companion Drone",
      "[O] : Overcharge Hyper-Mode",
      "[T] : Time Stop (Chrono)",
      "[D] : Tactical Dash (Invinc.)",
      "[B] : Smart Bomb (Clear)",
      "[S] : Hyper Shield (Protect)",
      "",
      "--- POWERUP PODS ---",
      "S:Spread L:Laser H:Shield",
      "B:Bomb R:Rapid T:Time",
      "W:Drone Pod O:Overcharge Core"
    ];
    for (let i = 0; i < instructions.length; i++) {

    }

    ctx.fillStyle = '#ffea00';

    ctx.fillText('Press [H] or ENTER to return', W / 2, H - 30);
    ctx.textAlign = 'left';
  }

  function drawKeybindsScreen() {
    ctx.fillStyle = 'rgba(5, 5, 18, 0.95)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00e5ff'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
    ctx.fillText('CUSTOM KEYBINDS', W / 2, 50);

    let kbKeys = Object.keys(keybinds);
    for(let i=0; i<kbKeys.length; i++) {
        let k = kbKeys[i];
        ctx.fillStyle = (menuIndex === i) ? '#ffea00' : '#ffffff';
        let val = waitForKeybind === k ? 'PRESS KEY...' : keybinds[k].toUpperCase();
        ctx.font = '14px monospace';
        ctx.fillText(`${k.toUpperCase()}: ${val}`, W / 2, 90 + i * 25);
    }
    ctx.fillStyle = '#80d8ff'; ctx.font = '12px monospace';
    ctx.fillText('UP/DOWN: Select | ENTER: Rebind | ESC: Back', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  function drawModeSelectScreen() {
    ctx.fillStyle = '#ffea00';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SELECT GAME MODE', W / 2, 90);

    for (let i = 0; i < MODES.length; i++) {
      let y = 180 + i * 65;
      if (i === modeIndex) {
        ctx.fillStyle = '#00e5ff';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`> ${MODES[i].name} <`, W / 2, y);
        ctx.fillStyle = '#ffffff';
        ctx.font = '11px monospace';
        ctx.fillText(MODES[i].desc, W / 2, y + 20);
      } else {
        ctx.fillStyle = '#78909c';
        ctx.font = '14px monospace';
        ctx.fillText(MODES[i].name, W / 2, y);
      }
    }

    ctx.fillStyle = '#ff1744';
    ctx.font = '12px monospace';
    ctx.fillText('Press ENTER to Launch Mission', W / 2, H - 40);
    ctx.textAlign = 'left';
  }

  function drawLeaderboardScreen() {
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TOP COMMANDERS', W / 2, 70);

    for (let i = 0; i < leaderboard.length; i++) {
      let y = 140 + i * 35;
      let item = leaderboard[i];
      ctx.fillStyle = i === 0 ? '#ffea00' : '#ffffff';
      ctx.font = '13px monospace';
      ctx.fillText(`#${i + 1}   Score:${item.score}   Wave:${item.wave}`, W / 2, y);
    }
    ctx.textAlign = 'left';
  }

  function drawPauseScreen() {
    ctx.fillStyle = 'rgba(5, 5, 18, 0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffea00';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SYSTEM PAUSED', W / 2, 120);

    let options = ['RESUME GAME', 'SAVE GAME STATE', 'LOAD GAME STATE', 'QUIT TO MENU'];
    for (let i = 0; i < options.length; i++) {
      let y = 200 + i * 40;
      if (i === menuIndex) {
        ctx.fillStyle = '#00e5ff';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`> ${options[i]} <`, W / 2, y);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.font = '14px monospace';
        ctx.fillText(options[i], W / 2, y);
      }
    }
    ctx.textAlign = 'left';
  }

  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(20, 0, 0, 0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff1744';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(isReplaying ? 'REPLAY ENDED' : 'MISSION FAILED', W / 2, 140);
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, 190);
    ctx.fillText(`WAVE REACHED: ${wave}`, W / 2, 220);
    ctx.fillStyle = '#ffea00';
    ctx.font = '14px monospace';
    ctx.fillText('ENTER: Menu | E: CSV | J: JSON | R: Save Replay', W / 2, 310);
    ctx.textAlign = 'left';
  }

  function drawVictoryScreen() {
    ctx.fillStyle = 'rgba(0, 30, 20, 0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00e676';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(isReplaying ? 'REPLAY ENDED' : 'CAMPAIGN VICTORY!', W / 2, 140);
    ctx.fillStyle = '#ffea00';
    ctx.font = '14px monospace';
    ctx.fillText('Alien Mothership Destroyed', W / 2, 175);
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, 220);
    ctx.fillText(`VICTORY BONUS: +10000`, W / 2, 250);
    ctx.fillStyle = '#80d8ff';
    ctx.font = '14px monospace';
    ctx.fillText('ENTER: Menu | E: CSV | J: JSON | R: Save Replay', W / 2, 330);
    ctx.textAlign = 'left';
  }

  setInterval(() => {
    update();
    draw();
  }, 16);
</script>
</body>
</html>
