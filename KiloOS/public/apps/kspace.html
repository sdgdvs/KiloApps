<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KSpace - Deep Space Shooter</title>
<script>
window.addEventListener('load', () => {
    if (window.resizeTo) window.resizeTo(340, 520);
    if (window.parent) window.parent.postMessage({ type: 'OS_SET_WINDOW_SIZE', width: 340, height: 520 }, '*');
});
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #050512;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    color: #fff;
    text-rendering: optimizeLegibility;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: calc(100vh * 320 / 480);
    max-height: calc(100vw * 480 / 320);
    aspect-ratio: 320 / 480;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
    border: 2px solid #1a237e;
    background: #000;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .skill-bar {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    z-index: 10;
    width: 95%;
    justify-content: center;
  }
  .skill-btn {
    background: rgba(10, 25, 50, 0.85);
    border: 1px solid #00e5ff;
    color: #00e5ff;
    padding: 4px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    transition: all 0.15s ease;
  }
  .skill-btn:hover {
    background: #00e5ff;
    color: #000;
  }
  .skill-btn.cooldown {
    border-color: #555;
    color: #777;
    background: rgba(20, 20, 20, 0.8);
    cursor: not-allowed;
    box-shadow: none;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="320" height="480" tabindex="0" role="img" aria-label="KSpace space shooter game canvas"></canvas>
  <div class="skill-bar" id="skillBar" style="display:none;">
    <button class="skill-btn" id="btnHyperJump" onclick="useHyperJump()">[J] JUMP</button>
    <button class="skill-btn" id="btnDrone" onclick="deployDroneWing()">[W] DRONE</button>
    <button class="skill-btn" id="btnOvercharge" onclick="useOvercharge()">[O] OVERCHARGE</button>
    <button class="skill-btn" id="btnTimeStop" onclick="useTimeStop()">[T] STOP</button>
    <button class="skill-btn" id="btnDash" onclick="useTacticalDash()">[D] DASH</button>
    <button class="skill-btn" id="btnBomb" onclick="useSmartBomb()">[B] BOMB</button>
    <button class="skill-btn" id="btnShield" onclick="useHyperShield()">[S] SHIELD</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const skillBar = document.getElementById('skillBar');
  const W = 320, H = 480;

  let initialSeed = 999;
  let seed = 999;
  function rnd() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed;
  }
  function randomFloat() { return (rnd() & 0xffffff) / 0x1000000; }


  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // --- GAME STATES ---
  const STATE_MENU = 0;
  const STATE_MODE_SELECT = 1;
  const STATE_PLAYING = 2;
  const STATE_PAUSED = 3;
  const STATE_LEADERBOARD = 4;
  const STATE_GAMEOVER = 5;
  const STATE_VICTORY = 6;
  const STATE_HELP = 7;

  const STATE_KEYBINDS = 8;
  const STATE_REPLAY = 9;

  let keybinds = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright', fire: ' ', hyperJump: 'j', drone: 'w', overcharge: 'o', timeStop: 't', dash: 'd', bomb: 'b', shield: 's', pause: 'p' };
  try { let kb = localStorage.getItem('kspace_keybinds'); if (kb) keybinds = Object.assign(keybinds, JSON.parse(kb)); } catch(e) {}

  let shotsFired = 0;
  let shotsHit = 0;
  let timeSurvivedFrames = 0;

  let isReplaying = false;
  let currentReplay = null;
  let replayIndex = 0;
  let lastReplaySaved = null;

  let waitForKeybind = null;

  function exportStats() {
    let acc = shotsFired > 0 ? ((shotsHit / shotsFired) * 100).toFixed(1) : 0;
    let data = { score, wave, mode: MODES[modeIndex].name, enemiesKilled, timeSurvivedSeconds: Math.floor(timeSurvivedFrames/60), shotsFired, shotsHit, accuracyPct: acc };
    let json = JSON.stringify(data, null, 2);
    let blob = new Blob([json], { type: 'application/json' });
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kspace_stats.json'; a.click();
  }
  function exportCSV() {
    let acc = shotsFired > 0 ? ((shotsHit / shotsFired) * 100).toFixed(1) : 0;
    let csv = `Score,Wave,Mode,EnemiesKilled,TimeSurvivedSec,ShotsFired,ShotsHit,AccuracyPct\n${score},${wave},${MODES[modeIndex].name},${enemiesKilled},${Math.floor(timeSurvivedFrames/60)},${shotsFired},${shotsHit},${acc}`;
    let blob = new Blob([csv], { type: 'text/csv' });
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kspace_stats.csv'; a.click();
  }
  function exportHighScores() {
    let blob = new Blob([JSON.stringify(leaderboard, null, 2)], { type: 'application/json' });
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kspace_highscores.json'; a.click();
  }
  function importHighScores() {
    let input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
      let file = e.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = ev => {
        try {
          let data = JSON.parse(ev.target.result);
          if (Array.isArray(data)) {
            let valid = data.filter(item => item && typeof item.score === 'number' && typeof item.wave === 'number');
            if (valid.length > 0) {
              leaderboard = valid.map(item => ({
                score: Math.floor(item.score),
                wave: Math.floor(item.wave),
                mode: String(item.mode || 'Classic 20-Wave Campaign')
              })).sort((a, b) => b.score - a.score).slice(0, 5);
              saveLeaderboard();
              alert('Imported!');
            } else { alert('No valid high scores found'); }
          } else { alert('Invalid JSON format'); }
        } catch(err) { alert('Invalid JSON'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }
  function exportReplay() {
    if (!lastReplaySaved) { alert('No replay available!'); return; }
    let blob = new Blob([JSON.stringify(lastReplaySaved)], { type: 'application/json' });
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kspace_replay.json'; a.click();
  }
  function loadReplay() {
    let input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
      let file = e.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = ev => {
        try {
          let data = JSON.parse(ev.target.result);
          if (data && data.seed && data.frames) {
             lastReplaySaved = data;
             startReplay(data);
          } else { alert('Invalid replay'); }
        } catch(err) { alert('Invalid JSON'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }
  function startReplay(rep) {
    currentReplay = rep;
    replayIndex = 0;
    isReplaying = true;
    startNewGame(rep.modeIndex, rep.seed);
  }


  let gameState = STATE_MENU;
  let menuIndex = 0;
  let modeIndex = 0; // 0: Classic 20-Wave Campaign, 1: Endurance Wave, 2: Boss Rush

  // --- GAME MODES ---
  const MODES = [
    { name: 'Classic 20-Wave Campaign', desc: '20 Waves with Stage 20 Alien Mothership Boss' },
    { name: 'Endurance Wave Storm', desc: 'Relentless enemy storm, scaling speed & asteroids' },
    { name: 'Boss Rush Challenge', desc: 'Non-stop Boss encounters back-to-back' }
  ];

  // --- PLAYER ENTITY ---
  let p = {
    x: W / 2 - 10,
    y: H - 60,
    hp: 3,
    maxHp: 3,
    shield: false,
    bombs: 1,
    maxBombs: 3,
    weaponType: 0 // 0: Normal, 1: Spread, 2: Laser, 3: Plasma
  };

  // Timers & Active Skills Cooldowns
  let spreadTimer = 0;
  let laserTimer = 0;
  let rapidTimer = 0;
  let timeStopTimer = 0;
  let timeStopCooldown = 0;
  let dashCooldown = 0;
  let invincibleTimer = 0;
  let hyperShieldTimer = 0;
  let hyperShieldCooldown = 0;

  // Loop 11: Drone Wings & Hyper-Jump Systems
  let drones = []; // { x, y, shootTimer }
  let droneCount = 0;
  let hyperJumpEnergy = 0; // 0..100%
  let hyperJumpTimer = 0; // Warp state timer

  // Loop 10 Systems
  let overchargeEnergy = 0; // 0..100%
  let overchargeTimer = 0;
  let bombardmentActive = false;
  let bombardmentTimer = 0;
  let bombardmentBanner = 0;
  let strikes = [];
  let eliteSquadActive = false;
  let eliteSquadTimer = 0;
  let eliteSquadName = "";

  let score = 0;
  let highScore = 0;
  let totalKills = 0;
  let enemiesKilled = 0;
  let comboMultiplier = 1;
  let comboTimer = 0;
  let weaponLevel = 0;
  let wave = 1;
  let frameCount = 0;
  let bombFlash = 0;
  let bossDeathFlash = 0;
  let screenShake = 0;

  // Collections
  let bullets = [];
  let eBullets = [];
  let enemies = [];
  let stars = [];
  let explosions = [];
  let powerups = [];

  // Loop 2 Visual FX Collections
  let shockwaves = [];
  let debris = [];
  let shieldRipples = [];
  let muzzleFlashes = [];
  let thrusterParticles = [];

  let escort = { active: false, x: 0, y: 0, dy: 0, hp: 0, maxHp: 0 };
  let pathGatesActive = false;
  let pathGatesY = 0;

  // Deep Space Shifting Nebulae
  let nebulae = [
    { x: W * 0.25, y: H * 0.3, r: 100, col1: 'rgba(75, 0, 130, 0.28)', col2: 'rgba(0, 229, 255, 0)', vx: 0.12, vy: 0.2, phase: 0 },
    { x: W * 0.75, y: H * 0.7, r: 120, col1: 'rgba(139, 0, 139, 0.25)', col2: 'rgba(255, 23, 68, 0)', vx: -0.09, vy: 0.15, phase: 1.5 },
    { x: W * 0.45, y: H * 0.1, r: 85, col1: 'rgba(0, 80, 180, 0.22)', col2: 'rgba(0, 0, 0, 0)', vx: 0.07, vy: 0.25, phase: 3.0 }
  ];

  // Loop 3: Distant Planets and Comets
  let planets = [
    { x: W * 0.8, y: H * 0.2, r: 40, col: '#004d40', ringCol: 'rgba(0, 255, 128, 0.4)', rot: 0, vx: -0.02, vy: 0.05, type: 'ringed' },
    { x: W * 0.1, y: H * 0.7, r: 25, col: '#b71c1c', ringCol: null, rot: 0, vx: 0.01, vy: 0.03, type: 'cratered' }
  ];
  let comets = [];

  // Init 3-Layer Parallax Starfield
  for (let i = 0; i < 75; i++) {
    let layer = randomFloat() < 0.5 ? 0 : (randomFloat() < 0.8 ? 1 : 2);
    stars.push({
      x: randomFloat() * W,
      y: randomFloat() * H,
      layer: layer,
      speed: layer === 0 ? 0.4 : (layer === 1 ? 1.2 : 2.5),
      size: layer === 0 ? 1 : (layer === 1 ? 1.5 : 2),
      alpha: 0.3 + randomFloat() * 0.7
    });
  }

  // Local Storage Persistence
  try { highScore = parseInt(localStorage.getItem('kspace_highscore') || '0', 10) || 0; } catch (e) {}
  try { totalKills = parseInt(localStorage.getItem('kspace_totalkills') || '0', 10) || 0; } catch (e) {}

  let leaderboard = [];
  function loadLeaderboard() {
    try {
      let data = localStorage.getItem('kspace_leaderboard');
      if (data) {
        leaderboard = JSON.parse(data);
      } else {
        leaderboard = [
          { score: 12000, wave: 20, mode: 'Classic 20-Wave Campaign' },
          { score: 8500, wave: 15, mode: 'Classic 20-Wave Campaign' },
          { score: 5000, wave: 10, mode: 'Endurance Wave Storm' },
          { score: 3500, wave: 7, mode: 'Boss Rush Challenge' },
          { score: 1500, wave: 4, mode: 'Classic 20-Wave Campaign' }
        ];
      }
    } catch (e) {
      leaderboard = [];
    }
  }
  loadLeaderboard();

  function saveLeaderboard() {
    try {
      localStorage.setItem('kspace_leaderboard', JSON.stringify(leaderboard));
    } catch (e) {}
  }

  function addScoreToLeaderboard(newScore, newWave, modeName) {
    leaderboard.push({ score: newScore, wave: newWave, mode: modeName });
    leaderboard.sort((a, b) => b.score - a.score);
    if (leaderboard.length > 5) leaderboard = leaderboard.slice(0, 5);
    saveLeaderboard();
  }

  function hasSavedGame() {
    try { return localStorage.getItem('kspace_save') !== null; } catch (e) { return false; }
  }

  function saveGameState() {
    let saveObj = {
      p: p,
      score: score,
      wave: wave,
      modeIndex: modeIndex,
      enemiesKilled: enemiesKilled,
      spreadTimer: spreadTimer,
      laserTimer: laserTimer,
      rapidTimer: rapidTimer,
      timeStopTimer: timeStopTimer,
      timeStopCooldown: timeStopCooldown,
      dashCooldown: dashCooldown,
      invincibleTimer: invincibleTimer,
      hyperShieldTimer: hyperShieldTimer,
      hyperShieldCooldown: hyperShieldCooldown,
      droneCount: droneCount,
      hyperJumpEnergy: hyperJumpEnergy,
      overchargeEnergy: overchargeEnergy,
      boss: boss
    };
    try {
      localStorage.setItem('kspace_save', JSON.stringify(saveObj));
      playSound(2);
    } catch (e) {}
  }

  function loadGameState() {
    try {
      let str = localStorage.getItem('kspace_save');
      if (!str) return false;
      let saveObj = JSON.parse(str);
      p = saveObj.p;
      score = saveObj.score;
      wave = saveObj.wave;
      modeIndex = saveObj.modeIndex;
      enemiesKilled = saveObj.enemiesKilled;
      spreadTimer = saveObj.spreadTimer || 0;
      laserTimer = saveObj.laserTimer || 0;
      rapidTimer = saveObj.rapidTimer || 0;
      timeStopTimer = saveObj.timeStopTimer || 0;
      timeStopCooldown = saveObj.timeStopCooldown || 0;
      dashCooldown = saveObj.dashCooldown || 0;
      invincibleTimer = saveObj.invincibleTimer || 0;
      hyperShieldTimer = saveObj.hyperShieldTimer || 0;
      hyperShieldCooldown = saveObj.hyperShieldCooldown || 0;
      droneCount = saveObj.droneCount || 0;
      hyperJumpEnergy = saveObj.hyperJumpEnergy || 0;
      overchargeEnergy = saveObj.overchargeEnergy || 0;
      boss = saveObj.boss || null;

      drones = [];
      for (let i = 0; i < droneCount; i++) {
        drones.push({ x: p.x + (i === 0 ? -22 : 22), y: p.y + 6, shootTimer: i * 7 });
      }

      bullets = [];
      eBullets = [];
      enemies = [];
      powerups = [];
      explosions = [];
      gameState = STATE_PLAYING;
      playSound(3);
      return true;
    } catch (e) {
      return false;
    }
  }

  function clearSavedGame() {
    try { localStorage.removeItem('kspace_save'); } catch (e) {}
  }

  // --- AUDIO SYNTHESIZER ---
  let audioCtx;
  function playSound(type) {
    try {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      let t = audioCtx.currentTime;

      if (type === 0) { // Shoot
        osc.type = 'square';
        osc.frequency.setValueAtTime(900, t);
        osc.frequency.exponentialRampToValueAtTime(300, t + 0.08);
        gain.gain.setValueAtTime(0.06, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
        osc.start(t); osc.stop(t + 0.08);
      } else if (type === 1) { // Explosion
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
        osc.start(t); osc.stop(t + 0.25);
      } else if (type === 2) { // Powerup / Skill
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.setValueAtTime(780, t + 0.08);
        osc.frequency.setValueAtTime(1040, t + 0.16);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.24);
        osc.start(t); osc.stop(t + 0.24);
      } else if (type === 3) { // Wave Clear / Stasis
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, t);
        osc.frequency.setValueAtTime(550, t + 0.1);
        osc.frequency.setValueAtTime(750, t + 0.2);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.35);
        osc.start(t); osc.stop(t + 0.35);
      } else if (type === 4) { // Smart Bomb
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.5);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
        osc.start(t); osc.stop(t + 0.5);
      } else if (type === 5) { // Laser
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, t);
        osc.frequency.linearRampToValueAtTime(800, t + 0.05);
        gain.gain.setValueAtTime(0.04, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.05);
        osc.start(t); osc.stop(t + 0.05);
      } else if (type === 6) { // Victory Fanfare
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.setValueAtTime(554, t + 0.12);
        osc.frequency.setValueAtTime(659, t + 0.24);
        osc.frequency.setValueAtTime(880, t + 0.36);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.6);
        osc.start(t); osc.stop(t + 0.6);
      } else if (type === 7) { // Loop 11: Hyper-Jump Warp Sweep
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(1600, t + 0.25);
        osc.frequency.exponentialRampToValueAtTime(350, t + 0.5);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.5);
        osc.start(t); osc.stop(t + 0.5);
      } else if (type === 8) { // Loop 11: Drone Vulcan / Point Defense Zap
        osc.type = 'square';
        osc.frequency.setValueAtTime(1100, t);
        osc.frequency.exponentialRampToValueAtTime(450, t + 0.05);
        gain.gain.setValueAtTime(0.04, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.05);
        osc.start(t); osc.stop(t + 0.05);
      } else if (type === 9) { // Loop 11: Dreadnought Mega-Ion Beam Roar
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(90, t);
        osc.frequency.linearRampToValueAtTime(160, t + 0.3);
        osc.frequency.linearRampToValueAtTime(60, t + 0.7);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.75);
        osc.start(t); osc.stop(t + 0.75);
      }
    } catch (e) {}
  }

  // --- PARTICLES, SHOCKWAVES & DEBRIS (Loop 8 Enhanced Engine) ---
  function addShockwave(x, y, maxR = 35, color = '#00e5ff', speed = 2.4) {
    // Primary high-energy compression shockwave ring
    shockwaves.push({ x: x, y: y, r: 4, maxR: maxR, color: color, alpha: 1.0, speed: speed, isOuter: false });
    // Secondary outer ion dispersion halo
    shockwaves.push({ x: x, y: y, r: 2, maxR: maxR * 1.35, color: '#ffffff', alpha: 0.75, speed: speed * 1.45, isOuter: true });
  }

  function addDebrisChunk(x, y, count = 6, color = '#ff9100') {
    for (let i = 0; i < count; i++) {
      let angle = randomFloat() * Math.PI * 2;
      let spd = 1.0 + randomFloat() * 3.5;
      debris.push({
        x: x, y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        rot: randomFloat() * Math.PI * 2,
        vrot: (randomFloat() - 0.5) * 0.35,
        size: 3 + randomFloat() * 5,
        color: color,
        shape: Math.floor(randomFloat() * 3),
        life: 1.0,
        decay: 0.018 + randomFloat() * 0.025
      });
    }
  }

  function addShieldRipple(x, y, color = '#00e5ff') {
    shieldRipples.push({ x: x, y: y, r: 6, maxR: 28, color: color, alpha: 1.0 });
  }

  function addMuzzleFlash(x, y, color = '#00e5ff', size = 6) {
    muzzleFlashes.push({ x: x, y: y, size: size, life: 3, maxLife: 3, color: color });
  }

  function addExplosion(x, y, count = 14, color = null) {
    screenShake += Math.floor(count / 3);
    if (screenShake > 25) screenShake = 25;

    // Layer 0: Incandescent Core Needle Sparks with Velocity Trails
    let sparkCount = Math.max(6, Math.floor(count * 0.75));
    for (let i = 0; i < sparkCount; i++) {
      let angle = randomFloat() * Math.PI * 2;
      let spd = 2.5 + randomFloat() * 5.0;
      explosions.push({
        layer: 0,
        x: x, y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 1.0,
        decay: 0.035 + randomFloat() * 0.045,
        size: 1.2 + randomFloat() * 1.5,
        color: (i % 3 === 0) ? '#ffffff' : (color || (randomFloat() < 0.5 ? '#00e5ff' : '#ffea00'))
      });
    }

    // Layer 1: Expanding Buoyant Plasma Smoke Puffs
    let smokeCount = Math.max(4, Math.floor(count * 0.5));
    for (let i = 0; i < smokeCount; i++) {
      let angle = randomFloat() * Math.PI * 2;
      let spd = 0.5 + randomFloat() * 2.0;
      explosions.push({
        layer: 1,
        x: x, y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 0.3,
        life: 1.0,
        decay: 0.02 + randomFloat() * 0.025,
        size: 3.5 + randomFloat() * 4.0,
        color: (randomFloat() < 0.4 ? '#ff3d00' : (randomFloat() < 0.5 ? '#ff9100' : '#4a148c'))
      });
    }

    // Layer 2: Heavy Kinematic Armor & Hull Debris Shards (via debris system)
    if (count >= 10) {
      addDebrisChunk(x, y, Math.min(14, Math.floor(count * 0.6)), color || '#ff9800');
    }

    // Layer 3: Radiant Celebration Energy Stars
    if (count >= 12) {
      let starCount = Math.min(8, Math.floor(count * 0.35));
      for (let i = 0; i < starCount; i++) {
        let angle = (i / starCount) * Math.PI * 2 + randomFloat() * 0.3;
        let spd = 1.2 + randomFloat() * 2.8;
        explosions.push({
          layer: 3,
          x: x, y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1.0,
          decay: 0.018 + randomFloat() * 0.02,
          size: 4.0 + randomFloat() * 3.0,
          rot: randomFloat() * Math.PI,
          vrot: (randomFloat() - 0.5) * 0.25,
          color: (randomFloat() < 0.5 ? '#ffd700' : '#ffffff')
        });
      }
    }

    if (count >= 10) {
      addShockwave(x, y, count * 2.4, color || '#ff5722');
    }
  }

  function updateExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
      let ex = explosions[i];
      ex.x += ex.vx;
      ex.y += ex.vy;
      if (ex.layer === 1) {
        ex.vx *= 0.92;
        ex.vy *= 0.92;
        ex.vy -= 0.04; // buoyant upward drift
      } else if (ex.layer === 0) {
        ex.vx *= 0.96;
        ex.vy *= 0.96;
      } else if (ex.layer === 3) {
        ex.vx *= 0.94;
        ex.vy *= 0.94;
        if (ex.rot !== undefined) ex.rot += ex.vrot;
      }
      ex.life -= ex.decay;
      if (ex.life <= 0) explosions.splice(i, 1);
    }
  }

  function drawExplosions() {
    for (let ex of explosions) {
      ctx.save();
      let alpha = Math.max(0, ex.life);
      ctx.globalAlpha = alpha;

      if (ex.layer === 0) {
        // Incandescent needle core spark with velocity trail
        ctx.strokeStyle = ex.color;
        ctx.lineWidth = ex.size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ex.x, ex.y);
        ctx.lineTo(ex.x - ex.vx * 2.4, ex.y - ex.vy * 2.4);
        ctx.stroke();
      } else if (ex.layer === 1) {
        // Expanding buoyant plasma smoke puff
        let r = ex.size * (0.8 + (1.0 - alpha) * 1.6);
        ctx.fillStyle = ex.color;
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (ex.layer === 3) {
        // Radiant 4-point energy star
        ctx.translate(ex.x, ex.y);
        ctx.rotate(ex.rot || 0);
        let s = ex.size * (0.5 + alpha * 0.5);
        ctx.fillStyle = ex.color;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.25, -s * 0.25);
        ctx.lineTo(s, 0);
        ctx.lineTo(s * 0.25, s * 0.25);
        ctx.lineTo(0, s);
        ctx.lineTo(-s * 0.25, s * 0.25);
        ctx.lineTo(-s, 0);
        ctx.lineTo(-s * 0.25, -s * 0.25);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = ex.color;
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, ex.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // --- KEYBOARD & INPUT ---
  const keys = {};
  document.addEventListener('keydown', e => {
    if (!waitForKeybind && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar', 'KeyB', 'KeyP', 'Escape', 'KeyH', 'F1'].includes(e.code) || [' ', 'b', 'B', 'p', 'P', 't', 'T', 'd', 'D', 's', 'S', 'h', 'H'].includes(e.key)) {
      e.preventDefault();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    
    if (waitForKeybind) {
      keybinds[waitForKeybind] = e.key.toLowerCase();
      localStorage.setItem('kspace_keybinds', JSON.stringify(keybinds));
      waitForKeybind = null;
      return;
    }
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;

    const keyLower = e.key ? e.key.toLowerCase() : '';

    if (gameState === STATE_MENU) {
      if (keyLower === 'h' || e.key === 'F1') {
        gameState = STATE_HELP;
      } else if (e.key === 'ArrowUp' || keyLower === 'w') {
        menuIndex = (menuIndex - 1 + (hasSavedGame() ? 6 : 5)) % (hasSavedGame() ? 6 : 5);
      } else if (e.key === 'ArrowDown' || keyLower === 's') {
        menuIndex = (menuIndex + 1) % (hasSavedGame() ? 6 : 5);
      } else if (e.key === 'Enter' || e.key === ' ') {
        handleMenuSelect();
      }
    } else if (gameState === STATE_KEYBINDS) {
      if (e.key === 'Escape') gameState = STATE_MENU;
      else if (e.key === 'ArrowUp') menuIndex = (menuIndex - 1 + 10) % 10;
      else if (e.key === 'ArrowDown') menuIndex = (menuIndex + 1) % 10;
      else if (e.key === 'Enter') waitForKeybind = Object.keys(keybinds)[menuIndex];
    } else if (gameState === STATE_HELP) {
      if (keyLower === 'h' || e.key === 'F1' || e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
        gameState = STATE_MENU;
      }
    } else if (gameState === STATE_MODE_SELECT) {
      if (e.key === 'ArrowUp' || keyLower === 'w') {
        modeIndex = (modeIndex - 1 + MODES.length) % MODES.length;
      } else if (e.key === 'ArrowDown' || keyLower === 's') {
        modeIndex = (modeIndex + 1) % MODES.length;
      } else if (e.key === 'Enter' || e.key === ' ') {
        startNewGame(modeIndex);
      } else if (e.key === 'Escape' || e.key === 'Backspace') {
        gameState = STATE_MENU;
      }
    } else if (gameState === STATE_PLAYING) {
      if (keyLower === 'p' || e.key === 'Escape') {
        gameState = STATE_PAUSED;
        menuIndex = 0;
      } else if (keyLower === keybinds.timeStop) {
        useTimeStop();
      } else if (keyLower === keybinds.dash) {
        useTacticalDash();
      } else if (keyLower === keybinds.bomb || keyLower === 'x') {
        useSmartBomb();
      } else if (keyLower === keybinds.shield) {
        useHyperShield();
      }
    } else if (gameState === STATE_PAUSED) {
      if (e.key === 'ArrowUp' || keyLower === 'w') {
        menuIndex = (menuIndex - 1 + 4) % 4;
      } else if (e.key === 'ArrowDown' || keyLower === 's') {
        menuIndex = (menuIndex + 1) % 4;
      } else if (e.key === 'Enter' || e.key === ' ') {
        handlePauseSelect();
      } else if (keyLower === keybinds.pause || e.key === 'Escape') {
        gameState = STATE_PLAYING;
      }
    } else if (gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) {
      if (keyLower === 'e') exportCSV();
      else if (keyLower === 'j') exportStats();

    }

  // Touch / Pointer controls

    if (gameState === STATE_MENU) {
      let optCount = hasSavedGame() ? 6 : 5;

          handleMenuSelect();
          break;
        }
      }
    } else if (gameState === STATE_MODE_SELECT) {
      for (let i = 0; i < MODES.length; i++) {

        if (mx >= 40 && mx <= 280 && my >= btnY - 20 && my <= btnY + 25) {
          modeIndex = i;
          startNewGame(modeIndex);
          break;
        }
      }
    } else if (gameState === STATE_PAUSED) {
      for (let i = 0; i < 4; i++) {

          menuIndex = i;
          handlePauseSelect();
          break;
        }
      }
    } else if (gameState === STATE_LEADERBOARD || gameState === STATE_GAMEOVER || gameState === STATE_VICTORY || gameState === STATE_HELP) {
      gameState = STATE_MENU;
    } else if (gameState === STATE_PLAYING) {

      const my = (e.clientY - rect.top) * (H / rect.height);

      p.y = Math.max(0, Math.min(H - 20, my - 10));

  function handleMenuSelect() {
    let saved = hasSavedGame();
    let opts = ['NEW_GAME'];
    if (saved) opts.push('RESUME');
    opts.push('LEADERBOARD', 'MODE_SELECT', 'KEYBINDS', 'LOAD_REPLAY');
    let sel = opts[menuIndex];
    if (sel === 'NEW_GAME') startNewGame(0);
    else if (sel === 'RESUME') loadGameState();
    else if (sel === 'LEADERBOARD') gameState = STATE_LEADERBOARD;
    else if (sel === 'MODE_SELECT') gameState = STATE_MODE_SELECT;
    else if (sel === 'KEYBINDS') gameState = STATE_KEYBINDS;
    else if (sel === 'LOAD_REPLAY') loadReplay();
  }

  function handlePauseSelect() {
    if (menuIndex === 0) gameState = STATE_PLAYING;
    else if (menuIndex === 1) saveGameState();
    else if (menuIndex === 2) { if (!loadGameState()) alert("No saved game!"); }
    else if (menuIndex === 3) gameState = STATE_MENU;

  // --- SPAWNING SYSTEM & FORMATIONS ---
  function spawnEnemy() {
    if (boss) return;

    let t = Math.floor(randomFloat() * 100);
    let type, dx = 0;
    if (t < 25) type = 0;       // Scout Interceptor
    else if (t < 38) type = 1;  // Chaser Predator
    else if (t < 50) type = 2;  // Shooter Saucer
    else if (t < 60) type = 3;  // Armored Heavy
    else if (t < 70) { type = 4; dx = (randomFloat() < 0.5 ? 2.2 : -2.2); } // Zigzag
    else if (t < 78) type = 5;  // Small Asteroid
    else if (t < 85) { type = 6; dx = (randomFloat() < 0.5 ? 1.8 : -1.8); } // Frigate
    else if (t < 92) type = 7;  // Kamikaze Interceptor
    else type = 8;             // Stealth Cloak Fighter

    let hp = type === 9 ? 50 : (type === 8 ? 18 : (type === 7 ? 8 : (type === 6 ? 45 : (type === 5 ? 25 : (type === 3 ? 12 : (type === 2 ? 6 : (type === 4 ? 4 : 2)))))));

    enemies.push({ x: randomFloat() * (W - ew), y: -24, type: type, hp: hp, maxHp: hp, dx: dx, timer: 0, cloaked: false, isElite: false });

    if (boss) return;

    if (!boss || !boss.isMothership) return false;

  function destroyBoss() {
