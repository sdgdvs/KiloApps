<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KSpace - Deep Space Shooter</title>
<script>
window.addEventListener('load', () => {
    if (window.resizeTo) window.resizeTo(340, 520);
    if (window.parent) window.parent.postMessage({ type: 'OS_SET_WINDOW_SIZE', width: 340, height: 520 }, '*');
});
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #050512;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    color: #fff;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: calc(100vh * 320 / 480);
    max-height: calc(100vw * 480 / 320);
    aspect-ratio: 320 / 480;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
    border: 2px solid #1a237e;
    background: #000;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  .skill-bar {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    z-index: 10;
    width: 95%;
    justify-content: center;
  }
  .skill-btn {
    background: rgba(10, 25, 50, 0.85);
    border: 1px solid #00e5ff;
    color: #00e5ff;
    padding: 4px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    transition: all 0.15s ease;
  }
  .skill-btn:hover {
    background: #00e5ff;
    color: #000;
  }
  .skill-btn.cooldown {
    border-color: #555;
    color: #777;
    background: rgba(20, 20, 20, 0.8);
    cursor: not-allowed;
    box-shadow: none;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="320" height="480" tabindex="0" role="img" aria-label="KSpace space shooter game canvas"></canvas>
  <div class="skill-bar" id="skillBar" style="display:none;">
    <button class="skill-btn" id="btnTimeStop" onclick="useTimeStop()">[T] STOP</button>
    <button class="skill-btn" id="btnDash" onclick="useTacticalDash()">[D] DASH</button>
    <button class="skill-btn" id="btnBomb" onclick="useSmartBomb()">[B] BOMB</button>
    <button class="skill-btn" id="btnShield" onclick="useHyperShield()">[S] SHIELD</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const skillBar = document.getElementById('skillBar');
  const W = 320, H = 480;

  let initialSeed = 999;
  let seed = 999;
  function rnd() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed;
  }
  function randomFloat() { return (rnd() & 0xffffff) / 0x1000000; }


  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // --- GAME STATES ---
  const STATE_MENU = 0;
  const STATE_MODE_SELECT = 1;
  const STATE_PLAYING = 2;
  const STATE_PAUSED = 3;
  const STATE_LEADERBOARD = 4;
  const STATE_GAMEOVER = 5;
  const STATE_VICTORY = 6;
  const STATE_HELP = 7;

  const STATE_KEYBINDS = 8;
  const STATE_REPLAY = 9;

  let keybinds = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright', fire: ' ', timeStop: 't', dash: 'd', bomb: 'b', shield: 's', pause: 'p' };
  try { let kb = localStorage.getItem('kspace_keybinds'); if (kb) keybinds = JSON.parse(kb); } catch(e) {}

  let shotsFired = 0;
  let shotsHit = 0;
  let timeSurvivedFrames = 0;

  let isReplaying = false;
  let currentReplay = null;
  let replayIndex = 0;
  let lastReplaySaved = null;

  let waitForKeybind = null;

  function exportStats() {
    let acc = shotsFired > 0 ? ((shotsHit / shotsFired) * 100).toFixed(1) : 0;
    let data = { score, wave, mode: MODES[modeIndex].name, enemiesKilled, timeSurvivedSeconds: Math.floor(timeSurvivedFrames/60), shotsFired, shotsHit, accuracyPct: acc };
    let json = JSON.stringify(data, null, 2);
    let blob = new Blob([json], { type: 'application/json' });
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kspace_stats.json'; a.click();
  }
  function exportCSV() {
    let acc = shotsFired > 0 ? ((shotsHit / shotsFired) * 100).toFixed(1) : 0;
    let csv = `Score,Wave,Mode,EnemiesKilled,TimeSurvivedSec,ShotsFired,ShotsHit,AccuracyPct\n${score},${wave},${MODES[modeIndex].name},${enemiesKilled},${Math.floor(timeSurvivedFrames/60)},${shotsFired},${shotsHit},${acc}`;
    let blob = new Blob([csv], { type: 'text/csv' });
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kspace_stats.csv'; a.click();
  }
  function exportHighScores() {
    let blob = new Blob([JSON.stringify(leaderboard, null, 2)], { type: 'application/json' });
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kspace_highscores.json'; a.click();
  }
  function importHighScores() {
    let input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
      let file = e.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = ev => {
        try { let data = JSON.parse(ev.target.result); if(Array.isArray(data)) { leaderboard = data; saveLeaderboard(); alert('Imported!'); } } catch(err) { alert('Invalid JSON'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }
  function exportReplay() {
    if (!lastReplaySaved) { alert('No replay available!'); return; }
    let blob = new Blob([JSON.stringify(lastReplaySaved)], { type: 'application/json' });
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kspace_replay.json'; a.click();
  }
  function loadReplay() {
    let input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
      let file = e.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = ev => {
        try {
          let data = JSON.parse(ev.target.result);
          if (data && data.seed && data.frames) {
             lastReplaySaved = data;
             startReplay(data);
          } else { alert('Invalid replay'); }
        } catch(err) { alert('Invalid JSON'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }
  function startReplay(rep) {
    currentReplay = rep;
    replayIndex = 0;
    isReplaying = true;
    startNewGame(rep.modeIndex, rep.seed);
  }


  let gameState = STATE_MENU;
  let menuIndex = 0;
  let modeIndex = 0; // 0: Classic 20-Wave Campaign, 1: Endurance Wave, 2: Boss Rush

  // --- GAME MODES ---
  const MODES = [
    { name: 'Classic 20-Wave Campaign', desc: '20 Waves with Stage 20 Alien Mothership Boss' },
    { name: 'Endurance Wave Storm', desc: 'Relentless enemy storm, scaling speed & asteroids' },
    { name: 'Boss Rush Challenge', desc: 'Non-stop Boss encounters back-to-back' }
  ];

  // --- PLAYER ENTITY ---
  let p = {
    x: W / 2 - 10,
    y: H - 60,
    hp: 3,
    maxHp: 3,
    shield: false,
    bombs: 1,
    maxBombs: 3,
    weaponType: 0 // 0: Normal, 1: Spread, 2: Laser, 3: Plasma
  };

  // Timers & Active Skills Cooldowns
  let spreadTimer = 0;
  let laserTimer = 0;
  let rapidTimer = 0;
  let timeStopTimer = 0;
  let timeStopCooldown = 0;
  let dashCooldown = 0;
  let invincibleTimer = 0;
  let hyperShieldTimer = 0;
  let hyperShieldCooldown = 0;

  let score = 0;
  let highScore = 0;
  let totalKills = 0;
  let enemiesKilled = 0;
  let comboMultiplier = 1;
  let comboTimer = 0;
  let weaponLevel = 0;
  let wave = 1;
  let frameCount = 0;
  let bombFlash = 0;

  // Collections
  let bullets = [];
  let eBullets = [];
  let enemies = [];
  let stars = [];
  let explosions = [];
  let powerups = [];

  // Loop 2 Visual FX Collections
  let shockwaves = [];
  let debris = [];
  let shieldRipples = [];
  let muzzleFlashes = [];
  let thrusterParticles = [];

  let escort = { active: false, x: 0, y: 0, dy: 0, hp: 0, maxHp: 0 };
  let pathGatesActive = false;
  let pathGatesY = 0;

  // Deep Space Shifting Nebulae
  let nebulae = [
    { x: W * 0.25, y: H * 0.3, r: 100, col1: 'rgba(75, 0, 130, 0.28)', col2: 'rgba(0, 229, 255, 0)', vx: 0.12, vy: 0.2, phase: 0 },
    { x: W * 0.75, y: H * 0.7, r: 120, col1: 'rgba(139, 0, 139, 0.25)', col2: 'rgba(255, 23, 68, 0)', vx: -0.09, vy: 0.15, phase: 1.5 },
    { x: W * 0.45, y: H * 0.1, r: 85, col1: 'rgba(0, 80, 180, 0.22)', col2: 'rgba(0, 0, 0, 0)', vx: 0.07, vy: 0.25, phase: 3.0 }
  ];

  // Loop 3: Distant Planets and Comets
  let planets = [
    { x: W * 0.8, y: H * 0.2, r: 40, col: '#004d40', ringCol: 'rgba(0, 255, 128, 0.4)', rot: 0, vx: -0.02, vy: 0.05, type: 'ringed' },
    { x: W * 0.1, y: H * 0.7, r: 25, col: '#b71c1c', ringCol: null, rot: 0, vx: 0.01, vy: 0.03, type: 'cratered' }
  ];
  let comets = [];

  // Init 3-Layer Parallax Starfield
  for (let i = 0; i < 75; i++) {
    let layer = randomFloat() < 0.5 ? 0 : (randomFloat() < 0.8 ? 1 : 2);
    stars.push({
      x: randomFloat() * W,
      y: randomFloat() * H,
      layer: layer,
      speed: layer === 0 ? 0.4 : (layer === 1 ? 1.2 : 2.5),
      size: layer === 0 ? 1 : (layer === 1 ? 1.5 : 2),
      alpha: 0.3 + randomFloat() * 0.7
    });
  }

  // Local Storage Persistence
  try { highScore = parseInt(localStorage.getItem('kspace_highscore') || '0', 10) || 0; } catch (e) {}
  try { totalKills = parseInt(localStorage.getItem('kspace_totalkills') || '0', 10) || 0; } catch (e) {}

  let leaderboard = [];
  function loadLeaderboard() {
    try {
      let data = localStorage.getItem('kspace_leaderboard');
      if (data) {
        leaderboard = JSON.parse(data);
      } else {
        leaderboard = [
          { score: 12000, wave: 20, mode: 'Classic 20-Wave Campaign' },
          { score: 8500, wave: 15, mode: 'Classic 20-Wave Campaign' },
          { score: 5000, wave: 10, mode: 'Endurance Wave Storm' },
          { score: 3500, wave: 7, mode: 'Boss Rush Challenge' },
          { score: 1500, wave: 4, mode: 'Classic 20-Wave Campaign' }
        ];
      }
    } catch (e) {
      leaderboard = [];
    }
  }
  loadLeaderboard();

  function saveLeaderboard() {
    try {
      localStorage.setItem('kspace_leaderboard', JSON.stringify(leaderboard));
    } catch (e) {}
  }

  function addScoreToLeaderboard(newScore, newWave, modeName) {
    leaderboard.push({ score: newScore, wave: newWave, mode: modeName });
    leaderboard.sort((a, b) => b.score - a.score);
    if (leaderboard.length > 5) leaderboard = leaderboard.slice(0, 5);
    saveLeaderboard();
  }

  function hasSavedGame() {
    try { return localStorage.getItem('kspace_save') !== null; } catch (e) { return false; }
  }

  function saveGameState() {
    let saveObj = {
      p: p,
      score: score,
      wave: wave,
      modeIndex: modeIndex,
      enemiesKilled: enemiesKilled,
      spreadTimer: spreadTimer,
      laserTimer: laserTimer,
      rapidTimer: rapidTimer,
      timeStopTimer: timeStopTimer,
      timeStopCooldown: timeStopCooldown,
      dashCooldown: dashCooldown,
      invincibleTimer: invincibleTimer,
      hyperShieldTimer: hyperShieldTimer,
      hyperShieldCooldown: hyperShieldCooldown,
      boss: boss
    };
    try {
      localStorage.setItem('kspace_save', JSON.stringify(saveObj));
      playSound(2);
    } catch (e) {}
  }

  function loadGameState() {
    try {
      let str = localStorage.getItem('kspace_save');
      if (!str) return false;
      let saveObj = JSON.parse(str);
      p = saveObj.p;
      score = saveObj.score;
      wave = saveObj.wave;
      modeIndex = saveObj.modeIndex;
      enemiesKilled = saveObj.enemiesKilled;
      spreadTimer = saveObj.spreadTimer || 0;
      laserTimer = saveObj.laserTimer || 0;
      rapidTimer = saveObj.rapidTimer || 0;
      timeStopTimer = saveObj.timeStopTimer || 0;
      timeStopCooldown = saveObj.timeStopCooldown || 0;
      dashCooldown = saveObj.dashCooldown || 0;
      invincibleTimer = saveObj.invincibleTimer || 0;
      hyperShieldTimer = saveObj.hyperShieldTimer || 0;
      hyperShieldCooldown = saveObj.hyperShieldCooldown || 0;
      boss = saveObj.boss || null;

      bullets = [];
      eBullets = [];
      enemies = [];
      powerups = [];
      explosions = [];
      gameState = STATE_PLAYING;
      playSound(3);
      return true;
    } catch (e) {
      return false;
    }
  }

  function clearSavedGame() {
    try { localStorage.removeItem('kspace_save'); } catch (e) {}
  }

  // --- AUDIO SYNTHESIZER ---
  let audioCtx;
  function playSound(type) {
    try {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      let t = audioCtx.currentTime;

      if (type === 0) { // Shoot
        osc.type = 'square';
        osc.frequency.setValueAtTime(900, t);
        osc.frequency.exponentialRampToValueAtTime(300, t + 0.08);
        gain.gain.setValueAtTime(0.06, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
        osc.start(t); osc.stop(t + 0.08);
      } else if (type === 1) { // Explosion
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
        osc.start(t); osc.stop(t + 0.25);
      } else if (type === 2) { // Powerup / Skill
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.setValueAtTime(780, t + 0.08);
        osc.frequency.setValueAtTime(1040, t + 0.16);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.24);
        osc.start(t); osc.stop(t + 0.24);
      } else if (type === 3) { // Wave Clear / Stasis
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, t);
        osc.frequency.setValueAtTime(550, t + 0.1);
        osc.frequency.setValueAtTime(750, t + 0.2);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.35);
        osc.start(t); osc.stop(t + 0.35);
      } else if (type === 4) { // Smart Bomb
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.5);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
        osc.start(t); osc.stop(t + 0.5);
      } else if (type === 5) { // Laser
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, t);
        osc.frequency.linearRampToValueAtTime(800, t + 0.05);
        gain.gain.setValueAtTime(0.04, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.05);
        osc.start(t); osc.stop(t + 0.05);
      } else if (type === 6) { // Victory Fanfare
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.setValueAtTime(554, t + 0.12);
        osc.frequency.setValueAtTime(659, t + 0.24);
        osc.frequency.setValueAtTime(880, t + 0.36);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.6);
        osc.start(t); osc.stop(t + 0.6);
      }
    } catch (e) {}
  }

  // --- PARTICLES, SHOCKWAVES & DEBRIS (Loop 2) ---
  function addShockwave(x, y, maxR = 35, color = '#00e5ff', speed = 2.2) {
    shockwaves.push({ x: x, y: y, r: 4, maxR: maxR, color: color, alpha: 1.0, speed: speed });
  }

  function addDebrisChunk(x, y, count = 6, color = '#ff9100') {
    for (let i = 0; i < count; i++) {
      let angle = randomFloat() * Math.PI * 2;
      let spd = 1.0 + randomFloat() * 3.5;
      debris.push({
        x: x, y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        rot: randomFloat() * Math.PI * 2,
        vrot: (randomFloat() - 0.5) * 0.3,
        size: 3 + randomFloat() * 5,
        color: color,
        life: 1.0,
        decay: 0.02 + randomFloat() * 0.03
      });
    }
  }

  function addShieldRipple(x, y, color = '#00e5ff') {
    shieldRipples.push({ x: x, y: y, r: 6, maxR: 28, color: color, alpha: 1.0 });
  }

  function addMuzzleFlash(x, y, color = '#00e5ff', size = 6) {
    muzzleFlashes.push({ x: x, y: y, size: size, life: 3, maxLife: 3, color: color });
  }

  function addExplosion(x, y, count = 14, color = null) {
    for (let i = 0; i < count; i++) {
      let angle = randomFloat() * Math.PI * 2;
      let speed = 0.8 + randomFloat() * 4.0;
      explosions.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        decay: 0.025 + randomFloat() * 0.04,
        size: 2 + randomFloat() * 3.5,
        color: color || (randomFloat() < 0.5 ? '#ff4500' : (randomFloat() < 0.5 ? '#ffa500' : '#ffff00'))
      });
    }
    if (count >= 10) {
      addShockwave(x, y, count * 2.2, color || '#ff5722');
      addDebrisChunk(x, y, Math.min(12, Math.floor(count / 2)), color || '#ff9800');
    }
  }

  function updateExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
      let ex = explosions[i];
      ex.x += ex.vx;
      ex.y += ex.vy;
      ex.life -= ex.decay;
      if (ex.life <= 0) explosions.splice(i, 1);
    }
  }

  function drawExplosions() {
    for (let ex of explosions) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ex.life);
      ctx.fillStyle = ex.color;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.size * ex.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // --- ACTIVE SKILLS FUNCTIONS ---
  function useTimeStop() { if(!isReplaying && currentReplay && currentReplay.frames.length) currentReplay.frames[currentReplay.frames.length-1].t = 1;
    if (gameState !== STATE_PLAYING) return;
    if (timeStopCooldown <= 0 || timeStopTimer > 0) {
      timeStopTimer = 375; // 6 seconds
      timeStopCooldown = 600; // 10 seconds CD
      playSound(3);
      addExplosion(W / 2, H / 2, 40, '#00e5ff');
    }
  }

  function useTacticalDash() { if(!isReplaying && currentReplay && currentReplay.frames.length) currentReplay.frames[currentReplay.frames.length-1].d = 1;
    if (gameState !== STATE_PLAYING) return;
    if (dashCooldown <= 0) {
      addExplosion(p.x + 10, p.y + 10, 25, '#00b0ff');
      p.x = W / 2 - 10;
      p.y = H - 60;
      invincibleTimer = 125; // 2 seconds invincibility
      dashCooldown = 300; // 5 seconds CD
      playSound(2);
      addExplosion(p.x + 10, p.y + 10, 25, '#00e5ff');
    }
  }

  function useSmartBomb() { if(!isReplaying && currentReplay && currentReplay.frames.length) currentReplay.frames[currentReplay.frames.length-1].b = 1;
    if (p.bombs <= 0 || gameState !== STATE_PLAYING) return;
    p.bombs--;
    bombFlash = 15;
    playSound(4);
    addExplosion(W / 2, H / 2, 50, '#ffffff');

    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.hp -= 100;
      if (e.hp <= 0) {
        comboTimer = 180;
        if (comboMultiplier < 10) comboMultiplier++;
        score += 30 * comboMultiplier;
        enemiesKilled++;
        totalKills++;
        addExplosion(e.x + 10, e.y + 10, 16, '#00e5ff');
        enemies.splice(i, 1);
      }
    }
    eBullets = [];

    if (boss) {
      if (boss.isMothership) {
        for (let t of boss.turrets) {
          if (t.active) {
            t.hp -= 60;
            if (t.hp <= 0) t.active = false;
          }
        }
        if (!isMothershipShieldActive()) boss.hp -= 80;
      } else {
        boss.hp -= 80;
      }
      addExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, 35, '#ff1744');
      if (boss.hp <= 0) destroyBoss();
    }
    try { localStorage.setItem('kspace_totalkills', totalKills); } catch (e) {}
  }

  function useHyperShield() { if(!isReplaying && currentReplay && currentReplay.frames.length) currentReplay.frames[currentReplay.frames.length-1].s = 1;
    if (gameState !== STATE_PLAYING) return;
    if (hyperShieldCooldown <= 0 || hyperShieldTimer === 0) {
      hyperShieldTimer = 500; // 8 seconds energy barrier
      hyperShieldCooldown = 750; // 12.5 seconds CD
      playSound(2);
      addExplosion(p.x + 10, p.y + 10, 25, '#ffea00');
    }
  }

  // --- KEYBOARD & INPUT ---
  const keys = {};
  document.addEventListener('keydown', e => {
    if (!waitForKeybind && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar', 'KeyB', 'KeyP', 'Escape', 'KeyH'].includes(e.code) || [' ', 'b', 'B', 'p', 'P', 't', 'T', 'd', 'D', 's', 'S', 'h', 'H'].includes(e.key)) {
      e.preventDefault();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    
    if (waitForKeybind) {
      keybinds[waitForKeybind] = e.key.toLowerCase();
      localStorage.setItem('kspace_keybinds', JSON.stringify(keybinds));
      waitForKeybind = null;
      return;
    }
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;


    if (gameState === STATE_MENU) {
      if (e.key === 'h' || e.key === 'H') {
        gameState = STATE_HELP;
      } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        menuIndex = (menuIndex - 1 + (hasSavedGame() ? 6 : 5)) % (hasSavedGame() ? 6 : 5);
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        menuIndex = (menuIndex + 1) % (hasSavedGame() ? 6 : 5);
      } else if (e.key === 'Enter' || e.key === ' ') {
        handleMenuSelect();
      }
    } else if (gameState === STATE_KEYBINDS) {
      if (e.key === 'Escape') gameState = STATE_MENU;
      else if (e.key === 'ArrowUp') menuIndex = (menuIndex - 1 + 10) % 10;
      else if (e.key === 'ArrowDown') menuIndex = (menuIndex + 1) % 10;
      else if (e.key === 'Enter') waitForKeybind = Object.keys(keybinds)[menuIndex];
    } else if (gameState === STATE_HELP) {
      if (e.key === 'h' || e.key === 'H' || e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
        gameState = STATE_MENU;
      }
    } else if (gameState === STATE_MODE_SELECT) {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        modeIndex = (modeIndex - 1 + MODES.length) % MODES.length;
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        modeIndex = (modeIndex + 1) % MODES.length;
      } else if (e.key === 'Enter' || e.key === ' ') {
        startNewGame(modeIndex);
      } else if (e.key === 'Escape' || e.key === 'Backspace') {
        gameState = STATE_MENU;
      }
    } else if (gameState === STATE_PLAYING) {
      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        gameState = STATE_PAUSED;
        menuIndex = 0;
      } else if (e.key.toLowerCase() === keybinds.timeStop) {
        useTimeStop();
      } else if (e.key.toLowerCase() === keybinds.dash) {
        useTacticalDash();
      } else if (e.key.toLowerCase() === keybinds.bomb || e.key.toLowerCase() === 'x') {
        useSmartBomb();
      } else if (e.key.toLowerCase() === keybinds.shield) {
        useHyperShield();
      }
    } else if (gameState === STATE_PAUSED) {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        menuIndex = (menuIndex - 1 + 4) % 4;
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        menuIndex = (menuIndex + 1) % 4;
      } else if (e.key === 'Enter' || e.key === ' ') {
        handlePauseSelect();
      } else if (e.key.toLowerCase() === keybinds.pause || e.key === 'Escape') {
        gameState = STATE_PLAYING;
      }
    
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'e') { exportCSV(); 
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'j') { exportStats();
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'r') { exportReplay();

      } else if (gameState === STATE_LEADERBOARD || gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
        gameState = STATE_MENU;
      
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'e') { exportCSV(); 
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'j') { exportStats();
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'r') { exportReplay();

      } else if (gameState === STATE_LEADERBOARD && e.key.toLowerCase() === 'e') { exportHighScores(); 
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'e') { exportCSV(); 
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'j') { exportStats();
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'r') { exportReplay();

      } else if (gameState === STATE_LEADERBOARD && e.key.toLowerCase() === 'i') { importHighScores(); }
    }
  });

  document.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    keys[e.code] = false;
  });

  // Touch / Pointer controls
  canvas.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);

    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    if (gameState === STATE_MENU) {
      let optCount = hasSavedGame() ? 6 : 5;
      for (let i = 0; i < optCount; i++) {
        let btnY = 170 + i * 40;
        if (mx >= 50 && mx <= 270 && my >= btnY - 15 && my <= btnY + 15) {
          menuIndex = i;
          handleMenuSelect();
          break;
        }
      }
    } else if (gameState === STATE_MODE_SELECT) {
      for (let i = 0; i < MODES.length; i++) {
        let btnY = 200 + i * 55;
        if (mx >= 40 && mx <= 280 && my >= btnY - 20 && my <= btnY + 25) {
          modeIndex = i;
          startNewGame(modeIndex);
          break;
        }
      }
    } else if (gameState === STATE_PAUSED) {
      for (let i = 0; i < 4; i++) {
        let btnY = 200 + i * 40;
        if (mx >= 50 && mx <= 270 && my >= btnY - 15 && my <= btnY + 15) {
          menuIndex = i;
          handlePauseSelect();
          break;
        }
      }
    
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'e') { exportCSV(); 
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'j') { exportStats();
      } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) && e.key.toLowerCase() === 'r') { exportReplay();

      } else if (gameState === STATE_LEADERBOARD || gameState === STATE_GAMEOVER || gameState === STATE_VICTORY || gameState === STATE_HELP) {
      gameState = STATE_MENU;
    } else if (gameState === STATE_PLAYING) {
      if (mx > W - 40 && my < 40) {
        gameState = STATE_PAUSED;
        menuIndex = 0;
      }
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (gameState === STATE_PLAYING && e.buttons === 1) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);
      const my = (e.clientY - rect.top) * (H / rect.height);
      p.x = Math.max(0, Math.min(W - 20, mx - 10));
      p.y = Math.max(0, Math.min(H - 20, my - 10));
    }
  });

  function handleMenuSelect() {
    let saved = hasSavedGame();
    let opts = ['MODE_SELECT'];
    if (saved) opts.push('RESUME');
    opts.push('LEADERBOARD', 'MODE_SELECT', 'KEYBINDS', 'LOAD_REPLAY');
    let sel = opts[menuIndex];
    if (sel === 'MODE_SELECT') gameState = STATE_MODE_SELECT;
    else if (sel === 'RESUME') loadGameState();
    else if (sel === 'LEADERBOARD') gameState = STATE_LEADERBOARD;
    else if (sel === 'KEYBINDS') gameState = STATE_KEYBINDS;
    else if (sel === 'LOAD_REPLAY') loadReplay();
  }

  function handlePauseSelect() {
    if (menuIndex === 0) gameState = STATE_PLAYING;
    else if (menuIndex === 1) saveGameState();
    else if (menuIndex === 2) { if (!loadGameState()) alert("No saved game!"); }
    else if (menuIndex === 3) gameState = STATE_MENU;
  }

  function startNewGame(modeIdx, forceSeed = null) {
    
    modeIndex = modeIdx;
    shotsFired = 0; shotsHit = 0; timeSurvivedFrames = 0;
    if (forceSeed !== null) { seed = forceSeed; } else { initialSeed = Math.floor(randomFloat()*2000000000); seed = initialSeed; isReplaying = false; }
    if (!isReplaying) { currentReplay = { seed: initialSeed, modeIndex: modeIdx, frames: [] }; }

    p = {
      x: W / 2 - 10, y: H - 60,
      hp: 3, maxHp: 3,
      shield: false, bombs: 1, maxBombs: 3, weaponType: 0
    };
    weaponLevel = 0;
    score = 0; wave = 1; enemiesKilled = 0;
    comboMultiplier = 1; comboTimer = 0;
    spreadTimer = 0; laserTimer = 0; rapidTimer = 0;
    timeStopTimer = 0; timeStopCooldown = 0;
    dashCooldown = 0; invincibleTimer = 0;
    hyperShieldTimer = 0; hyperShieldCooldown = 0;
    bullets = []; eBullets = []; enemies = []; powerups = []; explosions = [];
    boss = null;
    escort.active = false; pathGatesActive = false;
    gameState = STATE_PLAYING;
    playSound(3);

    if (modeIndex === 2) spawnBoss(1);
  }

  // --- SPAWNING SYSTEM & FORMATIONS ---
  function spawnEnemy() {
    if (boss) return;

    let t = Math.floor(randomFloat() * 100);
    let type, dx = 0;
    if (t < 25) type = 0;       // Scout Interceptor
    else if (t < 38) type = 1;  // Chaser Predator
    else if (t < 50) type = 2;  // Shooter Saucer
    else if (t < 60) type = 3;  // Armored Heavy
    else if (t < 70) { type = 4; dx = (randomFloat() < 0.5 ? 2.2 : -2.2); } // Zigzag
    else if (t < 78) type = 5;  // Small Asteroid
    else if (t < 85) { type = 6; dx = (randomFloat() < 0.5 ? 1.8 : -1.8); } // Frigate
    else if (t < 92) type = 7;  // Kamikaze Interceptor
    else type = 8;             // Stealth Cloak Fighter

    let hp = type === 9 ? 50 : (type === 8 ? 18 : (type === 7 ? 8 : (type === 6 ? 45 : (type === 5 ? 25 : (type === 3 ? 12 : (type === 2 ? 6 : (type === 4 ? 4 : 2)))))));
    let ew = (type === 6 || type === 9) ? 36 : 20;
    enemies.push({ x: randomFloat() * (W - ew), y: -24, type: type, hp: hp, maxHp: hp, dx: dx, timer: 0, cloaked: false });
  }

  function spawnFormation(type) {
    if (boss) return;
    let startX = 40;
    for (let k = 0; k < 5; k++) {
      let x, y, dx, hp = type === 7 ? 8 : (type === 8 ? 18 : (type === 9 ? 6 : 5));
      if (type === 9) {
        x = W / 2 - 10 + (k - 2) * 35;
        y = -20 - Math.abs(k - 2) * 25;
        dx = 0;
      } else {
        x = Math.min(W - 30, startX + k * 48);
        y = -20 - (k % 3) * 20;
        dx = k % 2 === 0 ? 1.5 : -1.5;
      }
      enemies.push({ x: x, y: y, type: type === 9 ? 2 : type, hp: hp, maxHp: hp, dx: dx, dy: 2.0, timer: 0, cloaked: false });
    }
  }

  function isMothershipShieldActive() {
    if (!boss || !boss.isMothership) return false;
    return boss.turrets.some(t => t.active);
  }

  function spawnBoss(bossLevel = 1) {
    let isMother = (wave >= 20 || bossLevel >= 4);
    let hp = isMother ? 600 : (140 + bossLevel * 90);
    boss = {
      x: W / 2 - (isMother ? 45 : 30),
      y: -70,
      targetY: 45,
      w: isMother ? 90 : 60,
      h: isMother ? 60 : 50,
      hp: hp,
      maxHp: hp,
      level: bossLevel,
      isMothership: isMother,
      turrets: isMother ? [
        { hp: 80, active: true },
        { hp: 80, active: true },
        { hp: 80, active: true },
        { hp: 80, active: true }
      ] : [],
      dx: 2.0,
      attackTimer: 0,
      phase: 1
    };
    playSound(4);
  }

  function destroyBoss() {
    comboTimer = 180;
    if (comboMultiplier < 10) comboMultiplier++;
    let baseScore = boss.isMothership ? 10000 : (1200 * boss.level);
    score += baseScore * comboMultiplier;
    enemiesKilled += 10;
    totalKills += 10;
    addExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, 60, '#ff1744');
    playSound(1);

    // Drop Powerups
    powerups.push({ x: boss.x + 15, y: boss.y + 20, dy: 1.5, type: Math.floor(randomFloat() * 9) });
    powerups.push({ x: boss.x + 45, y: boss.y + 20, dy: 1.5, type: Math.floor(randomFloat() * 9) });

    if (boss.isMothership || wave >= 20) {
      boss = null;
      gameState = STATE_VICTORY;
      playSound(6);
      addScoreToLeaderboard(score, wave, MODES[modeIndex].name);
    if(!isReplaying) lastReplaySaved = currentReplay;
      clearSavedGame();
      return;
    }

    boss = null;
    wave++;
    playSound(3);

    if (modeIndex === 2) {
      setTimeout(() => { if (gameState === STATE_PLAYING) spawnBoss(wave); }, 2500);
    } else {
      pathGatesActive = true;
      pathGatesY = -50;
    }
  }

  // --- SHOOTING LOGIC ---
  function shoot() {
    shotsFired++;
    playSound(laserTimer > 0 ? 5 : 0);
    if (laserTimer > 0) return;

    if (spreadTimer > 0 || p.weaponType === 1) {
      let maxB = 3 + weaponLevel * 2;
      let dxs = [0, -2.5, 2.5, -1.25, 1.25, -3.75, 3.75];
      let dys = [-9, -8, -8, -8.5, -8.5, -7, -7];
      for (let i = 0; i < maxB; i++) {
        bullets.push({ x: p.x + 8, y: p.y, dx: dxs[i], dy: dys[i], type: 0 });
      }
      addMuzzleFlash(p.x + 10, p.y - 2, '#00e5ff', 8);
    } else if (p.weaponType === 3) {
      let maxB = 1 + weaponLevel;
      let dxs = [0, -2, 2];
      for (let i = 0; i < maxB; i++) {
        bullets.push({ x: p.x + 6, y: p.y, dx: dxs[i], dy: -5, type: 1 });
      }
      addMuzzleFlash(p.x + 10, p.y - 2, '#d500f9', 10);
    } else {
      let maxB = 2 + weaponLevel;
      let offsets = [3, 13, 8, 8];
      let dys = [-8, -8, -9, -7];
      let dxs = [0, 0, 0, 0];
      if (weaponLevel === 2) { dxs[2] = -1.5; dxs[3] = 1.5; }
      for (let i = 0; i < maxB; i++) {
        bullets.push({ x: p.x + offsets[i], y: p.y, dx: dxs[i], dy: dys[i], type: 0 });
      }
      addMuzzleFlash(p.x + 4, p.y, '#00e5ff', 5);
      addMuzzleFlash(p.x + 14, p.y, '#00e5ff', 5);
    }
  }

  // --- UPDATE GAME LOOP ---
  
  function update() {
    if (gameState !== STATE_PLAYING) {
      skillBar.style.display = 'none';
      return;
    }
    timeSurvivedFrames++;

    if (isReplaying && currentReplay) {
      if (replayIndex < currentReplay.frames.length) {
        let fData = currentReplay.frames[replayIndex++];
        p.x = fData.x; p.y = fData.y;
        if (fData.f) shoot();
        if (fData.b) useSmartBomb();
        if (fData.d) useTacticalDash();
        if (fData.t) useTimeStop();
        if (fData.s) useHyperShield();
      } else {
         gameState = STATE_GAMEOVER; // end of replay
      }
    } else {
      // Record
      let isFire = (keys[keybinds.fire] || keys['enter'] || keys['spacebar'] || keys[' ']);
      let fireRate = (rapidTimer > 0) ? 3 : 7;
      let willFire = (isFire && frameCount % fireRate === 0);
      
      const speed = (keys['shift'] || keys['ShiftLeft']) ? 7 : 4.5;
      if (keys[keybinds.left]) p.x -= speed;
      if (keys[keybinds.right]) p.x += speed;
      if (keys[keybinds.up]) p.y -= speed;
      if (keys[keybinds.down]) p.y += speed;
      p.x = Math.max(0, Math.min(W - 20, p.x));
      p.y = Math.max(0, Math.min(H - 20, p.y));

      currentReplay.frames.push({ x: parseFloat(p.x.toFixed(1)), y: parseFloat(p.y.toFixed(1)), f: willFire ? 1 : 0 });

      if (willFire) { shoot(); }
    }

    skillBar.style.display = 'flex';
    updateSkillButtonsUI();

    if (bombFlash > 0) bombFlash--;
    if (comboTimer > 0) {
      comboTimer--;
      if (comboTimer === 0) comboMultiplier = 1;
    }

    // 20-Wave Campaign Progression
    if (modeIndex === 0) {
      let targetWave = Math.min(20, 1 + Math.floor(score / 650));
      if (targetWave > wave) {
        wave = targetWave;
        playSound(3);
        if (wave === 5 && !boss) spawnBoss(1);
        else if (wave === 10 && !boss) spawnBoss(2);
        else if (wave === 15 && !boss) spawnBoss(3);
        else if (wave === 20 && !boss) spawnBoss(4); // Stage 20 Alien Mothership Boss
        else if (wave % 4 === 0) spawnFormation(randomFloat() < 0.33 ? 9 : (randomFloat() < 0.5 ? 7 : 8));
      }
    } else if (modeIndex === 1) {
      wave = 1 + Math.floor(score / 600);
    }

    // Scroll Starfield
    for (let s of stars) {
      s.y += s.speed * (modeIndex === 1 ? 1.5 : 1.0);
      if (s.y > H) {
        s.y = 0;
        s.x = randomFloat() * W;
      }
    }

    if (pathGatesActive) {
      pathGatesY += 1.0;
      if (pathGatesY > H + 50) pathGatesActive = false;
      if (p.x < W/4 + 20 && p.x + 20 > W/4 - 20 && p.y < pathGatesY + 20 && p.y + 20 > pathGatesY - 20) {
        pathGatesActive = false; wave += 1; score += 2000; playSound(2);
      } else if (p.x < 3*W/4 + 20 && p.x + 20 > 3*W/4 - 20 && p.y < pathGatesY + 20 && p.y + 20 > pathGatesY - 20) {
        pathGatesActive = false; p.hp = p.maxHp; playSound(2);
      }
    }

    if (frameCount % 600 === 0 && !escort.active && !boss && wave % 2 === 0) {
      escort.active = true; escort.x = W / 2 - 15; escort.y = -30; escort.dy = 0.5;
      escort.maxHp = 20; escort.hp = 20;
    }

    if (escort.active) {
      escort.y += escort.dy;
      for (let i = eBullets.length - 1; i >= 0; i--) {
        let eb = eBullets[i];
        if (eb.x >= escort.x && eb.x <= escort.x + 30 && eb.y >= escort.y && eb.y <= escort.y + 30) {
          eBullets.splice(i, 1); escort.hp--; addExplosion(eb.x, eb.y, 3, '#ffea00');
        }
      }
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        if (e.x + 20 >= escort.x && e.x <= escort.x + 30 && e.y + 20 >= escort.y && e.y <= escort.y + 30) {
          enemies.splice(i, 1); escort.hp -= 5; addExplosion(e.x + 10, e.y + 10, 10, '#ff9800');
        }
      }
      if (escort.hp <= 0) {
        escort.active = false; addExplosion(escort.x + 15, escort.y + 15, 30, '#ff1744');
      } else if (escort.y > H) {
        escort.active = false; score += 5000 * comboMultiplier; playSound(6);
      }
    }

    updateExplosions();

    // Movement
    

    // Timers
    if (spreadTimer > 0) spreadTimer--;
    if (laserTimer > 0) laserTimer--;
    if (rapidTimer > 0) rapidTimer--;
    if (timeStopTimer > 0) timeStopTimer--;
    if (timeStopCooldown > 0) timeStopCooldown--;
    if (hyperShieldTimer > 0) hyperShieldTimer--;
    if (hyperShieldCooldown > 0) hyperShieldCooldown--;
    if (dashCooldown > 0) dashCooldown--;
    if (invincibleTimer > 0) invincibleTimer--;

    // Bullets Update
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.y += b.dy;
      b.x += b.dx;
      if (b.y < -10 || b.x < -10 || b.x > W + 10) bullets.splice(i, 1);
    }

    // Boss & Alien Mothership Logic
    if (boss) {
      if (boss.y < boss.targetY) boss.y += 1;
      else {
        boss.x += boss.dx;
        if (boss.x < 10 || boss.x > W - boss.w - 10) boss.dx = -boss.dx;
      }

      boss.attackTimer++;
      if (timeStopTimer === 0 && boss.attackTimer % (boss.isMothership ? 35 : 45) === 0) {
        if (boss.isMothership) {
          let tOffsets = [5, 25, 65, 85];
          for (let tIdx = 0; tIdx < 4; tIdx++) {
            if (boss.turrets[tIdx] && boss.turrets[tIdx].active) {
              eBullets.push({ x: boss.x + tOffsets[tIdx], y: boss.y + 35, dx: (tIdx === 0 ? -1.5 : (tIdx === 3 ? 1.5 : 0)), dy: 3.5 });
            }
          }
          if (!isMothershipShieldActive() && (boss.attackTimer % 50 === 0)) {
            for (let a = -2; a <= 2; a++) {
              eBullets.push({ x: boss.x + 45, y: boss.y + 45, dx: a * 1.5, dy: 3.8 });
            }
          }
        } else {
          eBullets.push({ x: boss.x + 10, y: boss.y + boss.h, dx: -1.5, dy: 3.5 });
          eBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h, dx: 0, dy: 4 });
          eBullets.push({ x: boss.x + boss.w - 10, y: boss.y + boss.h, dx: 1.5, dy: 3.5 });
        }
      }

      // Laser Beam vs Boss
      if (laserTimer > 0) {
        if (p.x + 10 >= boss.x && p.x + 10 <= boss.x + boss.w) {
          if (!isMothershipShieldActive()) {
            boss.hp -= 0.8;
            addExplosion(p.x + 10, boss.y + boss.h, 2, '#00e5ff');
            if (boss.hp <= 0) {
              if (boss.phase === 1) {
                boss.phase = 2; boss.maxHp *= 1.5; boss.hp = boss.maxHp;
                boss.dx = boss.dx > 0 ? boss.dx + 0.5 : boss.dx - 0.5;
                addExplosion(boss.x + boss.w/2, boss.y + boss.h/2, 40, '#ffea00');
              } else destroyBoss();
            }
          }
        }
      }

      // Bullets vs Boss & Turrets
      for (let j = bullets.length - 1; j >= 0; j--) {
        let b = bullets[j];
        if (boss.isMothership) {
          let tOffsetsX = [5, 25, 65, 85];
          let hitTurret = false;
          for (let tIdx = 0; tIdx < 4; tIdx++) {
            if (boss.turrets[tIdx] && boss.turrets[tIdx].active) {
              let tx = boss.x + tOffsetsX[tIdx];
              let ty = boss.y + 25;
              if (b.x >= tx - 6 && b.x <= tx + 18 && b.y >= ty - 6 && b.y <= ty + 18) {
                bullets.splice(j, 1);
                shotsHit++; boss.turrets[tIdx].hp -= (b.type === 1 ? 12 : 3);
                addExplosion(b.x, b.y, 4, '#ff9100');
                if (boss.turrets[tIdx].hp <= 0) {
                  boss.turrets[tIdx].active = false;
                  addExplosion(tx, ty, 20, '#ff1744');
                }
                hitTurret = true;
                break;
              }
            }
          }
          if (!hitTurret && b.x >= boss.x && b.x <= boss.x + boss.w && b.y >= boss.y && b.y <= boss.y + boss.h) {
            bullets.splice(j, 1);
            if (isMothershipShieldActive()) {
              addExplosion(b.x, b.y, 3, '#00e5ff');
            } else {
              shotsHit++; boss.hp -= (b.type === 1 ? 8 : 2);
              addExplosion(b.x, b.y, 4, '#ff1744');
              if (boss.hp <= 0) {
                if (boss.phase === 1) {
                  boss.phase = 2; boss.maxHp *= 1.5; boss.hp = boss.maxHp;
                  boss.dx = boss.dx > 0 ? boss.dx + 0.5 : boss.dx - 0.5;
                  addExplosion(boss.x + boss.w/2, boss.y + boss.h/2, 40, '#ffea00');
                  break;
                } else { destroyBoss(); break; }
              }
            }
          }
        } else {
          if (b.x >= boss.x && b.x <= boss.x + boss.w && b.y >= boss.y && b.y <= boss.y + boss.h) {
            shotsHit++; boss.hp -= (b.type === 1 ? 8 : 2);
            addExplosion(b.x, b.y, 3, '#00e5ff');
            bullets.splice(j, 1);
            if (boss.hp <= 0) {
              if (boss.phase === 1) {
                boss.phase = 2; boss.maxHp *= 1.5; boss.hp = boss.maxHp;
                boss.dx = boss.dx > 0 ? boss.dx + 0.5 : boss.dx - 0.5;
                addExplosion(boss.x + boss.w/2, boss.y + boss.h/2, 40, '#ffea00');
                break;
              } else { destroyBoss(); break; }
            }
          }
        }
      }
    }

    // Spawning regular enemies
    let spawnRate = Math.max(8, 30 - Math.floor(score / 200) - (modeIndex === 1 ? 8 : 0));
    if (frameCount % spawnRate === 0) spawnEnemy();

    // Regular Enemies Update
    let baseEnemySpeed = 1.8 + (score / 300) + (modeIndex === 1 ? 1.0 : 0);
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      let ew = (e.type === 6 || e.type === 9) ? 36 : 20;
      let eh = (e.type === 6 || e.type === 9) ? 36 : 20;

      if (e.type === 8) {
        e.timer++;
        if (e.timer % 40 === 0) e.cloaked = !e.cloaked;
      }

      if (timeStopTimer === 0) {
        if (e.type === 0) e.y += baseEnemySpeed * 1.2;
        else if (e.type === 1) {
          e.y += baseEnemySpeed * 0.8;
          if (e.x < p.x) e.x += 0.8;
          if (e.x > p.x) e.x -= 0.8;
        } else if (e.type === 2) e.y += baseEnemySpeed * 0.5;
        else if (e.type === 3) e.y += baseEnemySpeed * 0.4;
        else if (e.type === 4) {
          e.y += baseEnemySpeed * 0.9;
          e.x += e.dx;
          if (e.x < 0 || e.x > W - ew) e.dx = -e.dx;
        } else if (e.type === 5 || e.type === 9) e.y += baseEnemySpeed * 1.3;
        else if (e.type === 6) {
          if (e.y < 60) e.y += 0.8;
          else {
            e.x += e.dx;
            if (e.x < 0 || e.x > W - ew) e.dx = -e.dx;
          }
        } else if (e.type === 7) { // Kamikaze
          e.y += baseEnemySpeed * 2.0;
          if (e.x < p.x) e.x += 1.4;
          if (e.x > p.x) e.x -= 1.4;
        } else if (e.type === 8) {
          e.y += baseEnemySpeed * 1.0;
        }

        // Enemy Firing
        if (e.type === 2 && frameCount % 60 === 0 && randomFloat() < 0.5) {
          eBullets.push({ x: e.x + 10, y: e.y + 20, dx: 0, dy: 3.5 });
        }
      }

      // Laser Beam Collision
      if (laserTimer > 0) {
        if (p.x + 10 >= e.x && p.x + 10 <= e.x + ew && p.y > e.y) {
          if (!e.cloaked) e.hp -= 0.5;
          addExplosion(p.x + 10, e.y + eh / 2, 2, '#00e5ff');
          if (e.hp <= 0) { handleEnemyDefeat(e, i); continue; }
        }
      }

      // Player Collision with Enemy
      if (p.x < e.x + ew && p.x + 20 > e.x && p.y < e.y + eh && p.y + 20 > e.y) {
        addExplosion(e.x + ew / 2, e.y + eh / 2, 16);
        enemies.splice(i, 1);
        playerHit();
        continue;
      }

      // Bullets vs Enemy
      for (let j = bullets.length - 1; j >= 0; j--) {
        let b = bullets[j];
        if (b.x < e.x + ew && b.x + 4 > e.x && b.y < e.y + eh && b.y + 10 > e.y) {
          if (e.cloaked && randomFloat() < 0.75) {
            // Miss cloaked fighter
          } else {
            shotsHit++; e.hp -= (b.type === 1 ? 6 : 1);
            addExplosion(b.x, b.y, b.type === 1 ? 6 : 3, '#00e5ff');
            bullets.splice(j, 1);
          }

          if (e.hp <= 0) {
            handleEnemyDefeat(e, i);
            break;
          }
        }
      }

      if (e.y > H + 20) enemies.splice(i, 1);
    }

    // Enemy Bullets Update
    for (let i = eBullets.length - 1; i >= 0; i--) {
      let eb = eBullets[i];
      if (timeStopTimer === 0) {
        eb.y += eb.dy;
        eb.x += eb.dx;
      }

      if (eb.y > H || eb.x < 0 || eb.x > W) {
        eBullets.splice(i, 1);
        continue;
      }

      if (p.x < eb.x + 4 && p.x + 20 > eb.x && p.y < eb.y + 10 && p.y + 20 > eb.y) {
        eBullets.splice(i, 1);
        playerHit();
      }
    }

    // Power-ups Update
    for (let i = powerups.length - 1; i >= 0; i--) {
      let pu = powerups[i];
      pu.y += pu.dy;

      if (p.x < pu.x + 16 && p.x + 20 > pu.x && p.y < pu.y + 16 && p.y + 20 > pu.y) {
        applyPowerup(pu.type);
        addExplosion(pu.x + 8, pu.y + 8, 12, '#00e5ff');
        powerups.splice(i, 1);
        score += 50;
        playSound(2);
        continue;
      }

      if (pu.y > H) powerups.splice(i, 1);
    }

    frameCount++;
  }

  function updateSkillButtonsUI() {
    let bStop = document.getElementById('btnTimeStop');
    let bDash = document.getElementById('btnDash');
    let bBomb = document.getElementById('btnBomb');
    let bShield = document.getElementById('btnShield');

    if (timeStopTimer > 0) { bStop.className = 'skill-btn'; bStop.innerText = '[T] ACTIVE'; }
    else if (timeStopCooldown > 0) { bStop.className = 'skill-btn cooldown'; bStop.innerText = `[T] ${Math.ceil(timeStopCooldown/60)}s`; }
    else { bStop.className = 'skill-btn'; bStop.innerText = '[T] STOP'; }

    if (invincibleTimer > 0) { bDash.className = 'skill-btn'; bDash.innerText = '[D] WARP'; }
    else if (dashCooldown > 0) { bDash.className = 'skill-btn cooldown'; bDash.innerText = `[D] ${Math.ceil(dashCooldown/60)}s`; }
    else { bDash.className = 'skill-btn'; bDash.innerText = '[D] DASH'; }

    bBomb.innerText = `[B] BOMB (${p.bombs})`;
    if (p.bombs <= 0) bBomb.className = 'skill-btn cooldown';
    else bBomb.className = 'skill-btn';

    if (hyperShieldTimer > 0) { bShield.className = 'skill-btn'; bShield.innerText = '[S] BARRIER'; }
    else if (hyperShieldCooldown > 0) { bShield.className = 'skill-btn cooldown'; bShield.innerText = `[S] ${Math.ceil(hyperShieldCooldown/60)}s`; }
    else { bShield.className = 'skill-btn'; bShield.innerText = '[S] SHIELD'; }
  }

  function handleEnemyDefeat(e, index) {
    comboTimer = 180;
    if (comboMultiplier < 10) comboMultiplier++;
    let baseScore = (e.type === 6 ? 300 : (e.type === 9 ? 200 : (e.type === 8 ? 150 : (e.type === 7 ? 120 : 30))));
    score += baseScore * comboMultiplier;
    enemiesKilled++;
    totalKills++;
    playSound(1);
    addExplosion(e.x + 10, e.y + 10, e.type === 6 ? 24 : 12);

    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem('kspace_highscore', highScore); } catch (ex) {}
    }
    try { localStorage.setItem('kspace_totalkills', totalKills); } catch (ex) {}

    // Powerup Drop Chance (22%)
    if (randomFloat() < 0.22) {
      powerups.push({ x: e.x, y: e.y, dy: 1.8, type: Math.floor(randomFloat() * 9) });
    }

    enemies.splice(index, 1);
  }

  function applyPowerup(type) {
    if (type === 0) { spreadTimer = 350; p.weaponType = 1; }
    else if (type === 1) { laserTimer = 300; p.weaponType = 2; }
    else if (type === 2) { p.shield = true; addShieldRipple(p.x + 10, p.y + 10, '#00e5ff'); }
    else if (type === 3) { p.bombs = Math.min(p.maxBombs, p.bombs + 1); }
    else if (type === 4) { rapidTimer = 350; }
    else if (type === 5) { useTimeStop(); }
    else if (type === 6) { useHyperShield(); addShieldRipple(p.x + 10, p.y + 10, '#ffea00'); }
    else if (type === 7) { dashCooldown = 0; useTacticalDash(); }
    else if (type === 8) { if (weaponLevel < 2) weaponLevel++; }
  }

  function playerHit() {
    if (hyperShieldTimer > 0 || invincibleTimer > 0) return;

    if (p.shield) {
      p.shield = false;
      addShieldRipple(p.x + 10, p.y + 10, '#00e5ff');
      addExplosion(p.x + 10, p.y + 10, 16, '#00e5ff');
      playSound(1);
    } else {
      p.hp--;
      weaponLevel = 0;
      addExplosion(p.x + 10, p.y + 10, 30, '#ff1744');
      playSound(1);
      if (p.hp <= 0) {
        gameState = STATE_GAMEOVER;
        clearSavedGame();
        addScoreToLeaderboard(score, wave, MODES[modeIndex].name);
    if(!isReplaying) lastReplaySaved = currentReplay;
      }
    }
  }

  // --- DRAWING FUNCTIONS ---
  // --- DRAWING FUNCTIONS (Loop 2 Visuals) ---
  function drawPlayerShip(x, y, shield, frame) {
    ctx.save();
    ctx.translate(x, y);

    // Multi-Stage Animated Thruster Flames (Loop 2)
    let flameH = 6 + Math.sin(frame * 0.4) * 3;
    // Outer Flame Plume
    ctx.fillStyle = (frame % 2 === 0) ? '#ff3d00' : '#ff9100';
    ctx.beginPath(); ctx.moveTo(4, 20); ctx.lineTo(10, 20 + flameH + 3); ctx.lineTo(16, 20); ctx.closePath(); ctx.fill();
    // Middle Core Flame
    ctx.fillStyle = '#ffea00';
    ctx.beginPath(); ctx.moveTo(6, 20); ctx.lineTo(10, 20 + flameH); ctx.lineTo(14, 20); ctx.closePath(); ctx.fill();
    // White Plasma Center Core
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(8, 20); ctx.lineTo(10, 20 + flameH * 0.6); ctx.lineTo(12, 20); ctx.closePath(); ctx.fill();

    // Wingtip Maneuvering Thrusters
    ctx.fillStyle = '#00e5ff';
    ctx.fillRect(0, 16, 2, 4 + (frame % 2) * 2);
    ctx.fillRect(18, 16, 2, 4 + (frame % 2) * 2);

    // Ship Hull
    ctx.fillStyle = '#00b0ff';
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(20, 16); ctx.lineTo(15, 20); ctx.lineTo(10, 15); ctx.lineTo(5, 20); ctx.lineTo(0, 16);
    ctx.closePath(); ctx.fill();

    // Metallic Hull Panels & Details
    ctx.fillStyle = '#80d8ff';
    ctx.beginPath(); ctx.moveTo(10, 3); ctx.lineTo(14, 12); ctx.lineTo(10, 10); ctx.lineTo(6, 12); ctx.closePath(); ctx.fill();

    // Cockpit Canopy
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(10, 7, 3, 5, 0, 0, Math.PI * 2); ctx.fill();

    // Hyper Shield Barrier / Shield Ripples
    if (hyperShieldTimer > 0) {
      let rPulse = 20 + Math.sin(frame * 0.3) * 2;
      ctx.strokeStyle = '#ffea00';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 10; ctx.shadowColor = '#ffea00';
      ctx.beginPath(); ctx.arc(10, 10, rPulse, 0, Math.PI * 2); ctx.stroke();
    } else if (shield) {
      let rot = (frame * 0.1) % (Math.PI * 2);
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 8; ctx.shadowColor = '#00e5ff';
      ctx.beginPath(); ctx.arc(10, 10, 16, rot, rot + Math.PI * 1.6); ctx.stroke();
    }

    ctx.restore();

    // Laser Beam Ray
    if (laserTimer > 0 && gameState === STATE_PLAYING) {
      ctx.save();
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 5 + Math.sin(frame * 0.5) * 3;
      ctx.shadowBlur = 14; ctx.shadowColor = '#00e5ff';
      ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + 10, 0); ctx.stroke();
      ctx.restore();
    }
  }

  function drawEnemyShip(e, frame) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.cloaked) ctx.globalAlpha = 0.25;

    // Enemy Rear Thruster Flames
    if (e.type !== 5 && e.type !== 9) { // Non-asteroids have engines
      let eFlame = 4 + (frame % 3) * 2;
      ctx.fillStyle = (e.type === 4 ? '#00e5ff' : (e.type === 7 ? '#ffea00' : '#ff3d00'));
      ctx.beginPath();
      ctx.moveTo(7, 0); ctx.lineTo(10, -eFlame); ctx.lineTo(13, 0);
      ctx.closePath(); ctx.fill();
    }

    let isDamaged = (e.hp < e.maxHp / 2) && (frame % 4 < 2);
    if (isDamaged && e.type !== 5 && e.type !== 9) {
      ctx.filter = 'brightness(2) drop-shadow(0 0 5px red)';
    }

    if (e.type === 0) { // Red Interceptor
      ctx.fillStyle = '#ff1744';
      ctx.beginPath();
      ctx.moveTo(0, 2); ctx.lineTo(10, 18); ctx.lineTo(20, 2); ctx.lineTo(13, 6); ctx.lineTo(10, 0); ctx.lineTo(7, 6);
      ctx.closePath(); ctx.fill();
    } else if (e.type === 1) { // Orange Chaser
      ctx.fillStyle = '#ff9100';
      ctx.beginPath(); ctx.moveTo(10, 20); ctx.lineTo(20, 4); ctx.lineTo(10, 0); ctx.lineTo(0, 4); ctx.closePath(); ctx.fill();
    } else if (e.type === 2) { // Purple Saucer
      ctx.fillStyle = '#d500f9';
      ctx.beginPath(); ctx.ellipse(10, 12, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath(); ctx.arc(10, 12, 3, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 3) { // Heavy Armored
      ctx.fillStyle = '#78909c'; ctx.fillRect(2, 2, 16, 16);
      ctx.fillStyle = '#ff1744'; ctx.fillRect(8, 6, 4, 8);
    } else if (e.type === 4) { // Zigzag
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath(); ctx.moveTo(10, 18); ctx.lineTo(20, 0); ctx.lineTo(10, 6); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    } else if (e.type === 5 || e.type === 9) { // Asteroids
      ctx.fillStyle = '#8d6e63';
      let r = (e.type === 9) ? 15 : 9;
      let ptsCount = 8;
      ctx.beginPath();
      for (let i = 0; i < ptsCount; i++) {
        let a = i * Math.PI * 2 / ptsCount;
        let pR = r * (0.8 + ((Math.floor(e.x + i * 77) % 100) / 250));
        if (i === 0) ctx.moveTo(r + Math.cos(a)*pR, r + Math.sin(a)*pR);
        else ctx.lineTo(r + Math.cos(a)*pR, r + Math.sin(a)*pR);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5d4037';
      ctx.beginPath(); ctx.arc(r - 2, r - 2, r * 0.4, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 6) { // Frigate
      ctx.fillStyle = '#c62828';
      ctx.beginPath(); ctx.moveTo(18, 34); ctx.lineTo(34, 8); ctx.lineTo(18, 12); ctx.lineTo(2, 8); ctx.closePath(); ctx.fill();
    } else if (e.type === 7) { // Kamikaze Spike
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath(); ctx.moveTo(10, 22); ctx.lineTo(20, 0); ctx.lineTo(10, 4); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    } else if (e.type === 8) { // Stealth Fighter
      ctx.fillStyle = '#673ab7';
      ctx.beginPath(); ctx.moveTo(10, 18); ctx.lineTo(20, 2); ctx.lineTo(10, 8); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
    }

    ctx.restore();
  }

  function drawBoss(b, frame) {
    ctx.save();
    ctx.translate(b.x, b.y);

    let isEnraged = (b.hp < b.maxHp * 0.5);

    if (b.isMothership) {
      // Alien Mothership Hull
      ctx.fillStyle = isEnraged ? '#b71c1c' : '#880e4f';
      ctx.beginPath();
      ctx.moveTo(45, 58); ctx.lineTo(85, 35); ctx.lineTo(90, 10); ctx.lineTo(65, 2); ctx.lineTo(45, 12); ctx.lineTo(25, 2); ctx.lineTo(0, 10); ctx.lineTo(5, 35);
      ctx.closePath(); ctx.fill();

      // Enraged Phase Electric Lightning Arcs (Loop 2)
      if (isEnraged && frame % 2 === 0) {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(45, 30);
        ctx.lineTo(45 + (randomFloat() - 0.5) * 60, 30 + (randomFloat() - 0.5) * 40);
        ctx.stroke();
      }

      // Core Eye Overload
      let coreCol = isEnraged ? ((frame % 4 < 2) ? '#ffea00' : '#ff1744') : ((frame % 8 < 4) ? '#00e5ff' : '#ff1744');
      ctx.fillStyle = coreCol;
      ctx.beginPath(); ctx.arc(45, 30, 12, 0, Math.PI * 2); ctx.fill();

      // Turrets
      let tOffsetsX = [5, 25, 65, 85];
      for (let i = 0; i < 4; i++) {
        if (b.turrets[i] && b.turrets[i].active) {
          ctx.fillStyle = '#ff9100';
          ctx.beginPath(); ctx.arc(tOffsetsX[i], 28, 7, 0, Math.PI * 2); ctx.fill();
        }
      }

      // Deflector Shield Ring
      if (isMothershipShieldActive()) {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 12; ctx.shadowColor = '#00e5ff';
        ctx.beginPath(); ctx.arc(45, 30, 50, 0, Math.PI * 2); ctx.stroke();
      }
    } else { // Dreadnought Boss
      ctx.fillStyle = isEnraged ? '#d500f9' : '#b71c1c';
      ctx.beginPath();
      ctx.moveTo(30, 48); ctx.lineTo(58, 12); ctx.lineTo(45, 2); ctx.lineTo(30, 14); ctx.lineTo(15, 2); ctx.lineTo(2, 12);
      ctx.closePath(); ctx.fill();

      if (isEnraged && frame % 2 === 0) {
        ctx.strokeStyle = '#ffea00';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(30, 24);
        ctx.lineTo(30 + (randomFloat() - 0.5) * 40, 24 + (randomFloat() - 0.5) * 30);
        ctx.stroke();
      }

      let coreCol = isEnraged ? ((frame % 4 < 2) ? '#ffffff' : '#ff1744') : ((frame % 10 < 5) ? '#ffea00' : '#ff1744');
      ctx.fillStyle = coreCol;
      ctx.beginPath(); ctx.arc(30, 24, 10, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
  }

  function drawPowerupItem(pu, frame) {
    ctx.save();
    ctx.translate(pu.x + 8, pu.y + 8);
    let pulse = 1 + Math.sin(frame * 0.15) * 0.15;
    ctx.scale(pulse, pulse);

    const colors = ['#00e676', '#00e5ff', '#3d5aff', '#ff1744', '#ffea00', '#d500f9', '#ffd700', '#00b0ff', '#ff64c8'];
    const labels = ['S', 'L', 'H', 'B', 'R', 'T', 'Y', 'D', 'W'];

    ctx.fillStyle = colors[pu.type] || '#fff';
    ctx.beginPath();
    let pulseAmt = (frame % 20 < 10) ? 1 : 0;
    if (pu.type % 3 === 0) {
      ctx.moveTo(0, -7 - pulseAmt); ctx.lineTo(7+pulseAmt, 7+pulseAmt); ctx.lineTo(-7-pulseAmt, 7+pulseAmt); ctx.closePath();
    } else if (pu.type % 3 === 1) {
      ctx.rect(-7 - pulseAmt, -7 - pulseAmt, 14 + pulseAmt*2, 14 + pulseAmt*2);
    } else {
      ctx.arc(0, 0, 8 + pulseAmt, 0, Math.PI * 2);
    }
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labels[pu.type] || 'P', 0, 1);
    ctx.restore();
  }

  // --- RENDER LOOP ---
  function draw() {
    if (bombFlash > 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      return;
    }

    // Dynamic Deep Space Background
    let bgR = 5 + (wave * 4) % 25;
    let bgG = 5 + (wave * 6) % 25;
    let bgB = 18 + (wave * 10) % 40;
    ctx.fillStyle = `rgb(${bgR}, ${bgG}, ${bgB})`;
    ctx.fillRect(0, 0, W, H);

    // Deep Space Nebulae Render (Loop 2)
    for (let n of nebulae) {
      n.x += n.vx; n.y += n.vy;
      n.phase += 0.015;
      if (n.x < -n.r) n.x = W + n.r;
      if (n.x > W + n.r) n.x = -n.r;
      if (n.y < -n.r) n.y = H + n.r;
      if (n.y > H + n.r) n.y = -n.r;

      let pr = n.r + Math.sin(n.phase) * 12;
      let g = ctx.createRadialGradient(n.x, n.y, 5, n.x, n.y, pr);
      g.addColorStop(0, n.col1);
      g.addColorStop(1, n.col2);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, pr, 0, Math.PI * 2); ctx.fill();
    }

    // Planets (Loop 3)
    for (let p of planets) {
      p.x += p.vx; p.y += p.vy; p.rot += 0.005;
      if (p.x < -p.r*2) p.x = W + p.r*2;
      if (p.x > W + p.r*2) p.x = -p.r*2;
      if (p.y < -p.r*2) p.y = H + p.r*2;
      if (p.y > H + p.r*2) p.y = -p.r*2;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
      if (p.type === 'ringed') {
        ctx.strokeStyle = p.ringCol;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.8, p.r * 0.4, Math.PI/6, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 2.0, p.r * 0.5, Math.PI/6, 0, Math.PI * 2); ctx.stroke();
      } else if (p.type === 'cratered') {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.arc(-p.r*0.3, -p.r*0.2, p.r*0.15, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.r*0.4, p.r*0.3, p.r*0.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-p.r*0.1, p.r*0.5, p.r*0.1, 0, Math.PI * 2); ctx.fill();
      }
      let pgrad = ctx.createRadialGradient(-p.r*0.2, -p.r*0.2, 0, 0, 0, p.r);
      pgrad.addColorStop(0, 'rgba(255,255,255,0.1)');
      pgrad.addColorStop(1, 'rgba(0,0,0,0.8)');
      ctx.fillStyle = pgrad;
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Comets (Loop 3)
    if (randomFloat() < 0.005) {
      comets.push({ x: randomFloat() * W, y: -20, vx: (randomFloat() - 0.5) * 2, vy: 5 + randomFloat() * 5, life: 1.0 });
    }
    for (let i = comets.length - 1; i >= 0; i--) {
      let c = comets[i];
      c.x += c.vx; c.y += c.vy; c.life -= 0.01;
      if (c.y > H + 20 || c.life <= 0) { comets.splice(i, 1); continue; }
      ctx.save();
      let cgrad = ctx.createLinearGradient(c.x, c.y, c.x - c.vx*10, c.y - c.vy*10);
      cgrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      cgrad.addColorStop(0.2, 'rgba(0, 229, 255, 0.8)');
      cgrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
      ctx.strokeStyle = cgrad;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x - c.vx*15, c.y - c.vy*15); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(c.x, c.y, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 3-Layer Parallax Starfield Render
    for (let s of stars) {
      if (s.layer === 2) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + 4); ctx.stroke();
      } else if (s.layer === 1) {
        let tw = 0.5 + Math.sin(frameCount * 0.1 + s.x) * 0.4;
        ctx.fillStyle = `rgba(180, 230, 255, ${tw})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      } else {
        ctx.fillStyle = timeStopTimer > 0 ? '#00e5ff' : `rgba(120, 150, 200, ${s.alpha * 0.7})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
    }

    if (gameState === STATE_MENU) drawMenuScreen();
    else if (gameState === STATE_MODE_SELECT) drawModeSelectScreen();
    else if (gameState === STATE_LEADERBOARD) drawLeaderboardScreen();
    else if (gameState === STATE_HELP) drawHelpScreen();
    else if (gameState === STATE_KEYBINDS) drawKeybindsScreen();
    else if (gameState === STATE_PLAYING || gameState === STATE_PAUSED || gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) {
      drawPlayerShip(p.x, p.y, p.shield, frameCount);

      // Player Bullets with Plasma Glow & Trails (Loop 2)
      for (let b of bullets) {
        ctx.save();
        if (b.type === 1) {
          let grad = ctx.createRadialGradient(b.x + 4, b.y + 4, 1, b.x + 4, b.y + 4, 7);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.5, '#e040fb');
          grad.addColorStop(1, 'rgba(213, 0, 249, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(b.x + 4, b.y + 4, 7, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(b.x + 2, b.y + 5); ctx.lineTo(b.x + 2 - b.dx * 2, b.y + 14); ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(b.x, b.y, 4, 10);
        }
        ctx.restore();
      }

      // Enemy Bullets with Glow Halo
      for (let eb of eBullets) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 23, 68, 0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(eb.x, eb.y); ctx.lineTo(eb.x - eb.dx * 2, eb.y - eb.dy * 2); ctx.stroke();
        ctx.fillStyle = '#ffea00';
        ctx.beginPath(); ctx.arc(eb.x, eb.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      for (let e of enemies) drawEnemyShip(e, frameCount);
      if (boss) drawBoss(boss, frameCount);
      for (let pu of powerups) drawPowerupItem(pu, frameCount);

      // Render Visual Effects (Debris, Shockwaves, Shield Ripples, Muzzle Flashes)
      // Debris Chunks
      for (let i = debris.length - 1; i >= 0; i--) {
        let d = debris[i];
        d.x += d.vx; d.y += d.vy; d.rot += d.vrot; d.life -= d.decay;
        if (d.life <= 0) { debris.splice(i, 1); continue; }
        ctx.save();
        ctx.translate(d.x, d.y); ctx.rotate(d.rot);
        ctx.globalAlpha = Math.max(0, d.life);
        ctx.fillStyle = d.color;
        ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size * 0.6);
        ctx.restore();
      }

      // Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        let sw = shockwaves[i];
        sw.r += sw.speed; sw.alpha -= 0.04;
        if (sw.alpha <= 0 || sw.r >= sw.maxR) { shockwaves.splice(i, 1); continue; }
        ctx.save();
        ctx.strokeStyle = sw.color; ctx.globalAlpha = Math.max(0, sw.alpha); ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      // Shield Impact Ripples
      for (let i = shieldRipples.length - 1; i >= 0; i--) {
        let sr = shieldRipples[i];
        sr.r += 1.8; sr.alpha -= 0.05;
        if (sr.alpha <= 0 || sr.r >= sr.maxR) { shieldRipples.splice(i, 1); continue; }
        ctx.save();
        ctx.strokeStyle = sr.color; ctx.globalAlpha = Math.max(0, sr.alpha); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sr.x, sr.y, sr.r, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      // Muzzle Flashes
      for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        let mf = muzzleFlashes[i];
        mf.life--;
        if (mf.life <= 0) { muzzleFlashes.splice(i, 1); continue; }
        ctx.save();
        ctx.fillStyle = mf.color;
        ctx.beginPath(); ctx.arc(mf.x, mf.y, mf.size * (mf.life / mf.maxLife), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(mf.x, mf.y, (mf.size * 0.5) * (mf.life / mf.maxLife), 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      drawExplosions();
      drawHUD();

      if (gameState === STATE_PAUSED) drawPauseScreen();
      if (gameState === STATE_GAMEOVER) drawGameOverScreen();
      if (gameState === STATE_VICTORY) drawVictoryScreen();
    }
  }

  function drawHUD() {
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px monospace';
    ctx.fillText(isReplaying ? `REPLAY - SCORE: ${score}` : `SCORE: ${score}`, 10, 18);
    ctx.fillText(`HIGH: ${highScore}`, 120, 18);
    ctx.fillText(`WAVE: ${wave}/20`, W - 85, 18);

    ctx.fillStyle = '#ff1744';
    for (let i = 0; i < p.hp; i++) ctx.fillRect(10 + i * 12, 26, 8, 8);

    ctx.fillStyle = '#ffea00';
    for (let i = 0; i < p.bombs; i++) ctx.fillRect(60 + i * 12, 26, 8, 8);

    if (boss) {
      ctx.fillStyle = '#111';
      ctx.fillRect(40, 42, W - 80, 12);
      let pct = Math.max(0, boss.hp / boss.maxHp);
      ctx.fillStyle = boss.isMothership ? '#d500f9' : '#ff1744';
      ctx.fillRect(42, 44, (W - 84) * pct, 8);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(40, 42, W - 80, 12);
      ctx.fillStyle = '#fff';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(boss.isMothership ? 'ALIEN MOTHERSHIP' : `DREADNOUGHT Lvl ${boss.level}`, W / 2, 51);
      ctx.textAlign = 'left';
    }
  }

  function drawMenuScreen() {
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('KSPACE', W / 2, 80);

    ctx.fillStyle = '#80d8ff';
    ctx.font = '12px monospace';
    ctx.fillText('Loop 7 Space Command', W / 2, 110);

    
    let saved = hasSavedGame();
    let options = ['START NEW GAME'];
    if (saved) options.push('RESUME SAVED GAME');
    options.push('HIGH SCORES');
    options.push('SELECT GAME MODE');
    options.push('KEYBINDS');
    options.push('LOAD REPLAY');


    for (let i = 0; i < options.length; i++) {
      let y = 170 + i * 40;
      if (i === menuIndex) {
        ctx.fillStyle = '#ffea00';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`> ${options[i]} <`, W / 2, y);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.font = '14px monospace';
        ctx.fillText(options[i], W / 2, y);
      }
    }

    ctx.fillStyle = '#ffea00';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('PRESS [H] FOR HELP', W / 2, H - 30);

    ctx.textAlign = 'left';
  }

  function drawHelpScreen() {
    ctx.fillStyle = 'rgba(5, 5, 18, 0.95)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HOW TO PLAY', W / 2, 60);

    ctx.fillStyle = '#ffffff';
    ctx.font = '12px monospace';
    let instructions = [
      "ARROWS / DRAG : Move Ship",
      "SPACE / CLICK : Fire Weapon",
      "",
      "--- SKILLS ---",
      "[T] : Time Stop (Freeze)",
      "[D] : Tactical Dash (Invincible)",
      "[B] : Smart Bomb (Clear)",
      "[S] : Hyper Shield (Protect)",
      "",
      "--- ITEMS ---",
      "S:Spread L:Laser H:Shield",
      "B:Bomb R:Rapid T:Time Stop",
      "Y:Hyper Shield D:Dash Refresh",
      "W:Weapon Upgrade"
    ];
    for (let i = 0; i < instructions.length; i++) {
      ctx.fillText(instructions[i], W / 2, 100 + i * 20);
    }

    ctx.fillStyle = '#ffea00';
    ctx.font = '14px monospace';
    ctx.fillText('Press [H] or ENTER to return', W / 2, H - 40);
    ctx.textAlign = 'left';
  }

  
  function drawKeybindsScreen() {
    ctx.fillStyle = 'rgba(5, 5, 18, 0.95)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00e5ff'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
    ctx.fillText('CUSTOM KEYBINDS', W / 2, 50);

    let kbKeys = Object.keys(keybinds);
    for(let i=0; i<kbKeys.length; i++) {
        let k = kbKeys[i];
        ctx.fillStyle = (menuIndex === i) ? '#ffea00' : '#ffffff';
        let val = waitForKeybind === k ? 'PRESS KEY...' : keybinds[k].toUpperCase();
        ctx.font = '14px monospace';
        ctx.fillText(`${k.toUpperCase()}: ${val}`, W / 2, 90 + i * 25);
    }
    ctx.fillStyle = '#80d8ff'; ctx.font = '12px monospace';
    ctx.fillText('UP/DOWN: Select | ENTER: Rebind | ESC: Back', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  function drawModeSelectScreen() {
    ctx.fillStyle = '#ffea00';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SELECT GAME MODE', W / 2, 90);

    for (let i = 0; i < MODES.length; i++) {
      let y = 180 + i * 65;
      if (i === modeIndex) {
        ctx.fillStyle = '#00e5ff';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`> ${MODES[i].name} <`, W / 2, y);
        ctx.fillStyle = '#ffffff';
        ctx.font = '11px monospace';
        ctx.fillText(MODES[i].desc, W / 2, y + 20);
      } else {
        ctx.fillStyle = '#78909c';
        ctx.font = '14px monospace';
        ctx.fillText(MODES[i].name, W / 2, y);
      }
    }

    ctx.fillStyle = '#ff1744';
    ctx.font = '12px monospace';
    ctx.fillText('Press ENTER to Launch Mission', W / 2, H - 40);
    ctx.textAlign = 'left';
  }

  function drawLeaderboardScreen() {
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TOP COMMANDERS', W / 2, 70);

    for (let i = 0; i < leaderboard.length; i++) {
      let y = 140 + i * 35;
      let item = leaderboard[i];
      ctx.fillStyle = i === 0 ? '#ffea00' : '#ffffff';
      ctx.font = '13px monospace';
      ctx.fillText(`#${i + 1}   Score:${item.score}   Wave:${item.wave}`, W / 2, y);
    }
    ctx.textAlign = 'left';
  }

  function drawPauseScreen() {
    ctx.fillStyle = 'rgba(5, 5, 18, 0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffea00';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SYSTEM PAUSED', W / 2, 120);

    let options = ['RESUME GAME', 'SAVE GAME STATE', 'LOAD GAME STATE', 'QUIT TO MENU'];
    for (let i = 0; i < options.length; i++) {
      let y = 200 + i * 40;
      if (i === menuIndex) {
        ctx.fillStyle = '#00e5ff';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`> ${options[i]} <`, W / 2, y);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.font = '14px monospace';
        ctx.fillText(options[i], W / 2, y);
      }
    }
    ctx.textAlign = 'left';
  }

  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(20, 0, 0, 0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff1744';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(isReplaying ? 'REPLAY ENDED' : 'MISSION FAILED', W / 2, 140);
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, 190);
    ctx.fillText(`WAVE REACHED: ${wave}`, W / 2, 220);
    ctx.fillStyle = '#ffea00';
    ctx.font = '14px monospace';
    ctx.fillText('ENTER: Menu | E: CSV | J: JSON | R: Save Replay', W / 2, 310);
    ctx.textAlign = 'left';
  }

  function drawVictoryScreen() {
    ctx.fillStyle = 'rgba(0, 30, 20, 0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00e676';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(isReplaying ? 'REPLAY ENDED' : 'CAMPAIGN VICTORY!', W / 2, 140);
    ctx.fillStyle = '#ffea00';
    ctx.font = '14px monospace';
    ctx.fillText('Alien Mothership Destroyed', W / 2, 175);
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, 220);
    ctx.fillText(`VICTORY BONUS: +10000`, W / 2, 250);
    ctx.fillStyle = '#80d8ff';
    ctx.font = '14px monospace';
    ctx.fillText('ENTER: Menu | E: CSV | J: JSON | R: Save Replay', W / 2, 330);
    ctx.textAlign = 'left';
  }

  setInterval(() => {
    update();
    draw();
  }, 16);
</script>
</body>
