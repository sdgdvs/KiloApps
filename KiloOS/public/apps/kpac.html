<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KPac</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background-color: #030611;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    text-rendering: optimizeLegibility;
  }
  #game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #080d1a;
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 15px rgba(30, 136, 229, 0.3);
    border: 1px solid #1e88e5;
  }
  canvas {
    width: 300px;
    height: 340px;
    border-radius: 6px;
    background-color: #030611;
  }
  .skills-bar {
    display: flex;
    gap: 4px;
    margin-top: 6px;
    width: 100%;
    max-width: 300px;
  }
  .skill-btn {
    flex: 1;
    background: linear-gradient(185deg, #1565c0, #0d47a1);
    color: #fff;
    border: 1px solid #42a5f5;
    border-radius: 6px;
    padding: 5px 2px;
    font-size: 8.5px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    user-select: none;
  }
  .skill-btn:hover:not(:disabled) {
    background: linear-gradient(185deg, #1e88e5, #1565c0);
    box-shadow: 0 0 8px rgba(66, 165, 245, 0.6);
  }
  .skill-btn:active:not(:disabled) {
    transform: scale(0.96);
  }
  .skill-btn:disabled {
    background: #1a2332;
    border-color: #37474f;
    color: #78909c;
    cursor: not-allowed;
  }
  .craft-btn {
    background: linear-gradient(185deg, #7b1fa2, #4a148c);
    border-color: #ba68c8;
  }
  .mode-btn {
    background: linear-gradient(185deg, #e65100, #bf360c);
    border-color: #ff9800;
  }
  .pet-btn {
    background: linear-gradient(185deg, #00897b, #004d40);
    border-color: #4db6ac;
  }
</style>
</head>

<div id="game-container">
  <canvas id="gameCanvas" width="300" height="340"></canvas>

    <button id="btnPetUlt" class="skill-btn pet-btn" onclick="triggerPetUltimate()">Pet [U]</button>
  </div>

</div>

  // Web Audio Synthesizer
  let audioCtx = null;
  function playSound(freq, duration, type = 'sine', slide = 0) {
      try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          if (slide !== 0) osc.frequency.linearRampToValueAtTime(freq + slide, audioCtx.currentTime + duration);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
  }

          particles.push({
              x: cx, y: cy,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              color,
              life: 25,
              maxLife: 25
          });
      }
  }

  function generateProceduralMaze(wave) {
      map = [];
      for (let r = 0; r < ROWS; r++) {
          map[r] = [];
          for (let c = 0; c < COLS; c++) {
              if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) map[r][c] = 1;
              else map[r][c] = 2;
          }
      }
      let seed = wave * 179 + 31;
      for (let r = 2; r < ROWS - 2; r += 2) {
          for (let c = 2; c <= Math.floor(COLS / 2); c += 2) {
              let opp = COLS - 1 - c;
              let blk = (seed + r * 5 + c * 7) % 5;
              if (blk === 0) {
                  map[r][c] = 1; map[r][opp] = 1;
                  map[r+1][c] = 1; map[r+1][opp] = 1;
              } else if (blk === 1) {
                  map[r][c] = 1; map[r][opp] = 1;
                  map[r][c+1] = 1; map[r][opp-1] = 1;
              } else if (blk === 2) {
                  map[r][c] = 1; map[r][opp] = 1;
              }
          }
      }
      for (let r = 6; r <= 8; r++) {
          for (let c = 5; c <= 9; c++) map[r][c] = 0;
      }
      map[6][5] = 1; map[7][5] = 1; map[8][5] = 1;
      map[6][9] = 1; map[7][9] = 1; map[8][9] = 1;
      map[8][6] = 1; map[8][7] = 1; map[8][8] = 1;
      map[6][6] = 1; map[6][7] = 1; map[6][8] = 1;

      map[7][0] = 0; map[7][1] = 2;
      map[7][COLS-1] = 0; map[7][COLS-2] = 2;

      map[12][7] = 0; map[11][7] = 2; map[12][6] = 2; map[12][8] = 2;
      map[1][1] = 3; map[1][COLS-2] = 3;
      map[ROWS-2][1] = 3; map[ROWS-2][COLS-2] = 3;
      map[3][3] = 4; map[3][COLS-4] = 5;
      map[ROWS-4][3] = 5; map[ROWS-4][COLS-4] = 4;

      if (wave >= 2) {
          if (map[3][7] === 2) map[3][7] = 9;
          if (map[11][7] === 2) map[11][7] = 9;
      }
      if (wave >= 4) {
          if (map[5][3] === 2) map[5][3] = 10;
          if (map[5][COLS-4] === 2) map[5][COLS-4] = 10;
      }
  }

  function attemptSkill(s) {

  function triggerPetUltimate() {
      if (petCooldown === 0 && !gameOver && !paused && petActive) {
          petCooldown = 180; petBurstTimer = 40;
          if (petType === 0) {
              for (let g of ghosts) { g.stunTimer = 60; addSparks(g.x * TS + TS/2, g.y * TS + TS/2, '#ff1744', 8); }
              if (gameMode === 0 && level === 20 && bossHp > 0) {

                  for (let c = px - 5; c <= px + 5; c++) {

              freezeSkillTimer = 50; saveMsgText = "PET: EMP VACUUM STORM!";

  function cyclePetCompanion() {

      saveMsgText = `PET: ${names[petType]}`;

  function toggleCraftMenu() {
      showCraftMenu = !showCraftMenu;
  }

  function toggleGameMode() {
      gameMode = gameMode === 0 ? 1 : 0;
      init(false);
      saveMsgText = `MODE: ${gameMode ? "ARCADE ENDLESS" : "CAMPAIGN"}`;
      saveMsgTimer = 25;
  }

  // Input bindings
  window.addEventListener('keydown', e => {
      let key = e.key.toUpperCase();
      if (key === 'ARROWUP' || key === 'W') ndx = 0, ndy = -1;
      else if (key === 'ARROWDOWN' || key === 'S') ndx = 0, ndy = 1;
      else if (key === 'ARROWLEFT' || key === 'A') ndx = -1, ndy = 0;
      else if (key === 'ARROWRIGHT' || key === 'D') ndx = 1, ndy = 0;
      else if (key === 'F') attemptSkill('s1');
      else if (key === 'Z') attemptSkill('s2');
      else if (key === 'M') attemptSkill('s3');
      else if (key === 'B') attemptSkill('s4');
      else if (key === 'U') triggerPetUltimate();
      else if (key === 'P') cyclePetCompanion();
      else if (key === 'C') toggleCraftMenu();
      else if (key === 'TAB' && showCraftMenu) { e.preventDefault(); craftMenuPage = craftMenuPage ? 0 : 1; }
      else if (key === 'O') toggleGameMode();
      else if (key === ' ' || key === 'ESCAPE') paused = !paused;
      else if (key === 'H') showHelp = !showHelp;
      else if (key === 'ENTER' && gameOver) init(false);
      else if (showCraftMenu && craftMenuPage === 0) {
          if (key === '1' || key === '7') craftItem(1);
          if (key === '2' || key === '8') craftItem(2);
          if (key === '3' || key === '9') craftItem(3);
          if (key === '4' || key === '0') craftItem(4);
      } else if (showCraftMenu && craftMenuPage === 1) {
          if (key === '1' || key === '5') craftItem(5);
          if (key === '2' || key === '6') craftItem(6);
          if (key === '3' || key === '7') craftItem(7);
          if (key === '4' || key === '8') craftItem(8);
          if (key === '5' || key === '9') craftItem(9);
      } else {
          if (key === '7') craftItem(1);
          if (key === '8') craftItem(2);
          if (key === '9') craftItem(3);
          if (key === '0') craftItem(4);
      }
  });

  function update() {
      if (screenShake > 0) screenShake--;
      if (saveMsgTimer > 0) saveMsgTimer--;
      if (playerSlowTimer > 0 && !relicAegis) playerSlowTimer--;
      if (showHelp || gameOver || paused) return;

      if (relicAegis) {
          relicAegisTimer++;
          if (relicAegisTimer >= 250) {
              relicAegisTimer = 0;
              if (shieldHits < 3) {
                  shieldActive = 1; shieldHits++;
                  addShockwave(px * TS + TS/2, py * TS + TS/2, '#ff9800');
                  saveMsgText = "AEGIS: SHIELD RECHARGED!"; saveMsgTimer = 20;
              }
          }
      }

      if (deathTimer > 0) {
          deathTimer--;
          if (deathTimer % 2 === 0) {
              let cols = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#00ffff', '#ff00ff'];
              let rc = cols[Math.floor(Math.random() * cols.length)];
              addShockwave(px * TS + TS/2, py * TS + TS/2, rc);
              addSparks(px * TS + TS/2, py * TS + TS/2, rc, 5);
          }
          if (deathTimer === 0) {
              lives--;
              playSound(150, 0.4, 'sawtooth');
              if (lives <= 0) {
                  gameOver = 1; statsGamesPlayed++;
                  if (score > statsMaxScore) statsMaxScore = score;
                  saveHighScore();
              } else {
                  px = 7; py = 12; pdx = 0; pdy = 0; ndx = 0; ndy = 0; petX = px; petY = py;
                  let effWave = (gameMode === 1) ? endlessWave : level;
                  ghosts[0] = {x: 7, y: 6, c: '#ff1744', type: 0, isPhantom: 0, phantomTimer: 0, isDead: 0, dirX: 0, dirY: -1, trait: (effWave >= 2) ? ((effWave % 5) + 1) : 0, stunTimer: 0};
                  ghosts[1] = {x: 6, y: 7, c: '#f06292', type: 1, isPhantom: 0, phantomTimer: 0, isDead: 0, dirX: -1, dirY: 0, trait: (effWave >= 3) ? (((effWave + 2) % 5) + 1) : 0, stunTimer: 0};
                  ghosts[2] = {x: 8, y: 7, c: '#00e5ff', type: 2, isPhantom: 0, phantomTimer: 0, isDead: 0, dirX: 1, dirY: 0, trait: (effWave >= 4) ? (((effWave + 3) % 5) + 1) : 0, stunTimer: 0};
                  ghosts[3] = {x: 7, y: 7, c: '#ff9100', type: 3, isPhantom: 0, phantomTimer: 0, isDead: 0, dirX: 0, dirY: 1, trait: (effWave >= 5) ? (((effWave + 4) % 5) + 1) : 0, stunTimer: 0};
                  ghosts[4] = {x: 7, y: 5, c: '#aa00ff', type: 4, isPhantom: 0, phantomTimer: 0, isDead: 0, dirX: 0, dirY: -1, trait: (effWave >= 6) ? (((effWave + 1) % 5) + 1) : 0, stunTimer: 0};
              }
          }
          return;
      }

      if (victoryTimer > 0) {
          victoryTimer--;
          if (victoryTimer === 0) {
              if (gameMode === 1) {
                  endlessWave++;
                  if (endlessWave > endlessHighWave) endlessHighWave = endlessWave;
                  let mult = relicStone ? 2 : 1;
                  score += (1000 + endlessWave * 200) * mult;
                  craftStarDust += 2; craftFruitEssence += 1;
                  saveHighScore(); init(true);
              } else {
                  if (level === 20) {
                      gameOver = 2; statsGamesPlayed++; saveHighScore();
                  } else {
                      level++; init(true);
                  }
              }
          }
          return;
      }

      if (freezeCooldown > 0) freezeCooldown--;
      if (speedCooldown > 0) speedCooldown--;
      if (magnetCooldown > 0) magnetCooldown--;
      if (shieldCooldown > 0) shieldCooldown--;
      if (petCooldown > 0) petCooldown--;
      if (petBurstTimer > 0) petBurstTimer--;

      if (freezeSkillTimer > 0) freezeSkillTimer--;
      if (frightTimer > 0) frightTimer--;

      for (let i = 0; i < sludgeTraps.length; i++) {
          sludgeTraps[i].life--;
          if (sludgeTraps[i].life <= 0) { sludgeTraps.splice(i, 1); i--; }
      }
      for (let g of ghosts) { if (g.stunTimer > 0) g.stunTimer--; }

      let effLevel = (gameMode === 1) ? endlessWave : level;
      let ghostSpeed = 4 - Math.floor(effLevel / 4);
      if (diffMode === 0) ghostSpeed += 1;
      else if (diffMode === 2) ghostSpeed = Math.max(1, ghostSpeed - 1);
      if (relicHourglass) ghostSpeed += 1;
      ghostSpeed = Math.max(1, ghostSpeed);
      if (frightTimer > 0) ghostSpeed *= 2;

      // Ghost movement
      if (freezeSkillTimer === 0 && frameCount % ghostSpeed === 0) {
          let dirs = [[1,0], [-1,0], [0,1], [0,-1]];
          for (let i = 0; i < numGhosts; i++) {
              let g = ghosts[i];
              if (g.isDead || g.stunTimer > 0) continue;
              if (g.isPhantom && g.phantomTimer <= 0) continue;

              let oldX = g.x, oldY = g.y;
              if (g.trait === 3 && (frameCount % 30 === 0) && sludgeTraps.length < 16) {
                  sludgeTraps.push({x: g.x, y: g.y, life: 90});
              }

              if (frightTimer === 0) {
                  let tx = px, ty = py;
                  if (g.type === 1) { tx = px + pdx * 3; ty = py + pdy * 3; }
                  else if (g.type === 2) { tx = px - pdx * 2; ty = py - pdy * 2; }
                  else if (g.type === 3) {
                      let d = Math.abs(g.x - px) + Math.abs(g.y - py);
                      if (d <= 6) { tx = 0; ty = ROWS - 1; }
                  } else if (g.type === 4) { tx = px - pdx * 3; ty = py - pdy * 3; }

                  let bestD = -1, minDist = 99999;
                  for (let d = 0; d < 4; d++) {
                      let nx = g.x + dirs[d][0], ny = g.y + dirs[d][1];
                      if (nx < 0) nx = COLS - 1;
                      if (nx >= COLS) nx = 0;
                      if (ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
                          let dist = Math.abs(nx - tx) + Math.abs(ny - ty);
                          if (dist < minDist) { minDist = dist; bestD = d; }
                      }
                  }
                  if (bestD !== -1) {
                      let nx = g.x + dirs[bestD][0], ny = g.y + dirs[bestD][1];
                      if (nx < 0) nx = COLS - 1;
                      if (nx >= COLS) nx = 0;
                      if (ny >= 0 && ny < ROWS && map[ny][nx] !== 1) { g.x = nx; g.y = ny; }
                  }
              } else {
                  let d = Math.floor(Math.random() * 4);
                  let nx = g.x + dirs[d][0], ny = g.y + dirs[d][1];
                  if (nx < 0) nx = COLS - 1;
                  if (nx >= COLS) nx = 0;
                  if (ny >= 0 && ny < ROWS && map[ny][nx] !== 1) { g.x = nx; g.y = ny; }
              }
              g.dirX = g.x - oldX; g.dirY = g.y - oldY;
          }
      }

      if (ndx !== 0 || ndy !== 0) {
          let nx = px + ndx, ny = py + ndy;
          if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
              pdx = ndx; pdy = ndy; ndx = 0; ndy = 0;
          }
      }

      if (speedSkillTimer > 0) speedSkillTimer--;
      let moveTick = (speedSkillTimer > 0) ? 1 : ((playerSlowTimer > 0 && !relicAegis) ? 3 : 2);

      if (moveTick === 1 || frameCount % moveTick === 0) {
          let nx = px + pdx, ny = py + pdy;
          if (nx < 0) nx = COLS - 1;
          if (nx >= COLS) nx = 0;

          if (ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
              px = nx; py = ny;

              if (!relicAegis) {
                  for (let s of sludgeTraps) {
                      if (s.x === px && s.y === py && !shieldActive) {
                          playerSlowTimer = 30; addSparks(px * TS + TS/2, py * TS + TS/2, '#00e676', 4);
                      }
                  }
              }

              // Void Rift Warp [Tile 9]
              if (map[py][px] === 9) {
                  let tx = COLS - 1 - px, ty = ROWS - 1 - py;
                  if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS && map[ty][tx] !== 1) {
                      px = tx; py = ty;
                  }
                  addExplosion(px * TS + TS/2, py * TS + TS/2, '#ba68c8');
                  if (shieldActive || frightTimer > 0) {
                      score += 300; craftStarDust += 1;
                      saveMsgText = "VOID RIFT STABILIZED! +300"; saveMsgTimer = 25;
                  } else {
                      saveMsgText = "DIMENSIONAL WARP!"; saveMsgTimer = 20;
                  }
                  playSound(600, 0.3, 'sine', -250);
              }

              if (map[py][px] === 6) {
                  if (shieldActive) {
                      shieldHits--; if (shieldHits <= 0) shieldActive = 0;
                      map[py][px] = 0; addShockwave(px * TS + TS/2, py * TS + TS/2, '#ff4500');
                      saveMsgText = "HAZARD ABSORBED!"; saveMsgTimer = 20;
                  } else {
                      lives--; playSound(150, 0.3, 'sawtooth');
                      if (lives <= 0) { gameOver = 1; statsGamesPlayed++; saveHighScore(); }
                      else { px = 7; py = 12; pdx = 0; pdy = 0; ndx = 0; ndy = 0; }
                  }
              } else if (map[py][px] >= 2 && map[py][px] <= 5) {
                  let loopNum = Math.floor((level - 1) / 20);
                  let mult = (gameMode === 1) ? (1 + Math.floor(endlessWave / 2)) : ((loopNum >= 7) ? 8 : 1);
                  if (relicStone) mult *= 2;

                  petExp++;
                  if (petExp >= 25 * petLevel && petLevel < 5) {
                      petLevel++; petExp = 0;
                      saveMsgText = "PET LEVEL UP!"; saveMsgTimer = 25;
                      addExplosion(petX * TS + TS/2, petY * TS + TS/2, '#ffd700');
                      saveHighScore();
                      playSound(880, 0.4, 'sine', 200);
                  }

                  if (map[py][px] === 3) {
                      score += 40 * mult; craftStarDust++;
                      let baseFright = (diffMode === 0) ? 75 : ((diffMode === 2) ? 35 : 50);
                      if (relicCrown) baseFright = Math.floor(baseFright * 1.5);
                      frightTimer = (loopNum >= 7) ? 0 : baseFright;
                      addExplosion(px * TS + TS/2, py * TS + TS/2, '#ffb852');
                      playSound(400, 0.2, 'triangle', 200);
                  } else if (map[py][px] === 4) {
                      score += 20 * mult; speedSkillTimer = 80;
                      addShockwave(px * TS + TS/2, py * TS + TS/2, '#00e5ff');
                  } else if (map[py][px] === 5) {
                      score += 30 * mult; freezeSkillTimer = 60;
                      addShockwave(px * TS + TS/2, py * TS + TS/2, '#80deea');
                  } else {
                      let dotPts = relicOrb ? 25 : 10;
                      if (petType === 3) dotPts *= 3;
                      score += dotPts * mult;
                      if (dotCount % 25 === 0) craftStarDust++;
                  }

                  if (score > highScore) highScore = score;
                  if (score > statsMaxScore) statsMaxScore = score;
                  map[py][px] = 0; dotCount--;
                  if (dotCount === 0) { victoryTimer = 30; playSound(600, 0.4, 'sine', 300); }
              } else if (map[py][px] === 8) {
                  level += Math.floor(Math.random() * 3) + 1; score += 1000; craftFruitEssence += 2;
                  init(true); return;
              }
          }
      }

      // Companion Pet AI
      if (petActive) {
          petFloatAngle += 0.15;
          if (frameCount % 2 === 0) {
              if (petX < px) petX++; else if (petX > px) petX--;
              if (petY < py) petY++; else if (petY > py) petY--;
          }
          if (petType === 0 && frameCount % 15 === 0) {
              for (let g of ghosts) {
                  if (!g.isDead && g.stunTimer === 0) {
                      let dist = Math.abs(g.x - petX) + Math.abs(g.y - petY);
                      if (dist <= 2 + petLevel) {
                          g.stunTimer = 30 + petLevel * 5;
                          addSparks(g.x * TS + TS/2, g.y * TS + TS/2, '#ff1744', 5);
                          break;
                      }
                  }
              }
          }
          let vacRadius = (relicOrb ? 2 : 0) + (petType === 1 ? (1 + Math.floor(petLevel / 2)) : 0);
          if (vacRadius > 0 && frameCount % 3 === 0) {
              for (let r = petY - vacRadius; r <= petY + vacRadius; r++) {
                  for (let c = petX - vacRadius; c <= petX + vacRadius; c++) {
                      if (r >= 0 && r < ROWS && c >= 0 && c < COLS && map[r][c] === 2) {
                          let dotPts = relicOrb ? 25 : 10;
                          if (petType === 3) dotPts *= 3;
                          let mult = relicStone ? 2 : 1;
                          score += dotPts * mult; map[r][c] = 0; dotCount--;
                          if (dotCount === 0) { victoryTimer = 30; playSound(600, 0.4, 'sine', 300); }
                      }
                  }
              }
          }
      }

      // Dot Magnet
      if (magnetSkillTimer > 0) {
          magnetSkillTimer--;
          for (let r = py - 3; r <= py + 3; r++) {
              for (let c = px - 3; c <= px + 3; c++) {
                  if (r >= 0 && r < ROWS && c >= 0 && c < COLS && map[r][c] >= 2 && map[r][c] <= 5) {
                      let mult = (gameMode === 1) ? (1 + Math.floor(endlessWave / 2)) : 1;
                      if (relicStone) mult *= 2;
                      score += 10 * mult; map[r][c] = 0; dotCount--;
                  }
              }
          }
      }

      // Ghost Collisions
      for (let i = 0; i < numGhosts; i++) {
          let g = ghosts[i];
          if (g.isDead || (g.isPhantom && g.phantomTimer <= 0)) continue;

          if (px === g.x && py === g.y) {
              if (frightTimer > 0) {
                  let mult = (gameMode === 1) ? (1 + Math.floor(endlessWave / 2)) : 1;
                  if (relicStone) mult *= 2;
                  craftEctoplasm += (g.trait > 0 ? 2 : 1);
                  if (relicCrown) craftFruitEssence += 1;
                  let eatScore = relicCrown ? 400 : 200;

                  if (g.type === 5) {
                      bossHp--; score += 500 * mult; craftEctoplasm += 3;
                      g.x = 7; g.y = 6; addExplosion(px * TS + TS/2, py * TS + TS/2, '#ffd700');
                      if (bossHp <= 0) { score += 2000 * mult; victoryTimer = 30; statsGamesPlayed++; saveHighScore(); }
                  } else if (g.type === 6) {
                      score += 100 * mult; g.phantomTimer = 0; addExplosion(px * TS + TS/2, py * TS + TS/2, '#ce93d8');
                  } else {
                      score += eatScore * mult; statsGhostsEaten++;
                      addExplosion(px * TS + TS/2, py * TS + TS/2, '#00e5ff');
                      playSound(550, 0.25, 'triangle', 200);
                      g.isDead = 1;
                  }
              } else if (shieldActive) {
                  shieldHits--; if (shieldHits <= 0) shieldActive = 0;
                  g.x = 7; g.y = 6; addShockwave(px * TS + TS/2, py * TS + TS/2, '#00e5ff');
                  saveMsgText = "SHIELD ABSORBED!"; saveMsgTimer = 20;
              } else {
                  deathTimer = 40; playSound(150, 0.4, 'sawtooth'); break;
              }
          }
      }

      // Fruit
      if (dotCount < 40 && fruitActive === 0 && fruitTimer === 0 && Math.random() < 0.01) {
          fruitActive = 1; fruitTimer = 100;
      }
      if (fruitActive) {
          fruitTimer--;
          if (fruitTimer <= 0) fruitActive = 0;
          else if (px === 7 && py === 12) {
              let mult = (gameMode === 1) ? (1 + Math.floor(endlessWave / 2)) : 1;
              if (relicStone) mult *= 2;
              score += (relicStone ? 2500 : 500) * mult;
              craftFruitEssence += 2;
              addShockwave(7 * TS + TS/2, 12 * TS + TS/2, relicStone ? '#ffd700' : '#00e676');
              fruitActive = 0;
              playSound(700, 0.3, 'sine', 150);
          }
      }

      for (let i = 0; i < shockwaves.length; i++) {
          shockwaves[i].r += 2;
          shockwaves[i].alpha -= 0.05;
          if (shockwaves[i].r >= shockwaves[i].maxR || shockwaves[i].alpha <= 0) {
              shockwaves.splice(i, 1); i--;
          }
      }

      for (let i = 0; i < particles.length; i++) {
          let p = particles[i];
          p.x += p.vx; p.y += p.vy;
          p.vx *= 0.95; p.vy += 0.15;
          p.life--;
          if (p.life <= 0) { particles.splice(i, 1); i--; }
      }

      frameCount++;
  }

  function drawWallTile(ctx, r, c) {
      let x = c * TS, y = r * TS;
      ctx.fillStyle = '#080e1e';
      ctx.fillRect(x, y, TS, TS);
      ctx.strokeStyle = '#1e88e5';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 2, y + 2, TS - 4, TS - 4);
  }

  function draw() {
      ctx.fillStyle = '#030611';
      ctx.fillRect(0, 0, 300, 340);

      ctx.save();
      if (screenShake > 0) {
          let sx = (Math.random() - 0.5) * screenShake;
          let sy = (Math.random() - 0.5) * screenShake;
          ctx.translate(sx, sy);
      }

      // Cyber Grid
      ctx.strokeStyle = 'rgba(30, 136, 229, 0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 300; i += 20) { ctx.moveTo(i, 0); ctx.lineTo(i, 340); }
      for (let j = 0; j <= 340; j += 20) { ctx.moveTo(0, j); ctx.lineTo(300, j); }
      ctx.stroke();

      for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
              if (map[r][c] === 1) drawWallTile(ctx, r, c);
              else if (map[r][c] === 2) {
                  let cx = c * TS + TS/2, cy = r * TS + TS/2;
                  ctx.fillStyle = relicOrb ? '#ba68c8' : (petType === 3 ? '#ffd700' : '#d8863b');
                  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
              } else if (map[r][c] === 3) {
                  let cx = c * TS + TS/2, cy = r * TS + TS/2;
                  let p = Math.sin(frameCount * 0.3) * 2;
                  ctx.fillStyle = '#ffb852';
                  ctx.beginPath(); ctx.arc(cx, cy, 6 + p, 0, Math.PI * 2); ctx.fill();
              } else if (map[r][c] === 4) {
                  ctx.fillStyle = '#00e5ff';
                  ctx.fillRect(c * TS + 6, r * TS + 6, 8, 8);
              } else if (map[r][c] === 5) {
                  ctx.fillStyle = '#80deea';
                  ctx.fillRect(c * TS + 5, r * TS + 5, 10, 10);
              } else if (map[r][c] === 6) {
                  ctx.fillStyle = '#ff4500';
                  ctx.fillRect(c * TS + 5, r * TS + 5, 10, 10);
              } else if (map[r][c] === 8) {
                  ctx.fillStyle = '#c832ff';
                  ctx.beginPath(); ctx.arc(c * TS + TS/2, r * TS + TS/2, 6, 0, Math.PI * 2); ctx.fill();
              } else if (map[r][c] === 9) { // Void Rift
                  let cx = c * TS + TS/2, cy = r * TS + TS/2;
                  let p = Math.sin(frameCount * 0.4) * 3;
                  ctx.strokeStyle = '#ba68c8'; ctx.lineWidth = 2;
                  ctx.beginPath(); ctx.arc(cx, cy, 7 + p, 0, Math.PI * 2); ctx.stroke();
                  ctx.fillStyle = '#4a148c'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
              } else if (map[r][c] === 10) { // Phase Gateway
                  let cx = c * TS + TS/2, cy = r * TS + TS/2;
                  let open = (frameCount % 40 < 20);
                  ctx.strokeStyle = open ? '#00e676' : '#ff1744'; ctx.lineWidth = 2;
                  ctx.beginPath(); ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.stroke();
              }
          }
      }

      for (let s of sludgeTraps) {
          ctx.fillStyle = '#00e676';
          ctx.fillRect(s.x * TS + 5, s.y * TS + 5, 10, 10);
      }

      if (fruitActive) {
          ctx.fillStyle = relicStone ? '#ffd700' : '#d50000';
          ctx.beginPath(); ctx.arc(7 * TS + TS/2, 12 * TS + TS/2, 6, 0, Math.PI * 2); ctx.fill();
      }

      // Draw Companion Pet
      if (petActive) {
          let petCx = petX * TS + TS/2;
          let petCy = petY * TS + TS/2 + Math.sin(petFloatAngle) * 3;
          let petCol = (petType === 0) ? '#ff5252' : ((petType === 1) ? '#00e5ff' : ((petType === 2) ? '#f06292' : '#ffd700'));
          ctx.strokeStyle = petCol; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(petCx, petCy, 9, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = petCol; ctx.beginPath(); ctx.arc(petCx, petCy, 5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(petCx - 2, petCy - 1, 1.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(petCx + 2, petCy - 1, 1.5, 0, Math.PI * 2); ctx.fill();
      }

      // Draw Pac-Man
      let cx = px * TS + TS/2, cy = py * TS + TS/2;
      let pacColor = shieldActive ? ((shieldHits >= 2) ? '#00ffff' : '#00e5ff') : ((speedSkillTimer > 0) ? '#ff9800' : '#ffeb3b');
      ctx.fillStyle = pacColor;
      ctx.beginPath();
      let mouth = [0.4, 0.2, 0.05, 0.2][frameCount % 4] * Math.PI;
      let baseAngle = (pdx === 1) ? 0 : ((pdx === -1) ? Math.PI : ((pdy === 1) ? Math.PI/2 : (pdy === -1 ? Math.PI*1.5 : 0)));
      ctx.arc(cx, cy, TS/2 - 1, baseAngle + mouth, baseAngle + Math.PI * 2 - mouth);
      ctx.lineTo(cx, cy);
      ctx.fill();

      // Draw Ghosts
      for (let i = 0; i < numGhosts; i++) {
          let g = ghosts[i];
          if (g.isPhantom && g.phantomTimer <= 0) continue;
          let gcx = g.x * TS + TS/2, gcy = g.y * TS + TS/2;
          let isScared = frightTimer > 0;
          let c = isScared ? ((frightTimer < 15 && Math.floor(frightTimer / 2) % 2 === 0) ? '#ffffff' : '#1e88e5') : g.c;
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.arc(gcx, gcy - 2, TS/2 - 2, Math.PI, 0, false);
          ctx.lineTo(gcx + TS/2 - 2, gcy + TS/2 - 2);
          ctx.lineTo(gcx - TS/2 + 2, gcy + TS/2 - 2);
          ctx.fill();

          if (!isScared) {
              ctx.fillStyle = '#fff';
              ctx.beginPath();
              ctx.arc(gcx - 3, gcy - 2, 2.5, 0, Math.PI * 2);
              ctx.arc(gcx + 3, gcy - 2, 2.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#0d47a1';
              ctx.beginPath();
              ctx.arc(gcx - 3 + (g.dirX||0)*1.5, gcy - 2 + (g.dirY||0)*1.5, 1.2, 0, Math.PI * 2);
              ctx.arc(gcx + 3 + (g.dirX||0)*1.5, gcy - 2 + (g.dirY||0)*1.5, 1.2, 0, Math.PI * 2);
              ctx.fill();
          }
      }

      for (let s of shockwaves) {
          ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.globalAlpha = Math.max(0, s.alpha);
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
      }
      for (let p of particles) {
          ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1.0;
      ctx.restore();

      // HUD Text
      ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.textBaseline = 'top';
      if (gameMode === 1) {
          ctx.fillText(`[ENDLESS W:${endlessWave}/HI:${endlessHighWave}] Sc:${score} Lvs:${lives}`, 4, 302);
      } else {
          ctx.fillText(`[CAMP Lv:${level}/20] Sc:${score} HI:${highScore} Lvs:${lives}`, 4, 302);
      }

      let relicBadges = "";
      if (relicCrown) relicBadges += "C";
      if (relicHourglass) relicBadges += "H";
      if (relicOrb) relicBadges += "O";
      if (relicAegis) relicBadges += "A";
      if (relicStone) relicBadges += "S";

      ctx.fillStyle = '#00ffcc';
      ctx.fillText(`Ect:${craftEctoplasm} Ess:${craftFruitEssence} Dst:${craftStarDust} [${relicBadges||"-"}] | Pet:Lv${petLevel}`, 4, 314);
      ctx.fillStyle = '#ffeb3b';
      ctx.fillText(`F:${freezeCooldown>0?'CD':'OK'} Z:${speedCooldown>0?'CD':'OK'} M:${magnetCooldown>0?'CD':'OK'} B:${shieldActive?'ON':(shieldCooldown>0?'CD':'OK')} U:${petCooldown>0?'CD':'OK'} [H]Help`, 4, 326);

      if (showCraftMenu) {
          ctx.fillStyle = 'rgba(5, 12, 25, 0.94)';
          ctx.fillRect(10, 15, 280, 275);
          ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2;
          ctx.strokeRect(10, 15, 280, 275);

          ctx.fillStyle = '#00e5ff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(craftMenuPage === 0 ? '=== CYBER FORGE: CONSUMABLES ===' : '=== CYBER FORGE: MYTHIC RELICS ===', 150, 25);
          ctx.font = '10.5px monospace'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left';

          if (craftMenuPage === 0) {
              ctx.fillText('1 / [7]: Super Pellet (2 Ecto + 1 Dust)', 20, 55);
              ctx.fillText('2 / [8]: Chrono Warp (2 Ecto + 2 Ess)', 20, 85);
              ctx.fillText('3 / [9]: Aegis Shield 2X (2 Dust + 2 Ess)', 20, 115);
              ctx.fillText('4 / [0]: Void Pulse Bomb (3E + 3D + 1Ess)', 20, 145);
          } else {
              ctx.fillText('1 / [5]: Ghost King Crown (4E + 3D)', 20, 50);
              ctx.fillText('2 / [6]: Chrono Hourglass (4Ess + 3D)', 20, 75);
              ctx.fillText('3 / [7]: Astral Devourer Orb (4E + 4D)', 20, 100);
              ctx.fillText('4 / [8]: Sun Titan Aegis (4Ess + 4D)', 20, 125);
              ctx.fillText('5 / [9]: Philosopher Stone (5E+5S+5D)', 20, 150);
          }

          ctx.fillStyle = '#ffd700';
          ctx.fillText(`Stock: ${craftEctoplasm} Ecto, ${craftFruitEssence} Ess, ${craftStarDust} Dust`, 20, 185);
          ctx.fillStyle = '#00e676';
          ctx.fillText('Press [Tab] to Toggle Relics | [C] Close', 20, 220);
      } else if (showHelp) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.9)'; ctx.fillRect(0, 0, 300, 340);
          ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('KPac Loop 11 - Help', 150, 22);
          ctx.font = '10.5px sans-serif';
          ctx.fillText('Move: Arrows / WASD | Space: Pause', 150, 48);
          ctx.fillText('Skills: F(Freeze) Z(Sprint) M(Magnet) B(Shield)', 150, 70);
          ctx.fillText('Pet: [U] Pet Ultimate | [P] Cycle Pet Type', 150, 92);
          ctx.fillText('Cyber-Forge: [C] Menu [Tab] Mythic Relics', 150, 114);
          ctx.fillText('Modes: [O] Toggle Campaign / Endless', 150, 136);
          ctx.fillText('Portals: Step on Void Rifts to Warp', 150, 158);
          ctx.fillStyle = '#00e676';
          ctx.fillText('Press H or click to start/resume', 150, 200);
          ctx.textAlign = 'left';
      }

      if (saveMsgTimer > 0) {
          ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 12px monospace';
          ctx.fillText(saveMsgText, 50, 160);
      }
      if (victoryTimer > 0) {
          ctx.fillStyle = '#00e676'; ctx.font = 'bold 14px monospace';
          ctx.fillText(gameMode === 1 ? 'WAVE CLEARED!' : 'MAZE CLEARED!', 85, 150);
      } else if (gameOver) {
          ctx.fillStyle = (gameOver === 2) ? '#00e676' : '#ff1744'; ctx.font = 'bold 12px monospace';
          ctx.fillText(gameOver === 2 ? 'CAMPAIGN VICTORY!' : 'GAME OVER', 95, 140);
      } else if (paused) {
          ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 12px monospace';
          ctx.fillText('PAUSED', 125, 150);
      }
  }

  loadHighScore();
  init(false);
  setInterval(() => {
      update();
      draw();
  }, 100);
</script>
</body>
</html>
