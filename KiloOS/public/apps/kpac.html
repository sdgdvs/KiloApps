<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background-color: #030611;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #080d1a;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 15px rgba(30, 136, 229, 0.3);
    border: 1px solid #1e88e5;
  }
  canvas {
    width: 300px;
    height: 340px;
    border-radius: 6px;
    background-color: #030611;
  }
  .skills-bar {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    width: 100%;
    max-width: 300px;
  }
  .skill-btn {
    flex: 1;
    background: linear-gradient(185deg, #1565c0, #0d47a1);
    color: #fff;
    border: 1px solid #42a5f5;
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    user-select: none;
  }
  .skill-btn:hover:not(:disabled) {
    background: linear-gradient(185deg, #1e88e5, #1565c0);
    box-shadow: 0 0 8px rgba(66, 165, 245, 0.6);
  }
  .skill-btn:active:not(:disabled) {
    transform: scale(0.96);
  }
  .skill-btn:disabled {
    background: #1a2332;
    border-color: #37474f;
    color: #78909c;
    cursor: not-allowed;
  }
  .skill-btn.active {
    background: linear-gradient(185deg, #00c853, #00a152);
    border-color: #69f0ae;
    box-shadow: 0 0 10px rgba(105, 240, 174, 0.8);
  }
</style>
</head>

</div>

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, dur, type='square') {
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + dur);
      osc.stop(audioCtx.currentTime + dur);
  }
  
  const keys = {};
  document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (bindState > 0) {
          let k = e.key;
          if (bindState === 1) keybinds.up = [k];
          else if (bindState === 2) keybinds.down = [k];
          else if (bindState === 3) keybinds.left = [k];
          else if (bindState === 4) keybinds.right = [k];
          else if (bindState === 5) keybinds.skill1 = [k];
          else if (bindState === 6) keybinds.skill2 = [k];
          else if (bindState === 7) keybinds.skill3 = [k];
          else if (bindState === 8) { keybinds.skill4 = [k]; bindState = 0; saveMsgText = 'KEYS BOUND!'; saveMsgTimer = 25; }
          if (bindState > 0) bindState++;
          return;
      }
      if (e.key === 'k' || e.key === 'K') { bindState = 1; return; }
      if (e.key === 'h' || e.key === 'H') showHelp = !showHelp;
      if (showHelp) return;

      if (e.key === 'e' || e.key === 'E') {
          let mode = prompt("Type 'E' to Export JSON or 'I' to Import JSON:");
          if (mode) {
              if (mode.toUpperCase() === 'E') {
                  prompt("Copy your save data:", JSON.stringify({highScore, statsGamesPlayed, statsGhostsEaten, statsMaxScore}));
              } else if (mode.toUpperCase() === 'I') {
                  let json = prompt("Paste your JSON:");
                  if (json) {
                      try {
                          let data = JSON.parse(json);
                          if (data.highScore !== undefined) highScore = data.highScore;
                          if (data.statsGamesPlayed !== undefined) statsGamesPlayed = data.statsGamesPlayed;
                          if (data.statsGhostsEaten !== undefined) statsGhostsEaten = data.statsGhostsEaten;
                          if (data.statsMaxScore !== undefined) statsMaxScore = data.statsMaxScore;
                          localStorage.setItem('kpac_highscore', highScore);

                          localStorage.setItem('kpac_ghosts', statsGhostsEaten);
                          localStorage.setItem('kpac_maxscore', statsMaxScore);
                          saveMsgText = 'JSON IMPORTED'; saveMsgTimer = 25;
                      } catch(err) { alert("Invalid JSON"); }
                  }
              }
          }
          return;
      }

      if (e.key === 'r' || e.key === 'R') {
          if (replayMode === 1) { replayMode = 0; saveMsgText = 'RECORD STOPPED'; saveMsgTimer = 25; }
          else {
              replayMode = 1; replays = [];
              replaySeed = Math.floor(Math.random() * 1000000); randSeed = replaySeed;
              replayDiffMode = diffMode; init(false);
              saveMsgText = 'RECORDING...'; saveMsgTimer = 25;
          }
          return;
      }
      if (e.key === 't' || e.key === 'T') {
          if (replayMode === 2) { replayMode = 0; saveMsgText = 'PLAYBACK STOPPED'; saveMsgTimer = 25; }
          else if (replays.length > 0) {
              replayMode = 2; replayIndex = 0;
              randSeed = replaySeed; diffMode = replayDiffMode; init(false);
              saveMsgText = 'PLAYING REPLAY'; saveMsgTimer = 25;
          }
          return;
      }

      if ((e.key === 'p' || e.key === 'P') && !gameOver) paused = !paused;
      if (e.key === '1') { diffMode = 0; saveMsgText = 'DIFF: EASY'; saveMsgTimer = 20; playSound(400, 0.1, 'sine'); }
      if (e.key === '2') { diffMode = 1; saveMsgText = 'DIFF: NORMAL'; saveMsgTimer = 20; playSound(500, 0.1, 'sine'); }
      if (e.key === '3') { diffMode = 2; saveMsgText = 'DIFF: HARD'; saveMsgTimer = 20; playSound(600, 0.1, 'sine'); }

      // Active Skills hotkeys
      if (keybinds.skill1.includes(e.key)) attemptSkill('s1');
      if (keybinds.skill2.includes(e.key)) attemptSkill('s2');
      if (keybinds.skill3.includes(e.key)) attemptSkill('s3');
      if (keybinds.skill4.includes(e.key)) attemptSkill('s4');

      if ((e.key === 'v' || e.key === 'V') && !gameOver) saveGame();
      if (e.key === 'l' || e.key === 'L') loadGame();
  });

          particles.push({
              x: cx, y: cy,

              vy: Math.sin(ang) * spd,
              life: 12 + Math.random() * 8,

      }

      // Ghost 1: Pinky (Pink Interceptor)
      // Ghost 2: Inky (Cyan Flanker)
      // Ghost 3: Clyde (Orange Patrol)
      // Ghost 4: Sue (Purple Stalker)
      ghosts = [
          {x: 7, y: 6, dirX: 0, dirY: -1, color: '#ff1744', type: 0, isPhantom: 0, phantomTimer: 0, isDead: 0},
          {x: 6, y: 7, dirX: -1, dirY: 0, color: '#f06292', type: 1, isPhantom: 0, phantomTimer: 0, isDead: 0},
          {x: 8, y: 7, dirX: 1, dirY: 0, color: '#00e5ff', type: 2, isPhantom: 0, phantomTimer: 0, isDead: 0},
          {x: 7, y: 7, dirX: 0, dirY: 1, color: '#ff9100', type: 3, isPhantom: 0, phantomTimer: 0, isDead: 0},
          {x: 7, y: 5, dirX: 0, dirY: -1, color: '#ab47bc', type: 4, isPhantom: 0, phantomTimer: 0, isDead: 0}
      ];

      if (level === 20) {
          // Stage 20 Ghost King Boss
          ghosts.push({x: 7, y: 6, dirX: 0, dirY: -1, color: '#ffd700', type: 5, isPhantom: 0, phantomTimer: 0, isDead: 0});
          ghosts.push({x: 0, y: 0, dirX: 0, dirY: 0, color: '#ce93d8', type: 6, isPhantom: 1, phantomTimer: 0, isDead: 0});
          ghosts.push({x: 0, y: 0, dirX: 0, dirY: 0, color: '#ce93d8', type: 6, isPhantom: 1, phantomTimer: 0, isDead: 0});
          numGhosts = 6;
          bossHp = 8;
          bossMaxHp = 8;
          phantomSpawnTimer = 0;
      } else if (level >= 4) {
          numGhosts = 5;
      } else if (level === 3) {
          numGhosts = 4;
      } else if (level === 2) {
          numGhosts = 3;
      } else {
          numGhosts = 2;
      }

      frightTimer = 0;
      victoryTimer = 0;
      freezeSkillTimer = 0; freezeCooldown = 0;
      speedSkillTimer = 0; speedCooldown = 0;
      magnetSkillTimer = 0; magnetCooldown = 0;
      shieldActive = 0; shieldCooldown = 0;
      gameOver = 0; dotCount = 0; frameCount = 0;
      paused = false;
      fruitActive = 0;
      fruitTimer = 0;
      popups = [];
      particles = [];
      shockwaves = [];
      
      for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
              if (map[r][c] >= 2 && map[r][c] <= 5) dotCount++;
          }
      }
  }

  function updateSkillButtons() {
      document.getElementById('btnFreeze').disabled = freezeCooldown > 0;
      document.getElementById('btnSprint').disabled = speedCooldown > 0;
      document.getElementById('btnMagnet').disabled = magnetCooldown > 0;
      document.getElementById('btnShield').disabled = shieldCooldown > 0 || shieldActive > 0;

      document.getElementById('btnFreeze').classList.toggle('active', freezeSkillTimer > 0);
      document.getElementById('btnSprint').classList.toggle('active', speedSkillTimer > 0);
      document.getElementById('btnMagnet').classList.toggle('active', magnetSkillTimer > 0);
      document.getElementById('btnShield').classList.toggle('active', shieldActive > 0);
  }

  function update() {
      if (saveMsgTimer > 0) saveMsgTimer--;
      if (gameOver) {
          if (keys['Enter']) init(false);
          return;
      }
      if (showHelp || paused) return;

      if (victoryTimer > 0) {
          victoryTimer--;
          if (victoryTimer === 0) {
              if (level === 20) {
                  gameOver = 2; // Campaign Victory!
                  statsGamesPlayed++;
                  localStorage.setItem('kpac_games', statsGamesPlayed);
                  playSound(1200, 0.8, 'sine');
              } else {
                  level++;
                  playSound(800, 0.5, 'sine');
                  init(true);
              }
          }
          return;
      }
      
      if (replayMode === 2) {
          while (replayIndex < replays.length && replays[replayIndex].f === frameCount) {
              let ev = replays[replayIndex];
              if (ev.act === 'move') { ndx = ev.nx; ndy = ev.ny; }
              else if (ev.act === 's1') triggerFreezeSkill();
              else if (ev.act === 's2') triggerSpeedSkill();
              else if (ev.act === 's3') triggerMagnetSkill();
              else if (ev.act === 's4') triggerShieldSkill();
              replayIndex++;
          }
      } else {
          let oldNdx = ndx, oldNdy = ndy;
          if (isKey(keybinds.left)) { ndx = -1; ndy = 0; }
          if (isKey(keybinds.right)) { ndx = 1; ndy = 0; }
          if (isKey(keybinds.up)) { ndx = 0; ndy = -1; }
          if (isKey(keybinds.down)) { ndx = 0; ndy = 1; }
          if (replayMode === 1 && (ndx !== oldNdx || ndy !== oldNdy)) {
              replays.push({f: frameCount, act: 'move', nx: ndx, ny: ndy});
          }
      }
      
      if (freezeCooldown > 0) freezeCooldown--;
      if (speedCooldown > 0) speedCooldown--;
      if (magnetCooldown > 0) magnetCooldown--;
      if (shieldCooldown > 0) shieldCooldown--;

      if (freezeSkillTimer > 0) freezeSkillTimer--;
      if (frightTimer > 0) frightTimer--;

      updateSkillButtons();

      // Stage 20 Phantom Clone Spawner
      if (level === 20 && bossHp > 0) {
          phantomSpawnTimer++;
          if (phantomSpawnTimer >= 50) {
              phantomSpawnTimer = 0;
              for (let k = 6; k <= 7; k++) {
                  if (ghosts[k].phantomTimer <= 0) {
                      ghosts[k] = {x: 7, y: 6, dirX: 0, dirY: -1, color: '#ce93d8', type: 6, isPhantom: 1, phantomTimer: 80, isDead: 0};
                      if (numGhosts < 8) numGhosts = 8;
                      break;
                  }
              }
          }
      }
      for (let k = 6; k <= 7; k++) {
          if (ghosts[k].isPhantom && ghosts[k].phantomTimer > 0) {
              ghosts[k].phantomTimer--;
          }
      }

      // Dead Ghost Returning Eyes Step (Move float eyes back to Ghost House)
      for (let i = 0; i < numGhosts; i++) {
          let g = ghosts[i];
          if (g.isDead) {
              if (frameCount % 2 === 0) {
                  if (g.x < 7) g.x++;
                  else if (g.x > 7) g.x--;
                  if (g.y < 6) g.y++;
                  else if (g.y > 6) g.y--;
                  if (g.x === 7 && g.y === 6) g.isDead = 0; // Respawned!
              }
          }
      }
      
      let baseGhostSpeed = Math.max(1, 4 - Math.floor(level/4));
      if (diffMode === 0) baseGhostSpeed += 1;
      if (diffMode === 2) baseGhostSpeed = Math.max(1, baseGhostSpeed - 1);
      let ghostSpeed = baseGhostSpeed;
      if (frightTimer > 0) ghostSpeed *= 2;
      
      if (freezeSkillTimer === 0 && frameCount % ghostSpeed === 0) {
          const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
          for (let i = 0; i < numGhosts; i++) {
              let g = ghosts[i];
              if (g.isDead) continue;
              if (g.isPhantom && g.phantomTimer <= 0) continue;

              let oldX = g.x, oldY = g.y;
              if (frightTimer === 0) {
                  let tx = px, ty = py;
                  if (g.type === 1) { // Pinky
                      tx = px + pdx * 3; ty = py + pdy * 3;
                  } else if (g.type === 2) { // Inky
                      tx = px - pdx * 2; ty = py - pdy * 2;
                  } else if (g.type === 3) { // Clyde
                      let distToPac = Math.abs(g.x - px) + Math.abs(g.y - py);
                      if (distToPac > 6) { tx = px; ty = py; }
                      else { tx = 0; ty = ROWS - 1; }
                  } else if (g.type === 4) { // Sue
                      tx = px - pdx * 3; ty = py - pdy * 3;
                  } else if (g.type === 5) { // Ghost King Boss
                      tx = px; ty = py;
                  } else if (g.type === 6) { // Phantom Clone
                      tx = px + Math.floor(Math.random() * 5 - 2);
                      ty = py + Math.floor(Math.random() * 5 - 2);
                  }
                  
                  let loopNum = Math.floor((level - 1) / 20);
                  if (loopNum >= 7 && g.type === 0 && (Math.random() < 0.05)) {
                      let nx = px + Math.floor(Math.random() * 5 - 2);
                      let ny = py + Math.floor(Math.random() * 5 - 2);
                      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
                          g.x = nx; g.y = ny;
                      }
                  }

                  let best_d = -1;
                  let min_dist = 9999;
                  let randThreshold = diffMode === 0 ? 0.35 : (diffMode === 2 ? 0.1 : 0.2);
                  if (Math.random() < randThreshold) {
                      best_d = Math.floor(Math.random() * 4);
                  } else {
                      for (let d = 0; d < 4; d++) {
                          let nx = g.x + dirs[d][0], ny = g.y + dirs[d][1];
                          if (nx < 0) nx = COLS - 1;
                          if (nx >= COLS) nx = 0;
                          if (ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
                              let dist = Math.abs(nx - tx) + Math.abs(ny - ty);
                              if (dist < min_dist) { min_dist = dist; best_d = d; }
                          }
                      }
                  }
                  if (best_d !== -1) {
                      let nx = g.x + dirs[best_d][0];
                      if (nx < 0) nx = COLS - 1;
                      if (nx >= COLS) nx = 0;
                      if (map[g.y + dirs[best_d][1]][nx] !== 1) {
                          g.x = nx; g.y += dirs[best_d][1];
                      }
                  }
              } else {
                  const d = Math.floor(Math.random() * 4);
                  let nx = g.x + dirs[d][0];
                  if (nx < 0) nx = COLS - 1;
                  if (nx >= COLS) nx = 0;
                  if (map[g.y + dirs[d][1]][nx] !== 1) {
                      g.x = nx; g.y += dirs[d][1];
                  }
              }
              if (g.x < 0) g.x = COLS - 1;
              if (g.x >= COLS) g.x = 0;
              if (g.x !== oldX || g.y !== oldY) {
                  g.dirX = Math.sign(g.x - oldX);
                  g.dirY = Math.sign(g.y - oldY);
              }
          }
      }
      
      if (ndx !== 0 || ndy !== 0) {
          const nx = px + ndx, ny = py + ndy;
          if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
              pdx = ndx; pdy = ndy;
              ndx = 0; ndy = 0;
          }
      }
      
      if (speedSkillTimer > 0) speedSkillTimer--;
      let playerMoves = (speedSkillTimer > 0) ? true : (frameCount % 2 === 0);
      
      if (playerMoves) {
          let nx = px + pdx, ny = py + pdy;
          if (nx < 0) nx = COLS - 1;
          if (nx >= COLS) nx = 0;
          
          if (ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
              px = nx; py = ny;
              if (map[py][px] === 6) {
                  let cx = px * TS + TS/2, cy = py * TS + TS/2;
                  if (shieldActive) {
                      shieldActive = 0;
                      map[py][px] = 0;
                      addPopup(cx, cy, 'ABSORBED!', '#ff4500');
                      addSparks(cx, cy, '#ff4500', 16);
                      addShockwave(cx, cy, '#ff4500');
                      playSound(1000, 0.3, 'sine');
                  } else {
                      playSound(200, 0.5, 'sawtooth');
                      addSparks(cx, cy, '#ffeb3b', 16);
                      lives--;
                      if (lives <= 0) {
                          gameOver = 1;
                          statsGamesPlayed++;
                          localStorage.setItem('kpac_games', statsGamesPlayed);
                      } else {
                          px = 7; py = 12; pdx = 0; pdy = 0; ndx = 0; ndy = 0;
                          ghosts[0] = {x: 7, y: 6, dirX: 0, dirY: -1, color: '#ff1744', type: 0, isPhantom: 0, phantomTimer: 0, isDead: 0};
                          ghosts[1] = {x: 6, y: 7, dirX: -1, dirY: 0, color: '#f06292', type: 1, isPhantom: 0, phantomTimer: 0, isDead: 0};
                          ghosts[2] = {x: 8, y: 7, dirX: 1, dirY: 0, color: '#00e5ff', type: 2, isPhantom: 0, phantomTimer: 0, isDead: 0};
                          ghosts[3] = {x: 7, y: 7, dirX: 0, dirY: 1, color: '#ff9100', type: 3, isPhantom: 0, phantomTimer: 0, isDead: 0};
                          ghosts[4] = {x: 7, y: 5, dirX: 0, dirY: -1, color: '#ab47bc', type: 4, isPhantom: 0, phantomTimer: 0, isDead: 0};
                          if (level % 20 === 0) ghosts[5] = {x: 7, y: 6, dirX: 0, dirY: -1, color: '#ffd700', type: 5, isPhantom: 0, phantomTimer: 0, isDead: 0};
                      }
                  }
              } else if (map[py][px] >= 2 && map[py][px] <= 5) {
                  let cx = px * TS + TS/2, cy = py * TS + TS/2;
                  let loopNum = Math.floor((level - 1) / 20);
                  let mult = (loopNum >= 7) ? 8 : 1;
                  if (map[py][px] === 3) {
                      score += 40 * mult; frightTimer = (loopNum >= 7) ? 0 : 50; playSound(300, 0.3, 'sawtooth');
                      addPopup(cx, cy, '+' + (40 * mult), '#ffb852');
                      addSparks(cx, cy, '#ffb852', 10);
                      addShockwave(cx, cy, '#ffb852');
                      addShockwave(cx, cy, '#ffffff');
                  }
                  else if (map[py][px] === 4) {
                      score += 20 * mult; speedSkillTimer = 80; playSound(900, 0.1, 'triangle');
                      addPopup(cx, cy, 'SPEED!', '#00ffff');
                      addSparks(cx, cy, '#00ffff', 8);
                      addShockwave(cx, cy, '#00ffff');
                  }
                  else if (map[py][px] === 5) {
                      score += 30 * mult; freezeSkillTimer = 60; playSound(700, 0.2, 'sine');
                      addPopup(cx, cy, 'FREEZE!', '#ffffff');
                      addSparks(cx, cy, '#ffffff', 8);
                      addShockwave(cx, cy, '#80deea');
                  }
                  else {
                      score += 10 * mult; playSound(600, 0.05, 'square');
                  }
                  if (score > highScore) { highScore = score; localStorage.setItem('kpac_highscore', highScore); }
                  if (score > statsMaxScore) { statsMaxScore = score; localStorage.setItem('kpac_maxscore', statsMaxScore); }
                  map[py][px] = 0;
                  dotCount--;
                  if (dotCount === 0) {
                      victoryTimer = 30;
                      playSound(1200, 0.5, 'sine');
                  }
              }
          }
      }

      // Dot Magnet Skill
      if (magnetSkillTimer > 0) {
          magnetSkillTimer--;
          for (let r = py - 3; r <= py + 3; r++) {
              for (let c = px - 3; c <= px + 3; c++) {
                  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                      if (map[r][c] >= 2 && map[r][c] <= 5) {
                          let cx = c * TS + TS/2, cy = r * TS + TS/2;
                          let loopNum = Math.floor((level - 1) / 20);
                          let mult = (loopNum >= 7) ? 8 : 1;
                          if (map[r][c] === 3) { score += 40 * mult; frightTimer = (loopNum >= 7) ? 0 : 50; addPopup(cx, cy, '+' + (40 * mult), '#ffb852'); addShockwave(cx, cy, '#ffb852'); }
                          else if (map[r][c] === 4) { score += 20 * mult; speedSkillTimer = 80; addPopup(cx, cy, 'SPEED!', '#00ffff'); }
                          else if (map[r][c] === 5) { score += 30 * mult; freezeSkillTimer = 60; addPopup(cx, cy, 'FREEZE!', '#ffffff'); }
                          else { score += 10 * mult; }
                          map[r][c] = 0;
                          dotCount--;
                          addSparks(cx, cy, '#ffeb3b', 4);
                      }
                  }
              }
          }
      }
      
      for (let i = 0; i < numGhosts; i++) {
          let g = ghosts[i];
          if (g.isDead) continue; // Floating dead eyes don't collide with Pac-Man
          if (g.isPhantom && g.phantomTimer <= 0) continue;

          if (px === g.x && py === g.y) {
              let cx = px * TS + TS/2, cy = py * TS + TS/2;
              if (frightTimer > 0) {
                  let loopNum = Math.floor((level - 1) / 20);
                  let mult = (loopNum >= 7) ? 8 : 1;
                  if (g.type === 5) { // Ghost King Boss
                      bossHp--;
                      score += 500 * mult;
                      addPopup(cx, cy, 'BOSS HIT! -1HP', '#ffd700');
                      addSparks(cx, cy, '#ffd700', 16);
                      addShockwave(cx, cy, '#ffd700');
                      g.x = 7; g.y = 6;
                      playSound(900, 0.3, 'square');
                      if (bossHp <= 0) {
                          score += 2000 * mult;
                          victoryTimer = 30;
                          statsGamesPlayed++;
                          localStorage.setItem('kpac_games', statsGamesPlayed);
                      }
                  } else if (g.type === 6) { // Phantom Clone
                      score += 100 * mult;
                      g.phantomTimer = 0;
                      addPopup(cx, cy, '+' + (100 * mult), '#ce93d8');
                      addShockwave(cx, cy, '#ce93d8');
                  } else {
                      score += 200 * mult;
                      statsGhostsEaten++;
                      localStorage.setItem('kpac_ghosts', statsGhostsEaten);
                      if (score > highScore) { highScore = score; localStorage.setItem('kpac_highscore', highScore); }
                      if (score > statsMaxScore) { statsMaxScore = score; localStorage.setItem('kpac_maxscore', statsMaxScore); }
                      playSound(800, 0.1, 'triangle');
                      addPopup(cx, cy, '+' + (200 * mult), '#ffeb3b');
                      addSparks(cx, cy, '#ff1744', 12);
                      addShockwave(cx, cy, '#00ffff');
                      g.isDead = 1; // Float eyes return to ghost house!
                  }
              } else if (shieldActive) {
                  // Ghost Shield Absorbs hit!
                  shieldActive = 0;
                  g.x = 7; g.y = 6;
                  addPopup(cx, cy, 'SHIELD ABSORBED!', '#00e5ff');
                  addSparks(cx, cy, '#00e5ff', 16);
                  addShockwave(cx, cy, '#00e5ff');
                  playSound(1000, 0.3, 'sine');
              } else {
                  playSound(200, 0.5, 'sawtooth');
                  addSparks(cx, cy, '#ffeb3b', 16);
                  lives--;
                  if (lives <= 0) {
                      gameOver = 1;
                      statsGamesPlayed++;
                      localStorage.setItem('kpac_games', statsGamesPlayed);
                  } else {
                      px = 7; py = 12;
                      pdx = 0; pdy = 0; ndx = 0; ndy = 0;
                      ghosts[0] = {x: 7, y: 6, dirX: 0, dirY: -1, color: '#ff1744', type: 0, isPhantom: 0, phantomTimer: 0, isDead: 0};
                      ghosts[1] = {x: 6, y: 7, dirX: -1, dirY: 0, color: '#f06292', type: 1, isPhantom: 0, phantomTimer: 0, isDead: 0};
                      ghosts[2] = {x: 8, y: 7, dirX: 1, dirY: 0, color: '#00e5ff', type: 2, isPhantom: 0, phantomTimer: 0, isDead: 0};
                      ghosts[3] = {x: 7, y: 7, dirX: 0, dirY: 1, color: '#ff9100', type: 3, isPhantom: 0, phantomTimer: 0, isDead: 0};
                      ghosts[4] = {x: 7, y: 5, dirX: 0, dirY: -1, color: '#ab47bc', type: 4, isPhantom: 0, phantomTimer: 0, isDead: 0};
                      if (level === 20) ghosts[5] = {x: 7, y: 6, dirX: 0, dirY: -1, color: '#ffd700', type: 5, isPhantom: 0, phantomTimer: 0, isDead: 0};
                  }
                  break;
              }
          }
      }
      
      if (dotCount < 40 && fruitActive === 0 && fruitTimer === 0 && Math.random() < 0.006) {
          fruitActive = 1;
          fruitTimer = 100;
      }
      if (fruitActive) {
          fruitTimer--;
          if (fruitTimer <= 0) fruitActive = 0;
          else if (px === 7 && py === 12) {
              let loopNum = Math.floor((level - 1) / 20);
              let mult = (loopNum >= 7) ? 8 : 1;
              score += 500 * mult;
              let cx = 7 * TS + TS/2, cy = 12 * TS + TS/2;
              addPopup(cx, cy, '+' + (500 * mult), '#ff1744');
              addSparks(cx, cy, '#00e676', 14);
              addShockwave(cx, cy, '#00e676');
              if (score > highScore) { highScore = score; localStorage.setItem('kpac_highscore', highScore); }
              if (score > statsMaxScore) { statsMaxScore = score; localStorage.setItem('kpac_maxscore', statsMaxScore); }
              fruitActive = 0;
              playSound(1000, 0.1, 'square');
          }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          p.x += p.vx; p.y += p.vy;
          p.life--;
          if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
          let pop = popups[i];
          pop.y -= 0.5;
          pop.life--;
          if (pop.life <= 0) popups.splice(i, 1);
      }
      for (let i = shockwaves.length - 1; i >= 0; i--) {
          let s = shockwaves[i];
          s.r += 1.8;
          s.alpha -= 0.06;
          if (s.alpha <= 0 || s.r >= s.maxR) shockwaves.splice(i, 1);
      }
      
      let loopNum = Math.floor((level - 1) / 20);
      if (loopNum >= 7 && (frameCount % 60 === 0)) {
          let hx = Math.floor(Math.random() * COLS);
          let hy = Math.floor(Math.random() * ROWS);
          if (map[hy][hx] === 0 && (hx !== px || hy !== py) && (hx !== 7 || hy !== 6)) {
              map[hy][hx] = 6;
          }
      }

      frameCount++;
  }

  function drawWallTile(ctx, r, c) {
      let x = c * TS, y = r * TS;
      ctx.fillStyle = '#060a17';
      ctx.fillRect(x, y, TS, TS);

      let nU = r > 0 && map[r-1][c] === 1;
      let nD = r < ROWS-1 && map[r+1][c] === 1;
      let nL = c > 0 && map[r][c-1] === 1;
      let nR = c < COLS-1 && map[r][c+1] === 1;

      let wallColor = '#1e88e5';
      let wallHighlight = '#64b5f6';
      if (victoryTimer > 0) {
          const colors = ['#ffffff', '#00ffff', '#ffd700', '#1e88e5'];
          wallColor = colors[(victoryTimer + r + c) % colors.length];
          wallHighlight = '#ffffff';
      }

      ctx.save();
      ctx.shadowColor = wallColor;
      ctx.shadowBlur = 6;
      ctx.strokeStyle = wallColor;
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 2, y + 2, TS - 4, TS - 4);

      ctx.strokeStyle = wallHighlight;
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (!nU) { ctx.moveTo(x, y + 1); ctx.lineTo(x + TS, y + 1); }
      if (!nD) { ctx.moveTo(x, y + TS - 1); ctx.lineTo(x + TS, y + TS - 1); }
      if (!nL) { ctx.moveTo(x + 1, y); ctx.lineTo(x + 1, y + TS); }
      if (!nR) { ctx.moveTo(x + TS - 1, y); ctx.lineTo(x + TS - 1, y + TS); }
      ctx.stroke();

      // Corner junction caps
      ctx.fillStyle = wallHighlight;
      if (nU && nR) { ctx.fillRect(x + TS - 3, y, 3, 3); }
      if (nU && nL) { ctx.fillRect(x, y, 3, 3); }
      if (nD && nR) { ctx.fillRect(x + TS - 3, y + TS - 3, 3, 3); }
      if (nD && nL) { ctx.fillRect(x, y + TS - 3, 3, 3); }
      ctx.restore();
  }

  function drawDot(ctx, c, r) {
      let cx = c * TS + TS/2, cy = r * TS + TS/2;
      ctx.fillStyle = 'rgba(255, 200, 150, 0.25)';
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffc896';
      ctx.fillRect(cx - 2, cy - 2, 4, 4);
  }

  function drawPowerPellet(ctx, c, r, frame) {
      let cx = c * TS + TS/2, cy = r * TS + TS/2;
      let radius = 4.5 + Math.sin(frame * 0.3) * 1.5;
      
      let radGrad = ctx.createRadialGradient(cx, cy, 1, cx, cy, radius + 5);
      radGrad.addColorStop(0, '#ffffff');
      radGrad.addColorStop(0.5, '#ffb852');
      radGrad.addColorStop(1, 'rgba(255, 184, 82, 0)');
      
      ctx.fillStyle = radGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 5, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.75, 0, Math.PI * 2);
      ctx.fill();
  }

  function drawSpeedItem(ctx, c, r, frame) {
      let cx = c * TS + TS/2, cy = r * TS + TS/2;
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(cx + 2, cy - 6);
      ctx.lineTo(cx - 4, cy + 1);
      ctx.lineTo(cx, cy + 1);
      ctx.lineTo(cx - 2, cy + 6);
      ctx.lineTo(cx + 4, cy - 1);
      ctx.lineTo(cx, cy - 1);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
  }

  function drawFreezeItem(ctx, c, r, frame) {
      let cx = c * TS + TS/2, cy = r * TS + TS/2;
      ctx.strokeStyle = '#80deea';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy);
      ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5);
      ctx.moveTo(cx - 3, cy - 3); ctx.lineTo(cx + 3, cy + 3);
      ctx.moveTo(cx + 3, cy - 3); ctx.lineTo(cx - 3, cy + 3);
      ctx.stroke();
  }

  function drawFruit(ctx, c, r) {
      let bounceY = Math.sin(frameCount * 0.25) * 3;
      let cx = c * TS + TS/2, cy = r * TS + TS/2 + bounceY;
      let fruitType = Math.floor((level - 1) / 2) % 5; // 0=Cherry, 1=Strawberry, 2=Peach, 3=Apple, 4=Watermelon

      if (fruitType === 0) { // Cherry
          ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(cx - 3, cy + 1); ctx.quadraticCurveTo(cx - 1, cy - 5, cx + 2, cy - 6);
          ctx.moveTo(cx + 3, cy + 2); ctx.quadraticCurveTo(cx + 1, cy - 5, cx + 2, cy - 6);
          ctx.stroke();
          ctx.fillStyle = '#81c784'; ctx.beginPath(); ctx.arc(cx + 4, cy - 5, 2, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#d50000'; ctx.beginPath();
          ctx.arc(cx - 3, cy + 2, 3.5, 0, Math.PI * 2);
          ctx.arc(cx + 3, cy + 3, 3.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 4, cy + 1, 1.5, 1.5); ctx.fillRect(cx + 2, cy + 2, 1.5, 1.5);
      } else if (fruitType === 1) { // Strawberry
          ctx.fillStyle = '#e53935'; ctx.beginPath();
          ctx.moveTo(cx, cy + 6); ctx.lineTo(cx - 5, cy - 2); ctx.lineTo(cx + 5, cy - 2); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#4caf50'; ctx.fillRect(cx - 4, cy - 4, 8, 2.5);
          ctx.fillStyle = '#ffeb3b'; ctx.fillRect(cx - 2, cy, 1, 1); ctx.fillRect(cx + 2, cy, 1, 1); ctx.fillRect(cx, cy + 3, 1, 1);
      } else if (fruitType === 2) { // Peach/Orange
          ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.arc(cx, cy + 1, 5.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#4caf50'; ctx.fillRect(cx - 1, cy - 6, 4, 2);
      } else if (fruitType === 3) { // Apple
          ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.arc(cx, cy + 1, 5.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#795548'; ctx.fillRect(cx - 1, cy - 6, 2, 3);
          ctx.fillStyle = '#4caf50'; ctx.fillRect(cx + 1, cy - 6, 3, 2);
      } else { // Melon Slice
          ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI, false); ctx.fill();
          ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI, false); ctx.fill();
          ctx.fillStyle = '#000000'; ctx.fillRect(cx - 2, cy + 2, 1, 1); ctx.fillRect(cx + 2, cy + 2, 1, 1);
      }
  }

  function drawPacman(ctx, px, py, pdx, pdy, frame, speedTimer) {
      let cx = px * TS + TS/2, cy = py * TS + TS/2;
      
      let angle = 0;
      if (pdx === 1) angle = 0;
      else if (pdx === -1) angle = Math.PI;
      else if (pdy === 1) angle = Math.PI / 2;
      else if (pdy === -1) angle = 3 * Math.PI / 2;

      // 4-frame smooth chomp animation frame sequence
      const chompFrames = [0.45 * Math.PI, 0.28 * Math.PI, 0.05 * Math.PI, 0.28 * Math.PI];
      let mouth = chompFrames[frame % 4];

      // Speed glow aura & motion trail
      if (speedTimer > 0 || pdx !== 0 || pdy !== 0) {
          ctx.save();
          ctx.strokeStyle = speedTimer > 0 ? 'rgba(0, 255, 255, 0.6)' : 'rgba(255, 235, 59, 0.3)';
          ctx.lineWidth = 3;
          ctx.shadowColor = speedTimer > 0 ? '#00ffff' : '#ffeb3b';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(cx - pdx * 4, cy - pdy * 4, TS/2, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
      }

      if (shieldActive) {
          ctx.strokeStyle = '#00e5ff';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#00e5ff';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(cx, cy, TS/2 + 3, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
      }

      ctx.fillStyle = shieldActive ? '#00e5ff' : '#ffeb3b';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, TS/2 - 1, angle + mouth, angle + Math.PI * 2 - mouth);
      ctx.closePath();
      ctx.fill();

      let eyeAngle = angle - Math.PI / 3;
      let ex = cx + Math.cos(eyeAngle) * (TS / 4);
      let ey = cy + Math.sin(eyeAngle) * (TS / 4);
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(ex, ey, 1.5, 0, Math.PI * 2);
      ctx.fill();
  }

  function drawGhost(ctx, g, frame, frightTimer) {
      if (g.isPhantom && g.phantomTimer <= 0) return;

      let cx = g.x * TS + TS/2, cy = g.y * TS + TS/2;
      let w = TS - 4;
      let x = cx - w/2, y = cy - w/2;

      // Dead eyes floating back to ghost house
      if (g.isDead) {
          let eyeDx = Math.sign(7 - g.x) * 2;
          let eyeDy = Math.sign(6 - g.y) * 2;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(cx - 3, cy - 2, 3, 4, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + 3, cy - 2, 3, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#1565c0';
          ctx.beginPath();
          ctx.arc(cx - 3 + eyeDx, cy - 2 + eyeDy, 1.8, 0, Math.PI * 2);
          ctx.arc(cx + 3 + eyeDx, cy - 2 + eyeDy, 1.8, 0, Math.PI * 2);
          ctx.fill();
          return;
      }

      let isScared = frightTimer > 0;
      let isFlashing = isScared && frightTimer < 15 && Math.floor(frightTimer / 2) % 2 === 0;

      let bodyColor = isScared ? (isFlashing ? '#ffffff' : '#1e88e5') : g.color;

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.arc(cx, y + w/2, w/2, Math.PI, 0, false);
      ctx.lineTo(x + w, y + w);

      // 2-frame skirt wobbly wave animation
      let skirtOffset = (frame % 2 === 0) ? 1.5 : -1.5;
      let step = w / 3;
      ctx.lineTo(x + w - step * 0.5, y + w - 3 + skirtOffset);
      ctx.lineTo(x + w - step, y + w);
      ctx.lineTo(x + step * 0.5, y + w - 3 - skirtOffset);
      ctx.lineTo(x, y + w);
      ctx.closePath();
      ctx.fill();

      if (g.type === 5) { // Ghost King Crown
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.moveTo(cx - 5, y - 2);
          ctx.lineTo(cx - 3, y - 6);
          ctx.lineTo(cx, y - 3);
          ctx.lineTo(cx + 3, y - 6);
          ctx.lineTo(cx + 5, y - 2);
          ctx.closePath();
          ctx.fill();
      }

      if (!isScared) {
          let eyeDx = (g.dirX || 0) * 2;
          let eyeDy = (g.dirY || 0) * 2;

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(cx - 3, cy - 2, 3, 4, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + 3, cy - 2, 3, 4, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#0d47a1';
          ctx.beginPath();
          ctx.arc(cx - 3 + eyeDx, cy - 2 + eyeDy, 1.8, 0, Math.PI * 2);
          ctx.arc(cx + 3 + eyeDx, cy - 2 + eyeDy, 1.8, 0, Math.PI * 2);
          ctx.fill();
      } else {
          ctx.fillStyle = isFlashing ? '#d50000' : '#ffffff';
          ctx.fillRect(cx - 4, cy - 3, 2, 2);
          ctx.fillRect(cx + 2, cy - 3, 2, 2);

          ctx.strokeStyle = isFlashing ? '#d50000' : '#ffffff';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(cx - 5, cy + 2);
          ctx.lineTo(cx - 3, cy + 4);
          ctx.lineTo(cx - 1, cy + 2);
          ctx.lineTo(cx + 1, cy + 4);
          ctx.lineTo(cx + 3, cy + 2);
          ctx.lineTo(cx + 5, cy + 4);
          ctx.stroke();
      }
  }

  function draw() {
      ctx.fillStyle = '#030611';
      ctx.fillRect(0, 0, 300, 340);

      for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
              if (map[r][c] === 1) {
                  drawWallTile(ctx, r, c);
              } else if (map[r][c] === 2) {
                  drawDot(ctx, c, r);
              } else if (map[r][c] === 3) {
                  drawPowerPellet(ctx, c, r, frameCount);
              } else if (map[r][c] === 4) {
                  drawSpeedItem(ctx, c, r, frameCount);
              } else if (map[r][c] === 5) {
                  drawFreezeItem(ctx, c, r, frameCount);
              } else if (map[r][c] === 6) {
                  let px = c * TS, py = r * TS;
                  ctx.fillStyle = '#ff4500';
                  let pulse = (frameCount % 4 === 0) ? 1 : 0;
                  ctx.fillRect(px + 4 - pulse, py + 4 - pulse, TS - 8 + pulse * 2, TS - 8 + pulse * 2);
              }
          }
      }

      if (fruitActive) {
          drawFruit(ctx, 7, 12);
      }
      
      drawPacman(ctx, px, py, pdx, pdy, frameCount, speedSkillTimer);
      
      for (let i = 0; i < numGhosts; i++) {
          drawGhost(ctx, ghosts[i], frameCount, frightTimer);
      }

      for (let s of shockwaves) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, s.alpha);
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
      }

      for (let p of particles) {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 2, 2);
      }

      for (let pop of popups) {
          ctx.fillStyle = pop.color;
          ctx.font = 'bold 10px monospace';
          ctx.fillText(pop.text, pop.x - 10, pop.y);
      }
      
      ctx.fillStyle = '#fff';
      ctx.font = '11px monospace';
      ctx.textBaseline = 'top';
      const diffNames = ['EASY', 'NORM', 'HARD'];
      ctx.fillText(`Lv:${level}/20 Sc:${score} HI:${highScore} Lvs:${lives}`, 4, 302);
      let rText = replayMode === 1 ? ' [REC]' : (replayMode === 2 ? ' [PLAY]' : '');
      ctx.fillText(`Diff:${diffNames[diffMode]}${rText} Save:V Load:L Bind:K`, 4, 316);
      ctx.fillStyle = '#00ffcc';
      ctx.fillText(`[Press H for Help] Export/Import:E`, 4, 330);

      if (bindState > 0) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
          ctx.fillRect(0, 0, 300, 340);
          ctx.fillStyle = '#ff6464';
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'center';
          const bindNames = ["", "UP", "DOWN", "LEFT", "RIGHT", "SKILL 1 (FREEZE)", "SKILL 2 (SPRINT)", "SKILL 3 (MAGNET)", "SKILL 4 (SHIELD)"];
          ctx.fillText(`PRESS KEY FOR ${bindNames[bindState]}`, 150, 170);
          ctx.textAlign = 'left';
      } else if (showHelp) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
          ctx.fillRect(0, 0, 300, 340);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('KPac - Help & Controls', 150, 40);
          ctx.font = '12px sans-serif';
          ctx.fillText('Move: Arrows or WASD', 150, 70);
          ctx.fillText('Skills: F, Z, M, B (or buttons)', 150, 90);
          ctx.fillText('Diff: 1(Easy) 2(Norm) 3(Hard)', 150, 110);
          ctx.fillText('Save/Load: V / L  |  Pause: P', 150, 130);
          ctx.fillText('Keybinds: K  |  JSON: E', 150, 150);
          ctx.fillText('Replay: R(Rec) T(Play)', 150, 170);
          ctx.fillText('Avoid ghosts, eat all dots.', 150, 200);
          ctx.fillText('Power pellets let you eat ghosts!', 150, 220);
          ctx.fillStyle = '#00e676';
          ctx.fillText('Press H to start/resume', 150, 260);
          ctx.textAlign = 'left';
      }

      if (level === 20 && bossHp > 0) {
          ctx.fillStyle = '#ffd700';
          ctx.font = 'bold 10px monospace';
          ctx.fillText(`BOSS KING HP:${bossHp}/${bossMaxHp}`, 180, 308);
      }
      
      if (saveMsgTimer > 0) {
          ctx.fillStyle = '#ffeb3b';
          ctx.font = 'bold 12px monospace';
          ctx.fillText(saveMsgText, 85, 175);
      }

      if (victoryTimer > 0) {
          ctx.fillStyle = '#00e676';
          ctx.font = 'bold 14px monospace';
          ctx.fillText('MAZE CLEARED!', 90, 150);
      } else if (gameOver) {
          if (gameOver === 2) {
              ctx.fillStyle = '#00e676';
              ctx.font = 'bold 12px monospace';
              ctx.fillText('CAMPAIGN VICTORY!', 85, 140);
          } else {
              ctx.fillStyle = '#ff1744';
              ctx.font = 'bold 12px monospace';
              ctx.fillText('GAME OVER', 115, 140);
          }
          ctx.fillStyle = '#fff';
          ctx.font = '10px monospace';
          ctx.fillText(`Games: ${statsGamesPlayed} Ghosts: ${statsGhostsEaten} Max: ${statsMaxScore}`, 35, 160);
      } else if (paused) {
          ctx.fillStyle = '#ffeb3b';
          ctx.font = 'bold 12px monospace';
          ctx.fillText('PAUSED', 125, 150);
      }
  }

  init(false);
  setInterval(() => {
      update();
      draw();
  }, 100);
</script>
</body>
</html>
