<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KPac</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background-color: #030611;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    text-rendering: optimizeLegibility;
  }
  #game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #080d1a;
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 15px rgba(30, 136, 229, 0.3);
    border: 1px solid #1e88e5;
  }
  canvas {
    width: 300px;
    height: 340px;
    border-radius: 6px;
    background-color: #030611;
  }
  .skills-bar {
    display: flex;
    gap: 4px;
    margin-top: 8px;
    width: 100%;
    max-width: 300px;
  }
  .skill-btn {
    flex: 1;
    background: linear-gradient(185deg, #1565c0, #0d47a1);
    color: #fff;
    border: 1px solid #42a5f5;
    border-radius: 6px;
    padding: 5px 2px;
    font-size: 9px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    user-select: none;
  }
  .skill-btn:hover:not(:disabled) {
    background: linear-gradient(185deg, #1e88e5, #1565c0);
    box-shadow: 0 0 8px rgba(66, 165, 245, 0.6);
  }
  .skill-btn:active:not(:disabled) {
    transform: scale(0.96);
  }
  .skill-btn:disabled {
    background: #1a2332;
    border-color: #37474f;
    color: #78909c;
    cursor: not-allowed;
  }
  .skill-btn.active {
    background: linear-gradient(185deg, #00c853, #00a152);
    border-color: #69f0ae;
    box-shadow: 0 0 10px rgba(105, 240, 174, 0.8);
  }
  .craft-btn {
    background: linear-gradient(185deg, #7b1fa2, #4a148c);
    border-color: #ba68c8;
  }
  .mode-btn {
    background: linear-gradient(185deg, #e65100, #bf360c);
    border-color: #ff9800;
  }
</style>
</head>

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, dur, type='square') {
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + dur);
      osc.stop(audioCtx.currentTime + dur);
  }

          if (bindState > 0) bindState++;
          return;
      }
      if (e.key === 'k' || e.key === 'K') { bindState = 1; return; }

      if (e.key === '0' || (showCraftMenu && e.key === '4')) { craftItem(4); return; }

      if (showHelp || showCraftMenu) return;

      if (e.key === 'e' || e.key === 'E') {
          let mode = prompt("Type 'E' to Export JSON or 'I' to Import JSON:");

              if (mode.toUpperCase() === 'E') {

                          if (data.highScore !== undefined) highScore = data.highScore;
                          if (data.endlessHighWave !== undefined) endlessHighWave = data.endlessHighWave;
                          if (data.craftEctoplasm !== undefined) craftEctoplasm = data.craftEctoplasm;
                          if (data.craftFruitEssence !== undefined) craftFruitEssence = data.craftFruitEssence;
                          if (data.craftStarDust !== undefined) craftStarDust = data.craftStarDust;
                          saveStorage();
                          saveMsgText = 'JSON IMPORTED'; saveMsgTimer = 25;
                      } catch(err) { alert("Invalid JSON"); }
                  }
              }
          }
          return;
      }

      if (e.key === 'r' || e.key === 'R') {
          if (replayMode === 1) { replayMode = 0; saveMsgText = 'RECORD STOPPED'; saveMsgTimer = 25; }
          else {
              replayMode = 1; replays = [];
              replaySeed = Math.floor(Math.random() * 1000000); randSeed = replaySeed;
              replayDiffMode = diffMode; init(false);
              saveMsgText = 'RECORDING...'; saveMsgTimer = 25;
          }
          return;
      }
      if (e.key === 't' || e.key === 'T') {
          if (replayMode === 2) { replayMode = 0; saveMsgText = 'PLAYBACK STOPPED'; saveMsgTimer = 25; }
          else if (replays.length > 0) {

          }

      if ((e.key === 'p' || e.key === 'P') && !gameOver) paused = !paused;
      if (e.key === '1') { diffMode = 0; saveMsgText = 'DIFF: EASY'; saveMsgTimer = 20; playSound(400, 0.1, 'sine'); }

                      g.x = 7; g.y = 6; g.isDead = 0;
                  }
              }
              for (let r = py - 5; r <= py + 5; r++) {
                  for (let c = px - 5; c <= px + 5; c++) {
                      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                          if (map[r][c] >= 2 && map[r][c] <= 5) {
                              score += 20;
                              map[r][c] = 0;
                              dotCount--;
                          }
                      }
                  }
              }
              saveMsgText = 'CRAFTED: VOID BOMB!';
              saveMsgTimer = 25;
              saveStorage();
              playSound(400, 0.5, 'sawtooth');
              addExplosion(px * TS + TS/2, py * TS + TS/2, '#c832ff');
              addPopup(px * TS + TS/2, py * TS + TS/2, 'VOID BOMB PULSE!', '#c832ff');
          } else {
              saveMsgText = 'NEED: 3 ECTO + 3 DUST + 1 ESS';
              saveMsgTimer = 25;
              playSound(200, 0.2, 'sawtooth');
          }
      }
  }

  function attemptSkill(type) {
      if (replayMode === 1) replays.push({f: frameCount, act: type});
      if (type === 's1') triggerFreezeSkill();
      if (type === 's2') triggerSpeedSkill();
      if (type === 's3') triggerMagnetSkill();
      if (type === 's4') triggerShieldSkill();

  function getInitLives() {
      if (diffMode === 0) return 5;
      if (diffMode === 2) return 2;

  function saveGame() {
      const data = {
          px, py, pdx, pdy, ndx, ndy,
          ghosts, map, score, level, lives, diffMode,
          frightTimer, freezeSkillTimer, speedSkillTimer, magnetSkillTimer, shieldActive, shieldHits,
          freezeCooldown, speedCooldown, magnetCooldown, shieldCooldown,
          bossHp, dotCount, frameCount, fruitActive, fruitTimer, gameOver, vipX, vipY, vipActive,
          gameMode, endlessWave, endlessHighWave, craftEctoplasm, craftFruitEssence, craftStarDust
      };
      localStorage.setItem('kpac_save_state', JSON.stringify(data));
      saveMsgText = 'GAME SAVED';
      saveMsgTimer = 25;
      playSound(700, 0.15, 'sine');
  }

  function loadGame() {
      const raw = localStorage.getItem('kpac_save_state');
      if (!raw) {
          saveMsgText = 'NO SAVE FOUND';
          saveMsgTimer = 25;
          playSound(200, 0.2, 'sawtooth');
          return;
      }
      try {
          const data = JSON.parse(raw);
          px = data.px; py = data.py; pdx = data.pdx; pdy = data.pdy;
          ndx = data.ndx; ndy = data.ndy;
          ghosts = data.ghosts; map = data.map;
          score = data.score; level = data.level; lives = data.lives;
          diffMode = data.diffMode !== undefined ? data.diffMode : 1;
          frightTimer = data.frightTimer;
          freezeSkillTimer = data.freezeSkillTimer || 0;
          speedSkillTimer = data.speedSkillTimer || 0;
          magnetSkillTimer = data.magnetSkillTimer || 0;
          shieldActive = data.shieldActive || 0;
          shieldHits = data.shieldHits || 1;
          freezeCooldown = data.freezeCooldown || 0;
          speedCooldown = data.speedCooldown || 0;
          magnetCooldown = data.magnetCooldown || 0;
          shieldCooldown = data.shieldCooldown || 0;
          bossHp = data.bossHp || 8;
          dotCount = data.dotCount;
          frameCount = data.frameCount; fruitActive = data.fruitActive;
          fruitTimer = data.fruitTimer; gameOver = data.gameOver;
          vipX = data.vipX || 7; vipY = data.vipY || 7; vipActive = data.vipActive || 0;
          gameMode = data.gameMode || 0; endlessWave = data.endlessWave || 1; endlessHighWave = data.endlessHighWave || 1;
          craftEctoplasm = data.craftEctoplasm || 0; craftFruitEssence = data.craftFruitEssence || 0; craftStarDust = data.craftStarDust || 0;
          paused = false;
          saveMsgText = 'GAME LOADED';
          saveMsgTimer = 25;
          playSound(900, 0.15, 'sine');
      } catch(e) {}
  }

  let popups = [];
  let particles = [];
  let shockwaves = [];

  function addSparks(cx, cy, color, count=8) {
      for (let i = 0; i < count; i++) {
          let ang = Math.random() * Math.PI * 2;
          let spd = 1 + Math.random() * 4;
          particles.push({
              x: cx, y: cy,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              life: 20 + Math.random() * 10,
              maxLife: 30,
              color: color
          });
      }
  }

  function addExplosion(cx, cy, color) {
      addShockwave(cx, cy, color, true);
      addShockwave(cx, cy, '#ffffff', false);
      addSparks(cx, cy, color, 15);
      addSparks(cx, cy, '#ffffff', 10);
      screenShake = 15;
  }

  function addPopup(cx, cy, text, color='#fff') {
      popups.push({ x: cx, y: cy, text: text, color: color, life: 20 });
  }

  function addShockwave(cx, cy, color='#ffb852', is3D=false) {
      shockwaves.push({ x: cx, y: cy, r: 2, maxR: 28, alpha: 1.0, color: color, is3D: is3D });
  }

  function generateProceduralMaze(wave) {
      let m = [];
      for (let r = 0; r < ROWS; r++) {
          let row = [];
          for (let c = 0; c < COLS; c++) {
              if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) row.push(1);
              else row.push(2);
          }
          m.push(row);
      }
      let seed = wave * 179 + 31;
      for (let r = 2; r < ROWS - 2; r += 2) {
          for (let c = 2; c <= Math.floor(COLS / 2); c += 2) {
              let opp = COLS - 1 - c;
              let blk = (seed + r * 5 + c * 7) % 5;
              if (blk === 0) {
                  m[r][c] = 1; m[r][opp] = 1;
                  m[r+1][c] = 1; m[r+1][opp] = 1;
              } else if (blk === 1) {
                  m[r][c] = 1; m[r][opp] = 1;
                  m[r][c+1] = 1; m[r][opp-1] = 1;
              } else if (blk === 2) {
                  m[r][c] = 1; m[r][opp] = 1;
              }
          }
      }
      for (let r = 6; r <= 8; r++) {
          for (let c = 5; c <= 9; c++) m[r][c] = 0;
      }
      m[6][5] = 1; m[7][5] = 1; m[8][5] = 1;
      m[6][9] = 1; m[7][9] = 1; m[8][9] = 1;
      m[8][6] = 1; m[8][7] = 1; m[8][8] = 1;
      m[6][6] = 1; m[6][7] = 1; m[6][8] = 1;
      m[7][0] = 0; m[7][1] = 2; m[7][COLS-1] = 0; m[7][COLS-2] = 2;
      m[12][7] = 0; m[11][7] = 2; m[12][6] = 2; m[12][8] = 2;
      m[1][1] = 3; m[1][COLS-2] = 3; m[ROWS-2][1] = 3; m[ROWS-2][COLS-2] = 3;
      m[3][3] = 4; m[3][COLS-4] = 5; m[ROWS-4][3] = 5; m[ROWS-4][COLS-4] = 4;
      if (wave >= 3) {
          if (m[4][7] === 2) m[4][7] = 6;
          if (m[10][7] === 2) m[10][7] = 6;
      }
      return m;
  }

  function init(keepScore) {
      if (!keepScore) {
          score = 0;
          if (gameMode === 0) level = 1;
          else endlessWave = 1;
          lives = getInitLives();
      }
      if (gameMode === 1) {
          map = generateProceduralMaze(endlessWave);
      } else {
          const mapIndex = (level - 1) % 20;
          map = maps[mapIndex].map(row => [...row]);
      }
      px = 7; py = 12;
      pdx = 0; pdy = 0; ndx = 0; ndy = 0;
      sludgeTraps = [];
      playerSlowTimer = 0;

      // 5 AI Ghost Personalities with Procedural Traits
      let effWave = (gameMode === 1) ? endlessWave : level;
      let t0 = (effWave >= 2) ? ((effWave % 5) + 1) : 0;
      let t1 = (effWave >= 3) ? (((effWave + 2) % 5) + 1) : 0;
      let t2 = (effWave >= 4) ? (((effWave + 3) % 5) + 1) : 0;
      let t3 = (effWave >= 5) ? (((effWave + 4) % 5) + 1) : 0;
      let t4 = (effWave >= 6) ? (((effWave + 1) % 5) + 1) : 0;

      ghosts = [
          {x: 7, y: 6, dirX: 0, dirY: -1, color: '#ff1744', type: 0, isPhantom: 0, phantomTimer: 0, isDead: 0, trait: t0},
          {x: 6, y: 7, dirX: -1, dirY: 0, color: '#f06292', type: 1, isPhantom: 0, phantomTimer: 0, isDead: 0, trait: t1},
          {x: 8, y: 7, dirX: 1, dirY: 0, color: '#00e5ff', type: 2, isPhantom: 0, phantomTimer: 0, isDead: 0, trait: t2},
          {x: 7, y: 7, dirX: 0, dirY: 1, color: '#ff9100', type: 3, isPhantom: 0, phantomTimer: 0, isDead: 0, trait: t3},
          {x: 7, y: 5, dirX: 0, dirY: -1, color: '#ab47bc', type: 4, isPhantom: 0, phantomTimer: 0, isDead: 0, trait: t4}
      ];

      if (gameMode === 0 && level === 20) {
          // Stage 20 Ghost King Boss
          ghosts.push({x: 7, y: 6, dirX: 0, dirY: -1, color: '#ffd700', type: 5, isPhantom: 0, phantomTimer: 0, isDead: 0, trait: 5});
          ghosts.push({x: 0, y: 0, dirX: 0, dirY: 0, color: '#ce93d8', type: 6, isPhantom: 1, phantomTimer: 0, isDead: 0, trait: 0});
          ghosts.push({x: 0, y: 0, dirX: 0, dirY: 0, color: '#ce93d8', type: 6, isPhantom: 1, phantomTimer: 0, isDead: 0, trait: 0});
          numGhosts = 6;
          bossHp = 8;
          bossMaxHp = 8;
          phantomSpawnTimer = 0;
      } else if (effWave >= 4) {
          numGhosts = 5;
      } else if (effWave === 3) {
          numGhosts = 4;
      } else if (effWave === 2) {
          numGhosts = 3;
      } else {
          numGhosts = 2;
      }

      vipActive = (gameMode === 0 && level % 5 === 0 && level !== 20) ? 1 : 0;
      vipX = 7; vipY = 7;
      if (gameMode === 0 && level % 3 === 0 && level < 18 && map[Math.floor(ROWS/2)][Math.floor(COLS/2)] !== 1) {
          map[Math.floor(ROWS/2)][Math.floor(COLS/2)] = 8;
      }

      frightTimer = 0;
      victoryTimer = 0;
      deathTimer = 0;
      freezeSkillTimer = 0; freezeCooldown = 0;
      speedSkillTimer = 0; speedCooldown = 0;
      magnetSkillTimer = 0; magnetCooldown = 0;
      shieldActive = 0; shieldCooldown = 0; shieldHits = 0;
      gameOver = 0; dotCount = 0; frameCount = 0;
      paused = false;
      fruitActive = 0;
      fruitTimer = 0;
      screenShake = 0;
      popups = [];
      particles = [];
      shockwaves = [];
      showCraftMenu = false;
      
      for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
              if (map[r][c] >= 2 && map[r][c] <= 5) dotCount++;
          }
      }
  }

  function updateSkillButtons() {
      document.getElementById('btnFreeze').disabled = freezeCooldown > 0;
      document.getElementById('btnSprint').disabled = speedCooldown > 0;
      document.getElementById('btnMagnet').disabled = magnetCooldown > 0;
      document.getElementById('btnShield').disabled = shieldCooldown > 0 || shieldActive > 0;

      document.getElementById('btnFreeze').classList.toggle('active', freezeSkillTimer > 0);
      document.getElementById('btnSprint').classList.toggle('active', speedSkillTimer > 0);
      document.getElementById('btnMagnet').classList.toggle('active', magnetSkillTimer > 0);
      document.getElementById('btnShield').classList.toggle('active', shieldActive > 0);
  }

  function update() {
      if (saveMsgTimer > 0) saveMsgTimer--;
      if (playerSlowTimer > 0) playerSlowTimer--;
      if (gameOver) {
          if (keys['Enter']) init(false);
          return;
      }
      if (showHelp || showCraftMenu || paused) return;

      if (deathTimer > 0) {
          deathTimer--;
          if (deathTimer % 2 === 0) {
              const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#00ffff', '#ff00ff'];
              addSparks(px * TS + TS/2, py * TS + TS/2, colors[Math.floor(Math.random() * colors.length)], 3);
          }
          if (deathTimer === 0) {
              lives--;
              if (lives <= 0) {
                  gameOver = 1;
                  statsGamesPlayed++;
                  saveStorage();
              } else {
                  px = 7; py = 12; pdx = 0; pdy = 0; ndx = 0; ndy = 0;
              }
          }
          for (let i = particles.length - 1; i >= 0; i--) {
              let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy += 0.15; p.life--; if (p.life <= 0) particles.splice(i, 1);
          }
          return;
      }

      if (victoryTimer > 0) {
          victoryTimer--;
          if (victoryTimer === 0) {
              if (gameMode === 1) {
                  endlessWave++;
                  if (endlessWave > endlessHighWave) endlessHighWave = endlessWave;
                  score += 1000 + endlessWave * 200;
                  craftStarDust += 2;
                  craftFruitEssence += 1;
                  saveStorage();
                  playSound(1200, 0.6, 'sine');
                  init(true);
              } else {
                  if (level === 20) {
                      gameOver = 2;
                      statsGamesPlayed++;
                      saveStorage();
                      playSound(1200, 0.8, 'sine');
                  } else {
                      level++;
                      playSound(800, 0.5, 'sine');
                      init(true);
                  }
              }
          }
          return;
      }
      
      if (replayMode === 2) {
          while (replayIndex < replays.length && replays[replayIndex].f === frameCount) {
              let ev = replays[replayIndex];
              if (ev.act === 'move') { ndx = ev.nx; ndy = ev.ny; }
              else if (ev.act === 's1') triggerFreezeSkill();
              else if (ev.act === 's2') triggerSpeedSkill();
              else if (ev.act === 's3') triggerMagnetSkill();
              else if (ev.act === 's4') triggerShieldSkill();
              replayIndex++;
          }
      } else {
          let oldNdx = ndx, oldNdy = ndy;
          if (isKey(keybinds.left)) { ndx = -1; ndy = 0; }
          if (isKey(keybinds.right)) { ndx = 1; ndy = 0; }
          if (isKey(keybinds.up)) { ndx = 0; ndy = -1; }
          if (isKey(keybinds.down)) { ndx = 0; ndy = 1; }
          if (replayMode === 1 && (ndx !== oldNdx || ndy !== oldNdy)) {
              replays.push({f: frameCount, act: 'move', nx: ndx, ny: ndy});
          }
      }
      
      if (freezeCooldown > 0) freezeCooldown--;
      if (speedCooldown > 0) speedCooldown--;
      if (magnetCooldown > 0) magnetCooldown--;
      if (shieldCooldown > 0) shieldCooldown--;

      if (freezeSkillTimer > 0) freezeSkillTimer--;
      if (frightTimer > 0) frightTimer--;
      if (screenShake > 0) screenShake--;

      updateSkillButtons();

      // Sludge Traps Update
      for (let i = sludgeTraps.length - 1; i >= 0; i--) {
          sludgeTraps[i].life--;
          if (sludgeTraps[i].life <= 0) sludgeTraps.splice(i, 1);
      }

      // Stage 20 Phantom Clone Spawner
      if (gameMode === 0 && level === 20 && bossHp > 0) {
          phantomSpawnTimer += (bossHp <= bossMaxHp / 2) ? 2 : 1;
          if (phantomSpawnTimer >= 50) {
              phantomSpawnTimer = 0;
              for (let k = 6; k <= 7; k++) {
                  if (ghosts[k].phantomTimer <= 0) {
                      ghosts[k] = {x: 7, y: 6, dirX: 0, dirY: -1, color: '#ce93d8', type: 6, isPhantom: 1, phantomTimer: 80, isDead: 0, trait: 0};
                      if (numGhosts < 8) numGhosts = 8;
                      break;
                  }
              }
          }
      }
      for (let k = 6; k <= 7; k++) {
          if (ghosts[k].isPhantom && ghosts[k].phantomTimer > 0) {
              ghosts[k].phantomTimer--;
          }
      }

      // Dead Ghost Returning Eyes Step
      for (let i = 0; i < numGhosts; i++) {
          let g = ghosts[i];
          if (g.isDead) {
              if (frameCount % 2 === 0) {
                  if (g.x < 7) g.x++;
                  else if (g.x > 7) g.x--;
                  if (g.y < 6) g.y++;
                  else if (g.y > 6) g.y--;
                  if (g.x === 7 && g.y === 6) g.isDead = 0;
              }
          }
      }
      
      // VIP Escort Logic
      if (vipActive && freezeSkillTimer === 0) {
          if (frameCount % 3 === 0) {
              let dirs = [[1,0], [-1,0], [0,1], [0,-1]];
              let d = Math.floor(Math.random() * 4);
              let nx = vipX + dirs[d][0], ny = vipY + dirs[d][1];
              if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
                  vipX = nx; vipY = ny;
              }
          }
          for (let i = 0; i < numGhosts; i++) {
              if (!ghosts[i].isDead && ghosts[i].type !== 6 && ghosts[i].x === vipX && ghosts[i].y === vipY && frightTimer === 0) {
                  lives--;
                  playSound(200, 0.5, 'sawtooth');
                  vipX = 7; vipY = 7; px = 7; py = 12;
                  if (lives <= 0) { gameOver = 1; saveStorage(); }
              }
          }
      }

      let effLvl = (gameMode === 1) ? endlessWave : level;
      let baseGhostSpeed = Math.max(1, 4 - Math.floor(effLvl/4));
      if (diffMode === 0) baseGhostSpeed += 1;
      if (diffMode === 2) baseGhostSpeed = Math.max(1, baseGhostSpeed - 1);
      let ghostSpeed = baseGhostSpeed;
      if (frightTimer > 0) ghostSpeed *= 2;
      
      if (freezeSkillTimer === 0 && frameCount % ghostSpeed === 0) {
          const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
          for (let i = 0; i < numGhosts; i++) {
              let g = ghosts[i];
              if (g.isDead) continue;
              if (g.isPhantom && g.phantomTimer <= 0) continue;

              // Trait 3: Trapper drops sludge
              if (g.trait === 3 && (frameCount % 30 === 0) && sludgeTraps.length < 16) {
                  sludgeTraps.push({x: g.x, y: g.y, life: 90});
              }

              // Trait 1: Vortex Magnet pulls player slightly
              if (g.trait === 1 && (frameCount % 10 === 0)) {
                  let distToP = Math.abs(g.x - px) + Math.abs(g.y - py);
                  if (distToP <= 3 && distToP > 1) {
                      if (px < g.x && map[py][px+1] !== 1) px++;
                      else if (px > g.x && map[py][px-1] !== 1) px--;
                  }
              }

              // Trait 2: Glitch Shifter random teleport
              if (g.trait === 2 && Math.random() < 0.04) {
                  let rx = px + Math.floor(Math.random() * 5 - 2);
                  let ry = py + Math.floor(Math.random() * 5 - 2);
                  if (rx >= 0 && rx < COLS && ry >= 0 && ry < ROWS && map[ry][rx] !== 1) {
                      g.x = rx; g.y = ry;
                      addSparks(rx * TS + TS/2, ry * TS + TS/2, '#ff00ff', 6);
                  }
              }

              let oldX = g.x, oldY = g.y;
              if (frightTimer === 0) {
                  let tx = px, ty = py;
                  if (g.type === 1) { tx = px + pdx * 3; ty = py + pdy * 3; }
                  else if (g.type === 2) { tx = px - pdx * 2; ty = py - pdy * 2; }
                  else if (g.type === 3) {
                      let distToPac = Math.abs(g.x - px) + Math.abs(g.y - py);
                      if (distToPac > 6) { tx = px; ty = py; }
                      else { tx = 0; ty = ROWS - 1; }
                  } else if (g.type === 4) { tx = px - pdx * 3; ty = py - pdy * 3; }
                  else if (g.type === 5) {
                      if (bossHp <= bossMaxHp / 2) { tx = px + pdx * 2; ty = py + pdy * 2; }
                      else { tx = px; ty = py; }
                  } else if (g.type === 6) {
                      tx = px + Math.floor(Math.random() * 5 - 2);
                      ty = py + Math.floor(Math.random() * 5 - 2);
                  }
                  
                  if (g.trait === 5 && (g.x === px || g.y === py)) { tx = px; ty = py; }

                  let best_d = -1;
                  let min_dist = 9999;
                  let randThreshold = diffMode === 0 ? 0.35 : (diffMode === 2 ? 0.1 : 0.2);
                  if (Math.random() < randThreshold) {
                      best_d = Math.floor(Math.random() * 4);
                  } else {
                      for (let d = 0; d < 4; d++) {
                          let nx = g.x + dirs[d][0], ny = g.y + dirs[d][1];
                          if (nx < 0) nx = COLS - 1;
                          if (nx >= COLS) nx = 0;
                          if (ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
                              let dist = Math.abs(nx - tx) + Math.abs(ny - ty);
                              if (dist < min_dist) { min_dist = dist; best_d = d; }
                          }
                      }
                  }
                  if (best_d !== -1) {
                      let nx = g.x + dirs[best_d][0];
                      if (nx < 0) nx = COLS - 1;
                      if (nx >= COLS) nx = 0;
                      if (map[g.y + dirs[best_d][1]][nx] !== 1) {
                          g.x = nx; g.y += dirs[best_d][1];
                      }
                  }
              } else {
                  const d = Math.floor(Math.random() * 4);
                  let nx = g.x + dirs[d][0];
                  if (nx < 0) nx = COLS - 1;
                  if (nx >= COLS) nx = 0;
                  if (map[g.y + dirs[d][1]][nx] !== 1) {
                      g.x = nx; g.y += dirs[d][1];
                  }
              }
              if (g.x < 0) g.x = COLS - 1;
              if (g.x >= COLS) g.x = 0;
              if (g.x !== oldX || g.y !== oldY) {
                  g.dirX = Math.sign(g.x - oldX);
                  g.dirY = Math.sign(g.y - oldY);
              }
          }
      }
      
      if (ndx !== 0 || ndy !== 0) {
          const nx = px + ndx, ny = py + ndy;
          if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
              pdx = ndx; pdy = ndy;
              ndx = 0; ndy = 0;
          }
      }
      
      if (speedSkillTimer > 0) speedSkillTimer--;
      let moveTick = (speedSkillTimer > 0) ? 1 : ((playerSlowTimer > 0) ? 3 : 2);
      let playerMoves = (moveTick === 1) ? true : (frameCount % moveTick === 0);
      
      if (playerMoves) {
          let nx = px + pdx, ny = py + pdy;
          if (nx < 0) nx = COLS - 1;
          if (nx >= COLS) nx = 0;
          
          if (ny >= 0 && ny < ROWS && map[ny][nx] !== 1) {
              px = nx; py = ny;

              // Check Sludge collision
              for (let s of sludgeTraps) {
                  if (s.x === px && s.y === py) {
                      if (!shieldActive) {
                          playerSlowTimer = 30;
                          addSparks(px * TS + TS/2, py * TS + TS/2, '#00e676', 5);
                      }
                  }
              }

              if (map[py][px] === 6) {
                  let cx = px * TS + TS/2, cy = py * TS + TS/2;
                  if (shieldActive) {
                      shieldHits--;
                      if (shieldHits <= 0) shieldActive = 0;
                      map[py][px] = 0;
                      addPopup(cx, cy, 'ABSORBED!', '#ff4500');
                      addExplosion(cx, cy, '#ff4500');
                      playSound(1000, 0.3, 'sine');
                  } else {
                      playSound(200, 0.5, 'sawtooth');
                      deathTimer = 40;
                  }
              } else if (map[py][px] >= 2 && map[py][px] <= 5) {
                  let cx = px * TS + TS/2, cy = py * TS + TS/2;
                  let loopNum = Math.floor((level - 1) / 20);
                  let mult = (gameMode === 1) ? (1 + Math.floor(endlessWave / 2)) : ((loopNum >= 7) ? 8 : 1);
                  if (map[py][px] === 3) {
                      score += 40 * mult; frightTimer = (loopNum >= 7) ? 0 : 50; craftStarDust++; playSound(300, 0.3, 'sawtooth');
                      addPopup(cx, cy, '+' + (40 * mult), '#ffb852');
                      addExplosion(cx, cy, '#ffb852');
                  }
                  else if (map[py][px] === 4) {
                      score += 20 * mult; speedSkillTimer = 80; playSound(900, 0.1, 'triangle');
                      addPopup(cx, cy, 'SPEED!', '#00ffff');
                      addExplosion(cx, cy, '#00ffff');
                  }
                  else if (map[py][px] === 5) {
                      score += 30 * mult; freezeSkillTimer = 60; playSound(700, 0.2, 'sine');
                      addPopup(cx, cy, 'FREEZE!', '#ffffff');
                      addExplosion(cx, cy, '#80deea');
                  }
                  else {
                      score += 10 * mult; playSound(600, 0.05, 'square');
                      if (dotCount % 25 === 0) craftStarDust++;
                  }
                  if (score > highScore) { highScore = score; }
                  if (score > statsMaxScore) { statsMaxScore = score; }
                  saveStorage();
                  map[py][px] = 0;
                  dotCount--;
                  if (dotCount === 0) {
                      victoryTimer = 30;
                      playSound(1200, 0.5, 'sine');
                  }
              } else if (map[py][px] === 8) {
                  level += Math.floor(Math.random() * 3) + 1;
                  score += 1000;
                  craftFruitEssence += 2;
                  playSound(1000, 0.3, 'sine');
                  init(true);
                  return;
              }
          }
      }

      // Dot Magnet Skill
      if (magnetSkillTimer > 0) {
          magnetSkillTimer--;
          for (let r = py - 3; r <= py + 3; r++) {
              for (let c = px - 3; c <= px + 3; c++) {
                  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                      if (map[r][c] >= 2 && map[r][c] <= 5) {
                          let cx = c * TS + TS/2, cy = r * TS + TS/2;
                          let loopNum = Math.floor((level - 1) / 20);
                          let mult = (gameMode === 1) ? (1 + Math.floor(endlessWave / 2)) : ((loopNum >= 7) ? 8 : 1);
                          if (map[r][c] === 3) { score += 40 * mult; frightTimer = (loopNum >= 7) ? 0 : 50; craftStarDust++; addPopup(cx, cy, '+' + (40 * mult), '#ffb852'); addExplosion(cx, cy, '#ffb852'); }
                          else if (map[r][c] === 4) { score += 20 * mult; speedSkillTimer = 80; addPopup(cx, cy, 'SPEED!', '#00ffff'); }
                          else if (map[r][c] === 5) { score += 30 * mult; freezeSkillTimer = 60; addPopup(cx, cy, 'FREEZE!', '#ffffff'); }
                          else { score += 10 * mult; }
                          map[r][c] = 0;
                          dotCount--;
                          addSparks(cx, cy, '#ffeb3b', 4);
                      }
                  }
              }
          }
          if (fruitActive) {
              let mult = (gameMode === 1) ? (1 + Math.floor(endlessWave / 2)) : 1;
              score += 500 * mult;
              craftFruitEssence += 2;
              fruitActive = 0;
          }
      }
      
      for (let i = 0; i < numGhosts; i++) {
          let g = ghosts[i];
          if (g.isDead) continue;
          if (g.isPhantom && g.phantomTimer <= 0) continue;

          if (px === g.x && py === g.y) {
              let cx = px * TS + TS/2, cy = py * TS + TS/2;
              if (frightTimer > 0) {
                  let loopNum = Math.floor((level - 1) / 20);
                  let mult = (gameMode === 1) ? (1 + Math.floor(endlessWave / 2)) : ((loopNum >= 7) ? 8 : 1);
                  craftEctoplasm += (g.trait > 0 ? 2 : 1);

                  if (g.type === 5) { // Ghost King Boss
                      bossHp--;
                      score += 500 * mult;
                      craftEctoplasm += 3;
                      addPopup(cx, cy, 'BOSS HIT! -1HP', '#ffd700');
                      addExplosion(cx, cy, '#ffd700');
                      g.x = 7; g.y = 6;
                      playSound(900, 0.3, 'square');
                      if (bossHp <= 0) {
                          score += 2000 * mult;
                          victoryTimer = 30;
                          statsGamesPlayed++;
                          saveStorage();
                      }
                  } else if (g.type === 6) { // Phantom Clone
                      score += 100 * mult;
                      g.phantomTimer = 0;
                      addPopup(cx, cy, '+' + (100 * mult), '#ce93d8');
                      addExplosion(cx, cy, '#ce93d8');
                  } else {
                      score += 200 * mult;
                      statsGhostsEaten++;
                      saveStorage();
                      playSound(800, 0.1, 'triangle');
                      addPopup(cx, cy, '+' + (200 * mult), '#ffeb3b');
                      addExplosion(cx, cy, '#00ffff');
                      g.isDead = 1;
                  }
              } else if (shieldActive) {
                  shieldHits--;
                  if (shieldHits <= 0) shieldActive = 0;
                  g.x = 7; g.y = 6;
                  addPopup(cx, cy, 'SHIELD ABSORBED!', '#00e5ff');
                  addExplosion(cx, cy, '#00e5ff');
                  playSound(1000, 0.3, 'sine');
              } else {
                  playSound(200, 0.5, 'sawtooth');
                  deathTimer = 40;
                  break;
              }
          }
      }
      
      if (dotCount < 40 && fruitActive === 0 && fruitTimer === 0 && Math.random() < 0.006) {
          fruitActive = 1;
          fruitTimer = 100;
      }
      if (fruitActive) {
          fruitTimer--;
          if (fruitTimer <= 0) fruitActive = 0;
          else if (px === 7 && py === 12) {
              let mult = (gameMode === 1) ? (1 + Math.floor(endlessWave / 2)) : 1;
              score += 500 * mult;
              craftFruitEssence += 2;
              let cx = 7 * TS + TS/2, cy = 12 * TS + TS/2;
              addPopup(cx, cy, '+' + (500 * mult), '#ff1744');
              addSparks(cx, cy, '#00e676', 14);
              addShockwave(cx, cy, '#00e676');
              saveStorage();
              fruitActive = 0;
              playSound(1000, 0.1, 'square');
          }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          p.x += p.vx; p.y += p.vy;
          p.vx *= 0.95; p.vy += 0.15;
          p.life--;
          if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
          let pop = popups[i];
          pop.y -= 0.5;
          pop.life--;
          if (pop.life <= 0) popups.splice(i, 1);
      }
      for (let i = shockwaves.length - 1; i >= 0; i--) {
          let s = shockwaves[i];
          s.r += 1.8;
          s.alpha -= 0.06;
          if (s.alpha <= 0 || s.r >= s.maxR) shockwaves.splice(i, 1);
      }

      frameCount++;
  }

  function drawWallTile(ctx, r, c) {
      let x = c * TS, y = r * TS;

      if (r === 6 && c === 7) {
          let dist = 99;
          for (let g of ghosts) {
              if (!g.isDead && !(g.isPhantom && g.phantomTimer <= 0)) {
                  let d = Math.abs(g.x - c) + Math.abs(g.y - r);
                  if (d < dist) dist = d;
              }
          }
          let ripple = dist < 3 ? Math.sin(frameCount * 0.5) * 4 : Math.sin(frameCount * 0.1) * 1;
          ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + Math.sin(frameCount*0.2)*0.3})`;
          ctx.lineWidth = 2 + ripple;
          ctx.beginPath();
          ctx.moveTo(x, y + TS/2 + ripple);
          ctx.bezierCurveTo(x + TS/3, y + TS/2 - ripple, x + 2*TS/3, y + TS/2 + ripple, x + TS, y + TS/2 - ripple);
          ctx.stroke();
          ctx.fillStyle = `rgba(0, 200, 255, 0.15)`;
          ctx.fillRect(x, y, TS, TS);
          return;
      }

      ctx.fillStyle = '#060a17';
      ctx.fillRect(x, y, TS, TS);

      let nU = r > 0 && map[r-1][c] === 1;
      let nD = r < ROWS-1 && map[r+1][c] === 1;
      let nL = c > 0 && map[r][c-1] === 1;
      let nR = c < COLS-1 && map[r][c+1] === 1;

      let themeCols = ['#1e88e5', '#4caf50', '#9c27b0', '#f44336', '#ff9800', '#009688'];
      let themeHis = ['#64b5f6', '#81c784', '#ba68c8', '#e57373', '#ffb74d', '#4dd0e1'];
      let themeIdx = ((gameMode === 1 ? endlessWave : level) - 1) % 6;
      let wallColor = themeCols[themeIdx];
      let wallHighlight = themeHis[themeIdx];
      if (victoryTimer > 0) {
          const colors = ['#ffffff', '#00ffff', '#ffd700', '#1e88e5'];
          wallColor = colors[(victoryTimer + r + c) % colors.length];
          wallHighlight = '#ffffff';
      }

      ctx.save();
      ctx.shadowColor = wallColor;
      ctx.shadowBlur = 6 + Math.sin(frameCount * 0.2) * 2;
      ctx.strokeStyle = wallColor;
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 2, y + 2, TS - 4, TS - 4);

      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.3 + 0.3 * Math.sin(frameCount * 0.4 + r + c)) + ')';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 3, y + 3, TS - 6, TS - 6);

      ctx.strokeStyle = wallHighlight;
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (!nU) { ctx.moveTo(x, y + 1); ctx.lineTo(x + TS, y + 1); }
      if (!nD) { ctx.moveTo(x, y + TS - 1); ctx.lineTo(x + TS, y + TS - 1); }
      if (!nL) { ctx.moveTo(x + 1, y); ctx.lineTo(x + 1, y + TS); }
      if (!nR) { ctx.moveTo(x + TS - 1, y); ctx.lineTo(x + TS - 1, y + TS); }
      ctx.stroke();

      ctx.fillStyle = wallHighlight;
      if (nU && nR) { ctx.fillRect(x + TS - 3, y, 3, 3); }
      if (nU && nL) { ctx.fillRect(x, y, 3, 3); }
      if (nD && nR) { ctx.fillRect(x + TS - 3, y + TS - 3, 3, 3); }
      if (nD && nL) { ctx.fillRect(x, y + TS - 3, 3, 3); }
      ctx.restore();
  }

  function drawDot(ctx, c, r) {
      let cx = c * TS + TS/2, cy = r * TS + TS/2;
      let radGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 10 + Math.sin(frameCount * 0.1) * 2);
      radGrad.addColorStop(0, 'rgba(255, 220, 150, 0.4)');
      radGrad.addColorStop(1, 'rgba(255, 220, 150, 0)');
      ctx.fillStyle = radGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 12, 0, Math.PI * 2);
      ctx.fill();

      let pelletGrad = ctx.createRadialGradient(cx - 1, cy - 1, 0, cx, cy, 3);
      pelletGrad.addColorStop(0, '#ffffff');
      pelletGrad.addColorStop(0.3, '#ffc896');
      pelletGrad.addColorStop(1, '#d8863b');
      ctx.fillStyle = pelletGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fill();
  }

  function drawPowerPellet(ctx, c, r, frame) {
      let cx = c * TS + TS/2, cy = r * TS + TS/2;
      let radius = 4.5 + Math.sin(frame * 0.3) * 1.5;
      let radGrad = ctx.createRadialGradient(cx, cy, 1, cx, cy, radius + 8);
      radGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      radGrad.addColorStop(0.3, 'rgba(255, 184, 82, 0.8)');
      radGrad.addColorStop(1, 'rgba(255, 184, 82, 0)');
      ctx.fillStyle = radGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 8, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.strokeStyle = `rgba(255, 215, 0, ${0.5 + Math.sin(frame * 0.1) * 0.5})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 2 + (frame % 15) * 0.2, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.75, 0, Math.PI * 2);
      ctx.fill();
  }

  function drawSpeedItem(ctx, c, r, frame) {
      let cx = c * TS + TS/2, cy = r * TS + TS/2;
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(cx + 2, cy - 6); ctx.lineTo(cx - 4, cy + 1); ctx.lineTo(cx, cy + 1);
      ctx.lineTo(cx - 2, cy + 6); ctx.lineTo(cx + 4, cy - 1); ctx.lineTo(cx, cy - 1);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
  }

  function drawFreezeItem(ctx, c, r, frame) {
      let cx = c * TS + TS/2, cy = r * TS + TS/2;
      ctx.strokeStyle = '#80deea';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy);
      ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5);
      ctx.moveTo(cx - 3, cy - 3); ctx.lineTo(cx + 3, cy + 3);
      ctx.moveTo(cx + 3, cy - 3); ctx.lineTo(cx - 3, cy + 3);
      ctx.stroke();
  }

  function drawFruit(ctx, c, r) {
      let bounceY = Math.sin(frameCount * 0.25) * 3;
      let cx = c * TS + TS/2, cy = r * TS + TS/2 + bounceY;
      ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx - 3, cy + 1); ctx.quadraticCurveTo(cx - 1, cy - 5, cx + 2, cy - 6);
      ctx.moveTo(cx + 3, cy + 2); ctx.quadraticCurveTo(cx + 1, cy - 5, cx + 2, cy - 6);
      ctx.stroke();
      ctx.fillStyle = '#d50000'; ctx.beginPath();
      ctx.arc(cx - 3, cy + 2, 3.5, 0, Math.PI * 2);
      ctx.arc(cx + 3, cy + 3, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawPacman(ctx, px, py, pdx, pdy, frame, speedTimer) {
      let cx = px * TS + TS/2, cy = py * TS + TS/2;
      let angle = 0;
      if (pdx === 1) angle = 0;
      else if (pdx === -1) angle = Math.PI;
      else if (pdy === 1) angle = Math.PI / 2;
      else if (pdy === -1) angle = 3 * Math.PI / 2;

      if (deathTimer > 0) {
          let foldProgress = (40 - deathTimer) / 40.0;
          let foldRadius = (TS/2 - 1) * (1.0 - foldProgress);
          let foldMouth = Math.PI * foldProgress;
          ctx.fillStyle = shieldActive ? '#00e5ff' : '#ffeb3b';
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, Math.max(0, foldRadius), angle + foldMouth, angle + Math.PI * 2 - foldMouth);
          ctx.closePath();
          ctx.fill();
          return;
      }

      const chompFrames = [0.45 * Math.PI, 0.28 * Math.PI, 0.05 * Math.PI, 0.28 * Math.PI];
      let mouth = chompFrames[frame % 4];

      if (shieldActive || speedTimer > 0 || pdx !== 0 || pdy !== 0) {
          ctx.save();
          ctx.strokeStyle = shieldActive ? '#00e5ff' : (speedTimer > 0 ? '#00ffff' : '#ffeb3b');
          ctx.lineWidth = shieldActive ? 3 : 2;
          ctx.shadowColor = shieldActive ? '#00e5ff' : '#ffeb3b';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(cx, cy, TS/2 + (shieldActive ? 3 : 1), 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
      }

      ctx.fillStyle = shieldActive ? '#00e5ff' : '#ffeb3b';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, TS/2 - 1, angle + mouth, angle + Math.PI * 2 - mouth);
      ctx.closePath();
      ctx.fill();

      let eyeAngle = angle - Math.PI / 3;
      let ex = cx + Math.cos(eyeAngle) * (TS / 4);
      let ey = cy + Math.sin(eyeAngle) * (TS / 4);
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(ex, ey, 1.5, 0, Math.PI * 2);
      ctx.fill();
  }

  function drawGhost(ctx, g, frame, frightTimer) {
      if (g.isPhantom && g.phantomTimer <= 0) return;

      let cx = g.x * TS + TS/2, cy = g.y * TS + TS/2;
      let w = TS - 4;
      let x = cx - w/2, y = cy - w/2;

      if (g.isDead) {
          let eyeDx = Math.sign(7 - g.x) * 2;
          let eyeDy = Math.sign(6 - g.y) * 2;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(cx - 3, cy - 2, 3, 4, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + 3, cy - 2, 3, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#1565c0';
          ctx.beginPath();
          ctx.arc(cx - 3 + eyeDx, cy - 2 + eyeDy, 1.8, 0, Math.PI * 2);
          ctx.arc(cx + 3 + eyeDx, cy - 2 + eyeDy, 1.8, 0, Math.PI * 2);
          ctx.fill();
          return;
      }

      let isScared = frightTimer > 0;
      let isFlashing = isScared && frightTimer < 15 && Math.floor(frightTimer / 2) % 2 === 0;

      // Trait Aura Ring
      if (!isScared && g.trait > 0) {
          let traitCols = ['', '#00e5ff', '#ff00ff', '#00e676', '#ffd700', '#ff4500'];
          ctx.save();
          ctx.strokeStyle = traitCols[g.trait] || '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(cx, cy, w/2 + 2, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
      }

      let bodyColor = isScared ? (isFlashing ? '#ffffff' : '#1e88e5') : g.color;

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.arc(cx, y + w/2, w/2, Math.PI, 0, false);
      ctx.lineTo(x + w, y + w);

      let skirtOffset = (frame % 2 === 0) ? 1.5 : -1.5;
      let step = w / 3;
      ctx.lineTo(x + w - step * 0.5, y + w - 3 + skirtOffset);
      ctx.lineTo(x + w - step, y + w);
      ctx.lineTo(x + step * 0.5, y + w - 3 - skirtOffset);
      ctx.lineTo(x, y + w);
      ctx.closePath();
      ctx.fill();

      if (g.type === 5) {
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.moveTo(cx - 5, y - 2); ctx.lineTo(cx - 3, y - 6); ctx.lineTo(cx, y - 3);
          ctx.lineTo(cx + 3, y - 6); ctx.lineTo(cx + 5, y - 2);
          ctx.closePath();
          ctx.fill();
      }

      if (!isScared) {
          let eyeDx = (g.dirX || 0) * 2;
          let eyeDy = (g.dirY || 0) * 2;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(cx - 3, cy - 2, 3, 4, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + 3, cy - 2, 3, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0d47a1';
          ctx.beginPath();
          ctx.arc(cx - 3 + eyeDx, cy - 2 + eyeDy, 1.8, 0, Math.PI * 2);
          ctx.arc(cx + 3 + eyeDx, cy - 2 + eyeDy, 1.8, 0, Math.PI * 2);
          ctx.fill();
      } else {
          ctx.fillStyle = isFlashing ? '#d50000' : '#ffffff';
          ctx.beginPath();
          ctx.arc(cx - 3, cy - 2, 2.5, 0, Math.PI * 2);
          ctx.arc(cx + 3, cy - 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
      }
  }

  function draw() {
      ctx.fillStyle = '#030611';
      ctx.fillRect(0, 0, 300, 340);

      ctx.save();
      if (screenShake > 0) {
          let sx = (Math.random() - 0.5) * screenShake;
          let sy = (Math.random() - 0.5) * screenShake;
          ctx.translate(sx, sy);
      }

      // Cyber-grid background environmental art
      ctx.strokeStyle = 'rgba(30, 136, 229, 0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 300; i += 20) {
          ctx.moveTo(i, 0); ctx.lineTo(i, 340);
      }
      for (let j = 0; j <= 340; j += 20) {
          ctx.moveTo(0, j); ctx.lineTo(300, j);
      }
      ctx.stroke();

      for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
              if (map[r][c] === 1) drawWallTile(ctx, r, c);
              else if (map[r][c] === 2) drawDot(ctx, c, r);
              else if (map[r][c] === 3) drawPowerPellet(ctx, c, r, frameCount);
              else if (map[r][c] === 4) drawSpeedItem(ctx, c, r, frameCount);
              else if (map[r][c] === 5) drawFreezeItem(ctx, c, r, frameCount);
              else if (map[r][c] === 6) {
                  let px = c * TS, py = r * TS;
                  ctx.fillStyle = '#ff4500';
                  let pulse = (frameCount % 4 === 0) ? 1 : 0;
                  ctx.fillRect(px + 4 - pulse, py + 4 - pulse, TS - 8 + pulse * 2, TS - 8 + pulse * 2);
              } else if (map[r][c] === 8) {
                  let cx = c * TS + TS/2, cy = r * TS + TS/2;
                  ctx.fillStyle = '#c832ff';
                  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
              }
          }
      }

      // Draw Sludge Traps
      for (let s of sludgeTraps) {
          ctx.fillStyle = '#00e676';
          ctx.fillRect(s.x * TS + 5, s.y * TS + 5, 10, 10);
      }

      if (fruitActive) drawFruit(ctx, 7, 12);
      drawPacman(ctx, px, py, pdx, pdy, frameCount, speedSkillTimer);
      
      if (vipActive) {
          ctx.fillStyle = '#4caf50';
          ctx.beginPath();
          ctx.arc(vipX * TS + TS/2, vipY * TS + TS/2, TS/2 - 2, 0, Math.PI * 2);
          ctx.fill();
      }

      for (let i = 0; i < numGhosts; i++) {
          drawGhost(ctx, ghosts[i], frameCount, frightTimer);
      }

      for (let s of shockwaves) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, s.alpha);
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
      }

      for (let p of particles) {
          ctx.globalAlpha = Math.max(0, p.life / (p.maxLife || 30));
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      for (let pop of popups) {
          ctx.fillStyle = pop.color;
          ctx.font = 'bold 10px monospace';
          ctx.fillText(pop.text, pop.x - 10, pop.y);
      }
      
      ctx.restore();

      ctx.fillStyle = '#fff';
      ctx.font = '10px monospace';
      ctx.textBaseline = 'top';
      if (gameMode === 1) {
          ctx.fillText(`[ENDLESS W:${endlessWave}/HI:${endlessHighWave}] Sc:${score} Lvs:${lives}`, 4, 302);
      } else {
          ctx.fillText(`[CAMP Lv:${level}/20] Sc:${score} HI:${highScore} Lvs:${lives}`, 4, 302);
      }
      ctx.fillStyle = '#00ffcc';
      ctx.fillText(`Ecto:${craftEctoplasm} Ess:${craftFruitEssence} Dust:${craftStarDust} | [C]Forge [O]Mode`, 4, 314);
      ctx.fillStyle = '#ffeb3b';
      let rText = replayMode === 1 ? ' [REC]' : (replayMode === 2 ? ' [PLAY]' : '');
      ctx.fillText(`F:${freezeCooldown>0?'CD':'OK'} Z:${speedCooldown>0?'CD':'OK'} M:${magnetCooldown>0?'CD':'OK'} B:${shieldActive?'ON':(shieldCooldown>0?'CD':'OK')}${rText} [H]Help`, 4, 326);

      if (showCraftMenu) {
          ctx.fillStyle = 'rgba(5, 12, 25, 0.92)';
          ctx.fillRect(10, 20, 280, 260);
          ctx.strokeStyle = '#00e5ff';
          ctx.lineWidth = 2;
          ctx.strokeRect(10, 20, 280, 260);

          ctx.fillStyle = '#00e5ff';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('=== THE CYBER FORGE ===', 150, 30);
          ctx.font = '11px monospace';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'left';
          ctx.fillText('1 / [7]: Super Pellet (2 Ecto + 1 Dust)', 20, 60);
          ctx.fillText('2 / [8]: Chrono Warp (2 Ecto + 2 Ess)', 20, 90);
          ctx.fillText('3 / [9]: Aegis Shield 2X (2 Dust + 2 Ess)', 20, 120);
          ctx.fillText('4 / [0]: Void Pulse Bomb (3E + 3D + 1Ess)', 20, 150);
          
          ctx.fillStyle = '#ffd700';
          ctx.fillText(`Stock: ${craftEctoplasm} Ecto, ${craftFruitEssence} Ess, ${craftStarDust} Dust`, 20, 190);
          ctx.fillStyle = '#00e676';
          ctx.fillText('Press 1-4 or 7-0 to Craft | [C] Close', 25, 230);
      } else if (showHelp) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
          ctx.fillRect(0, 0, 300, 340);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 15px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('KPac Loop 10 - Help', 150, 25);
          ctx.font = '11px sans-serif';
          ctx.fillText('Move: Arrows or WASD', 150, 50);
          ctx.fillText('Skills: F(Freeze) Z(Sprint) M(Magnet) B(Shield)', 150, 70);
          ctx.fillText('Modes: [O] Toggle Campaign / Endless', 150, 90);
          ctx.fillText('Crafting: [C] Cyber-Forge Menu', 150, 110);
          ctx.fillText('Quick-Craft: 7(Pellet) 8(Warp) 9(Shield) 0(Nuke)', 150, 130);
          ctx.fillText('Diff: 1(Easy) 2(Norm) 3(Hard) | Save: V / L', 150, 150);
          ctx.fillText('Avoid ghosts, eat dots, craft powerups!', 150, 180);
          ctx.fillStyle = '#00e676';
          ctx.fillText('Press H or F1 to start/resume', 150, 220);
          ctx.textAlign = 'left';
      }

      if (saveMsgTimer > 0) {
          ctx.fillStyle = '#ffeb3b';
          ctx.font = 'bold 12px monospace';
          ctx.fillText(saveMsgText, 80, 160);
      }

      if (victoryTimer > 0) {
          ctx.fillStyle = '#00e676';
          ctx.font = 'bold 14px monospace';
          ctx.fillText(gameMode === 1 ? 'WAVE CLEARED!' : 'MAZE CLEARED!', 85, 150);
      } else if (gameOver) {
          if (gameOver === 2) {
              ctx.fillStyle = '#00e676';
              ctx.font = 'bold 12px monospace';
              ctx.fillText('CAMPAIGN VICTORY!', 85, 140);
          } else {
              ctx.fillStyle = '#ff1744';
              ctx.font = 'bold 12px monospace';
              ctx.fillText('GAME OVER', 115, 140);
          }
          ctx.fillStyle = '#fff';
          ctx.font = '10px monospace';
          ctx.fillText(`Games: ${statsGamesPlayed} Ghosts: ${statsGhostsEaten} Max: ${statsMaxScore}`, 35, 160);
      } else if (paused) {
          ctx.fillStyle = '#ffeb3b';
          ctx.font = 'bold 12px monospace';
          ctx.fillText('PAUSED', 125, 150);
      }
  }

  init(false);
  setInterval(() => {
      update();
      draw();
  }, 100);
</script>
</body>
</html>
