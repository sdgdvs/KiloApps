<!DOCTYPE html>
<html>
<head>
<title>KMine</title>
<style>
  body { margin: 0; background-color: #c0c0c0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; font-family: sans-serif; }
  canvas { background-color: #c0c0c0; border: 2px solid #808080; border-right-color: #fff; border-bottom-color: #fff; cursor: pointer; }
  #controls { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button, select { padding: 4px 8px; font-family: inherit; }
  .stats-box { font-size: 12px; background: #eee; padding: 4px 8px; border: 1px solid #aaa; border-radius: 4px; }
</style>
</head>
<body oncontextmenu="return false;">
<div id="controls">
  <select id="diff" onchange="changeDiff()">
    <option value="0">Beginner</option>
    <option value="1" selected>Intermediate</option>
    <option value="2">Expert</option>
  </select>
  <button onclick="initGame()">Restart</button>
  <button onclick="giveHint()" title="Press H for Hint">Hint (H)</button>
  <span id="status" style="font-family: monospace; font-weight: bold; min-width: 140px; display: inline-block;"></span>
  <div class="stats-box">Best: <span id="bestTime">--</span>s</div>
  <button onclick="exportStats()">Export Stats</button>
  <button onclick="document.getElementById('fileIn').click()">Import Stats</button>
  <input type="file" id="fileIn" style="display:none" accept=".json" onchange="importStats(event)">
  <button id="replayBtn" style="display:none;" onclick="startReplay()">Watch Replay</button>
</div>
<div style="font-size:14px; font-weight: bold; margin-bottom: 5px;">Press H for Hint | F5: Quicksave | F9: Quickload</div>
<canvas id="cvs"></canvas>
<script>
  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');
  
  const CELL = 30;
  let cols = 16;
  let rows = 16;
  let totalMines = 40;
  let grid = [];
  let state = [];
  let gameOver = 0; // 0: playing, 1: lost, 2: won
  let flags = 0;
  let timeElapsed = 0;
  let timerInterval = null;
  let firstClick = true;
  
  let bestTimes = { "0": null, "1": null, "2": null };
  let moves = [];
  let isReplaying = false;
  let startRealTime = 0;
  let quickSaveData = null;
  
  function loadStats() {
      let s = localStorage.getItem('kmine_best');
      if(s) { try { bestTimes = JSON.parse(s); } catch(e){} }
      updateBestTimeDisplay();
  }
  function saveStats() {
      localStorage.setItem('kmine_best', JSON.stringify(bestTimes));
      updateBestTimeDisplay();
  }
  function updateBestTimeDisplay() {
      let d = document.getElementById('diff').value;
      document.getElementById('bestTime').innerText = bestTimes[d] !== null ? bestTimes[d] : '--';
  }
  function exportStats() {
      let blob = new Blob([JSON.stringify(bestTimes)], {type: 'application/json'});
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'kmine_stats.json';
      a.click();
  }
  function importStats(e) {
      let file = e.target.files[0];
      if(!file) return;
      let reader = new FileReader();
      reader.onload = function(ev) {
          try {
              let parsed = JSON.parse(ev.target.result);
              if (parsed && typeof parsed === 'object') {
                  bestTimes = Object.assign(bestTimes, parsed);
                  saveStats();
              }
          } catch(err) { alert('Invalid JSON'); }
      };
      reader.readAsText(file);
      e.target.value = '';
  }

  function updateStatus() {
      const statusEl = document.getElementById('status');
      if (gameOver === 2) {
          statusEl.innerText = `YOU WIN! Time: ${timeElapsed}s`;
          statusEl.style.color = "green";
      } else if (gameOver === 1) {
          statusEl.innerText = `GAME OVER! Time: ${timeElapsed}s`;
          statusEl.style.color = "red";
      } else {
          statusEl.innerText = `Mines: ${totalMines - flags} | Time: ${timeElapsed}s`;
          statusEl.style.color = "black";
      }
  }
  
  function startTimer() {
      if (!timerInterval && !isReplaying) {
          timerInterval = setInterval(() => {
              if (gameOver === 0 && !isReplaying) {
                  timeElapsed++;
                  updateStatus();
              }
          }, 1000);
      }
  }
  
  function stopTimer() {
      if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
      }
  }
  
  function checkWin() {
      let unrevealed = 0;
      for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
              if (state[y][x] !== 1) unrevealed++;
          }
      }
      if (unrevealed === totalMines) {
          gameOver = 2; // Win
          stopTimer();
          updateStatus();
          document.getElementById('replayBtn').style.display = 'inline-block';
          if (!isReplaying) {
              let d = document.getElementById('diff').value;
              if (bestTimes[d] === null || timeElapsed < bestTimes[d]) {
                  bestTimes[d] = timeElapsed;
                  saveStats();
              }
          }
      }
  }
  
  function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      cvs.width = cols * CELL * dpr;
      cvs.height = rows * CELL * dpr;
      cvs.style.width = `${cols * CELL}px`;
      cvs.style.height = `${rows * CELL}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function changeDiff() {
      const val = document.getElementById('diff').value;
      if (val === "0") { cols = 10; rows = 10; totalMines = 15; }
      else if (val === "1") { cols = 16; rows = 16; totalMines = 40; }
      else if (val === "2") { cols = 30; rows = 16; totalMines = 99; }
      updateBestTimeDisplay();
      setupCanvas();
      initGame();
  }
  
  function generateMines(safeX, safeY) {
      grid = Array.from({length: rows}, () => Array(cols).fill(0));
      let mines = 0;
      while (mines < totalMines) {
          let x = Math.floor(Math.random() * cols);
          let y = Math.floor(Math.random() * rows);
          if (grid[y][x] !== 9 && !(x === safeX && y === safeY)) {
              grid[y][x] = 9;
              mines++;
          }
      }
      for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
              if (grid[y][x] === 9) continue;
              let count = 0;
              for (let dy = -1; dy <= 1; dy++) {
                  for (let dx = -1; dx <= 1; dx++) {
                      let nx = x + dx;
                      let ny = y + dy;
                      if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && grid[ny][nx] === 9) {
                          count++;
                      }
                  }
              }
              grid[y][x] = count;
          }
      }
  }
  
  function initGame(keepGrid = false) {
      gameOver = 0;
      flags = 0;
      timeElapsed = 0;
      firstClick = !keepGrid;
      isReplaying = false;
      document.getElementById('replayBtn').style.display = 'none';
      stopTimer();
      updateStatus();
      if (!keepGrid) {
          grid = Array.from({length: rows}, () => Array(cols).fill(0));
          moves = [];
      }
      state = Array.from({length: rows}, () => Array(cols).fill(0));
      draw();
  }

  function applyAction(x, y, btn) {
      if (btn === 0) {
          if (firstClick) {
              firstClick = false;
              generateMines(x, y);
              startRealTime = Date.now();
              if (!isReplaying) startTimer();
          }
          if (state[y][x] === 1) {
              chord(x, y);
          } else if (state[y][x] === 0) {
              reveal(x, y);
          }
          if (gameOver === 0) checkWin();
      } else if (btn === 2) {
          if (state[y][x] !== 1) {
              if (state[y][x] === 0) { state[y][x] = 2; flags++; }
              else { state[y][x] = 0; flags--; }
              updateStatus();
          }
      }
  }
  
  function reveal(x, y) {
      if (x < 0 || x >= cols || y < 0 || y >= rows || state[y][x] !== 0) return;
      state[y][x] = 1;
      if (grid[y][x] === 9) {
          gameOver = 1;
          stopTimer();
          updateStatus();
          document.getElementById('replayBtn').style.display = 'inline-block';
          for (let i=0; i<rows; i++) {
              for (let j=0; j<cols; j++) {
                  if (grid[i][j] === 9) state[i][j] = 1;
              }
          }
          return;
      }
      if (grid[y][x] === 0) {
          for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                  reveal(x + dx, y + dy);
              }
          }
      }
  }
  
  function chord(x, y) {
      if (state[y][x] !== 1 || grid[y][x] <= 0 || grid[y][x] >= 9) return;
      let flagCount = 0;
      for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
              let nx = x + dx;
              let ny = y + dy;
              if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && state[ny][nx] === 2) flagCount++;
          }
      }
      if (flagCount === grid[y][x]) {
          for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                  let nx = x + dx;
                  let ny = y + dy;
                  if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && state[ny][nx] === 0) {
                      reveal(nx, ny);
                  }
              }
          }
      }
  }
  
  function giveHint() {
      if (gameOver !== 0 || isReplaying) return;
      let actionX = -1, actionY = -1;
      if (firstClick) {
          actionX = Math.floor(cols / 2);
          actionY = Math.floor(rows / 2);
      } else {
          let safeCells = [];
          for (let y = 0; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                  if (state[y][x] === 0 && grid[y][x] !== 9) safeCells.push({x, y});
              }
          }
          if (safeCells.length > 0) {
              let choice = safeCells[Math.floor(Math.random() * safeCells.length)];
              actionX = choice.x; actionY = choice.y;
          }
      }
      if (actionX !== -1) {
          moves.push({ t: Date.now() - startRealTime, x: actionX, y: actionY, b: 0 });
          applyAction(actionX, actionY, 0);
          draw();
      }
  }

  function startReplay() {
      if (moves.length === 0) return;
      initGame(true);
      isReplaying = true;
      document.getElementById('replayBtn').style.display = 'none';
      let replayStartTime = Date.now();
      let moveIdx = 0;
      
      function nextFrame() {
          if (!isReplaying) return;
          let now = Date.now() - replayStartTime;
          while (moveIdx < moves.length && now >= moves[moveIdx].t) {
              let m = moves[moveIdx];
              applyAction(m.x, m.y, m.b);
              moveIdx++;
          }
          draw();
          if (moveIdx < moves.length) {
              requestAnimationFrame(nextFrame);
          } else {
              isReplaying = false;
          }
      }
      requestAnimationFrame(nextFrame);
  }

  function quickSave() {
      if (gameOver !== 0 || firstClick || isReplaying) {
          alert("Cannot quicksave right now.");
          return;
      }
      quickSaveData = {
          grid: grid.map(r => [...r]),
          state: state.map(r => [...r]),
          cols, rows, totalMines, timeElapsed, flags, 
          moves: JSON.parse(JSON.stringify(moves)),
          diff: document.getElementById('diff').value,
          timeOffset: Date.now() - startRealTime
      };
      localStorage.setItem('kmine_quicksave', JSON.stringify(quickSaveData));
      alert("Quicksaved!");
  }

  function quickLoad() {
      let s = localStorage.getItem('kmine_quicksave');
      if (!s) { alert("No quicksave found."); return; }
      try {
          let d = JSON.parse(s);
          cols = d.cols; rows = d.rows; totalMines = d.totalMines;
          document.getElementById('diff').value = d.diff;
          setupCanvas();
          grid = d.grid; state = d.state;
          timeElapsed = d.timeElapsed; flags = d.flags;
          moves = d.moves;
          firstClick = false; gameOver = 0; isReplaying = false;
          startRealTime = Date.now() - d.timeOffset;
          stopTimer(); startTimer();
          updateStatus(); updateBestTimeDisplay(); draw();
      } catch(e) { alert("Failed to quickload."); }
  }
  
  function draw() {
      ctx.clearRect(0, 0, cols * CELL, rows * CELL);
      ctx.font = "bold 18px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
              let bx = x * CELL;
              let by = y * CELL;
              
              if (state[y][x] === 0 || state[y][x] === 2) {
                  ctx.fillStyle = "#c0c0c0";
                  ctx.fillRect(bx, by, CELL, CELL);
                  ctx.fillStyle = "#fff";
                  ctx.fillRect(bx, by, CELL, 2);
                  ctx.fillRect(bx, by, 2, CELL);
                  ctx.fillStyle = "#808080";
                  ctx.fillRect(bx, by + CELL - 2, CELL, 2);
                  ctx.fillRect(bx + CELL - 2, by, 2, CELL);
                  
                  if (state[y][x] === 2) {
                      ctx.fillStyle = "red";
                      ctx.fillText("F", bx + CELL/2, by + CELL/2);
                  }
              } else if (state[y][x] === 1) {
                  ctx.fillStyle = "#c0c0c0";
                  ctx.fillRect(bx, by, CELL, CELL);
                  ctx.fillStyle = "#808080";
                  ctx.fillRect(bx, by, CELL, 1);
                  ctx.fillRect(bx, by, 1, CELL);
                  
                  if (grid[y][x] === 9) {
                      ctx.fillStyle = "black";
                      ctx.fillText("*", bx + CELL/2, by + CELL/2 + 2);
                  } else if (grid[y][x] > 0) {
                      if (grid[y][x] === 1) ctx.fillStyle = "blue";
                      else if (grid[y][x] === 2) ctx.fillStyle = "green";
                      else ctx.fillStyle = "red";
                      ctx.fillText(grid[y][x], bx + CELL/2, by + CELL/2 + 1);
                  }
              }
          }
      }
      
      if (firstClick && gameOver === 0) {
          ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
          ctx.fillRect(0, (rows*CELL)/2 - 30, cols*CELL, 60);
          ctx.fillStyle = "black";
          ctx.font = "bold 16px Arial";
          ctx.fillText("L-Click: Reveal | R-Click: Flag", (cols*CELL)/2, (rows*CELL)/2 - 10);
          ctx.fillText("Press 'H' for Hint", (cols*CELL)/2, (rows*CELL)/2 + 15);
      }
  }
  
  cvs.addEventListener('mousedown', (e) => {
      if (gameOver !== 0 || isReplaying) {
          if (gameOver !== 0) initGame();
          return;
      }
      let rect = cvs.getBoundingClientRect();
      let x = Math.floor((e.clientX - rect.left) / (CELL * (cvs.width / rect.width / (window.devicePixelRatio||1))));
      let y = Math.floor((e.clientY - rect.top) / (CELL * (cvs.height / rect.height / (window.devicePixelRatio||1))));
      if (x < 0 || x >= cols || y < 0 || y >= rows) return;
      
      if (firstClick) startRealTime = Date.now();
      moves.push({ t: Date.now() - startRealTime, x, y, b: e.button });
      applyAction(x, y, e.button);
      draw();
  });
  
  window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') giveHint();
      if (e.key === 'F5') { e.preventDefault(); quickSave(); }
      if (e.key === 'F9') { e.preventDefault(); quickLoad(); }
  });
  
  loadStats();
  setupCanvas();
  initGame();
</script>
</body>
</html>
