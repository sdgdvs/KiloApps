import sys

html = """<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KMandel</title>
<style>
  :root {
    --bg-color: #0f172a;
    --panel-bg: rgba(15, 23, 42, 0.7);
    --border-color: rgba(255, 255, 255, 0.1);
    --text-color: #f8fafc;
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
  }
  body {
    margin: 0;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #canvas-container {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  #canvas-container:active {
    cursor: crosshair;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 200px;
    pointer-events: auto;
    user-select: none;
    max-height: 90vh;
    overflow-y: auto;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-group label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #94a3b8;
  }
  .value-display {
    font-family: monospace;
    font-size: 13px;
    background: rgba(0,0,0,0.3);
    padding: 4px 8px;
    border-radius: 4px;
    word-break: break-all;
  }
  button {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  button:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-1px);
  }
  button:active {
    transform: translateY(1px);
  }
  .row {
    display: flex;
    gap: 8px;
  }
  .row button {
    flex: 1;
  }
  .loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel-bg);
    backdrop-filter: blur(8px);
    padding: 12px 24px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    font-size: 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .loading.active {
    opacity: 1;
  }
  input[type="color"] {
    width: 100%;
    height: 30px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: none;
  }
</style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="c"></canvas>
    <div class="loading" id="loading">Rendering...</div>
    <div class="controls">
      <div class="control-group">
        <label>Zoom Level</label>
        <div class="value-display" id="zoom-disp" aria-live="polite">1.0x</div>
      </div>
      <div class="control-group">
        <label>Iterations</label>
        <div class="value-display" id="iter-disp" aria-live="polite">100</div>
      </div>
      <div class="row">
        <button id="btn-zoom-in" aria-label="Zoom In">+</button>
        <button id="btn-zoom-out" aria-label="Zoom Out">-</button>
      </div>
      <div class="row">
        <button id="btn-undo" disabled aria-label="Undo">Undo</button>
        <button id="btn-redo" disabled aria-label="Redo">Redo</button>
      </div>
      <button id="btn-save" aria-label="Save Image">Save 4K PNG</button>
      <button id="btn-theme" aria-label="Toggle Theme">Toggle Theme</button>
      <div class="control-group" id="custom-colors" style="display:none;">
        <label>Custom Palette</label>
        <div class="row">
          <input type="color" id="color1" value="#ff0000">
          <input type="color" id="color2" value="#0000ff">
        </div>
      </div>
      <button id="btn-julia" aria-label="Toggle Julia">Toggle Julia</button>
      <div class="control-group">
        <label style="font-size: 10px;">Hint: Shift+Click to Pick Julia from Mandelbrot</label>
      </div>
      <button id="btn-reset" aria-label="Reset View">Reset View</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const zoomDisp = document.getElementById('zoom-disp');
    const iterDisp = document.getElementById('iter-disp');
    const loading = document.getElementById('loading');
    
    // Viewport state
    let minRe = -2.0, maxRe = 1.0;
    let minIm = -1.2, maxIm = 1.2;
    let max_iter = 100;
    let theme = 0; // 0: Fire, 1: Ocean, 2: Cyberpunk, 3: BW, 4: Custom
    let isRendering = false;
    let renderRequested = false;

    let isJulia = false;
    let juliaCRe = 0.0, juliaCIm = 0.0;
    
    let history = [];
    let historyIdx = -1;

    let customColor1 = [255, 0, 0];
    let customColor2 = [0, 0, 255];

    function hexToRgb(hex) {
        var result = /^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i.exec(hex);
        return result ? [
            parseInt(result[1], 16),
            parseInt(result[2], 16),
            parseInt(result[3], 16)
        ] : [255,255,255];
    }
    
    document.getElementById('color1').addEventListener('input', (e) => {
        customColor1 = hexToRgb(e.target.value);
        if (theme === 4) requestRender();
    });
    document.getElementById('color2').addEventListener('input', (e) => {
        customColor2 = hexToRgb(e.target.value);
        if (theme === 4) requestRender();
    });

    // Interaction state
    let isDragging = false;
    let hasDragged = false;
    let dragStartX, dragStartY;
    let startMinRe, startMaxRe, startMinIm, startMaxIm;
    
    function saveState() {
        const state = { minRe, maxRe, minIm, maxIm, max_iter, isJulia, juliaCRe, juliaCIm, theme, customColor1: [...customColor1], customColor2: [...customColor2] };
        if (historyIdx < history.length - 1) {
            history = history.slice(0, historyIdx + 1);
        }
        history.push(state);
        if (history.length > 256) history.shift();
        historyIdx = history.length - 1;
        updateUndoRedoButtons();
    }
    
    function loadState(state) {
        minRe = state.minRe; maxRe = state.maxRe;
        minIm = state.minIm; maxIm = state.maxIm;
        max_iter = state.max_iter;
        isJulia = state.isJulia;
        juliaCRe = state.juliaCRe; juliaCIm = state.juliaCIm;
        theme = state.theme;
        customColor1 = [...state.customColor1];
        customColor2 = [...state.customColor2];
        document.getElementById('color1').value = '#' + customColor1.map(x => x.toString(16).padStart(2, '0')).join('');
        document.getElementById('color2').value = '#' + customColor2.map(x => x.toString(16).padStart(2, '0')).join('');
        document.getElementById('custom-colors').style.display = theme === 4 ? 'block' : 'none';
        updateUndoRedoButtons();
    }
    
    function updateUndoRedoButtons() {
        document.getElementById('btn-undo').disabled = historyIdx <= 0;
        document.getElementById('btn-redo').disabled = historyIdx >= history.length - 1;
        document.getElementById('btn-julia').textContent = isJulia ? 'Mandelbrot Mode' : 'Toggle Julia';
    }

    function undo() {
        if (historyIdx > 0) {
            historyIdx--;
            loadState(history[historyIdx]);
            requestRender();
        }
    }
    
    function redo() {
        if (historyIdx < history.length - 1) {
            historyIdx++;
            loadState(history[historyIdx]);
            requestRender();
        }
    }
    
    function updateDisplays() {
      const wRe = maxRe - minRe;
      const baseW = 3.0;
      const zoomLevel = (baseW / wRe);
      let zoomStr = zoomLevel < 1000 ? zoomLevel.toFixed(1) : (zoomLevel < 1000000 ? (zoomLevel/1000).toFixed(1) + 'k' : (zoomLevel/1000000).toFixed(1) + 'M');
      zoomDisp.textContent = zoomStr + 'x';
      iterDisp.textContent = max_iter;
      
      const needed_iter = Math.floor(100 * Math.pow(zoomLevel, 0.2));
      if (needed_iter > max_iter && zoomLevel > 5) {
          max_iter = Math.min(needed_iter, 2000);
      }
    }

    // WEB WORKER LOGIC
    const workerCode = `
      self.onmessage = function(e) {
          const { id, w, h, startY, endY, minRe, maxRe, minIm, maxIm, max_iter, isJulia, juliaCRe, juliaCIm, theme, customColor1, customColor2 } = e.data;
          
          const re_factor = (maxRe - minRe) / (w - 1);
          const im_factor = (maxIm - minIm) / (h - 1);
          
          const buf = new ArrayBuffer((endY - startY) * w * 4);
          const data = new Uint8ClampedArray(buf);
          let idx = 0;
          
          for (let y = startY; y < endY; ++y) {
              const c_im_view = maxIm - y * im_factor;
              for (let x = 0; x < w; ++x) {
                  const c_re_view = minRe + x * re_factor;
                  let c_re = isJulia ? juliaCRe : c_re_view;
                  let c_im = isJulia ? juliaCIm : c_im_view;
                  let Z_re = c_re_view, Z_im = c_im_view;
                  let isInside = true;
                  let n = 0;
                  
                  for (n = 0; n < max_iter; ++n) {
                      const Z_re2 = Z_re * Z_re, Z_im2 = Z_im * Z_im;
                      if (Z_re2 + Z_im2 > 4) {
                          isInside = false;
                          break;
                      }
                      Z_im = 2 * Z_re * Z_im + c_im;
                      Z_re = Z_re2 - Z_im2 + c_re;
                  }
                  
                  if (isInside) {
                      data[idx++] = 0; data[idx++] = 0; data[idx++] = 0; data[idx++] = 255;
                  } else {
                      let r = 0, g = 0, b = 0;
                      if (theme === 0) { // Fire
                        r = Math.floor((n * 255) / max_iter);
                        g = Math.floor((n * n * 255) / (max_iter * max_iter));
                        b = Math.floor((n * 128) / max_iter);
                      } else if (theme === 1) { // Ocean
                        r = Math.floor((n * 128) / max_iter);
                        g = Math.floor((n * n * 255) / (max_iter * max_iter));
                        b = Math.floor((n * 255) / max_iter);
                      } else if (theme === 2) { // Cyberpunk
                        let f = n / max_iter;
                        r = Math.max(0, Math.floor(Math.sin(f * Math.PI) * 255));
                        g = Math.max(0, Math.floor(Math.sin(f * Math.PI * 2) * 128));
                        b = Math.max(0, Math.floor(Math.cos(f * Math.PI) * 255));
                      } else if (theme === 3) { // BW
                        let f = (n % 20) > 10 ? 255 : 0;
                        r = f; g = f; b = f;
                      } else if (theme === 4) { // Custom
                        let f = n / max_iter;
                        r = Math.floor(customColor1[0] + f * (customColor2[0] - customColor1[0]));
                        g = Math.floor(customColor1[1] + f * (customColor2[1] - customColor1[1]));
                        b = Math.floor(customColor1[2] + f * (customColor2[2] - customColor1[2]));
                      }
                      data[idx++] = r; data[idx++] = g; data[idx++] = b; data[idx++] = 255;
                  }
              }
          }
          self.postMessage({ id, startY, data: buf }, [buf]);
      };
    `;
    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(workerBlob);
    
    const numWorkers = navigator.hardwareConcurrency || 4;
    const workers = [];
    for (let i = 0; i < numWorkers; i++) {
        workers.push(new Worker(workerUrl));
    }

    let activeWorkers = 0;
    
    function requestRender() {
        if (isRendering) {
            renderRequested = true;
            return;
        }
        isRendering = true;
        renderRequested = false;
        loading.classList.add('active');
        
        requestAnimationFrame(() => {
            performRender(canvas, window.innerWidth, window.innerHeight, false, () => {
                loading.classList.remove('active');
                isRendering = false;
                if (renderRequested) requestRender();
            });
        });
    }

    function performRender(targetCanvas, w, h, isOffscreen, callback) {
      if (!isOffscreen) {
          if (targetCanvas.width !== w || targetCanvas.height !== h) {
              targetCanvas.width = w;
              targetCanvas.height = h;
          }
          updateDisplays();
      }
      
      const targetCtx = targetCanvas.getContext('2d');
      const chunkH = Math.ceil(h / numWorkers);
      activeWorkers = 0;
      
      for (let i = 0; i < numWorkers; i++) {
          const startY = i * chunkH;
          if (startY >= h) break;
          const endY = Math.min(h, startY + chunkH);
          
          activeWorkers++;
          
          workers[i].onmessage = function(e) {
              const { startY: sy, data } = e.data;
              const imgData = new ImageData(new Uint8ClampedArray(data), w, endY - startY);
              targetCtx.putImageData(imgData, 0, sy);
              activeWorkers--;
              if (activeWorkers === 0) {
                  if (callback) callback();
              }
          };
          
          workers[i].postMessage({
              id: i, w, h, startY, endY, minRe, maxRe, minIm, maxIm, max_iter, isJulia, juliaCRe, juliaCIm, theme, customColor1, customColor2
          });
      }
    }
    
    function zoom(factor, centerX, centerY, dontSave) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const re_factor = (maxRe - minRe) / (w - 1);
        const im_factor = (maxIm - minIm) / (h - 1);
        
        const centerRe = minRe + centerX * re_factor;
        const centerIm = maxIm - centerY * im_factor;
        
        const newWRe = (maxRe - minRe) * factor;
        const newWIm = (maxIm - minIm) * factor;
        
        minRe = centerRe - (centerX / w) * newWRe;
        maxRe = minRe + newWRe;
        
        maxIm = centerIm + (centerY / h) * newWIm;
        minIm = maxIm - newWIm;
        
        if (!dontSave) saveState();
        requestRender();
    }

    window.addEventListener('resize', () => requestRender());
    
    document.getElementById('btn-reset').addEventListener('click', () => {
        if (isJulia) {
            minRe = -2.0; maxRe = 2.0;
            minIm = -2.0; maxIm = 2.0;
        } else {
            minRe = -2.0; maxRe = 1.0;
            minIm = -1.2; maxIm = 1.2;
        }
        max_iter = 100;
        saveState();
        requestRender();
    });
    
    document.getElementById('btn-julia').addEventListener('click', () => {
        if (!isJulia) {
            isJulia = true;
            juliaCRe = minRe + (maxRe - minRe) / 2.0;
            juliaCIm = minIm + (maxIm - minIm) / 2.0;
            minRe = -2.0; maxRe = 2.0;
            minIm = -2.0; maxIm = 2.0;
        } else {
            isJulia = false;
            minRe = -2.0; maxRe = 1.0;
            minIm = -1.2; maxIm = 1.2;
        }
        max_iter = 100;
        saveState();
        requestRender();
    });
    
    document.getElementById('btn-theme').addEventListener('click', () => {
        theme = (theme + 1) % 5;
        document.getElementById('custom-colors').style.display = theme === 4 ? 'block' : 'none';
        saveState();
        requestRender();
    });
    
    document.getElementById('btn-zoom-in').addEventListener('click', () => {
        zoom(0.5, window.innerWidth/2, window.innerHeight/2);
    });
    
    document.getElementById('btn-zoom-out').addEventListener('click', () => {
        zoom(2.0, window.innerWidth/2, window.innerHeight/2);
    });

    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-redo').addEventListener('click', redo);
    
    document.getElementById('btn-save').addEventListener('click', () => {
        loading.textContent = "Rendering 4K PNG...";
        loading.classList.add('active');
        
        // Create an offscreen canvas for 4K (3840x2160)
        const exportCanvas = document.createElement('canvas');
        const expW = 3840;
        const expH = 2160;
        exportCanvas.width = expW;
        exportCanvas.height = expH;
        
        performRender(exportCanvas, expW, expH, true, () => {
            const link = document.createElement('a');
            link.download = 'kmandel_4k.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
            loading.textContent = "Rendering...";
            loading.classList.remove('active');
        });
    });

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'z') undo();
        if (e.key.toLowerCase() === 'y') redo();
        if (e.key.toLowerCase() === 's') document.getElementById('btn-save').click();
        if (e.key.toLowerCase() === 'r') document.getElementById('btn-reset').click();
        if (e.key.toLowerCase() === 't') document.getElementById('btn-theme').click();
        if (e.key.toLowerCase() === 'j') document.getElementById('btn-julia').click();

        const panAmount = 0.1;
        let moved = false;
        if (e.key === 'ArrowUp') {
            const h = maxIm - minIm;
            minIm += h * panAmount; maxIm += h * panAmount; moved = true;
        } else if (e.key === 'ArrowDown') {
            const h = maxIm - minIm;
            minIm -= h * panAmount; maxIm -= h * panAmount; moved = true;
        } else if (e.key === 'ArrowLeft') {
            const w = maxRe - minRe;
            minRe -= w * panAmount; maxRe -= w * panAmount; moved = true;
        } else if (e.key === 'ArrowRight') {
            const w = maxRe - minRe;
            minRe += w * panAmount; maxRe += w * panAmount; moved = true;
        }
        
        if (moved) {
            saveState();
            requestRender();
        }
    });

    const container = document.getElementById('canvas-container');
    
    let wheelTimeout;
    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 1.5 : 1/1.5;
        zoom(factor, e.clientX, e.clientY, true);
        clearTimeout(wheelTimeout);
        wheelTimeout = setTimeout(saveState, 400);
    });
    
    container.addEventListener('pointerdown', (e) => {
        if (e.target !== canvas) return;
        
        // Interactive Julia bridging
        if (e.shiftKey && !isJulia) {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const re_factor = (maxRe - minRe) / (w - 1);
            const im_factor = (maxIm - minIm) / (h - 1);
            const clickRe = minRe + e.clientX * re_factor;
            const clickIm = maxIm - e.clientY * im_factor;
            
            isJulia = true;
            juliaCRe = clickRe;
            juliaCIm = clickIm;
            minRe = -2.0; maxRe = 2.0;
            minIm = -2.0; maxIm = 2.0;
            max_iter = 100;
            saveState();
            requestRender();
            return;
        }

        isDragging = true;
        hasDragged = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        startMinRe = minRe; startMaxRe = maxRe;
        startMinIm = minIm; startMaxIm = maxIm;
        container.setPointerCapture(e.pointerId);
    });
    
    container.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        hasDragged = true;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        
        const w = window.innerWidth;
        const h = window.innerHeight;
        const re_factor = (startMaxRe - startMinRe) / (w - 1);
        const im_factor = (startMaxIm - startMinIm) / (h - 1);
        
        minRe = startMinRe - dx * re_factor;
        maxRe = startMaxRe - dx * re_factor;
        
        minIm = startMinIm + dy * im_factor;
        maxIm = startMaxIm + dy * im_factor;
        
        requestRender();
    });
    
    container.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        container.releasePointerCapture(e.pointerId);
        if (hasDragged) {
            saveState();
            hasDragged = false;
        }
    });

    saveState();
    requestRender();
  </script>
</body>
</html>
