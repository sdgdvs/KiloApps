<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFarm</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #87CEEB; /* Sunny sky blue */
            color: #4E342E; /* Earthy dark brown */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; 
        }
        .container {
            background-color: #FFF3E0; /* Warm sunny white */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border: 4px solid #8D6E63;
        }
        canvas { 
            background-color: #8BC34A; 
            border: 4px solid #5D4037; 
            border-radius: 8px;
            cursor: pointer; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            display: block;
            margin: 0 auto;
        }
        h2 { margin: 0 0 10px 0; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 1px 1px 0px #FFCC80; }
        p { margin: 15px 0 0 0; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>KFarm</h2>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p>Click grass to till. Click soil to plant wheat.</p>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const COLS = 10;
        const ROWS = 10;
        const CELL_SIZE = 40;
        const grid = new Array(COLS * ROWS).fill(0); // 0=grass, 1=tilled, 2=wheat
        
        ctx.font = '28px Arial'; // For emoji
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const idx = y * COLS + x;
                    const val = grid[idx];
                    const px = x * CELL_SIZE;
                    const py = y * CELL_SIZE;
                    
                    // Draw cell background
                    if (val === 0) {
                        ctx.fillStyle = '#8BC34A'; // Sunny Grass
                    } else {
                        ctx.fillStyle = '#5D4037'; // Rich tilled soil
                    }
                    ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                    
                    // Draw grid border (subtle)
                    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                    ctx.strokeRect(px, py, CELL_SIZE, CELL_SIZE);
                    
                    // Draw crop icon
                    if (val === 2) {
                        ctx.fillText('🌾', px + CELL_SIZE / 2, py + CELL_SIZE / 2 + 2);
                    }
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / CELL_SIZE);
            
            if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
                const idx = y * COLS + x;
                if (grid[idx] === 0) {
                    grid[idx] = 1; // Till
                } else if (grid[idx] === 1) {
                    grid[idx] = 2; // Plant wheat
                }
                draw();
            }
        });

        draw();
    </script>
</body>
</html>
