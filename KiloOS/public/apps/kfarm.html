<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFarm</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #87CEEB; /* Sunny sky blue */
            color: #4E342E; /* Earthy dark brown */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; 
        }
        .container {
            background-color: #FFF3E0; /* Warm sunny white */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border: 4px solid #8D6E63;
        }
        canvas { 
            background-color: #8BC34A; 
            border: 4px solid #5D4037; 
            border-radius: 8px;
            cursor: pointer; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            display: block;
            margin: 0 auto;
        }
        h2 { margin: 0 0 10px 0; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 1px 1px 0px #FFCC80; }
        p { margin: 15px 0 0 0; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>KFarm - <span id="seasonSpan">Spring</span>, Day <span id="daySpan">1</span> | <span id="weatherSpan">Clear</span> | $<span id="moneySpan">50</span></h2>
        <div style="text-align: center; margin-bottom: 10px; font-weight: bold; color: #5D4037;">
            🐔 Chickens: <span id="chickensSpan">0</span> | 🐄 Cows: <span id="cowsSpan">0</span> | 🧍 Scarecrow: <span id="scarecrowSpan">No</span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p>Click: Grass(Till) &rarr; Soil(Plant) &rarr; 🌱(Water) &rarr; 🌾(Harvest)</p>
        <div style="text-align:center; margin-top:15px;">
            <div style="margin-bottom: 10px; font-size: 14px;">
                <label style="margin: 0 5px; cursor: pointer;"><input type="radio" name="seed" value="0" checked> Wheat (-$5) [Sp/Fa]</label>
                <label style="margin: 0 5px; cursor: pointer;"><input type="radio" name="seed" value="1"> Corn (-$10) [Su]</label>
                <label style="margin: 0 5px; cursor: pointer;"><input type="radio" name="seed" value="2"> Tomato (-$15) [Su/Fa]</label>
                <label style="margin: 0 5px; cursor: pointer;"><input type="radio" name="seed" value="3"> Pumpkin (-$25) [Fa]</label>
            </div>
            <button onclick="nextDay()" style="padding:10px 20px; font-size:16px; background-color:#FF9800; border:none; border-radius:5px; color:white; cursor:pointer; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Sleep (Next Day)</button>
            <button id="upgradeBtn" onclick="buyUpgrade()" style="padding:10px 20px; font-size:16px; background-color:#4CAF50; border:none; border-radius:5px; color:white; cursor:pointer; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-left:10px;">Fertilizer ($100)</button>
            <button id="upgradeToolsBtn" onclick="buyToolsUpgrade()" style="padding:10px 20px; font-size:16px; background-color:#2196F3; border:none; border-radius:5px; color:white; cursor:pointer; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-left:10px;">Upgrade Tools ($200)</button>
        </div>
        <div style="text-align:center; margin-top:10px;">
            <button onclick="buyChicken()" style="padding:5px 10px; font-size:14px; background-color:#FFC107; border:none; border-radius:5px; cursor:pointer; font-weight:bold; margin-right:5px;">Buy Chicken ($50)</button>
            <button onclick="buyCow()" style="padding:5px 10px; font-size:14px; background-color:#795548; border:none; border-radius:5px; color:white; cursor:pointer; font-weight:bold; margin-right:5px;">Buy Cow ($150)</button>
            <button id="scarecrowBtn" onclick="buyScarecrow()" style="padding:5px 10px; font-size:14px; background-color:#607D8B; border:none; border-radius:5px; color:white; cursor:pointer; font-weight:bold;">Buy Scarecrow ($100)</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const COLS = 10;
        const ROWS = 10;
        const CELL_SIZE = 40;
        const grid = Array.from({length: COLS * ROWS}, () => ({ type: 0, watered: false, growth: 0, cropType: 0 }));
        const seasons = ['Spring', 'Summer', 'Fall', 'Winter'];
        const cropData = [
            { name: 'Wheat', emoji: '🌾', growthTime: 2, value: 10, cost: 5, seasons: [0, 2] },
            { name: 'Corn', emoji: '🌽', growthTime: 3, value: 20, cost: 10, seasons: [1] },
            { name: 'Tomato', emoji: '🍅', growthTime: 4, value: 30, cost: 15, seasons: [1, 2] },
            { name: 'Pumpkin', emoji: '🎃', growthTime: 5, value: 50, cost: 25, seasons: [2] }
        ];
        let day = 1;
        let timeOfDay = 'day';
        let money = 50;
        let fertilizerBought = false;
        let toolsUpgraded = false;
        let chickens = 0;
        let cows = 0;
        let weather = 'Clear';
        let hasScarecrow = false;

        function updateAnimals() {
            document.getElementById('chickensSpan').innerText = chickens;
            document.getElementById('cowsSpan').innerText = cows;
        }

        function buyChicken() {
            if (money >= 50) {
                money -= 50;
                chickens++;
                updateMoney();
                updateAnimals();
            }
        }

        function buyCow() {
            if (money >= 150) {
                money -= 150;
                cows++;
                updateMoney();
                updateAnimals();
            }
        }

        function buyScarecrow() {
            if (!hasScarecrow && money >= 100) {
                money -= 100;
                hasScarecrow = true;
                updateMoney();
                document.getElementById('scarecrowSpan').innerText = 'Yes';
                const btn = document.getElementById('scarecrowBtn');
                btn.innerText = 'Scarecrow (Owned)';
                btn.style.backgroundColor = '#9E9E9E';
                btn.disabled = true;
            }
        }

        function updateMoney() {
            document.getElementById('moneySpan').innerText = money;
        }

        function buyUpgrade() {
            if (!fertilizerBought && money >= 100) {
                money -= 100;
                fertilizerBought = true;
                cropData.forEach(c => { if (c.growthTime > 1) c.growthTime--; });
                updateMoney();
                const btn = document.getElementById('upgradeBtn');
                btn.innerText = 'Fertilizer (Owned)';
                btn.style.backgroundColor = '#9E9E9E';
                btn.disabled = true;
            }
        }

        function buyToolsUpgrade() {
            if (!toolsUpgraded && money >= 200) {
                money -= 200;
                toolsUpgraded = true;
                updateMoney();
                const btn = document.getElementById('upgradeToolsBtn');
                btn.innerText = 'Tools Upgraded';
                btn.style.backgroundColor = '#9E9E9E';
                btn.disabled = true;
            }
        }
        
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.body.style.backgroundColor = timeOfDay === 'night' ? '#1A237E' : '#87CEEB';
            
            const currentSeason = Math.floor((day - 1) / 7) % 4;
            const seasonColors = ['#8BC34A', '#4CAF50', '#FFB300', '#E0F7FA']; // Spring, Summer, Fall, Winter
            const seasonColorNight = ['#33501E', '#1E4628', '#64460A', '#647882'];
            const grassColor = timeOfDay === 'night' ? seasonColorNight[currentSeason] : seasonColors[currentSeason];
            canvas.style.backgroundColor = grassColor;
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = grid[y * COLS + x];
                    const px = x * CELL_SIZE;
                    const py = y * CELL_SIZE;
                    
                    if (cell.type === 0) {
                        ctx.fillStyle = grassColor; 
                    } else {
                        const req = weather === 'Drought' ? 2 : (weather === 'Rain' ? 0 : 1);
                        if (weather === 'Rain' || cell.watered >= req) {
                            ctx.fillStyle = '#3E2723'; // wet
                        } else if (weather === 'Drought' && cell.watered === 1) {
                            ctx.fillStyle = '#4E342E'; // damp
                        } else {
                            ctx.fillStyle = '#5D4037'; // dry
                        }
                    }
                    ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                    
                    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                    ctx.strokeRect(px, py, CELL_SIZE, CELL_SIZE);
                    
                    if (cell.type === 2) {
                        ctx.font = '20px Arial';
                        ctx.fillText('🌱', px + CELL_SIZE / 2, py + CELL_SIZE / 2 + 2);
                    } else if (cell.type === 3) {
                        ctx.font = '28px Arial';
                        ctx.fillText(cropData[cell.cropType].emoji, px + CELL_SIZE / 2, py + CELL_SIZE / 2 + 2);
                    }
                }
            }
            if (timeOfDay === 'night') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (weather === 'Rain') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                for (let i = 0; i < 60; i++) {
                    ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 10 + Math.random() * 10);
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            if (timeOfDay === 'night') return;
            const rect = canvas.getBoundingClientRect();
            const cx = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const cy = Math.floor((e.clientY - rect.top) / CELL_SIZE);
            
            if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) {
                const centerCell = grid[cy * COLS + cx];
                let action = '';
                if (centerCell.type === 0) action = 'till';
                else if (centerCell.type === 1) action = 'plant';
                else if (centerCell.type === 2) {
                    const req = weather === 'Drought' ? 2 : 1;
                    if (centerCell.watered < req) action = 'water';
                }
                else if (centerCell.type === 3) action = 'harvest';
                
                if (!action) return;
                
                const isAoE = toolsUpgraded && (action === 'till' || action === 'water' || action === 'harvest');
                
                const minX = isAoE ? Math.max(0, cx - 1) : cx;
                const maxX = isAoE ? Math.min(COLS - 1, cx + 1) : cx;
                const minY = isAoE ? Math.max(0, cy - 1) : cy;
                const maxY = isAoE ? Math.min(ROWS - 1, cy + 1) : cy;
                
                for (let y = minY; y <= maxY; y++) {
                    for (let x = minX; x <= maxX; x++) {
                        const cell = grid[y * COLS + x];
                        if (action === 'till' && cell.type === 0) {
                            cell.type = 1;
                        } else if (action === 'plant' && x === cx && y === cy && cell.type === 1) {
                            const seedInput = document.querySelector('input[name="seed"]:checked');
                            const cType = seedInput ? parseInt(seedInput.value) : 0;
                            const currentSeason = Math.floor((day - 1) / 7) % 4;
                            if (cropData[cType].seasons.includes(currentSeason) && money >= cropData[cType].cost) {
                                money -= cropData[cType].cost;
                                updateMoney();
                                cell.type = 2;
                                cell.growth = 0;
                                cell.cropType = cType;
                            }
                        } else if (action === 'water' && cell.type === 2) {
                            const req = weather === 'Drought' ? 2 : 1;
                            if (cell.watered < req) {
                                cell.watered = (cell.watered || 0) + 1;
                            }
                        } else if (action === 'harvest' && cell.type === 3) {
                            money += cropData[cell.cropType].value;
                            updateMoney();
                            cell.type = 1;
                            cell.watered = 0;
                        }
                    }
                }
                draw();
            }
        });
        
        function nextDay() {
            if (timeOfDay === 'night') return;
            timeOfDay = 'night';
            draw();
            setTimeout(() => {
                day++;
                const currentSeason = Math.floor((day - 1) / 7) % 4;
                document.getElementById('daySpan').innerText = day;
                document.getElementById('seasonSpan').innerText = seasons[currentSeason];
                timeOfDay = 'day';
                money += (chickens * 5) + (cows * 15);
                updateMoney();
                for (let cell of grid) {
                    if (cell.type === 2 || cell.type === 3) {
                        if (!cropData[cell.cropType].seasons.includes(currentSeason)) {
                            cell.type = 1; // Dies because of season change
                        } else if (cell.type === 2) {
                            const req = weather === 'Drought' ? 2 : (weather === 'Rain' ? 0 : 1);
                            if ((cell.watered || 0) >= req) {
                                cell.growth++;
                                if (cell.growth >= cropData[cell.cropType].growthTime) cell.type = 3;
                            } else {
                                cell.type = 1; // Dies without water
                            }
                        }
                    }
                    cell.watered = 0;
                }
                
                // Pick new weather
                const r = Math.random();
                if (r < 0.2) weather = 'Rain';
                else if (r < 0.4) weather = 'Drought';
                else if (r < 0.6) weather = 'Crows';
                else weather = 'Clear';
                
                if (weather === 'Crows' && !hasScarecrow) {
                    for (let cell of grid) {
                        if ((cell.type === 2 || cell.type === 3) && Math.random() < 0.3) {
                            cell.type = 1;
                        }
                    }
                }

                document.getElementById('daySpan').innerText = day;
                document.getElementById('seasonSpan').innerText = seasons[currentSeason];
                document.getElementById('weatherSpan').innerText = weather;

                timeOfDay = 'day';
                money += (chickens * 5) + (cows * 15);
                updateMoney();
                
                draw();
            }, 1000);
        }

        draw();
    </script>
</body>
</html>
