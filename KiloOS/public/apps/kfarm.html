<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFarm</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #87CEEB; /* Sunny sky blue */
            color: #4E342E; /* Earthy dark brown */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; 
        }
        .container {
            background-color: #FFF3E0; /* Warm sunny white */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border: 4px solid #8D6E63;
        }
        canvas { 
            background-color: #8BC34A; 
            border: 4px solid #5D4037; 
            border-radius: 8px;
            cursor: pointer; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            display: block;
            margin: 0 auto;
        }
        h2 { margin: 0 0 10px 0; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 1px 1px 0px #FFCC80; }
        p { margin: 15px 0 0 0; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>KFarm - Day <span id="daySpan">1</span></h2>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p>Click: Grass(Till) &rarr; Soil(Plant) &rarr; 🌱(Water) &rarr; 🌾(Harvest)</p>
        <div style="text-align:center; margin-top:15px;">
            <button onclick="nextDay()" style="padding:10px 20px; font-size:16px; background-color:#FF9800; border:none; border-radius:5px; color:white; cursor:pointer; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Sleep (Next Day)</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const COLS = 10;
        const ROWS = 10;
        const CELL_SIZE = 40;
        const grid = Array.from({length: COLS * ROWS}, () => ({ type: 0, watered: false, growth: 0 }));
        let day = 1;
        let timeOfDay = 'day';
        
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.body.style.backgroundColor = timeOfDay === 'night' ? '#1A237E' : '#87CEEB';
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = grid[y * COLS + x];
                    const px = x * CELL_SIZE;
                    const py = y * CELL_SIZE;
                    
                    if (cell.type === 0) {
                        ctx.fillStyle = '#8BC34A'; 
                    } else {
                        ctx.fillStyle = cell.watered ? '#3E2723' : '#5D4037'; 
                    }
                    ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                    
                    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                    ctx.strokeRect(px, py, CELL_SIZE, CELL_SIZE);
                    
                    if (cell.type === 2) {
                        ctx.font = '20px Arial';
                        ctx.fillText('🌱', px + CELL_SIZE / 2, py + CELL_SIZE / 2 + 2);
                    } else if (cell.type === 3) {
                        ctx.font = '28px Arial';
                        ctx.fillText('🌾', px + CELL_SIZE / 2, py + CELL_SIZE / 2 + 2);
                    }
                }
            }
            if (timeOfDay === 'night') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            if (timeOfDay === 'night') return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / CELL_SIZE);
            
            if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
                const cell = grid[y * COLS + x];
                if (cell.type === 0) {
                    cell.type = 1;
                } else if (cell.type === 1) {
                    cell.type = 2;
                    cell.growth = 0;
                } else if (cell.type === 2 && !cell.watered) {
                    cell.watered = true;
                } else if (cell.type === 3) {
                    cell.type = 1;
                    cell.watered = false;
                }
                draw();
            }
        });
        
        function nextDay() {
            if (timeOfDay === 'night') return;
            timeOfDay = 'night';
            draw();
            setTimeout(() => {
                day++;
                document.getElementById('daySpan').innerText = day;
                timeOfDay = 'day';
                for (let cell of grid) {
                    if (cell.type === 2) {
                        if (cell.watered) {
                            cell.growth++;
                            if (cell.growth >= 2) cell.type = 3;
                        } else {
                            cell.type = 1; // Dies without water
                        }
                    }
                    cell.watered = false;
                }
                draw();
            }, 1000);
        }

        draw();
    </script>
</body>
</html>
