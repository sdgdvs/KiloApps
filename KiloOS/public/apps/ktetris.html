<!DOCTYPE html>
<html>
<head>
<title>KTetris</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background-color: #0c0d12; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; color: #ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
  canvas { background-color: #121218; border: 2px solid #282a36; box-shadow: 0 0 30px rgba(0, 240, 240, 0.18); border-radius: 8px; cursor: pointer; max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, type, dur) {
      try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + dur);
          osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  function handleResize() {
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const scale = Math.min(winW / 370, winH / 510) * 0.98;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = 370 * scale * dpr;
      canvas.height = 510 * scale * dpr;
      canvas.style.width = (370 * scale) + 'px';
      canvas.style.height = (510 * scale) + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(scale * dpr, scale * dpr);
      ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', handleResize);
  handleResize();
  const CELL = 20;
  const W = 10, H = 20;
  const BOARD_W = W * CELL; // 200px
  const SIDEBAR_X = BOARD_W + 15; // 215px

  // 16 Palette colors (0 Empty, 1..13 Pieces, 14 Garbage, 15 Bomb)
  const colors = [
    '#000000', '#00f0f0', '#0000f0', '#f0a000', '#f0f000', '#00f000', '#a000f0', '#f00000',
    '#ff69b4', '#32cd32', '#adff2f', '#00bfff', '#ffd700', '#8a2be2', '#888899', '#ff3333'
  ];
  const bevelHi = [
    '', '#99ffff', '#6666ff', '#ffcc66', '#ffff99', '#66ff66', '#d999ff', '#ff6666',
    '#ffb6d9', '#90ee90', '#d6ff99', '#99e6ff', '#fff099', '#c896ff', '#bbbbcc', '#ff9999'
  ];
  const bevelSh = [
    '', '#008888', '#000088', '#995500', '#999900', '#008800', '#550088', '#880000',
    '#b2226e', '#228b22', '#6b8e23', '#00688b', '#b8860b', '#4b0082', '#444455', '#880000'
  ];

  // 13 Piece Types (0..6 Tetrominos, 7..12 Pentominos), 4 Rotations each (5x5 Bitmasks)
  const tetrominos = [
      [0x078000, 0x421080, 0x003c00, 0x210840], // 0: I
      [0x870000, 0x621000, 0x070800, 0x423000], // 1: J
      [0x270000, 0x421800, 0x072000, 0xc21000], // 2: L
      [0x063000, 0x063000, 0x063000, 0x063000], // 3: O
      [0x660000, 0x430800, 0x033000, 0x861000], // 4: S
      [0x470000, 0x431000, 0x071000, 0x461000], // 5: T
      [0xc30000, 0x231000, 0x061800, 0x462000], // 6: Z
      [0x0f8000, 0x421084, 0x007c00, 0x421084], // 7: I5 (Line 5)
      [0x878000, 0x621080, 0x078400, 0x421180], // 8: L5
      [0xe21000, 0x270800, 0x423800, 0x872000], // 9: T5
      [0xa70000, 0x621800, 0x072800, 0xc23000], // 10: U5
      [0x471000, 0x471000, 0x471000, 0x471000], // 11: X5
      [0xc21800, 0x272000, 0xc21800, 0x272000]  // 12: Z5
  ];

  const MODE_MARATHON = 0;
  const MODE_SPRINT   = 1;
  const MODE_ULTRA    = 2;
  const MODE_CAMPAIGN = 3;
  const modeNames = ["MARATHON", "SPRINT 40L", "ULTRA 2-MIN", "CAMPAIGN"];

  
  let rngState = 12345;
  function randomSeed(s) { rngState = s; }
  function randomInt(max) {
      if (max <= 0) return 0;
      rngState = (rngState * 1103515245 + 12345) & 0x7fffffff;
      return rngState % max;
  }
  function randomFloat() { return randomInt(1000000) / 1000000; }

  let grid = Array(H).fill().map(() => Array(W).fill(0));
  let pc, rot, cx, cy, isBomb = false;
  let gameOver = false, isPaused = false, startScreen = true, winScreen = false, showLeaderboard = false, showHelp = false;
  let score = 0, lines = 0, level = 1, combo = 0, piecesPlaced = 0;
  let gameMode = MODE_MARATHON, campaignLevel = 1;
  let statLines = [0, 0, 0, 0, 0];

  let keybinds = JSON.parse(localStorage.getItem('ktetris_keys')) || {
      up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight',
      drop: ' ', hold: 'c', pause: 'p', nuke: 'b', swap: 's', freeze: 'f'
  };
  let showKeybinds = false;
  let bindIndex = 0;
  let bindNames = Object.keys(keybinds);

  let currentReplay = { seed: 12345, inputs: [] };
  let savedReplay = JSON.parse(localStorage.getItem('ktetris_replay'));
  let isReplaying = false;
  let replayIndex = 0;
  let replayTick = 0;

  function exportStats() {
      let tr = (lines>0) ? (statLines[3]/lines*100).toFixed(1) : 0;
      let stats = { score, lines, piecesPlaced, time: formatTime(modeTimerMs), tetrisRate: tr, singles: statLines[0], doubles: statLines[1], triples: statLines[2], tetrises: statLines[3], pentrises: statLines[4] };
      let jStr = JSON.stringify(stats, null, 2);
      let cStr = `Score,Lines,Pieces,Time,TetrisRate,Single,Double,Triple,Tetris,Pentris\n${score},${lines},${piecesPlaced},${formatTime(modeTimerMs)},${tr},${statLines[0]},${statLines[1]},${statLines[2]},${statLines[3]},${statLines[4]}`;
      let a1 = document.createElement('a'); a1.href = URL.createObjectURL(new Blob([jStr])); a1.download = 'ktetris_stats.json'; a1.click();
      let a2 = document.createElement('a'); a2.href = URL.createObjectURL(new Blob([cStr])); a2.download = 'ktetris_stats.csv'; a2.click();
  }

  function exportLeaderboard() {
      let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(leaderboard, null, 2)])); a.download = 'ktetris_hiscores.json'; a.click();
  }
  function importLeaderboard() {
      let input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
      input.onchange = e => {
          let f = e.target.files[0];
          if (f) {
              let r = new FileReader();
              r.onload = e2 => {
                  try {
                      let parsed = JSON.parse(e2.target.result);
                      if (Array.isArray(parsed)) {
                          leaderboard = parsed.filter(item => typeof item === 'object' && item !== null && typeof item.score === 'number')
                              .map(item => ({
                                  score: Math.floor(Number(item.score) || 0),
                                  mode: String(item.mode || 'MARATHON').substring(0, 16),
                                  lines: Math.floor(Number(item.lines) || 0),
                                  time: String(item.time || '--').substring(0, 16),
                                  date: String(item.date || '').substring(0, 16)
                              }))
                              .sort((a, b) => b.score - a.score)
                              .slice(0, 5);
                          localStorage.setItem('ktetris_leaderboard', JSON.stringify(leaderboard));
                      }
                  } catch(err) {}
              };
              r.readAsText(f);
          }
      };
      input.click();
  }


  // Active Skills & Hazards
  let nukeCharges = 2;
  let swapCharges = 3;
  let freezeCharges = 2;
  let freezeTimerMs = 0;
  let shakeTimer = 0;
  let distortionTimer = 0;
  let distortX = 0, distortY = 0;

  // Timers
  let modeTimerMs = 0;
  let ultraTimeLeftMs = 120000;

  // Next Queue & Hold Slot
  let nextQueue = [];
  let holdPc = -1, holdIsBomb = false, holdUsed = false;

  // Persistence
  let highScore = parseInt(localStorage.getItem('ktetris_hiscore') || '0', 10);
  let leaderboard = JSON.parse(localStorage.getItem('ktetris_leaderboard') || '[]');

  // FX & Animations
  let particles = [];
  let popups = [];
  let lineFlashes = [];
  let shockwaves = [];

  function saveLeaderboard(newScore, modeIdx, linesCleared, timeMs) {
      let modeLabel = modeNames[modeIdx];
      let entry = {
          score: newScore,
          mode: modeLabel,
          lines: linesCleared,
          time: formatTime(timeMs),
          date: new Date().toLocaleDateString()
      };
      leaderboard.push(entry);
      leaderboard.sort((a, b) => b.score - a.score);
      if (leaderboard.length > 5) leaderboard = leaderboard.slice(0, 5);
      localStorage.setItem('ktetris_leaderboard', JSON.stringify(leaderboard));
      if (newScore > highScore) {
          highScore = newScore;
          localStorage.setItem('ktetris_hiscore', highScore.toString());
      }
  }

  function saveGameState() {
      if (startScreen || gameOver || winScreen) return;
      let state = {
          grid, pc, rot, cx, cy, isBomb,
          score, lines, level, combo, piecesPlaced,
          gameMode, campaignLevel, statLines,
          modeTimerMs, ultraTimeLeftMs,
          nextQueue, holdPc, holdIsBomb, holdUsed,
          nukeCharges, swapCharges, freezeCharges, freezeTimerMs
      };
      localStorage.setItem('ktetris_saved_game', JSON.stringify(state));
      addPopup(BOARD_W / 2 - 30, H * CELL / 2, "GAME SAVED!", "#00ffff");
      playSound(800, 'sine', 0.15);
  }

  function loadGameState() {
      let raw = localStorage.getItem('ktetris_saved_game');
      if (!raw) return false;
      try {
          let state = JSON.parse(raw);
          grid = state.grid;
          pc = state.pc; rot = state.rot; cx = state.cx; cy = state.cy; isBomb = state.isBomb;
          score = state.score; lines = state.lines; level = state.level; combo = state.combo; piecesPlaced = state.piecesPlaced;
          gameMode = state.gameMode; campaignLevel = state.campaignLevel; statLines = state.statLines;
          modeTimerMs = state.modeTimerMs; ultraTimeLeftMs = state.ultraTimeLeftMs;
          nextQueue = state.nextQueue; holdPc = state.holdPc; holdIsBomb = state.holdIsBomb; holdUsed = state.holdUsed;
          nukeCharges = state.nukeCharges ?? 2;
          swapCharges = state.swapCharges ?? 3;
          freezeCharges = state.freezeCharges ?? 2;
          freezeTimerMs = state.freezeTimerMs ?? 0;
          
          startScreen = false; gameOver = false;
      if (!isReplaying) { currentReplay = { seed: Date.now(), inputs: [] }; randomSeed(currentReplay.seed); } else { randomSeed(currentReplay.seed); replayTick = 0; replayIndex = 0; } winScreen = false; isPaused = false; showLeaderboard = false;
          dropInterval = Math.max(40, 500 - (level - 1) * 20);
          addPopup(BOARD_W / 2 - 35, H * CELL / 2, "GAME RESUMED!", "#00ff66");
          playSound(600, 'square', 0.2);
          return true;
      } catch(e) {
          return false;
      }
  }

  function hasSavedGame() {
      return !!localStorage.getItem('ktetris_saved_game');
  }

  function addParticle(x, y, vx, vy, color, size = 3, life = 20) {
      particles.push({x, y, vx, vy, color, size, life, maxLife: life});
  }

  function addPopup(x, y, text, color = '#ffffff') {
      popups.push({x, y, text, color, life: 45, maxLife: 45});
  }

  function triggerLineFlash(yRow) {
      lineFlashes.push({y: yRow, life: 18, maxLife: 18});
      shockwaves.push({x: BOARD_W / 2, y: yRow * CELL + CELL / 2, radius: 10, maxRadius: 150, life: 25, maxLife: 25, color: '#ffffff'});
      for (let i = 0; i < 25; i++) {
          let px = randomFloat() * BOARD_W;
          let py = yRow * CELL + CELL / 2;
          let vx = (randomFloat() - 0.5) * 7;
          let vy = (randomFloat() - 0.5) * 7;
          let pColors = ['#ffffff', '#ffff55', '#00ffff', '#ff9900', '#ff33ff'];
          addParticle(px, py, vx, vy, pColors[Math.floor(randomFloat() * pColors.length)], randomFloat() * 3 + 2, 25);
      }
  }

  function spawnHardDropImpact(x, y) {
      shockwaves.push({x: (x + 2.5) * CELL, y: (y + 2.5) * CELL, radius: 5, maxRadius: 100, life: 20, maxLife: 20, color: 'rgba(255,255,255,0.8)'});
      shockwaves.push({x: (x + 2.5) * CELL, y: (y + 2.5) * CELL, radius: 10, maxRadius: 130, life: 25, maxLife: 25, color: 'rgba(0,255,200,0.6)'});
      distortionTimer = 15;
      distortX = (x + 2.5) * CELL;
      distortY = (y + 2.5) * CELL;
  }

  function spawnDropParticles(gridX, startY, endY, colorVal) {
      const pColor = colors[colorVal] || '#ffffff';
      for (let y = Math.max(0, startY); y <= endY; y++) {
          for (let i = 0; i < 2; i++) {
              addParticle((gridX + randomFloat()) * CELL, y * CELL + randomFloat() * CELL, (randomFloat() - 0.5) * 2, -randomFloat() * 2 - 1, pColor, 2, 14);
          }
      }
      for (let i = 0; i < 16; i++) {
          addParticle((gridX + 0.5) * CELL + (randomFloat() - 0.5) * CELL * 2, endY * CELL + CELL, (randomFloat() - 0.5) * 6, (randomFloat() - 0.5) * 4 - 2, pColor, 3, 20);
      }
  }

  let bag = [];
  function getRandomPieceIndex() {
      let hasPentominos = (gameMode === MODE_CAMPAIGN ? (campaignLevel >= 15) : (level >= 15));
      if (bag.length === 0 || (!hasPentominos && bag.some(p => p >= 7))) {
          bag = [];
          for (let i = 0; i < 7; i++) bag.push(i);
          if (hasPentominos) bag.push(7 + Math.floor(randomFloat() * 6));
          for (let i = bag.length - 1; i > 0; i--) {
              let j = Math.floor(randomFloat() * (i + 1));
              [bag[i], bag[j]] = [bag[j], bag[i]];
          }
      }
      return bag.pop();
  }

  function fillNextQueue() {
      while (nextQueue.length < 3) {
          let pcIdx = getRandomPieceIndex();
          let isB = (Math.floor(randomFloat() * 12) === 0);
          nextQueue.push({ pc: pcIdx, isBomb: isB });
      }
  }

  function checkCol(p, r, x, y) {
      let shape = tetrominos[p][r];
      for (let i = 0; i < 5; i++) {
          for (let j = 0; j < 5; j++) {
              if (shape & (1 << (24 - (i * 5 + j)))) {
                  let nx = x + j, ny = y + i;
                  if (nx < 0 || nx >= W || ny >= H || (ny >= 0 && grid[ny][nx])) return true;
              }
          }
      }
      return false;
  }

  // Active Skills
  function useRowNuke() {
      if (nukeCharges <= 0 || gameOver || isPaused || startScreen || winScreen || showLeaderboard) return;
      nukeCharges--;
      for (let k = 0; k < 3; k++) {
          let rY = H - 1 - k;
          triggerLineFlash(rY);
          for (let x = 0; x < W; x++) {
              if (grid[rY][x] > 0) {
                  let pCol = colors[grid[rY][x]];
                  for (let p = 0; p < 3; p++) addParticle((x + 0.5) * CELL, (rY + 0.5) * CELL, (randomFloat() - 0.5) * 8, -randomFloat() * 6 - 2, pCol, 3, 20);
              }
          }
      }
      grid.splice(H - 3, 3);
      for (let k = 0; k < 3; k++) grid.unshift(Array(W).fill(0));
      score += 300;
      addPopup(BOARD_W / 2 - 25, H * CELL / 2, "ROW NUKE! +300", "#ff6600");
      playSound(180, 'sawtooth', 0.1); setTimeout(() => playSound(120, 'square', 0.15), 100);
  }

  function usePieceSwap() {
      if (swapCharges <= 0 || gameOver || isPaused || startScreen || winScreen || showLeaderboard) return;
      swapCharges--;
      let tempP = pc;
      let tempB = isBomb;
      pc = nextQueue[0].pc;
      isBomb = nextQueue[0].isBomb;
      nextQueue[0].pc = tempP;
      nextQueue[0].isBomb = tempB;
      rot = 0; cx = 3; cy = -2;
      addPopup(BOARD_W / 2 - 25, H * CELL / 2 + 20, "PIECE SWAP!", "#00ffcc");
      playSound(750, 'sine', 0.08);
  }

  function useGravityFreeze() {
      if (freezeCharges <= 0 || freezeTimerMs > 0 || gameOver || isPaused || startScreen || winScreen || showLeaderboard) return;
      freezeCharges--;
      freezeTimerMs = 10000;
      addPopup(BOARD_W / 2 - 35, H * CELL / 2 - 20, "GRAVITY FREEZE!", "#00f0ff");
      playSound(1200, 'sine', 0.12);
  }

  function spawn() {
      fillNextQueue();
      let nextObj = nextQueue.shift();
      pc = nextObj.pc;
      rot = 0; cx = 3; cy = -2;
      isBomb = nextObj.isBomb;
      fillNextQueue();
      holdUsed = false;

      if (checkCol(pc, rot, cx, cy + 1)) {
          gameOver = true;
          playSound(200, 'square', 0.5);
          saveLeaderboard(score, gameMode, lines, modeTimerMs);
      }
  }

  function lock() {
      let shape = tetrominos[pc][rot];
      let blockVal = isBomb ? 15 : (pc + 1);
      for (let i = 0; i < 5; i++) {
          for (let j = 0; j < 5; j++) {
              if (shape & (1 << (24 - (i * 5 + j)))) {
                  if (cy + i >= 0) grid[cy + i][cx + j] = blockVal;
              }
          }
      }
      let linesCleared = 0;
      let explodeCenters = Array(H).fill().map(() => Array(W).fill(false));
      let hasBombs = false;
      let clearedRows = [];
      for (let y = H - 1; y >= 0; y--) {
          if (grid[y].every(c => c > 0)) {
              clearedRows.push(y);
              for (let x = 0; x < W; x++) {
                  if (grid[y][x] === 15) {
                      explodeCenters[y][x] = true;
                      hasBombs = true;
                  }
              }
              grid.splice(y, 1);
              grid.unshift(Array(W).fill(0));
              explodeCenters.splice(y, 1);
              explodeCenters.unshift(Array(W).fill(false));
              linesCleared++;
              y++;
          }
      }

      for (let rY of clearedRows) {
          triggerLineFlash(rY);
      }
      
      if (hasBombs) {
          for (let y = 0; y < H; y++) {
              for (let x = 0; x < W; x++) {
                  if (explodeCenters[y][x]) {
                      for (let dy = -2; dy <= 2; dy++) {
                          for (let dx = -2; dx <= 2; dx++) {
                              let ny = y + dy, nx = x + dx;
                              if (ny >= 0 && ny < H && nx >= 0 && nx < W) {
                                  if (grid[ny][nx] > 0) {
                                      let pCol = colors[grid[ny][nx]];
                                      for(let k=0; k<4; k++) addParticle((nx + 0.5)*CELL, (ny + 0.5)*CELL, (randomFloat()-0.5)*8, (randomFloat()-0.5)*8, pCol, 3, 20);
                                  }
                                  grid[ny][nx] = 0;
                              }
                          }
                      }
                      score += 500;
                      addPopup(BOARD_W / 2, H * CELL / 2, "BOMB BOOM! +500", "#ff3333");
                      shockwaves.push({x: x * CELL + CELL / 2, y: y * CELL + CELL / 2, radius: 20, maxRadius: 200, life: 30, maxLife: 30, color: '#ff3333'});
                      playSound(150, 'sawtooth', 0.1); setTimeout(() => playSound(100, 'square', 0.2), 100);
                  }
              }
          }
      }

      if (linesCleared > 0) {
          if (linesCleared >= 1 && linesCleared <= 5) statLines[linesCleared - 1]++;
          combo++;
          playSound(1000 + linesCleared * 200 + combo * 100, 'square', 0.1);
          
          let popupText = ["", "SINGLE! +100", "DOUBLE! +300", "TRIPLE! +500", "TETRIS! +800", "PENTRIS! +1200"][linesCleared] || "CLEARED!";
          let popupColor = ["", "#00ffff", "#00ff00", "#ffa500", "#ff00ff", "#ffd700"][linesCleared] || "#ffffff";
          addPopup(BOARD_W / 2 - 20, (cy + 2) * CELL, popupText, popupColor);
          if (combo > 1) {
              addPopup(BOARD_W / 2 - 10, (cy + 2) * CELL + 16, "COMBO x" + combo + "!", "#ff4444");
          }
      } else {
          combo = 0;
          playSound(500, 'square', 0.05);
      }
      
      lines += linesCleared;
      piecesPlaced++;

      // Mode-specific logic
      if (gameMode === MODE_CAMPAIGN) {
          let goal = campaignLevel * 10;
          level = campaignLevel;
          score += linesCleared * 100 * level * (combo > 0 ? combo : 1);
          
          if (campaignLevel > 5 && campaignLevel <= 9) {
              let threshold = Math.max(5, 16 - campaignLevel);
              if (piecesPlaced % threshold === 0) {
                  grid.shift();
                  let newRow = Array(W).fill(14);
                  newRow[Math.floor(randomFloat() * W)] = 0;
                  grid.push(newRow);
                  playSound(300, 'square', 0.1);
              }
          } else if (campaignLevel >= 10 && campaignLevel < 15) {
              let threshold = Math.max(3, 18 - campaignLevel);
              if (piecesPlaced % threshold === 0) {
                  let cols = Math.floor(randomFloat() * 3) + 1;
                  for (let k = 0; k < cols; k++) {
                      let c = Math.floor(randomFloat() * W);
                      for (let y = 0; y < H - 1; y++) grid[y][c] = grid[y+1][c];
                      grid[H-1][c] = 14;
                  }
                  playSound(250, 'square', 0.08);
              }
          } else if (campaignLevel >= 15) {
              // Earthquake hazard in stages 15+
              let eqFreq = Math.max(3, 21 - campaignLevel);
              if (piecesPlaced % eqFreq === 0) {
                  shakeTimer = 12;
                  let rRow = H - 1 - Math.floor(randomFloat() * 8);
                  let dir = randomFloat() < 0.5 ? -1 : 1;
                  if (dir === 1) {
                      let temp = grid[rRow][W - 1];
                      for (let x = W - 1; x > 0; x--) grid[rRow][x] = grid[rRow][x - 1];
                      grid[rRow][0] = temp;
                  } else {
                      let temp = grid[rRow][0];
                      for (let x = 0; x < W - 1; x++) grid[rRow][x] = grid[rRow][x + 1];
                      grid[rRow][W - 1] = temp;
                  }
                  addPopup(BOARD_W / 2 - 30, H * CELL / 2 - 40, "EARTHQUAKE!", "#ffb400");
                  playSound(120, 'sawtooth', 0.2);
              }
          }

          if (lines >= goal) {
              campaignLevel++;
              if (campaignLevel > 20) {
                  winScreen = true;
                  playSound(800, 'square', 0.15); playSound(1000, 'square', 0.15); playSound(1200, 'square', 0.3);
                  saveLeaderboard(score, gameMode, lines, modeTimerMs);
                  return;
              } else {
                  init();
                  return;
              }
          }
      } else if (gameMode === MODE_SPRINT) {
          score += linesCleared * 100 * (combo > 0 ? combo : 1);
          if (lines >= 40) {
              winScreen = true;
              playSound(800, 'square', 0.15); playSound(1200, 'square', 0.3);
              saveLeaderboard(score, gameMode, lines, modeTimerMs);
              return;
          }
      } else { // MARATHON & ULTRA
          level = Math.floor(lines / 10) + 1;
          score += linesCleared * 100 * level * (combo > 0 ? combo : 1);
          dropInterval = Math.max(40, 500 - (level - 1) * 20);
      }
  }

  function init() {
      piecesPlaced = 0;
      grid = Array(H).fill().map(() => Array(W).fill(0));
      lines = 0;
      modeTimerMs = 0;
      ultraTimeLeftMs = 120000;
      combo = 0;
      bag = [];
      particles = [];
      popups = [];
      lineFlashes = [];
      shockwaves = [];
      nextQueue = [];
      nukeCharges = 2;
      swapCharges = 3;
      freezeCharges = 2;
      freezeTimerMs = 0;
      shakeTimer = 0;
      distortionTimer = 0;

      if (gameMode === MODE_CAMPAIGN) {
          let garbage = Math.min(12, campaignLevel * 2);
          for (let r = 0; r < garbage; r++) {
              let hole = Math.floor(randomFloat() * W);
              for (let x = 0; x < W; x++) {
                  grid[H - 1 - r][x] = (x === hole) ? 0 : 14;
              }
          }
          level = campaignLevel;
          dropInterval = Math.max(40, 500 - (level - 1) * 20);
      } else {
          level = 1;
          dropInterval = 500;
          statLines = [0, 0, 0, 0, 0];
      }

      gameOver = false;
      if (!isReplaying) { currentReplay = { seed: Date.now(), inputs: [] }; randomSeed(currentReplay.seed); } else { randomSeed(currentReplay.seed); replayTick = 0; replayIndex = 0; }
      isPaused = false;
      winScreen = false;
      showLeaderboard = false;
      holdPc = -1;
      holdUsed = false;
      holdIsBomb = false;

      fillNextQueue();
      spawn();
  }

  function formatTime(ms) {
      let secTotal = Math.floor(ms / 1000);
      let mins = Math.floor(secTotal / 60);
      let secs = secTotal % 60;
      let tenths = Math.floor((ms % 1000) / 100);
      return (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs + '.' + tenths;
  }

  // Interactive Skill Button Clicks
  canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const scale = Math.min(winW / 370, winH / 510) * 0.98;
      const mx = (e.clientX - rect.left) / scale;
      const my = (e.clientY - rect.top) / scale;
      if (!gameOver && !isPaused && !startScreen && !winScreen && !showLeaderboard && !showHelp) {
          if (mx >= SIDEBAR_X && mx <= SIDEBAR_X + 140) {
              if (my >= 380 && my <= 400) useRowNuke();
              else if (my >= 400 && my <= 420) usePieceSwap();
              else if (my >= 420 && my <= 440) useGravityFreeze();
          }
      }
  });

  
  document.addEventListener('keydown', e => {
      let key = e.key === ' ' ? ' ' : (e.key.length === 1 ? e.key.toLowerCase() : e.key);

      if (showKeybinds) {
          e.preventDefault();
          if (e.key === 'Escape') { showKeybinds = false; startScreen = true; return; }
          keybinds[bindNames[bindIndex]] = key;
          localStorage.setItem('ktetris_keys', JSON.stringify(keybinds));
          bindIndex++;
          if (bindIndex >= bindNames.length) { showKeybinds = false; startScreen = true; }
          return;
      }
if (showHelp) {
          if (e.key.toLowerCase() === 'h' || e.key === 'Escape' || e.key === 'Enter') {
              showHelp = false;
          }
          return;
      }

      if (startScreen) {
          if (e.key === '1') { gameMode = MODE_MARATHON; startScreen = false; score = 0; isReplaying = false; init(); return; }
          if (e.key === '2') { gameMode = MODE_SPRINT;   startScreen = false; score = 0; isReplaying = false; init(); return; }
          if (e.key === '3') { gameMode = MODE_ULTRA;    startScreen = false; score = 0; isReplaying = false; init(); return; }
          if (e.key === '4') { gameMode = MODE_CAMPAIGN; startScreen = false; campaignLevel = 1; score = 0; isReplaying = false; init(); return; }
          if (e.key === '5' || e.key.toLowerCase() === 'l') { showLeaderboard = true; startScreen = false; return; }
          if (e.key.toLowerCase() === 'v' || e.key.toLowerCase() === 'r') { isReplaying = false; loadGameState(); return; }
          if (e.key.toLowerCase() === 'h') { showHelp = true; return; }
          if (e.key.toLowerCase() === 'k') { showKeybinds = true; bindIndex = 0; startScreen = false; return; }
          if (e.key.toLowerCase() === 'w' && savedReplay) { isReplaying = true; currentReplay = savedReplay; startScreen = false; init(); return; }
          return;
      }
      if (showLeaderboard) {
          if (e.key === 'Enter' || e.key === 'Escape' || e.key.toLowerCase() === 'b') { showLeaderboard = false; startScreen = true; }
          if (e.key.toLowerCase() === 'e') { exportLeaderboard(); }
          if (e.key.toLowerCase() === 'i') { importLeaderboard(); }
          return;
      }
      if (winScreen || gameOver) {
          if (e.key === 'Enter') { startScreen = true; winScreen = false; gameOver = false; return; }
          if (e.key.toLowerCase() === 'e') { exportStats(); return; }
          if (e.key.toLowerCase() === 's' && !isReplaying) { localStorage.setItem('ktetris_replay', JSON.stringify(currentReplay)); addPopup(BOARD_W/2-25, H*CELL/2, "REPLAY SAVED!", "#00ff00"); savedReplay = currentReplay; return; }
          return;
      }

      if (key === keybinds.pause) { isPaused = !isPaused; return; }
      if (key === 'h') { showHelp = true; return; }
      if (key === 'v') { saveGameState(); return; }
      if (key === keybinds.nuke) { useRowNuke(); if(!isReplaying) currentReplay.inputs.push({t:replayTick, k:'nuke'}); return; }
      if (key === keybinds.swap) { usePieceSwap(); if(!isReplaying) currentReplay.inputs.push({t:replayTick, k:'swap'}); return; }
      if (key === keybinds.freeze) { useGravityFreeze(); if(!isReplaying) currentReplay.inputs.push({t:replayTick, k:'freeze'}); return; }
      if (isPaused) return;

      if (key === keybinds.left) { if (!checkCol(pc, rot, cx - 1, cy)) cx--; if(!isReplaying) currentReplay.inputs.push({t:replayTick, k:'left'}); }
      if (key === keybinds.right) { if (!checkCol(pc, rot, cx + 1, cy)) cx++; if(!isReplaying) currentReplay.inputs.push({t:replayTick, k:'right'}); }
      if (key === keybinds.down) { if (!checkCol(pc, rot, cx, cy + 1)) cy++; if(!isReplaying) currentReplay.inputs.push({t:replayTick, k:'down'}); }
      if (key === keybinds.up || key === 'x' || key === 'z') {
          let nr = (rot + 1) % 4;
          if (!checkCol(pc, nr, cx, cy)) rot = nr;
          else if (!checkCol(pc, nr, cx - 1, cy)) { cx--; rot = nr; }
          else if (!checkCol(pc, nr, cx + 1, cy)) { cx++; rot = nr; }
          else if (!checkCol(pc, nr, cx - 2, cy)) { cx -= 2; rot = nr; }
          else if (!checkCol(pc, nr, cx + 2, cy)) { cx += 2; rot = nr; }
          if(!isReplaying) currentReplay.inputs.push({t:replayTick, k:'up'});
      }
      if (key === keybinds.hold || e.key === 'Shift') {
          if (!holdUsed) {
              if (holdPc === -1) { holdPc = pc; holdIsBomb = isBomb; spawn(); } 
              else { let temp = pc; let tempBomb = isBomb; pc = holdPc; isBomb = holdIsBomb; holdPc = temp; holdIsBomb = tempBomb; rot = 0; cx = 3; cy = -2; }
              holdUsed = true; playSound(700, 'sine', 0.08);
              if(!isReplaying) currentReplay.inputs.push({t:replayTick, k:'hold'});
          }
      }
      if (key === keybinds.drop) {
          let startY = cy; let dropDist = 0;
          while (!checkCol(pc, rot, cx, cy + 1)) { cy++; dropDist++; }
          score += dropDist * 2; spawnDropParticles(cx, startY, cy, isBomb ? 15 : (pc + 1));
          spawnHardDropImpact(cx, cy);
          let oldLevel = campaignLevel; lock();
          if (!winScreen && !gameOver && (gameMode !== MODE_CAMPAIGN || campaignLevel === oldLevel)) spawn();
          if(!isReplaying) currentReplay.inputs.push({t:replayTick, k:'drop'});
      }
  });

  // Sprite / 3D Beveled Gem Block Renderer
  function drawBlock(ctx, px, py, colorIdx, size = CELL, drawState = 0) { // drawState: 0=normal, 1=ghost, 2=active
      if (!colorIdx || colorIdx <= 0) return;
      const baseColor = colors[colorIdx] || '#888899';
      const tick = Date.now();
      
      if (drawState === 1) { // Ghost
          ctx.save();
          const pulse = 0.4 + 0.25 * Math.sin(tick * 0.009);
          ctx.globalAlpha = pulse;
          ctx.strokeStyle = baseColor;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(px + 1.5, py + 1.5, size - 3, size - 3);
          
          // Animated scanline for ghost
          const scanY = (tick * 0.05) % size;
          ctx.fillStyle = baseColor;
          ctx.globalAlpha = pulse * 0.8;
          ctx.fillRect(px + 2, py + scanY, size - 4, 2);
          
          ctx.fillStyle = baseColor;
          ctx.globalAlpha = pulse * 0.15;
          ctx.fillRect(px + 2, py + 2, size - 4, size - 4);
          ctx.restore();
          return;
      }

      ctx.save();
      const bHi = bevelHi[colorIdx] || '#ffffff';
      const bSh = bevelSh[colorIdx] || '#222222';
      const bSize = Math.max(2, Math.floor(size / 6));

      // Active piece pulsing glow aura
      if (drawState === 2) {
          ctx.shadowColor = baseColor;
          ctx.shadowBlur = 8 + 4 * Math.sin(tick * 0.01);
      }

      // Main Background
      ctx.fillStyle = baseColor;
      ctx.fillRect(px + 1, py + 1, size - 2, size - 2);

      // Top-Left Bevel Highlight
      ctx.fillStyle = bHi;
      ctx.beginPath();
      ctx.moveTo(px + 1, py + 1);
      ctx.lineTo(px + size - 1, py + 1);
      ctx.lineTo(px + size - 1 - bSize, py + 1 + bSize);
      ctx.lineTo(px + 1 + bSize, py + 1 + bSize);
      ctx.lineTo(px + 1 + bSize, py + size - 1 - bSize);
      ctx.lineTo(px + 1, py + size - 1);
      ctx.closePath();
      ctx.fill();

      // Bottom-Right Bevel Shadow
      ctx.fillStyle = bSh;
      ctx.beginPath();
      ctx.moveTo(px + size - 1, py + 1);
      ctx.lineTo(px + size - 1, py + size - 1);
      ctx.lineTo(px + 1, py + size - 1);
      ctx.lineTo(px + 1 + bSize, py + size - 1 - bSize);
      ctx.lineTo(px + size - 1 - bSize, py + size - 1 - bSize);
      ctx.lineTo(px + size - 1 - bSize, py + 1 + bSize);
      ctx.closePath();
      ctx.fill();

      // Inner Gem Texture / Pattern based on piece type (colorIdx)
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      if (colorIdx >= 1 && colorIdx <= 3) {
          // Inner circle
          ctx.beginPath();
          ctx.arc(px + size / 2, py + size / 2, size / 4, 0, Math.PI * 2);
          ctx.fill();
      } else if (colorIdx >= 4 && colorIdx <= 6) {
          // Diamond pattern
          ctx.beginPath();
          ctx.moveTo(px + size / 2, py + bSize + 2);
          ctx.lineTo(px + size - bSize - 2, py + size / 2);
          ctx.lineTo(px + size / 2, py + size - bSize - 2);
          ctx.lineTo(px + bSize + 2, py + size / 2);
          ctx.fill();
      } else if (colorIdx >= 7 && colorIdx <= 9) {
          // Inner cross
          ctx.fillRect(px + size / 2 - 2, py + bSize + 2, 4, size - (bSize + 2) * 2);
          ctx.fillRect(px + bSize + 2, py + size / 2 - 2, size - (bSize + 2) * 2, 4);
      } else {
          // Default square box
          ctx.fillRect(px + bSize + 1, py + bSize + 1, size - (bSize + 1) * 2, size - (bSize + 1) * 2);
      }
      ctx.restore();

      // Gem Corner Flare
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath();
      ctx.moveTo(px + bSize + 1, py + bSize + 1);
      ctx.lineTo(px + bSize + 4, py + bSize + 1);
      ctx.lineTo(px + bSize + 1, py + bSize + 4);
      ctx.closePath();
      ctx.fill();

      // Special details
      if (colorIdx === 15) { // Bomb
          const fuseFlicker = randomFloat() > 0.5 ? '#ffff00' : '#ffffff';
          const innerPulse = Math.abs(Math.sin(tick * 0.015));
          ctx.fillStyle = '#ff0000';
          ctx.beginPath();
          ctx.arc(px + size / 2, py + size / 2, Math.max(3, size / 3), 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = fuseFlicker;
          ctx.beginPath();
          ctx.arc(px + size / 2, py + size / 2, Math.max(1, (size / 4) * innerPulse), 0, Math.PI * 2);
          ctx.fill();
      } else if (colorIdx === 14) { // Garbage
          // Metallic / Rusty look
          ctx.fillStyle = '#8B4513'; // Rusty dots
          ctx.fillRect(px + 4, py + 4, 3, 3);
          ctx.fillRect(px + size - 7, py + size - 7, 3, 3);
          ctx.fillStyle = '#A0522D';
          ctx.fillRect(px + size - 8, py + 5, 2, 2);
          
          // Cross metallic sheen
          ctx.fillStyle = 'rgba(200, 200, 200, 0.2)';
          ctx.beginPath();
          ctx.moveTo(px + 1, py + size / 2);
          ctx.lineTo(px + size - 1, py + 1);
          ctx.lineTo(px + size - 1, py + 4);
          ctx.lineTo(px + 4, py + size - 1);
          ctx.fill();
      }
      
      if (drawState === 2 && colorIdx !== 14 && colorIdx !== 15) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(px + 1, py + 1, size - 2, size - 2);
          ctx.clip();
          
          let reflectionOffset = (px * 0.5 + py * 0.5 + tick * 0.05) % (size * 3);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.beginPath();
          ctx.moveTo(px - size + reflectionOffset, py - size);
          ctx.lineTo(px + reflectionOffset, py - size);
          ctx.lineTo(px - size + reflectionOffset + size * 2, py + size * 2);
          ctx.lineTo(px - size * 2 + reflectionOffset + size * 2, py + size * 2);
          ctx.fill();
          
          ctx.restore();
      }

      // Glinting highlight animation for placed blocks (drawState === 0)
      if (drawState === 0 && colorIdx !== 14 && colorIdx !== 15) {
          // Sweeping highlight
          let sweep = (tick * 0.15) % 3000; // 3 seconds cycle
          let diag = px + py; 
          // Check if the sweep line is near the block's diagonal
          if (sweep > diag - 30 && sweep < diag + 30) {
              let intensity = Math.max(0, 1.0 - Math.abs(sweep - diag) / 30.0);
              ctx.save();
              ctx.fillStyle = `rgba(255, 255, 255, ${0.4 * intensity})`;
              ctx.beginPath();
              ctx.moveTo(px + 1, py + size - 1);
              ctx.lineTo(px + size - 1, py + 1);
              ctx.lineTo(px + size - 1, py + size / 2);
              ctx.lineTo(px + size / 2, py + size - 1);
              ctx.fill();
              ctx.restore();
          }
      }

      ctx.restore();
  }

  function draw() {
      // Background base
      ctx.fillStyle = '#0a0a14'; // Dark space background
      ctx.fillRect(0, 0, 370, 510);
      
      // Cyber-grid environmental art
      const tick = Date.now();
      const gridScroll = (tick * 0.05) % 40;
      
      ctx.save();
      ctx.strokeStyle = 'rgba(0, 255, 200, 0.08)';
      ctx.lineWidth = 1;
      for (let i = -10; i < 40; i++) { 
          const xPos = i * 40;
          ctx.beginPath(); ctx.moveTo(xPos, 0); ctx.lineTo(xPos, 510); ctx.stroke();
      }
      for (let j = -10; j < 40; j++) { 
          const yPos = j * 40 + gridScroll;
          ctx.beginPath(); ctx.moveTo(0, yPos); ctx.lineTo(370, yPos); ctx.stroke();
      }
      ctx.restore();

      // Matrix star/dust atmospheric effects
      ctx.save();
      ctx.fillStyle = 'rgba(0, 255, 200, 0.4)';
      for (let i = 0; i < 30; i++) {
          const starY = (i * 27 + tick * 0.02) % 510;
          const starX = (Math.sin(i * 1.5) * 185) + 185;
          ctx.beginPath();
          ctx.arc(starX, starY, (i % 3 == 0) ? 1.5 : 0.8, 0, Math.PI*2);
          ctx.fill();
      }
      ctx.restore();

      let offX = 0, offY = 0;
      if (shakeTimer > 0) {
          offX = Math.floor(randomFloat() * 7) - 3;
          offY = Math.floor(randomFloat() * 7) - 3;
      }
      
      // Grid background lines with localized distortion
      ctx.strokeStyle = 'rgba(255,255,255,0.035)';
      ctx.lineWidth = 1;
      let dForce = distortionTimer > 0 ? (distortionTimer / 15.0) * 12.0 : 0;
      for (let x = 0; x <= W; x++) {
          ctx.beginPath();
          for (let y = 0; y <= H; y++) {
              let lx = offX + x * CELL;
              let ly = offY + y * CELL;
              if (dForce > 0) {
                  let dx = lx - distortX;
                  let dy = ly - distortY;
                  let dist = Math.sqrt(dx*dx + dy*dy);
                  if (dist < 100 && dist > 0) {
                      lx += (dx / dist) * dForce * (1 - dist/100);
                      ly += (dy / dist) * dForce * (1 - dist/100);
                  }
              }
              if (y === 0) ctx.moveTo(lx, ly);
              else ctx.lineTo(lx, ly);
          }
          ctx.stroke();
      }
      for (let y = 0; y <= H; y++) {
          ctx.beginPath();
          for (let x = 0; x <= W; x++) {
              let lx = offX + x * CELL;
              let ly = offY + y * CELL;
              if (dForce > 0) {
                  let dx = lx - distortX;
                  let dy = ly - distortY;
                  let dist = Math.sqrt(dx*dx + dy*dy);
                  if (dist < 100 && dist > 0) {
                      lx += (dx / dist) * dForce * (1 - dist/100);
                      ly += (dy / dist) * dForce * (1 - dist/100);
                  }
              }
              if (x === 0) ctx.moveTo(lx, ly);
              else ctx.lineTo(lx, ly);
          }
          ctx.stroke();
      }

      // Matrix bounds glowing neon edge
      let neonPulse = 0.5 + 0.5 * Math.sin(tick * 0.005);
      ctx.save();
      ctx.strokeStyle = `rgba(0, 255, 200, ${0.4 + 0.4 * neonPulse})`;
      ctx.lineWidth = 2 + 2 * neonPulse;
      ctx.shadowColor = '#00ffcc';
      ctx.shadowBlur = 8 + 8 * neonPulse;
      ctx.strokeRect(offX, offY, BOARD_W, H * CELL);
      ctx.restore();

      // Board blocks
      for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
              if (grid[y][x]) {
                  drawBlock(ctx, offX + x * CELL, offY + y * CELL, grid[y][x], CELL, 0);
              }
          }
      }

      // Active & Ghost Pieces
      if (!gameOver && !isPaused && !startScreen && !winScreen && !showLeaderboard) {
          let drawVal = isBomb ? 15 : (pc + 1);
          // Ghost piece
          let ghost_y = cy;
          while (!checkCol(pc, rot, cx, ghost_y + 1)) ghost_y++;
          let shape = tetrominos[pc][rot];
          for (let i = 0; i < 5; i++) {
              for (let j = 0; j < 5; j++) {
                  if (shape & (1 << (24 - (i * 5 + j)))) {
                      if (ghost_y + i >= 0) {
                          drawBlock(ctx, offX + (cx + j) * CELL, offY + (ghost_y + i) * CELL, drawVal, CELL, 1);
                      }
                  }
              }
          }
          
          // Current active piece
          for (let i = 0; i < 5; i++) {
              for (let j = 0; j < 5; j++) {
                  if (shape & (1 << (24 - (i * 5 + j)))) {
                      if (cy + i >= 0) {
                          drawBlock(ctx, offX + (cx + j) * CELL, offY + (cy + i) * CELL, drawVal, CELL, 2);
                      }
                  }
              }
          }
      }

      // Line flashes
      for (let f of lineFlashes) {
          let alpha = f.life / f.maxLife;
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
          ctx.fillRect(offX, offY + f.y * CELL, BOARD_W, CELL);
      }

      // Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
          let sw = shockwaves[i];
          let alpha = sw.life / sw.maxLife;
          let r = sw.radius + (sw.maxRadius - sw.radius) * (1 - alpha);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = sw.color;
          ctx.lineWidth = 2 + 2 * alpha;
          ctx.beginPath();
          ctx.arc(offX + sw.x, offY + sw.y, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
          sw.life--;
          if (sw.life <= 0) shockwaves.splice(i, 1);
      }

      // Particles
      for (let p of particles) {
          let alpha = p.life / p.maxLife;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(offX + p.x, offY + p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
      }

      // Popups
      for (let pop of popups) {
          let alpha = pop.life / pop.maxLife;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = pop.color;
          ctx.font = 'bold 13px system-ui, monospace';
          ctx.shadowColor = '#000000';
          ctx.shadowBlur = 4;
          ctx.fillText(pop.text, offX + pop.x, offY + pop.y);
          ctx.restore();
      }

      // Divider bar
      ctx.strokeStyle = '#282a36';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(BOARD_W, 0);
      ctx.lineTo(BOARD_W, H * CELL);
      ctx.stroke();

      // UI Panel
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px system-ui, sans-serif';
      
      // Mode Header
      ctx.fillStyle = '#00f0f0';
      ctx.fillText(modeNames[gameMode] + (isReplaying ? ' [REPLAY]' : ''), SIDEBAR_X, 22);

      ctx.fillStyle = '#aaaaaa';
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillText('SCORE:', SIDEBAR_X, 42);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.fillText(score.toString(), SIDEBAR_X, 58);

      ctx.fillStyle = '#aaaaaa';
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillText('HIGH SCORE:', SIDEBAR_X, 78);
      ctx.fillStyle = '#ffff55';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.fillText(highScore.toString(), SIDEBAR_X, 93);

      // Timers / Progress
      ctx.fillStyle = '#aaaaaa';
      ctx.font = '11px system-ui, sans-serif';
      if (gameMode === MODE_SPRINT) {
          ctx.fillText('TIME:', SIDEBAR_X, 113);
          ctx.fillStyle = '#55ff55';
          ctx.fillText(formatTime(modeTimerMs), SIDEBAR_X, 128);
          ctx.fillStyle = '#aaaaaa';
          ctx.fillText(`LINES: ${lines}/40`, SIDEBAR_X, 145);
      } else if (gameMode === MODE_ULTRA) {
          ctx.fillText('TIME LEFT:', SIDEBAR_X, 113);
          ctx.fillStyle = ultraTimeLeftMs <= 10000 ? '#ff4444' : '#55ff55';
          ctx.fillText(formatTime(ultraTimeLeftMs), SIDEBAR_X, 128);
          ctx.fillStyle = '#aaaaaa';
          ctx.fillText(`LINES: ${lines}`, SIDEBAR_X, 145);
      } else if (gameMode === MODE_CAMPAIGN) {
          ctx.fillText(`STAGE: ${campaignLevel}/20`, SIDEBAR_X, 113);
          ctx.fillText(`LINES: ${lines}/${campaignLevel * 10}`, SIDEBAR_X, 130);
      } else {
          ctx.fillText(`LEVEL: ${level}`, SIDEBAR_X, 113);
          ctx.fillText(`LINES: ${lines}`, SIDEBAR_X, 130);
      }

      // Next 3 Preview Slot
      ctx.fillStyle = '#00f0f0';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillText('NEXT (3):', SIDEBAR_X, 172);

      if (!gameOver && nextQueue.length >= 3) {
          // Preview 1 (13px cell)
          let p1 = nextQueue[0];
          let shape1 = tetrominos[p1.pc][0];
          let v1 = p1.isBomb ? 15 : (p1.pc + 1);
          for (let i = 0; i < 5; i++) {
              for (let j = 0; j < 5; j++) {
                  if (shape1 & (1 << (24 - (i * 5 + j)))) {
                      drawBlock(ctx, SIDEBAR_X + j * 13, 180 + i * 13, v1, 13);
                  }
              }
          }

          // Preview 2 (Mini: 9px cell)
          let p2 = nextQueue[1];
          let shape2 = tetrominos[p2.pc][0];
          let v2 = p2.isBomb ? 15 : (p2.pc + 1);
          for (let i = 0; i < 5; i++) {
              for (let j = 0; j < 5; j++) {
                  if (shape2 & (1 << (24 - (i * 5 + j)))) {
                      drawBlock(ctx, SIDEBAR_X + j * 9, 250 + i * 9, v2, 9);
                  }
              }
          }

          // Preview 3 (Mini: 9px cell)
          let p3 = nextQueue[2];
          let shape3 = tetrominos[p3.pc][0];
          let v3 = p3.isBomb ? 15 : (p3.pc + 1);
          for (let i = 0; i < 5; i++) {
              for (let j = 0; j < 5; j++) {
                  if (shape3 & (1 << (24 - (i * 5 + j)))) {
                      drawBlock(ctx, SIDEBAR_X + 65 + j * 9, 250 + i * 9, v3, 9);
                  }
              }
          }
      }

      // Hold Piece Slot
      ctx.fillStyle = '#00f0f0';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillText(holdUsed ? 'HOLD (LOCKED):' : 'HOLD [C]:', SIDEBAR_X, 305);

      if (holdPc !== -1) {
          let holdShape = tetrominos[holdPc][0];
          let holdVal = holdIsBomb ? 15 : (holdPc + 1);
          for (let i = 0; i < 5; i++) {
              for (let j = 0; j < 5; j++) {
                  if (holdShape & (1 << (24 - (i * 5 + j)))) {
                      drawBlock(ctx, SIDEBAR_X + j * 11, 315 + i * 11, holdVal, 11);
                  }
              }
          }
      }

      // SKILLS Panel
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillText('ACTIVE SKILLS:', SIDEBAR_X, 375);

      ctx.font = '11px system-ui, monospace';
      ctx.fillStyle = nukeCharges > 0 ? '#ff7832' : '#666666';
      ctx.fillText(`[B] Nuke: ${nukeCharges}`, SIDEBAR_X, 393);

      ctx.fillStyle = swapCharges > 0 ? '#00ffc8' : '#666666';
      ctx.fillText(`[S] Swap: ${swapCharges}`, SIDEBAR_X, 411);

      ctx.fillStyle = freezeTimerMs > 0 ? '#00ffff' : (freezeCharges > 0 ? '#64c8ff' : '#666666');
      ctx.fillText(freezeTimerMs > 0 ? `[F] FROZEN (${Math.ceil(freezeTimerMs / 1000)}s)` : `[F] Freeze: ${freezeCharges}`, SIDEBAR_X, 429);

      // Hints
      ctx.fillStyle = '#aaaaaa';
      ctx.font = 'bold 10px system-ui, monospace';
      ctx.fillText('[Arrows] Move/Rot', SIDEBAR_X, 452);
      ctx.fillText('[Space] Hard Drop', SIDEBAR_X, 468);
      ctx.fillStyle = '#00ffcc';
      ctx.fillText('[H] Help / Controls', SIDEBAR_X, 484);

      // Screens & Overlays
      if (showHelp) {
          ctx.fillStyle = 'rgba(10, 11, 16, 0.94)';
          ctx.fillRect(0, 0, 370, 510);
          ctx.fillStyle = '#00ffff';
          ctx.font = 'bold 20px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('CONTROLS & HELP', 370 / 2, 45);
          ctx.fillStyle = '#ffffff';
          ctx.font = '13px system-ui, monospace';
          ctx.textAlign = 'left';
          let hints = [
              "Left/Right : Move Piece",
              "Up Arrow   : Rotate Piece",
              "Down Arrow : Soft Drop",
              "Space      : Hard Drop",
              "C or Shift : Hold Piece",
              "B          : Use Nuke Skill",
              "S          : Use Swap Skill",
              "F          : Use Freeze Skill",
              "P          : Pause Game",
              "V          : Save Game",
              "H          : Toggle Help"
          ];
          hints.forEach((h, idx) => {
              ctx.fillText(h, 60, 90 + idx * 25);
          });
          ctx.fillStyle = '#666677';
          ctx.textAlign = 'center';
          ctx.fillText('Press H, ESC, or ENTER to return', 370 / 2, 480);
          ctx.textAlign = 'left';
      } else if (showKeybinds) {
          ctx.fillStyle = 'rgba(10, 11, 16, 0.94)';
          ctx.fillRect(0, 0, 370, 510);
          ctx.fillStyle = '#00ffff';
          ctx.font = 'bold 20px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('KEYBINDS CONFIG', 185, 50);
          ctx.fillStyle = '#ffffff';
          ctx.font = '14px system-ui, monospace';
          ctx.textAlign = 'left';
          bindNames.forEach((b, i) => {
              ctx.fillStyle = i === bindIndex ? '#00ff66' : '#aaaaaa';
              ctx.fillText(b.toUpperCase() + ": " + (i === bindIndex ? "[PRESS KEY]" : keybinds[b]), 50, 100 + i * 25);
          });
          ctx.fillStyle = '#666677';
          ctx.textAlign = 'center';
          ctx.fillText('Press ESC to cancel', 185, 480);
          ctx.textAlign = 'left';
      } else if (showLeaderboard) {
          ctx.fillStyle = 'rgba(10, 11, 16, 0.92)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#00ffff';
          ctx.font = 'bold 18px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('LEADERBOARD', 370 / 2, 45);

          ctx.fillStyle = '#8888aa';
          ctx.font = '11px system-ui, monospace';
          ctx.fillText('RANK   SCORE   MODE     TIME', 370 / 2, 75);

          ctx.strokeStyle = '#282a36';
          ctx.beginPath(); ctx.moveTo(20, 85); ctx.lineTo(370 - 20, 85); ctx.stroke();

          if (leaderboard.length === 0) {
              ctx.fillStyle = '#666677';
              ctx.font = '12px system-ui, sans-serif';
              ctx.fillText('No scores recorded yet!', 370 / 2, 140);
          } else {
              leaderboard.forEach((entry, idx) => {
                  let yPos = 115 + idx * 35;
                  ctx.fillStyle = idx === 0 ? '#ffea00' : (idx === 1 ? '#e0e0e0' : (idx === 2 ? '#cd7f32' : '#ffffff'));
                  ctx.font = 'bold 12px system-ui, monospace';
                  ctx.textAlign = 'left';
                  ctx.fillText(`#${idx + 1}`, 30, yPos);
                  ctx.fillText(`${entry.score}`, 85, yPos);
                  ctx.fillStyle = '#00f0f0';
                  ctx.fillText(`${entry.mode.substring(0, 8)}`, 165, yPos);
                  ctx.fillStyle = '#aaaaaa';
                  ctx.fillText(`${entry.time || '--'}`, 265, yPos);
              });
          }

          ctx.fillStyle = '#aaaaaa';
          ctx.font = '12px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('ENTER: Menu | E: Export | I: Import', 370 / 2, 480);
          ctx.textAlign = 'left';
      } else if (gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.78)';
          ctx.fillRect(10, 140, BOARD_W - 20, 120);
          ctx.fillStyle = '#ff3333';
          ctx.font = 'bold 20px system-ui, monospace';
          ctx.fillText('GAME OVER', 35, 185);
          ctx.fillStyle = '#aaaaaa';
          ctx.font = '12px system-ui, monospace';
          ctx.fillText('[ENTER] MENU', 48, 220);
          ctx.fillText('[E] EXPORT STATS', 48, 240);
          ctx.fillText('[S] SAVE REPLAY', 48, 260);
      } else if (winScreen) {
          ctx.fillStyle = 'rgba(0,0,0,0.78)';
          ctx.fillRect(10, 130, BOARD_W - 20, 130);
          ctx.fillStyle = '#00ff66';
          ctx.font = 'bold 20px system-ui, monospace';
          ctx.fillText('VICTORY!', 50, 175);
          ctx.fillStyle = '#ffffff';
          ctx.font = '12px system-ui, monospace';
          ctx.fillText(gameMode === MODE_SPRINT ? `TIME: ${formatTime(modeTimerMs)}` : 'STAGE CLEARED!', 30, 205);
          ctx.fillText('[ENTER] MENU', 30, 230);
          ctx.fillText('[E] EXPORT STATS | [S] SAVE REPLAY', 30, 250);
      } else if (startScreen) {
          ctx.fillStyle = 'rgba(10, 11, 16, 0.94)';
          ctx.fillRect(0, 0, 370, 510);

          ctx.fillStyle = '#00ffff';
          ctx.font = 'bold 24px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('K-TETRIS', 370 / 2, 50);

          ctx.fillStyle = '#8888aa';
          ctx.font = '12px system-ui, sans-serif';
          ctx.fillText('Select Game Mode:', 370 / 2, 85);

          let options = [
              "1. Marathon (Endless)",
              "2. Sprint (40-Lines Race)",
              "3. Ultra (2-Minute Timed)",
              "4. Campaign (20 Stages)"
          ];

          options.forEach((opt, idx) => {
              ctx.fillStyle = '#ffffff';
              ctx.font = '13px system-ui, monospace';
              ctx.textAlign = 'left';
              ctx.fillText(opt, 70, 125 + idx * 32);
          });

          ctx.fillStyle = '#00ff66';
          ctx.fillText('5 / [L]. High Scores', 70, 125 + 4 * 32);

          let yOffset = 125 + 5 * 32;
          ctx.fillStyle = '#ffaa00';
          ctx.fillText('[H]. Help & Controls', 70, yOffset);
          ctx.fillStyle = '#00ccff';
          ctx.fillText('[K]. Configure Keybinds', 70, yOffset + 96);
          if (savedReplay) { ctx.fillStyle = '#ff55aa'; ctx.fillText('[W]. Watch Last Replay', 70, yOffset + 64); }


          if (hasSavedGame()) {
              ctx.fillStyle = '#ff00ff';
              ctx.font = 'bold 13px system-ui, monospace';
              ctx.fillText('[V]. Resume Saved Game', 70, yOffset + 96);
          }

          ctx.fillStyle = '#ffff00';
          ctx.font = 'bold 12px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Press [H] for Help / Controls', 370 / 2, 470);
          ctx.fillStyle = '#666677';
          ctx.font = '11px system-ui, sans-serif';
          ctx.fillText('Press [L] for Leaderboard', 370 / 2, 490);
          ctx.textAlign = 'left';
      } else if (isPaused) {
          ctx.fillStyle = 'rgba(0,0,0,0.75)';
          ctx.fillRect(15, 160, BOARD_W - 30, 70);
          ctx.fillStyle = '#ffff00';
          ctx.font = 'bold 20px system-ui, monospace';
          ctx.fillText('PAUSED', 55, 202);
      }
  }

  let lastTime = performance.now();
  let dropCounter = 0;
  let dropInterval = 500;

  function update(time = performance.now()) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (!isPaused && !gameOver && !startScreen && !winScreen && !showLeaderboard && !showHelp && !showKeybinds) {
          replayTick += deltaTime;
          if (isReplaying) {
              while (replayIndex < currentReplay.inputs.length && currentReplay.inputs[replayIndex].t <= replayTick) {
                  let k = currentReplay.inputs[replayIndex].k;
                  if (k === 'left' && !checkCol(pc, rot, cx - 1, cy)) cx--;
                  if (k === 'right' && !checkCol(pc, rot, cx + 1, cy)) cx++;
                  if (k === 'down' && !checkCol(pc, rot, cx, cy + 1)) cy++;
                  if (k === 'up') {
                      let nr = (rot + 1) % 4;
                      if (!checkCol(pc, nr, cx, cy)) rot = nr;
                      else if (!checkCol(pc, nr, cx - 1, cy)) { cx--; rot = nr; }
                      else if (!checkCol(pc, nr, cx + 1, cy)) { cx++; rot = nr; }
                  }
                  if (k === 'hold' && !holdUsed) {
                      if (holdPc === -1) { holdPc = pc; holdIsBomb = isBomb; spawn(); } 
                      else { let temp = pc; let tempBomb = isBomb; pc = holdPc; isBomb = holdIsBomb; holdPc = temp; holdIsBomb = tempBomb; rot = 0; cx = 3; cy = -2; }
                      holdUsed = true; playSound(700, 'sine', 0.08);
                  }
                  if (k === 'drop') {
                      let startY = cy; let dropDist = 0;
                      while (!checkCol(pc, rot, cx, cy + 1)) { cy++; dropDist++; }
                      score += dropDist * 2; spawnDropParticles(cx, startY, cy, isBomb ? 15 : (pc + 1));
                      spawnHardDropImpact(cx, cy);
                      let oldLevel = campaignLevel; lock();
                      if (!winScreen && !gameOver && (gameMode !== MODE_CAMPAIGN || campaignLevel === oldLevel)) spawn();
                  }
                  if (k === 'nuke') useRowNuke();
                  if (k === 'swap') usePieceSwap();
                  if (k === 'freeze') useGravityFreeze();
                  replayIndex++;
              }
              if (replayIndex >= currentReplay.inputs.length && currentReplay.inputs.length > 0) {
                  addPopup(BOARD_W / 2 - 35, H * CELL / 2 - 20, "REPLAY FINISHED", "#ffff00");
              }
          }
          modeTimerMs += deltaTime;

          if (freezeTimerMs > 0) {
              freezeTimerMs -= deltaTime;
              if (freezeTimerMs < 0) freezeTimerMs = 0;
          }

          if (shakeTimer > 0) shakeTimer--;
          if (distortionTimer > 0) distortionTimer--;

          if (gameMode === MODE_ULTRA) {
              ultraTimeLeftMs -= deltaTime;
              if (ultraTimeLeftMs <= 0) {
                  ultraTimeLeftMs = 0;
                  gameOver = true;
                  playSound(200, 'square', 0.5);
                  addPopup(BOARD_W / 2 - 35, H * CELL / 2, "TIME EXPIRED!", "#ff3333");
                  saveLeaderboard(score, gameMode, lines, 120000);
              }
          }

          if (freezeTimerMs <= 0) {
              dropCounter += deltaTime;
              if (dropCounter > dropInterval) {
                  if (!checkCol(pc, rot, cx, cy + 1)) cy++;
                  else { 
                      let oldLevel = campaignLevel;
                      lock(); 
                      if (!winScreen && !gameOver && (gameMode !== MODE_CAMPAIGN || campaignLevel === oldLevel)) spawn(); 
                  }
                  dropCounter = 0;
              }
          }
      }

      // Update particle physics
      for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.life--;
          if (p.life <= 0) particles.splice(i, 1);
      }

      // Update popups
      for (let i = popups.length - 1; i >= 0; i--) {
          let pop = popups[i];
          pop.y -= 0.6;
          pop.life--;
          if (pop.life <= 0) popups.splice(i, 1);
      }

      // Update line flashes
      for (let i = lineFlashes.length - 1; i >= 0; i--) {
          let f = lineFlashes[i];
          f.life--;
          if (f.life <= 0) lineFlashes.splice(i, 1);
      }
      
      draw();
      requestAnimationFrame(update);
  }

  fillNextQueue();
  update();
</script>
</body>
