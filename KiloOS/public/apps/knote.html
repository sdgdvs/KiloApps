<!DOCTYPE html>
<html>
<head>
<title>KNote</title>
<style>
  body { margin: 0; background-color: #fffde7; display: flex; height: 100vh; overflow: hidden; font-family: "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .sidebar { width: 220px; background: #fff9c4; border-right: 1px solid #e0e0a0; display: flex; flex-direction: column; }
  .main { flex: 1; display: flex; flex-direction: column; background: #fffef0; }
  .toolbar { padding: 8px; display: flex; justify-content: flex-end; border-bottom: 1px solid #e0e0a0; gap: 8px; background: #fff9c4; }
  button { background: #fff; border: 1px solid #d0d090; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-family: "Segoe UI", sans-serif; font-size: 13px; transition: background 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  button:hover { background: #f0f0c0; }
  .search-box { padding: 8px; border-bottom: 1px solid #e0e0a0; }
  .search-box input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; font-family: "Segoe UI", sans-serif; }
  .note-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
  .note-item { padding: 10px; border-bottom: 1px solid #f0f0c0; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.1s; }
  .note-item:hover { background: #fff59d; }
  .note-item.active { background: #fff176; font-weight: bold; border-left: 3px solid #fbc02d; padding-left: 7px; }
  textarea { flex: 1; width: 100%; box-sizing: border-box; background-color: transparent; border: none; padding: 15px; font-family: "Segoe UI", sans-serif; font-size: 15px; resize: none; outline: none; line-height: 1.5; }
  #statusBar { padding: 6px 15px; background: #fff9c4; border-top: 1px solid #e0e0a0; font-size: 12px; color: #555; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="sidebar">
    <div style="padding: 8px;"><button id="newBtn" style="width: 100%">New Note</button></div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Search notes..."></div>
    <ul class="note-list" id="noteList"></ul>
</div>
<div class="main">
    <div class="toolbar">
        <button id="helpBtn">Help [F1]</button>
        <button id="pinBtn">Pin Note</button>
        <button id="exportBtn">Export TXT</button>
        <button id="delBtn">Delete Note</button>
    </div>
    <textarea id="noteArea" spellcheck="false" maxlength="6000"></textarea>
    <div id="statusBar">  Words: 0 | Chars: 0</div>
</div>
<script>
  const noteArea = document.getElementById('noteArea');
  const newBtn = document.getElementById('newBtn');
  const delBtn = document.getElementById('delBtn');
  const pinBtn = document.getElementById('pinBtn');
  const exportBtn = document.getElementById('exportBtn');
  const helpBtn = document.getElementById('helpBtn');
  const searchInput = document.getElementById('searchInput');
  const noteList = document.getElementById('noteList');
  const statusBar = document.getElementById('statusBar');
  
  let notes = [];
  try {
      let saved = localStorage.getItem('knote_data_multi');
      if (saved) notes = JSON.parse(saved);
      else {
          let old = localStorage.getItem('knote_data');
          if (old) notes.push({ text: old, pinned: false });
          else notes.push({ text: "Welcome to KNote!\n\nShortcuts:\n- Use the sidebar to switch notes.\n- Click New Note to create a note.\n- Click Pin Note to pin to the top.\n- Click Help or press F1/H for Help.", pinned: false });
      }
  } catch (e) {
      notes = [{ text: "Welcome to KNote!\n\nShortcuts:\n- Click Help or press F1/H for Help.", pinned: false }];
  }
  
  if (notes.length === 0) notes.push({ text: "", pinned: false });
  notes.forEach(n => { if (typeof n.pinned === 'undefined') n.pinned = false; });

  let activeIndex = 0;
  
  function updateStats() {
      let text = noteArea.value;
      let chars = text.length;
      let words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
      statusBar.innerText = `  Words: ${words} | Chars: ${chars}`;
  }
  
  function save() {
      try {
          localStorage.setItem('knote_data_multi', JSON.stringify(notes));
      } catch (e) {
          alert("Storage quota exceeded! Please delete some notes.");
      }
      renderList();
  }
  
  function renderList() {
      noteList.innerHTML = '';
      let query = searchInput.value.toLowerCase().trim();
      
      let items = notes.map((note, idx) => ({ ...note, origIndex: idx }));
      if (query) {
          items = items.filter(n => n.text.toLowerCase().includes(query));
      }
      
      // Sort pinned notes first while maintaining order
      items.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      
      items.forEach((item) => {
          let i = item.origIndex;
          let li = document.createElement('li');
          li.className = 'note-item' + (i === activeIndex ? ' active' : '');
          let title = item.text.trim().split('\n')[0];
          let displayTitle = (item.pinned ? '📌 ' : '') + (title ? title : 'Empty Note');
          li.innerText = displayTitle;
          li.onclick = () => { activeIndex = i; loadActive(); };
          noteList.appendChild(li);
      });
      
      if (notes[activeIndex]) {
          pinBtn.innerText = notes[activeIndex].pinned ? 'Unpin Note' : 'Pin Note';
      }
  }
  
  function loadActive() {
      if (notes.length === 0) notes.push({ text: "", pinned: false });
      if (activeIndex >= notes.length) activeIndex = notes.length - 1;
      noteArea.value = notes[activeIndex].text;
      updateStats();
      renderList();
      noteArea.focus();
  }
  
  noteArea.addEventListener('input', () => {
      notes[activeIndex].text = noteArea.value;
      updateStats();
      save();
  });
  
  searchInput.addEventListener('input', () => {
      renderList();
  });
  
  newBtn.addEventListener('click', () => {
      if (notes.length >= 100) {
          alert("Maximum of 100 notes reached. Please delete some notes first.");
          return;
      }
      notes.push({ text: "", pinned: false });
      activeIndex = notes.length - 1;
      save();
      loadActive();
  });
  
  delBtn.addEventListener('click', () => {
      notes.splice(activeIndex, 1);
      if (notes.length === 0) notes.push({ text: "", pinned: false });
      if (activeIndex >= notes.length) activeIndex = notes.length - 1;
      save();
      loadActive();
  });
  
  pinBtn.addEventListener('click', () => {
      if (notes[activeIndex]) {
          notes[activeIndex].pinned = !notes[activeIndex].pinned;
          save();
          renderList();
      }
  });

  exportBtn.addEventListener('click', () => {
      if (!notes[activeIndex]) return;
      let text = notes[activeIndex].text;
      let title = text.trim().split('\n')[0].replace(/[^a-zA-Z0-9_\-]/g, '_') || 'note';
      let blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
  });
  
  helpBtn.addEventListener('click', () => {
      alert("KNote Help:\n\n- Use the left sidebar to manage and search notes.\n- Click 'New Note' to add a note.\n- Use the toolbar to pin, export, or delete the current note.\n- Data is saved automatically in your browser.");
  });
  
  window.addEventListener('keydown', (e) => {
      if (e.key === 'F1' || (e.key.toLowerCase() === 'h' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
          e.preventDefault();
          alert("KNote Help:\n\n- Use the left sidebar to manage and search notes.\n- Click 'New Note' to add a note.\n- Use the toolbar to pin, export, or delete the current note.\n- Data is saved automatically in your browser.");
      }
  });

  if (window.resizeTo) {
      try { window.resizeTo(800, 600); } catch(e) {}
  }
  
  loadActive();
</script>
</body>
</html>
