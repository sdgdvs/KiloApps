<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>KColony</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #050a0f; color: #00ffff; font-family: 'Courier New', Courier, monospace; user-select: none; }
        #header { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 15px; background: linear-gradient(145deg, #112, #223); border: 2px solid #00ffff; border-radius: 5px; box-shadow: 0 0 10px #00ffff, inset 0 0 10px #00ffff; max-width: 700px; }
        .res { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 5px #00ffff; }
        #main { display: flex; gap: 20px; }
        #grid { display: grid; grid-template-columns: repeat(20, 20px); grid-template-rows: repeat(20, 20px); gap: 1px; background: #002; border: 2px solid #00ffff; box-shadow: 0 0 15px #00ffff; padding: 2px; }
        .cell { width: 20px; height: 20px; background: #0a111a; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 1px solid #003333; transition: all 0.2s; }
        .cell:hover { background: #005555; box-shadow: 0 0 10px #00ffff; }
        #panel { display: flex; flex-direction: column; gap: 15px; width: 220px; }
        h3 { margin: 0; padding: 0 0 10px; border-bottom: 1px solid #00ffff; text-shadow: 0 0 5px #00ffff; text-transform: uppercase; }
        .btn { padding: 8px; background: linear-gradient(145deg, #112, #223); border: 1px solid #00ffff; color: #00ffff; cursor: pointer; text-align: left; font-family: 'Courier New', Courier, monospace; border-radius: 3px; box-shadow: 0 0 5px rgba(0,255,255,0.2); transition: all 0.2s; text-transform: uppercase; font-size: 11px; }
        .btn.active { background: linear-gradient(145deg, #003333, #005555); border-color: #00ffff; box-shadow: 0 0 15px #00ffff, inset 0 0 10px #00ffff; color: #fff; text-shadow: 0 0 5px #fff; }
        .btn:hover:not(.active) { background: #113; box-shadow: 0 0 10px #00ffff; }
        .btn.research { border-color: #aa00ff; color: #aa00ff; box-shadow: 0 0 5px rgba(170,0,255,0.2); }
        .btn.research:hover { box-shadow: 0 0 10px #aa00ff; }
        .btn.expedition { border-color: #ffaa00; color: #ffaa00; box-shadow: 0 0 5px rgba(255,170,0,0.2); }
        .btn.expedition:hover { box-shadow: 0 0 10px #ffaa00; }
        small { display: block; margin-top: 3px; color: #0aa; text-shadow: none; font-size: 9px; }
    </style>
</head>
<body>
    <div id="header">
        <div class="res">Time:<span id="res-time">Day 1 (Day)</span></div>
        <div class="res">Food:<span id="res-food">50</span></div>
        <div class="res">Pwr:<span id="res-power">50</span>/<span id="res-maxpower">50</span></div>
        <div class="res">Mat:<span id="res-mat">50</span></div>
        <div class="res">Pop:<span id="res-pop">0</span>/<span id="res-maxpop">0</span></div>
        <div class="res">Hap:<span id="res-happy">100</span>%</div>
        <div class="res">Sci:<span id="res-sci">0</span></div>
    </div>
    <div id="msg" style="color: #ff0000; text-align: center; height: 20px; font-weight: bold; text-shadow: 0 0 5px #ff0000; margin-bottom: 10px; max-width: 700px;"></div>
    <div id="main">
        <div id="grid"></div>
        <div id="panel">
            <h3>Structures</h3>
            <button class="btn active" id="btn-none" onclick="selectType(0)">None (Inspect)</button>
            <button class="btn" id="btn-repair" onclick="selectType(-1)">Repair<br><small>Cost: 5 Mat</small></button>
            <button class="btn" id="btn-solar" onclick="selectType(1)">Solar Panel<br><small>Cost: 10 Mat</small></button>
            <button class="btn" id="btn-farm" onclick="selectType(2)">Farm<br><small>Cost: 10 Mat, 5 Pwr</small></button>
            <button class="btn" id="btn-mine" onclick="selectType(3)">Mine<br><small>Cost: 10 Pwr</small></button>
            <button class="btn" id="btn-hab" onclick="selectType(4)">Habitat<br><small>Cost: 15 Mat, 5 Pwr</small></button>
            <button class="btn" id="btn-battery" onclick="selectType(5)">Battery<br><small>Cost: 20 Mat</small></button>
            <button class="btn" id="btn-lab" onclick="selectType(6)">Laboratory<br><small>Cost: 20 Mat, 5 Pwr</small></button>
            <button class="btn" id="btn-hydro" onclick="selectType(8)" style="display:none">Hydroponics<br><small>Cost: 20 Mat, 10 Pwr</small></button>
            <button class="btn" id="btn-nuke" onclick="selectType(7)" style="display:none">Nuclear Reactor<br><small>Cost: 50 Mat</small></button>
            <button class="btn" id="btn-laser" onclick="selectType(9)" style="display:none">Laser Defense<br><small>Cost: 30 Mat, 20 Pwr</small></button>
            <button class="btn" id="btn-wall" onclick="selectType(10)">Wall<br><small>Cost: 5 Mat</small></button>
            <button class="btn" id="btn-turret" onclick="selectType(11)">Turret<br><small>Cost: 15 Mat, 5 Pwr</small></button>
            <hr style="border-color:#00ffff; width:100%; margin: 5px 0;">
            <button class="btn research" id="btn-res-hydro" onclick="research(1)">Res: Hydroponics<br><small>Cost: 50 Sci</small></button>
            <button class="btn research" id="btn-res-nuke" onclick="research(2)">Res: Nuclear<br><small>Cost: 100 Sci</small></button>
            <button class="btn research" id="btn-res-laser" onclick="research(3)">Res: Laser Def.<br><small>Cost: 150 Sci</small></button>
            <hr style="border-color:#00ffff; width:100%; margin: 5px 0;">
            <button class="btn expedition" id="btn-exped" onclick="expedition()">Launch Expedition<br><small>Req: 1 Pop | Cost: 20 Mat, 20 Pwr</small></button>
        </div>
    </div>
    <script>
        const GRID_W = 20;
        const GRID_H = 20;
        let food = 50, power = 50, maxPower = 50, mat = 50;
        let pop = 0, maxPop = 0, happiness = 100, popWait = 0, sci = 0;
        let unlockedHydro = false, unlockedNuke = false, unlockedLaser = false;
        let tick = 0, day = 1, isDay = true;
        let dustStormTicks = 0, msgTicks = 0, msgText = "";
        let currentType = 0; // -1=repair, 0=none, 1=solar, 2=farm, 3=mine, 4=hab, 5=battery, 6=lab, 7=nuke, 8=hydro, 9=laser, 10=wall, 11=turret
        let grid = new Array(GRID_W * GRID_H).fill(0);
        let aliens = [];
        
        function selectType(type) {
            currentType = type;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if (type === -1) document.getElementById('btn-repair').classList.add('active');
            else {
                const btns = ['none', 'solar', 'farm', 'mine', 'hab', 'battery', 'lab', 'nuke', 'hydro', 'laser', 'wall', 'turret'];
                document.getElementById('btn-' + btns[type]).classList.add('active');
            }
        }

        function expedition() {
            if (pop >= 1 && mat >= 20 && power >= 20) {
                mat -= 20;
                power -= 20;
                let r = Math.random();
                if (r < 0.3) {
                    mat += 50;
                    food += 50;
                    alert("Expedition Report:\nRover found a resource cache!\n(+50 Mat, +50 Food)");
                } else if (r < 0.6) {
                    sci += 100;
                    alert("Expedition Report:\nExpedition discovered ancient alien technology!\n(+100 Sci)");
                } else if (r < 0.8) {
                    alert("Expedition Report:\nRover broke down in a dust storm. Expedition returned safely but empty-handed.");
                } else {
                    pop--;
                    happiness = Math.max(0, happiness - 10);
                    alert("Expedition Report:\nExpedition was ambushed by aliens! Rover destroyed and colonist lost.\n(-1 Pop, -10% Happiness)");
                }
                updateUI();
            } else {
                alert("Not enough resources! Need 1 Pop, 20 Mat, 20 Pwr.");
            }
        }

        function research(r) {
            if (r === 1 && sci >= 50 && !unlockedHydro) {
                sci -= 50; unlockedHydro = true;
                document.getElementById('btn-res-hydro').style.display = 'none';
                document.getElementById('btn-hydro').style.display = 'block';
            }
            if (r === 2 && sci >= 100 && !unlockedNuke) {
                sci -= 100; unlockedNuke = true;
                document.getElementById('btn-res-nuke').style.display = 'none';
                document.getElementById('btn-nuke').style.display = 'block';
            }
            if (r === 3 && sci >= 150 && !unlockedLaser) {
                sci -= 150; unlockedLaser = true;
                document.getElementById('btn-res-laser').style.display = 'none';
                document.getElementById('btn-laser').style.display = 'block';
            }
            updateUI();
        }

        function build(x, y) {
            if (currentType === 0) return;
            const idx = y * GRID_W + x;

            if (currentType === -1) {
                if (grid[idx] > 20) {
                    if (mat >= 5) {
                        mat -= 5;
                        grid[idx] -= 20;
                        updateUI();
                        renderAll();
                    }
                }
                return;
            }

            if (grid[idx] !== 0) return;

            let costMat = 0, costPwr = 0;
            if (currentType === 1) { costMat = 10; }
            else if (currentType === 2) { costMat = 10; costPwr = 5; }
            else if (currentType === 3) { costPwr = 10; }
            else if (currentType === 4) { costMat = 15; costPwr = 5; }
            else if (currentType === 5) { costMat = 20; }
            else if (currentType === 6) { costMat = 20; costPwr = 5; }
            else if (currentType === 7) { costMat = 50; }
            else if (currentType === 8) { costMat = 20; costPwr = 10; }
            else if (currentType === 9) { costMat = 30; costPwr = 20; }
            else if (currentType === 10) { costMat = 5; }
            else if (currentType === 11) { costMat = 15; costPwr = 5; }

            if (mat >= costMat && power >= costPwr) {
                mat -= costMat;
                power -= costPwr;
                grid[idx] = currentType;
                updateUI();
                renderAll();
            }
        }

        function updateUI() {
            document.getElementById('res-time').innerText = `Day ${day} (${isDay ? 'Day' : 'Night'})`;
            document.getElementById('res-food').innerText = food;
            document.getElementById('res-power').innerText = power;
            document.getElementById('res-maxpower').innerText = maxPower;
            document.getElementById('res-mat').innerText = mat;
            document.getElementById('res-pop').innerText = pop;
            document.getElementById('res-maxpop').innerText = maxPop;
            document.getElementById('res-happy').innerText = happiness;
            document.getElementById('res-sci').innerText = sci;
        }

        function renderCell(x, y) {
            const idx = y * GRID_W + x;
            const cell = document.getElementById(`cell-${x}-${y}`);
            const t = grid[idx];
            if (t > 20) { cell.innerHTML = 'X'; cell.style.color = '#ff0000'; cell.style.textShadow = '0 0 5px #ff0000'; cell.style.background = '#330000'; cell.style.borderColor = '#ff0000'; }
            else if (t === 1) { cell.innerHTML = 'S'; cell.style.color = '#ffff00'; cell.style.textShadow = '0 0 5px #ffff00'; cell.style.background = '#333300'; cell.style.borderColor = '#ffff00'; }
            else if (t === 2) { cell.innerHTML = 'F'; cell.style.color = '#00ff00'; cell.style.textShadow = '0 0 5px #00ff00'; cell.style.background = '#003300'; cell.style.borderColor = '#00ff00'; }
            else if (t === 3) { cell.innerHTML = 'M'; cell.style.color = '#ff00ff'; cell.style.textShadow = '0 0 5px #ff00ff'; cell.style.background = '#330033'; cell.style.borderColor = '#ff00ff'; }
            else if (t === 4) { cell.innerHTML = 'H'; cell.style.color = '#00ffff'; cell.style.textShadow = '0 0 5px #00ffff'; cell.style.background = '#003333'; cell.style.borderColor = '#00ffff'; }
            else if (t === 5) { cell.innerHTML = 'B'; cell.style.color = '#ff8800'; cell.style.textShadow = '0 0 5px #ff8800'; cell.style.background = '#331100'; cell.style.borderColor = '#ff8800'; }
            else if (t === 6) { cell.innerHTML = 'L'; cell.style.color = '#aa00ff'; cell.style.textShadow = '0 0 5px #aa00ff'; cell.style.background = '#220033'; cell.style.borderColor = '#aa00ff'; }
            else if (t === 7) { cell.innerHTML = 'N'; cell.style.color = '#00ffaa'; cell.style.textShadow = '0 0 5px #00ffaa'; cell.style.background = '#003322'; cell.style.borderColor = '#00ffaa'; }
            else if (t === 8) { cell.innerHTML = 'Y'; cell.style.color = '#aaff00'; cell.style.textShadow = '0 0 5px #aaff00'; cell.style.background = '#223300'; cell.style.borderColor = '#aaff00'; }
            else if (t === 9) { cell.innerHTML = 'D'; cell.style.color = '#ff0000'; cell.style.textShadow = '0 0 5px #ff0000'; cell.style.background = '#330000'; cell.style.borderColor = '#ff0000'; }
            else if (t === 10) { cell.innerHTML = 'W'; cell.style.color = '#888888'; cell.style.textShadow = '0 0 5px #888888'; cell.style.background = '#222222'; cell.style.borderColor = '#888888'; }
            else if (t === 11) { cell.innerHTML = 'T'; cell.style.color = '#ffaa00'; cell.style.textShadow = '0 0 5px #ffaa00'; cell.style.background = '#332200'; cell.style.borderColor = '#ffaa00'; }
            else { cell.innerHTML = ''; cell.style.background = '#0a111a'; cell.style.borderColor = '#003333'; }
        }

        function renderAll() {
            for(let y=0; y<GRID_H; y++) {
                for(let x=0; x<GRID_W; x++) renderCell(x, y);
            }
            for(let a of aliens) {
                const cell = document.getElementById(`cell-${a.x}-${a.y}`);
                if (cell) {
                    cell.innerHTML = 'A';
                    cell.style.color = '#ff00ff';
                    cell.style.textShadow = '0 0 10px #ff00ff';
                }
            }
        }

        function init() {
            const gridEl = document.getElementById('grid');
            for (let y = 0; y < GRID_H; y++) {
                for (let x = 0; x < GRID_W; x++) {
                    const d = document.createElement('div');
                    d.className = 'cell';
                    d.id = `cell-${x}-${y}`;
                    d.onclick = () => build(x, y);
                    gridEl.appendChild(d);
                }
            }
            updateUI();
            
            setInterval(() => {
                tick++;
                if (tick % 10 === 0) { day++; isDay = true; }
                else if (tick % 10 === 5) { isDay = false; }
                
                if (Math.random() < 0.05) {
                    let r = Math.random();
                    let targets = [];
                    for(let i=0; i<grid.length; i++) if(grid[i] > 0 && grid[i] <= 11) targets.push(i);
                    if (r < 0.33 && targets.length > 0) {
                        let hits = Math.min(3, targets.length);
                        for(let i=0; i<hits; i++) {
                            let idx = targets[Math.floor(Math.random() * targets.length)];
                            if (grid[idx] > 0 && grid[idx] <= 11) grid[idx] += 20;
                        }
                        msgText = "METEOR SHOWER! Structures damaged.";
                        msgTicks = 5;
                    } else if (r < 0.66) {
                        dustStormTicks = 10;
                        msgText = "DUST STORM! Solar power reduced.";
                        msgTicks = 10;
                    } else if (targets.length > 0) {
                        let idx = targets[Math.floor(Math.random() * targets.length)];
                        if (grid[idx] > 0 && grid[idx] <= 11) grid[idx] += 20;
                        msgText = "EQUIPMENT BREAKDOWN!";
                        msgTicks = 5;
                    }
                    document.getElementById('msg').innerText = msgText;
                }
                if (dustStormTicks > 0) dustStormTicks--;
                if (msgTicks > 0) {
                    msgTicks--;
                    if (msgTicks <= 0) document.getElementById('msg').innerText = "";
                }

                // Turrets shoot aliens
                for (let idx = 0; idx < grid.length; idx++) {
                    let type = grid[idx] > 20 ? 0 : grid[idx];
                    if (type === 9 || type === 11) {
                        let range = type === 9 ? 5 : 3;
                        let tx = idx % GRID_W, ty = Math.floor(idx / GRID_W);
                        for (let i = aliens.length - 1; i >= 0; i--) {
                            let a = aliens[i];
                            let dist = Math.abs(tx - a.x) + Math.abs(ty - a.y);
                            if (dist <= range && power > 0) {
                                a.hp--;
                                if (a.hp <= 0) aliens.splice(i, 1);
                                break;
                            }
                        }
                    }
                }

                // Aliens move
                if (tick % 2 === 0) {
                    for (let i = aliens.length - 1; i >= 0; i--) {
                        let a = aliens[i];
                        let target = null;
                        let minDist = 999;
                        for (let idx = 0; idx < grid.length; idx++) {
                            if (grid[idx] > 0 && grid[idx] <= 20) {
                                let tx = idx % GRID_W, ty = Math.floor(idx / GRID_W);
                                let dist = Math.abs(tx - a.x) + Math.abs(ty - a.y);
                                if (dist < minDist) { minDist = dist; target = {x: tx, y: ty, idx: idx}; }
                            }
                        }
                        if (target) {
                            if (minDist <= 1) {
                                if (grid[target.idx] <= 20) {
                                    grid[target.idx] += 20;
                                    msgText = "ALIEN ATTACK! Structure damaged.";
                                    msgTicks = 5;
                                    document.getElementById('msg').innerText = msgText;
                                }
                                aliens.splice(i, 1);
                            } else {
                                if (Math.random() < 0.5 && a.x !== target.x) a.x += (target.x > a.x ? 1 : -1);
                                else if (a.y !== target.y) a.y += (target.y > a.y ? 1 : -1);
                                else a.x += (target.x > a.x ? 1 : -1);
                            }
                        } else {
                            a.x += Math.floor(Math.random()*3)-1;
                            a.y += Math.floor(Math.random()*3)-1;
                        }
                        a.x = Math.max(0, Math.min(GRID_W-1, a.x));
                        a.y = Math.max(0, Math.min(GRID_H-1, a.y));
                    }
                }

                // Spawn alien
                if (day > 2 && Math.random() < 0.1) {
                    let spawnEdge = Math.floor(Math.random() * 4);
                    let ax = 0, ay = 0;
                    if (spawnEdge === 0) { ax = Math.floor(Math.random()*GRID_W); ay = 0; }
                    if (spawnEdge === 1) { ax = Math.floor(Math.random()*GRID_W); ay = GRID_H-1; }
                    if (spawnEdge === 2) { ax = 0; ay = Math.floor(Math.random()*GRID_H); }
                    if (spawnEdge === 3) { ax = GRID_W-1; ay = Math.floor(Math.random()*GRID_H); }
                    aliens.push({x: ax, y: ay, hp: 3});
                    msgText = "ALIEN SPOTTED!";
                    msgTicks = 5;
                    document.getElementById('msg').innerText = msgText;
                }

                renderAll();
                
                let pwrProd = 0, farmCount = 0, mineCount = 0, habCount = 0, batCount = 0;
                let labCount = 0, nukeCount = 0, hydroCount = 0, laserCount = 0, turretCount = 0;
                for(let i=0; i<grid.length; i++) {
                    if(grid[i]===1 && isDay && dustStormTicks <= 0) pwrProd += 4; // Boosted solar for day only
                    if(grid[i]===2) farmCount += 1;
                    if(grid[i]===3) mineCount += 1;
                    if(grid[i]===4) habCount += 1;
                    if(grid[i]===5) batCount += 1;
                    if(grid[i]===6) labCount += 1;
                    if(grid[i]===7) nukeCount += 1;
                    if(grid[i]===8) hydroCount += 1;
                    if(grid[i]===9) laserCount += 1;
                    if(grid[i]===11) turretCount += 1;
                }
                maxPop = habCount * 5;
                maxPower = 50 + batCount * 50;
                pwrProd += nukeCount * 20;
                
                let pwrCons = farmCount + mineCount + habCount + labCount + hydroCount * 2 + laserCount * 5 + turretCount * 2; // power per structure
                power += pwrProd - pwrCons;
                
                let pwrEff = 1.0;
                if (power < 0) { power = 0; pwrEff = 0.5; }
                if (power > maxPower) power = maxPower;

                let eff = (happiness / 100.0) * pwrEff;
                let foodProd = Math.floor((farmCount * 5 + hydroCount * 15) * eff);
                let matProd = Math.floor(mineCount * 2 * eff);
                let sciProd = Math.floor(labCount * 2 * eff);

                food += foodProd;
                mat += matProd;
                sci += sciProd;

                let foodCons = pop;
                if (food >= foodCons) {
                    food -= foodCons;
                    happiness = Math.min(100, happiness + 5);
                } else {
                    food = 0;
                    happiness = Math.max(0, happiness - 10);
                }

                if (pop < maxPop && happiness >= 50) {
                    popWait++;
                    if (popWait >= 3) {
                        pop++;
                        popWait = 0;
                    }
                } else if (pop > maxPop) {
                    happiness = Math.max(0, happiness - 10);
                }

                updateUI();
            }, 2000);
        }

        init();
    </script>
</body>
</html>
