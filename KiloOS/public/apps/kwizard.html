<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KWizard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a0b2e;
            background-image: radial-gradient(circle at center, #2a114b 0%, #0d0416 100%);
            color: #e8d8b7;
            font-family: 'Georgia', 'Palatino Linotype', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        #game-board {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            background-color: transparent;
        }
        .hand-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 150px;
            gap: 10px;
            padding: 10px;
            border: 2px dashed #8b7355;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.3);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .play-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            border: 3px solid #b89947;
            border-radius: 8px;
            background-color: #f4ebd0;
            background-image: linear-gradient(to bottom right, #f4ebd0, #e6d5aa);
            color: #3e2723;
            box-shadow: 0 0 20px rgba(184, 153, 71, 0.4);
        }
        .card {
            width: 100px;
            height: 140px;
            background-color: #f8f1e4;
            background-image: linear-gradient(135deg, #f8f1e4 0%, #e8dcc3 100%);
            border: 2px solid #8b7355;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            color: #2c1e16;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #b89947;
            box-shadow: 0 0 15px rgba(184, 153, 71, 0.8);
        }
        .card.opponent {
            background-image: linear-gradient(135deg, #3d2b1f 0%, #1a120c 100%);
            border-color: #5c4033;
            color: #8b7355;
            cursor: default;
        }
        .card.opponent:hover {
            transform: none;
            border-color: #5c4033;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .card-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }
        .card.opponent .card-title {
            text-shadow: none;
        }
        .card-cost {
            font-size: 12px;
            color: #005580;
            font-weight: bold;
        }
        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 16px;
            background-color: #4a3b52;
            color: #e8d8b7;
            border: 2px solid #8b7355;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Georgia', serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #634b70;
            border-color: #b89947;
            box-shadow: 0 0 10px #b89947;
        }
    </style>
</head>
<body>
    <div id="game-board">
        <div id="controls">
            <button id="draw-btn">Draw Card</button>
            <button id="end-turn-btn">End Turn</button>
            <button id="reset-btn">Reset Game</button>
        </div>
        
        <div>
            <div style="text-align: center; margin-bottom: 5px;">Opponent Hand <span id="opp-mana-display" style="color: #8b7355; font-weight: bold;">(Mana: 1/1)</span></div>
            <div id="opponent-hand" class="hand-area">
                <!-- Opponent cards will appear here -->
            </div>
        </div>

        <div class="play-area">
            <h3 style="font-family: 'Georgia', serif; font-size: 24px; margin: 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">Arena</h3>
            <p style="color: #5c4033; font-style: italic; margin: 0;">Spells and effects go here</p>
        </div>

        <div>
            <div style="text-align: center; margin-bottom: 5px;">Player Hand <span id="player-mana-display" style="color: #e8d8b7; font-weight: bold;">(Mana: 1/1)</span></div>
            <div id="player-hand" class="hand-area">
                <!-- Player cards will appear here -->
            </div>
        </div>
    </div>

    <script>
        let playerMana = 1, playerMaxMana = 1;
        let opponentMana = 1, opponentMaxMana = 1;
        let opponentCards = [];

        const playerHand = document.getElementById('player-hand');
        const opponentHand = document.getElementById('opponent-hand');
        const drawBtn = document.getElementById('draw-btn');
        const endTurnBtn = document.getElementById('end-turn-btn');
        const resetBtn = document.getElementById('reset-btn');

        function updateManaDisplay() {
            document.getElementById('opp-mana-display').innerText = `(Mana: ${opponentMana}/${opponentMaxMana})`;
            document.getElementById('player-mana-display').innerText = `(Mana: ${playerMana}/${playerMaxMana})`;
        }

        const sampleCards = [
            { name: "Fireball", cost: 3, effect: "Deals 4 Fire damage" },
            { name: "Scorch", cost: 1, effect: "Deals 1 Fire damage" },
            { name: "Flame Strike", cost: 5, effect: "Deals 5 AoE Fire damage" },
            { name: "Ember", cost: 1, effect: "Burns for 1 damage" },
            { name: "Pyroblast", cost: 6, effect: "Deals 8 Fire damage" },
            { name: "Wall of Fire", cost: 4, effect: "Creates a fiery barrier" },
            { name: "Meteor", cost: 8, effect: "Deals 10 Fire damage" },
            { name: "Ignite", cost: 2, effect: "Deals 2 Fire dmg over time" },
            { name: "Ice Shard", cost: 2, effect: "Deals 2 Ice damage" },
            { name: "Frostbolt", cost: 3, effect: "Deals 3 Ice dmg, slows" },
            { name: "Blizzard", cost: 6, effect: "Deals 4 AoE Ice damage" },
            { name: "Frost Nova", cost: 4, effect: "Freezes enemies in place" },
            { name: "Ice Lance", cost: 1, effect: "Deals 1 Ice dmg (3 if frozen)" },
            { name: "Glacial Spike", cost: 7, effect: "Deals 9 Ice damage" },
            { name: "Cold Snap", cost: 5, effect: "Resets cooldowns (Ice)" },
            { name: "Arcane Missiles", cost: 1, effect: "Fires 3 arcane bolts" },
            { name: "Arcane Intellect", cost: 3, effect: "Draw 2 cards" },
            { name: "Counterspell", cost: 3, effect: "Interrupts a spell" },
            { name: "Magic Missile", cost: 2, effect: "Deals 2 Arcane damage" },
            { name: "Arcane Blast", cost: 4, effect: "Deals 5 Arcane damage" },
            { name: "Time Warp", cost: 8, effect: "Take an extra turn" },
            { name: "Polymorph", cost: 4, effect: "Turns target into a sheep" },
            { name: "Mana Shield", cost: 2, effect: "Absorbs damage using mana" },
            { name: "Healing Touch", cost: 2, effect: "Heals 3 Life points" },
            { name: "Rejuvenation", cost: 3, effect: "Heals 4 over time" },
            { name: "Regrowth", cost: 4, effect: "Heals 2 + 2 over time" },
            { name: "Swiftmend", cost: 1, effect: "Instantly heals 2" },
            { name: "Tranquility", cost: 8, effect: "Heals 10 to all allies" },
            { name: "Nourish", cost: 3, effect: "Heals 4" },
            { name: "Nature's Grasp", cost: 2, effect: "Roots attackers" },
            { name: "Lifebloom", cost: 2, effect: "Heals 1, blooms for 3" },
            { name: "Flash Heal", cost: 2, effect: "Fast heal for 3" },
            { name: "Greater Heal", cost: 5, effect: "Heals 7" },
            { name: "Renew", cost: 1, effect: "Heals 2 over time" },
            { name: "Lightning Strike", cost: 4, effect: "Deals 5 Nature damage" },
            { name: "Chain Lightning", cost: 5, effect: "Deals 4 dmg to 3 targets" }
        ];

        function createCardElement(cardData, isOpponent) {
            const card = document.createElement('div');
            card.className = 'card' + (isOpponent ? ' opponent' : '');
            
            if (isOpponent) {
                card.innerHTML = `<div class="card-title">Card</div>`;
            } else {
                card.innerHTML = `
                    <div class="card-title">${cardData.name}</div>
                    <div class="card-cost">Mana: ${cardData.cost}</div>
                `;
                card.onclick = () => {
                    if (playerMana >= cardData.cost) {
                        playerMana -= cardData.cost;
                        updateManaDisplay();
                        document.querySelector('.play-area p').innerHTML = `Player cast <b>${cardData.name}</b>!<br><span style="font-size: 14px; color: #8b7355; font-style: normal;">Effect: ${cardData.effect}</span>`;
                        card.style.borderColor = "#ffcc00";
                        setTimeout(() => {
                            if(card.parentElement === playerHand) {
                                playerHand.removeChild(card);
                            }
                        }, 300);
                    } else {
                        document.querySelector('.play-area p').innerHTML = `Not enough mana for <b>${cardData.name}</b>!`;
                    }
                };
            }
            return card;
        }

        function drawCard(isOpponent) {
            const hand = isOpponent ? opponentHand : playerHand;
            if (hand.children.length >= 7) {
                console.log("Hand is full");
                return;
            }
            const randomCard = sampleCards[Math.floor(Math.random() * sampleCards.length)];
            const cardElement = createCardElement(randomCard, isOpponent);
            hand.appendChild(cardElement);
            if (isOpponent) opponentCards.push(randomCard);
        }

        function playOpponentTurn() {
            let playedCards = [];
            let i = 0;
            while (i < opponentCards.length) {
                if (opponentMana >= opponentCards[i].cost) {
                    opponentMana -= opponentCards[i].cost;
                    playedCards.push(opponentCards[i]);
                    opponentCards.splice(i, 1);
                    opponentHand.removeChild(opponentHand.children[i]);
                } else {
                    i++;
                }
            }
            
            let message = "";
            if (playedCards.length > 0) {
                message = "Opponent played: " + playedCards.map(c => `<b>${c.name}</b>`).join(", ");
            } else {
                message = "Opponent ends turn without casting.";
            }
            document.querySelector('.play-area p').innerHTML = message;
        }

        drawBtn.onclick = () => {
            drawCard(false);
            drawCard(true);
        };

        endTurnBtn.onclick = () => {
            if (opponentMaxMana < 10) opponentMaxMana++;
            opponentMana = opponentMaxMana;
            drawCard(true);
            
            playOpponentTurn();
            
            if (playerMaxMana < 10) playerMaxMana++;
            playerMana = playerMaxMana;
            drawCard(false);
            updateManaDisplay();
        };

        resetBtn.onclick = () => {
            playerMaxMana = 1;
            playerMana = 1;
            opponentMaxMana = 1;
            opponentMana = 1;
            opponentCards = [];
            updateManaDisplay();
            playerHand.innerHTML = '';
            opponentHand.innerHTML = '';
            document.querySelector('.play-area p').innerHTML = `Spells and effects go here`;
            for(let i=0; i<3; i++) {
                drawCard(false);
                drawCard(true);
            }
        };

        resetBtn.click();
    </script>
</body>
</html>
