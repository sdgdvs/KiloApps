<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KWizard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        #game-board {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            background-color: #222;
        }
        .hand-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 150px;
            gap: 10px;
            padding: 10px;
            border: 1px dashed #444;
            border-radius: 8px;
        }
        .play-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #1e1e1e;
        }
        .card {
            width: 100px;
            height: 140px;
            background-color: #2a2a2a;
            border: 2px solid #555;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #888;
        }
        .card.opponent {
            background-color: #3a1a1a;
            cursor: default;
        }
        .card.opponent:hover {
            transform: none;
            border-color: #555;
        }
        .card-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }
        .card-cost {
            font-size: 12px;
            color: #4da6ff;
        }
        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 16px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div id="game-board">
        <div id="controls">
            <button id="draw-btn">Draw Card</button>
            <button id="reset-btn">Reset Game</button>
        </div>
        
        <div>
            <div style="text-align: center; margin-bottom: 5px;">Opponent Hand</div>
            <div id="opponent-hand" class="hand-area">
                <!-- Opponent cards will appear here -->
            </div>
        </div>

        <div class="play-area">
            <h3>Arena</h3>
            <p style="color: #666;">Spells and effects go here</p>
        </div>

        <div>
            <div style="text-align: center; margin-bottom: 5px;">Player Hand</div>
            <div id="player-hand" class="hand-area">
                <!-- Player cards will appear here -->
            </div>
        </div>
    </div>

    <script>
        const playerHand = document.getElementById('player-hand');
        const opponentHand = document.getElementById('opponent-hand');
        const drawBtn = document.getElementById('draw-btn');
        const resetBtn = document.getElementById('reset-btn');

        const sampleCards = [
            { name: "Fireball", cost: 3 },
            { name: "Ice Shard", cost: 2 },
            { name: "Arcane Missiles", cost: 1 },
            { name: "Healing Touch", cost: 2 },
            { name: "Lightning Strike", cost: 4 }
        ];

        function createCardElement(cardData, isOpponent) {
            const card = document.createElement('div');
            card.className = 'card' + (isOpponent ? ' opponent' : '');
            
            if (isOpponent) {
                card.innerHTML = `<div class="card-title">Card</div>`;
            } else {
                card.innerHTML = `
                    <div class="card-title">${cardData.name}</div>
                    <div class="card-cost">Mana: ${cardData.cost}</div>
                `;
                card.onclick = () => {
                    card.style.borderColor = "#ffcc00";
                    setTimeout(() => {
                        if(card.parentElement === playerHand) {
                            playerHand.removeChild(card);
                        }
                    }, 300);
                };
            }
            return card;
        }

        function drawCard(isOpponent) {
            const hand = isOpponent ? opponentHand : playerHand;
            if (hand.children.length >= 7) {
                console.log("Hand is full");
                return;
            }
            const randomCard = sampleCards[Math.floor(Math.random() * sampleCards.length)];
            const cardElement = createCardElement(randomCard, isOpponent);
            hand.appendChild(cardElement);
        }

        drawBtn.onclick = () => {
            drawCard(false);
            drawCard(true);
        };

        resetBtn.onclick = () => {
            playerHand.innerHTML = '';
            opponentHand.innerHTML = '';
            for(let i=0; i<3; i++) {
                drawCard(false);
                drawCard(true);
            }
        };

        resetBtn.click();
    </script>
</body>
</html>
