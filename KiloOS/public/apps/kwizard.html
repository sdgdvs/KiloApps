<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KWizard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a0b2e;
            background-image: radial-gradient(circle at center, #2a114b 0%, #0d0416 100%);
            color: #e8d8b7;
            font-family: 'Georgia', 'Palatino Linotype', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        #game-board {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            background-color: transparent;
        }
        .hand-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 150px;
            gap: 10px;
            padding: 10px;
            border: 2px dashed #8b7355;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.3);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .play-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            border: 3px solid #b89947;
            border-radius: 8px;
            background-color: #f4ebd0;
            background-image: linear-gradient(to bottom right, #f4ebd0, #e6d5aa);
            color: #3e2723;
            box-shadow: 0 0 20px rgba(184, 153, 71, 0.4);
        }
        .card {
            width: 100px;
            height: 140px;
            background-color: #f8f1e4;
            background-image: linear-gradient(135deg, #f8f1e4 0%, #e8dcc3 100%);
            border: 2px solid #8b7355;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            color: #2c1e16;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #b89947;
            box-shadow: 0 0 15px rgba(184, 153, 71, 0.8);
        }
        .card.opponent {
            background-image: linear-gradient(135deg, #3d2b1f 0%, #1a120c 100%);
            border-color: #5c4033;
            color: #8b7355;
            cursor: default;
        }
        .card.opponent:hover {
            transform: none;
            border-color: #5c4033;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .card-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }
        .card.opponent .card-title {
            text-shadow: none;
        }
        .card-cost {
            font-size: 12px;
            color: #005580;
            font-weight: bold;
        }
        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 16px;
            background-color: #4a3b52;
            color: #e8d8b7;
            border: 2px solid #8b7355;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Georgia', serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #634b70;
            border-color: #b89947;
            box-shadow: 0 0 10px #b89947;
        }
    </style>
</head>
<body>
    <div id="game-board">
        <div id="controls">
            <button id="draw-btn">Draw Card</button>
            <button id="reset-btn">Reset Game</button>
        </div>
        
        <div>
            <div style="text-align: center; margin-bottom: 5px;">Opponent Hand</div>
            <div id="opponent-hand" class="hand-area">
                <!-- Opponent cards will appear here -->
            </div>
        </div>

        <div class="play-area">
            <h3 style="font-family: 'Georgia', serif; font-size: 24px; margin: 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">Arena</h3>
            <p style="color: #5c4033; font-style: italic; margin: 0;">Spells and effects go here</p>
        </div>

        <div>
            <div style="text-align: center; margin-bottom: 5px;">Player Hand</div>
            <div id="player-hand" class="hand-area">
                <!-- Player cards will appear here -->
            </div>
        </div>
    </div>

    <script>
        const playerHand = document.getElementById('player-hand');
        const opponentHand = document.getElementById('opponent-hand');
        const drawBtn = document.getElementById('draw-btn');
        const resetBtn = document.getElementById('reset-btn');

        const sampleCards = [
            { name: "Fireball", cost: 3 },
            { name: "Ice Shard", cost: 2 },
            { name: "Arcane Missiles", cost: 1 },
            { name: "Healing Touch", cost: 2 },
            { name: "Lightning Strike", cost: 4 }
        ];

        function createCardElement(cardData, isOpponent) {
            const card = document.createElement('div');
            card.className = 'card' + (isOpponent ? ' opponent' : '');
            
            if (isOpponent) {
                card.innerHTML = `<div class="card-title">Card</div>`;
            } else {
                card.innerHTML = `
                    <div class="card-title">${cardData.name}</div>
                    <div class="card-cost">Mana: ${cardData.cost}</div>
                `;
                card.onclick = () => {
                    card.style.borderColor = "#ffcc00";
                    setTimeout(() => {
                        if(card.parentElement === playerHand) {
                            playerHand.removeChild(card);
                        }
                    }, 300);
                };
            }
            return card;
        }

        function drawCard(isOpponent) {
            const hand = isOpponent ? opponentHand : playerHand;
            if (hand.children.length >= 7) {
                console.log("Hand is full");
                return;
            }
            const randomCard = sampleCards[Math.floor(Math.random() * sampleCards.length)];
            const cardElement = createCardElement(randomCard, isOpponent);
            hand.appendChild(cardElement);
        }

        drawBtn.onclick = () => {
            drawCard(false);
            drawCard(true);
        };

        resetBtn.onclick = () => {
            playerHand.innerHTML = '';
            opponentHand.innerHTML = '';
            for(let i=0; i<3; i++) {
                drawCard(false);
                drawCard(true);
            }
        };

        resetBtn.click();
    </script>
</body>
</html>
