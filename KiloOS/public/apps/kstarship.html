<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KStarship</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #05050a;
    color: #e0e0ff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  h1 {
    margin: 10px 0;
    font-size: 24px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #00ffff;
    text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
    font-weight: normal;
  }
  #game-container {
    display: flex;
    flex-direction: row;
    gap: 20px;
  }
  canvas {
    border: 1px solid #00ffff;
    background-color: #000;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.2);
  }
  #ui-panel {
    display: flex;
    flex-direction: column;
    width: 200px;
    border: 1px solid #00ffff;
    padding: 15px;
    background-color: rgba(5, 5, 20, 0.8);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }
  .info-box {
    margin-bottom: 20px;
  }
  .info-box div {
    margin-bottom: 5px;
  }
  .label {
    color: #00ffff;
    font-size: 12px;
    letter-spacing: 1px;
    border-bottom: 1px solid #005555;
    margin-bottom: 5px;
    padding-bottom: 2px;
    text-shadow: 0 0 5px #00ffff;
  }
  .value {
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 0 0 5px #ffffff;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
    margin-top: auto;
  }
  button {
    background: transparent;
    color: #00ffff;
    border: 1px solid #00ffff;
    box-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
    padding: 10px;
    cursor: pointer;
    font-family: monospace;
    font-size: 16px;
    transition: all 0.2s ease-in-out;
  }
  button:hover {
    background-color: rgba(0, 255, 255, 0.2);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
  }
  button:active {
    background-color: #00ffff;
    color: #000;
  }
  #btn-up { grid-column: 2; grid-row: 1; }
  #btn-left { grid-column: 1; grid-row: 2; }
  #btn-down { grid-column: 2; grid-row: 2; }
  #btn-right { grid-column: 3; grid-row: 2; }
  #modal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background-color: rgba(5, 5, 20, 0.95);
    border: 2px solid #00ffff;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    text-align: center;
    display: none;
    z-index: 100;
    width: 300px;
  }
  #modal h2 { margin-top: 0; color: #ff8800; font-size: 20px; }
  #modal p { font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
  #modal-actions { display: flex; flex-direction: column; gap: 10px; }
  .action-btn { background: #00ffff; color: #000; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 100%; font-family: 'Courier New', Courier, monospace; }
  .action-btn:hover { background: #ffffff; }
</style>
</head>
<body>
  <h1>KStarship Command</h1>
  <div id="game-container">
    <canvas id="starmap" width="600" height="600"></canvas>
    <div id="ui-panel">
      <div class="info-box">
        <div class="label">SHIP STATUS</div>
        <div>Location: <span id="loc-x" class="value">0</span>, <span id="loc-y" class="value">0</span></div>
      </div>
      <div class="info-box">
        <div class="label">RESOURCES</div>
        <div>Fuel: <span id="res-fuel" class="value">10000</span></div>
        <div>Hull: <span id="res-hull" class="value">100%</span></div>
        <div>Crew: <span id="res-crew" class="value">10</span></div>
        <div>Credits: <span id="res-credits" class="value">1000</span></div>
      </div>
      <div class="info-box">
        <div class="label">CARGO</div>
        <div>Minerals: <span id="cargo-minerals" class="value">0</span></div>
        <div>Tech: <span id="cargo-tech" class="value">0</span></div>
      </div>
      <div class="info-box">
        <div class="label">UPGRADES</div>
        <div style="display:flex; justify-content:space-between;"><span>Wpn: <span id="upg-wpn" class="value">1</span></span> <span>Shd: <span id="upg-shd" class="value">1</span></span></div>
        <div style="display:flex; justify-content:space-between;"><span>Eng: <span id="upg-eng" class="value">1</span></span> <span>Cargo: <span id="upg-car" class="value">1</span></span></div>
      </div>
      <div class="info-box">
        <div class="label">SCANNER</div>
        <div id="scanner-info">No objects nearby.</div>
      </div>
      <div class="controls">
        <button id="btn-up">W</button>
        <button id="btn-left">A</button>
        <button id="btn-down">S</button>
        <button id="btn-right">D</button>
      </div>
      <button id="btn-crew" style="width:100%; margin-top:10px; font-size:14px;">MANAGE CREW (C)</button>
    </div>
  </div>

  <div id="modal">
    <h2 id="modal-title">Encounter</h2>
    <p id="modal-desc">Description</p>
    <div id="modal-actions"></div>
  </div>

  <script>
    const canvas = document.getElementById('starmap');
    const ctx = canvas.getContext('2d');
    const locX = document.getElementById('loc-x');
    const locY = document.getElementById('loc-y');
    const resFuel = document.getElementById('res-fuel');
    const resHull = document.getElementById('res-hull');
    const resCrew = document.getElementById('res-crew');
    const resCredits = document.getElementById('res-credits');
    const cargoMinerals = document.getElementById('cargo-minerals');
    const cargoTech = document.getElementById('cargo-tech');
    const upgWpn = document.getElementById('upg-wpn');
    const upgShd = document.getElementById('upg-shd');
    const upgEng = document.getElementById('upg-eng');
    const upgCar = document.getElementById('upg-car');
    const scannerInfo = document.getElementById('scanner-info');

    // Game state
    const state = {
      ship: { x: 0, y: 0, targetX: 0, targetY: 0, moving: false },
      resources: { fuel: 10000, hull: 100, credits: 1000 },
      cargo: { minerals: 0, tech: 0 },
      upgrades: { weapons: 1, shields: 1, engines: 1, cargo: 1 },
      crew: [],
      stars: [],
      mapSize: 2000,
      modalOpen: false
    };

    const firstNames = ["Ryker", "Spok", "Chek", "Scot", "Uhura", "Sulu", "Mac", "Data", "Worf", "Geordi", "Ripley", "Dallas", "Hicks", "Hudson", "Vasquez", "Gordy"];
    for(let i=0; i<10; i++) {
        state.crew.push({ name: firstNames[Math.floor(Math.random() * firstNames.length)], role: 0, level: 1, xp: 0 });
    }

    function getOfficer(role) {
        return state.crew.findIndex(c => c.role === role);
    }

    function cycleOfficer(role) {
        let current = getOfficer(role);
        let start = (current === -1) ? 0 : current + 1;
        for(let i=0; i<state.crew.length; i++) {
            let idx = (start + i) % state.crew.length;
            if (state.crew[idx].role === 0) {
                if (current !== -1) state.crew[current].role = 0;
                state.crew[idx].role = role;
                return;
            }
        }
    }

    function addXP(role, amt) {
        let idx = getOfficer(role);
        if (idx !== -1) {
            let c = state.crew[idx];
            if (c.level >= 5) return;
            c.xp += amt;
            if (c.xp >= c.level * 100) {
                c.xp -= c.level * 100;
                c.level++;
            }
        }
    }

    // Generate random stars and planets
    function generateStars() {
      const starTypes = [
        { type: 'Red Dwarf', color: '#ffaaaa', minP: 1, maxP: 3, size: 2 },
        { type: 'Yellow Dwarf', color: '#ffffaa', minP: 2, maxP: 6, size: 3 },
        { type: 'Blue Giant', color: '#aaddff', minP: 0, maxP: 2, size: 4 },
        { type: 'White Dwarf', color: '#ffffff', minP: 0, maxP: 1, size: 1 }
      ];
      const planetTypes = ['Terrestrial', 'Gas Giant', 'Ice World', 'Lava', 'Barren'];

      for (let i = 0; i < 200; i++) {
        const sType = starTypes[Math.floor(Math.random() * starTypes.length)];
        const numPlanets = sType.minP + Math.floor(Math.random() * (sType.maxP - sType.minP + 1));
        const planets = [];
        for (let p = 0; p < numPlanets; p++) {
          planets.push(planetTypes[Math.floor(Math.random() * planetTypes.length)]);
        }

        state.stars.push({
          x: Math.floor(Math.random() * state.mapSize) - state.mapSize/2,
          y: Math.floor(Math.random() * state.mapSize) - state.mapSize/2,
          size: sType.size,
          color: sType.color,
          name: sType.type,
          planets: planets,
          encounter: ['Pirates', 'Anomaly', 'Trader', 'Station', 'Story', 'None'][Math.floor(Math.random() * 6)],
          visited: false
        });
      }
    }

    // Map drawing logic
    function draw() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Draw grid
      ctx.strokeStyle = '#002222';
      ctx.lineWidth = 1;
      const gridSize = 100;
      const offsetX = -(state.ship.x % gridSize);
      const offsetY = -(state.ship.y % gridSize);
      
      for (let x = offsetX; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = offsetY; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw stars relative to ship
      state.stars.forEach(star => {
        const screenX = centerX + (star.x - state.ship.x);
        const screenY = centerY + (star.y - state.ship.y);
        
        // Only draw if on screen
        if (screenX >= 0 && screenX <= canvas.width && screenY >= 0 && screenY <= canvas.height) {
          ctx.fillStyle = star.color;
          ctx.beginPath();
          ctx.arc(screenX, screenY, star.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Draw ship at center
      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.moveTo(centerX, centerY - 10);
      ctx.lineTo(centerX + 8, centerY + 8);
      ctx.lineTo(centerX, centerY + 4);
      ctx.lineTo(centerX - 8, centerY + 8);
      ctx.closePath();
      ctx.fill();
      
      // Ship thrust trail if moving
      if (state.ship.moving) {
        ctx.fillStyle = '#ff8800';
        ctx.beginPath();
        ctx.moveTo(centerX, centerY + 6);
        ctx.lineTo(centerX + 4, centerY + 10);
        ctx.lineTo(centerX, centerY + 16);
        ctx.lineTo(centerX - 4, centerY + 10);
        ctx.closePath();
        ctx.fill();
      }

      updateUI();
    }

    function updateUI() {
      locX.innerText = Math.floor(state.ship.x);
      locY.innerText = Math.floor(state.ship.y);
      resFuel.innerText = Math.floor(state.resources.fuel);
      resHull.innerText = state.resources.hull + "%";
      resCrew.innerText = state.crew.length;
      resCredits.innerText = state.resources.credits;
      cargoMinerals.innerText = state.cargo.minerals;
      cargoTech.innerText = state.cargo.tech;
      upgWpn.innerText = state.upgrades.weapons;
      upgShd.innerText = state.upgrades.shields;
      upgEng.innerText = state.upgrades.engines;
      upgCar.innerText = state.upgrades.cargo;

      // Check nearby stars
      const nearby = state.stars.filter(s => 
        Math.hypot(s.x - state.ship.x, s.y - state.ship.y) < 50
      );
      if (nearby.length > 0) {
        const sys = nearby[0];
        let pText = sys.planets.length > 0 ? sys.planets.join(', ') : 'None';
        scannerInfo.innerHTML = `Star: ${sys.name}<br>Planets: ${sys.planets.length}<br><span style="font-size:11px;color:#88cccc">${pText}</span>`;
        scannerInfo.style.color = "#00ffff";

        if (!sys.visited && !state.modalOpen) {
          sys.visited = true;
          if (sys.encounter !== 'None') {
            triggerEncounter(sys.encounter);
          }
        }
      } else {
        scannerInfo.innerText = "Deep space. Nothing nearby.";
        scannerInfo.style.color = "#888888";
      }
    }

    function triggerEncounter(type) {
      state.modalOpen = true;
      const modal = document.getElementById('modal');
      const title = document.getElementById('modal-title');
      const desc = document.getElementById('modal-desc');
      const actions = document.getElementById('modal-actions');
      
      title.innerText = type.toUpperCase() + " ENCOUNTER";
      actions.innerHTML = '';

      const addBtn = (text, onClick) => {
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        btn.innerText = text;
        btn.onclick = onClick;
        actions.appendChild(btn);
      };

      const closeBtn = () => {
        addBtn('Continue', () => {
          modal.style.display = 'none';
          state.modalOpen = false;
        });
      };

      if (type === 'Pirates') {
        let pirateHp = 50;
        const updateCombatBtns = (msg) => {
            desc.innerText = msg + `\nPirate HP: ${pirateHp} | Your Hull: ${state.resources.hull}%`;
            actions.innerHTML = '';
            if (pirateHp <= 0) {
                addBtn('Claim Bounty (100C)', () => {
                    state.resources.credits += 100;
                    modal.style.display = 'none';
                    state.modalOpen = false;
                    updateUI();
                });
            } else if (state.resources.hull <= 0) {
                desc.innerText = "Your ship has been destroyed. Game Over.";
                addBtn('Restart', () => { location.reload(); });
            } else {
                addBtn('Fire Weapons', () => {
                    let pDmg = 10 + state.upgrades.weapons * 5 + Math.floor(Math.random()*10);
                    let gIdx = getOfficer(2); if (gIdx !== -1) pDmg += state.crew[gIdx].level * 2;
                    let sDmg = Math.max(0, 20 - state.upgrades.shields * 3 + Math.floor(Math.random()*5));
                    let eIdx = getOfficer(3); if (eIdx !== -1) sDmg -= state.crew[eIdx].level * 1;
                    if (sDmg < 0) sDmg = 0;
                    pirateHp -= pDmg;
                    if (pirateHp < 0) pirateHp = 0;
                    let result = `You hit pirate for ${pDmg}!`;
                    if (pirateHp > 0) {
                        state.resources.hull -= sDmg;
                        if (state.resources.hull < 0) state.resources.hull = 0;
                        result += ` Pirate hits you for ${sDmg}!`;
                        addXP(2, 10); addXP(3, 10);
                    } else {
                        result += ` Pirate destroyed!`;
                        addXP(2, 20);
                    }
                    updateCombatBtns(result);
                });
                addBtn('Flee', () => {
                    let sDmg = Math.max(0, 15 - state.upgrades.shields * 2);
                    state.resources.hull -= sDmg;
                    if (state.resources.hull < 0) state.resources.hull = 0;
                    desc.innerText = `You fled! Took ${sDmg} damage while escaping.\nYour Hull: ${state.resources.hull}%`;
                    actions.innerHTML = '';
                    closeBtn();
                });
            }
        };
        updateCombatBtns("Space pirates ambush you!");
      } else if (type === 'Anomaly') {
        desc.innerText = "You investigate a spatial anomaly. Your fuel tanks are replenished by 500.";
        state.resources.fuel += 500;
        closeBtn();
      } else if (type === 'Trader') {
        if (state.crew.length < 50) {
            state.crew.push({ name: firstNames[Math.floor(Math.random() * firstNames.length)], role: 0, level: 1, xp: 0 });
            desc.innerText = "A wandering trader offers help. 1 crew member joins your ship.";
        } else {
            desc.innerText = "A wandering trader offers help, but you have no room.";
        }
        closeBtn();
      } else if (type === 'Station') {
        desc.innerText = "You dock at a trading station. What would you like to do?";
        
        const updateStationBtns = (mode = 'main') => {
            actions.innerHTML = '';
            if (mode === 'main') {
                addBtn(`Buy 500 Fuel (50C)`, () => {
                    if (state.resources.credits >= 50) {
                        state.resources.credits -= 50;
                        state.resources.fuel += 500;
                        updateUI();
                        updateStationBtns('main');
                    }
                });
                addBtn(`Repair 20% Hull (100C)`, () => {
                    if (state.resources.credits >= 100 && state.resources.hull < 100) {
                        state.resources.credits -= 100;
                        state.resources.hull = Math.min(100, state.resources.hull + 20);
                        updateUI();
                        updateStationBtns('main');
                    }
                });
                addBtn(`Buy Minerals (100C)`, () => {
                    const maxCargo = state.upgrades.cargo * 10;
                    if (state.resources.credits >= 100 && (state.cargo.minerals + state.cargo.tech) < maxCargo) {
                        state.resources.credits -= 100;
                        state.cargo.minerals += 1;
                        updateUI();
                        updateStationBtns('main');
                    }
                });
                addBtn(`Sell Minerals (80C)`, () => {
                    if (state.cargo.minerals > 0) {
                        state.resources.credits += 80;
                        state.cargo.minerals -= 1;
                        updateUI();
                        updateStationBtns('main');
                    }
                });
                addBtn(`Buy Tech (300C)`, () => {
                    const maxCargo = state.upgrades.cargo * 10;
                    if (state.resources.credits >= 300 && (state.cargo.minerals + state.cargo.tech) < maxCargo) {
                        state.resources.credits -= 300;
                        state.cargo.tech += 1;
                        updateUI();
                        updateStationBtns('main');
                    }
                });
                addBtn(`Sell Tech (250C)`, () => {
                    if (state.cargo.tech > 0) {
                        state.resources.credits += 250;
                        state.cargo.tech -= 1;
                        updateUI();
                        updateStationBtns('main');
                    }
                });
                addBtn(`Shipyard (Upgrades)`, () => {
                    updateStationBtns('shipyard');
                });
                addBtn(`Tavern (Recruit 100C)`, () => {
                    if (state.resources.credits >= 100 && state.crew.length < 50) {
                        state.resources.credits -= 100;
                        state.crew.push({ name: firstNames[Math.floor(Math.random() * firstNames.length)], role: 0, level: 1, xp: 0 });
                        updateUI();
                        updateStationBtns('main');
                    }
                });
                addBtn('Leave Station', () => {
                    modal.style.display = 'none';
                    state.modalOpen = false;
                });
            } else if (mode === 'shipyard') {
                const wpnCost = state.upgrades.weapons * 500;
                addBtn(`Upgrade Weapons L${state.upgrades.weapons+1} (${wpnCost}C)`, () => {
                    if (state.resources.credits >= wpnCost && state.upgrades.weapons < 5) {
                        state.resources.credits -= wpnCost;
                        state.upgrades.weapons++;
                        updateUI();
                        updateStationBtns('shipyard');
                    }
                });
                const shdCost = state.upgrades.shields * 500;
                addBtn(`Upgrade Shields L${state.upgrades.shields+1} (${shdCost}C)`, () => {
                    if (state.resources.credits >= shdCost && state.upgrades.shields < 5) {
                        state.resources.credits -= shdCost;
                        state.upgrades.shields++;
                        updateUI();
                        updateStationBtns('shipyard');
                    }
                });
                const engCost = state.upgrades.engines * 500;
                addBtn(`Upgrade Engines L${state.upgrades.engines+1} (${engCost}C)`, () => {
                    if (state.resources.credits >= engCost && state.upgrades.engines < 5) {
                        state.resources.credits -= engCost;
                        state.upgrades.engines++;
                        updateUI();
                        updateStationBtns('shipyard');
                    }
                });
                const carCost = state.upgrades.cargo * 500;
                addBtn(`Upgrade Cargo L${state.upgrades.cargo+1} (${carCost}C)`, () => {
                    if (state.resources.credits >= carCost && state.upgrades.cargo < 5) {
                        state.resources.credits -= carCost;
                        state.upgrades.cargo++;
                        updateUI();
                        updateStationBtns('shipyard');
                    }
                });
                addBtn('Back to Station', () => {
                    updateStationBtns('main');
                });
            }
        };
        updateStationBtns('main');
      } else if (type === 'Story') {
        let storyType = Math.floor(Math.random() * 3);
        if (storyType === 0) {
            desc.innerText = "You find a derelict starship drifting in space.";
            addBtn('Salvage (Risk Hull, Gain Cargo)', () => {
                if (Math.random() < 0.5) {
                    state.cargo.tech += 1;
                    state.cargo.minerals += 1;
                    desc.innerText = "You successfully salvaged tech and minerals!";
                } else {
                    state.resources.hull -= 15;
                    if (state.resources.hull < 0) state.resources.hull = 0;
                    desc.innerText = "A booby trap exploded! Lost 15 Hull.";
                }
                actions.innerHTML = '';
                closeBtn();
                updateUI();
            });
            addBtn('Ignore', () => {
                modal.style.display = 'none';
                state.modalOpen = false;
            });
        } else if (storyType === 1) {
            desc.innerText = "You receive a distress signal from a nearby moon.";
            addBtn('Help (Cost 50 Fuel, Gain Reward)', () => {
                if (state.resources.fuel >= 50) {
                    state.resources.fuel -= 50;
                    if (Math.random() < 0.6) {
                        state.resources.credits += 150;
                        desc.innerText = "You rescued a wealthy merchant. Earned 150 Credits.";
                    } else {
                        desc.innerText = "It was a false alarm. You wasted fuel.";
                    }
                    actions.innerHTML = '';
                    closeBtn();
                    updateUI();
                } else {
                    desc.innerText = "Not enough fuel to reach them.";
                }
            });
            addBtn('Ignore', () => {
                modal.style.display = 'none';
                state.modalOpen = false;
            });
        } else {
            desc.innerText = "Scanners detect ancient alien ruins on a barren planet.";
            addBtn('Explore (Risk Crew, Gain Tech)', () => {
                if (Math.random() < 0.5) {
                    state.cargo.tech += 2;
                    desc.innerText = "You found valuable ancient technology!";
                } else {
                    if (state.crew.length > 0) {
                        state.crew.pop();
                        desc.innerText = "A cave-in occurred. You lost a crew member.";
                    } else {
                        desc.innerText = "You explored but found nothing.";
                    }
                }
                actions.innerHTML = '';
                closeBtn();
                updateUI();
            });
            addBtn('Leave', () => {
                modal.style.display = 'none';
                state.modalOpen = false;
            });
        }
      }
      modal.style.display = 'block';
      keys.w = keys.a = keys.s = keys.d = false;
      updateUI(); // refresh resources instantly
    }

    // Navigation logic
    const moveSpeed = 5;
    const keys = { w: false, a: false, s: false, d: false };

    function update() {
      if (state.modalOpen) {
        requestAnimationFrame(update);
        return;
      }

      let pIdx = getOfficer(1);
      const currentMoveSpeed = 5 + (state.upgrades.engines - 1) * 2 + (pIdx !== -1 ? state.crew[pIdx].level : 0);
      state.ship.moving = false;
      let dx = 0, dy = 0;
      if (keys.w) dy -= currentMoveSpeed;
      if (keys.s) dy += currentMoveSpeed;
      if (keys.a) dx -= currentMoveSpeed;
      if (keys.d) dx += currentMoveSpeed;

      if ((dx !== 0 || dy !== 0) && state.resources.fuel > 0) {
        state.ship.x += dx;
        state.ship.y += dy;
        state.ship.moving = true;
        state.resources.fuel -= 1;
        if (state.resources.fuel < 0) state.resources.fuel = 0;
        if (Math.random() < 0.1) addXP(1, 1);
      }

      // Boundaries
      if (state.ship.x < -state.mapSize/2) state.ship.x = -state.mapSize/2;
      if (state.ship.x > state.mapSize/2) state.ship.x = state.mapSize/2;
      if (state.ship.y < -state.mapSize/2) state.ship.y = -state.mapSize/2;
      if (state.ship.y > state.mapSize/2) state.ship.y = state.mapSize/2;

      draw();
      requestAnimationFrame(update);
    }

    // Input handlers
    function openCrewModal() {
        if (state.modalOpen) return;
        state.modalOpen = true;
        const modal = document.getElementById('modal');
        const title = document.getElementById('modal-title');
        const desc = document.getElementById('modal-desc');
        const actions = document.getElementById('modal-actions');
        
        const renderCrew = () => {
            title.innerText = "CREW MANAGEMENT";
            let p = getOfficer(1), g = getOfficer(2), e = getOfficer(3);
            let un = state.crew.length - (p!==-1?1:0) - (g!==-1?1:0) - (e!==-1?1:0);
            
            let pStr = p !== -1 ? `${state.crew[p].name} L${state.crew[p].level} (${state.crew[p].xp}XP)` : "NONE";
            let gStr = g !== -1 ? `${state.crew[g].name} L${state.crew[g].level} (${state.crew[g].xp}XP)` : "NONE";
            let eStr = e !== -1 ? `${state.crew[e].name} L${state.crew[e].level} (${state.crew[e].xp}XP)` : "NONE";
            
            desc.innerHTML = `Pilot: ${pStr}<br>Gunner: ${gStr}<br>Eng: ${eStr}<br><br>Unassigned: ${un}`;
            actions.innerHTML = '';
            
            const addBtn = (text, onClick) => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerText = text;
                btn.onclick = onClick;
                actions.appendChild(btn);
            };
            
            addBtn('Cycle Pilot', () => { cycleOfficer(1); renderCrew(); updateUI(); });
            addBtn('Cycle Gunner', () => { cycleOfficer(2); renderCrew(); updateUI(); });
            addBtn('Cycle Engineer', () => { cycleOfficer(3); renderCrew(); updateUI(); });
            addBtn('Close', () => {
                modal.style.display = 'none';
                state.modalOpen = false;
            });
        };
        renderCrew();
        modal.style.display = 'block';
        keys.w = keys.a = keys.s = keys.d = false;
    }

    document.getElementById('btn-crew').addEventListener('click', openCrewModal);

    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (['w','a','s','d'].includes(k)) { keys[k] = true; }
      if (k === 'c') { openCrewModal(); }
    });
    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (['w','a','s','d'].includes(k)) { keys[k] = false; }
    });

    function setupButton(id, key) {
      const btn = document.getElementById(id);
      btn.addEventListener('mousedown', () => keys[key] = true);
      btn.addEventListener('mouseup', () => keys[key] = false);
      btn.addEventListener('mouseleave', () => keys[key] = false);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
    }

    setupButton('btn-up', 'w');
    setupButton('btn-down', 's');
    setupButton('btn-left', 'a');
    setupButton('btn-right', 'd');

    // Init
    generateStars();
    update();
  </script>
</body>
</html>
