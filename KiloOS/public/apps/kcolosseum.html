<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KColosseum</title>
<style>
  body {
    background: linear-gradient(135deg, #e3dac9 0%, #f5f5dc 50%, #e3dac9 100%);
    color: #4a0404;
    font-family: 'Times New Roman', Times, serif;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  h1, h2 {
    color: #8b0000;
    text-align: center;
    border-bottom: 2px solid #d4af37;
    padding-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .dashboard {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .panel {
    background: #ffffff;
    border: 3px solid #d4af37;
    border-radius: 8px;
    padding: 15px;
    width: 48%;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
  }
  .funds {
    font-size: 1.5em;
    color: #d4af37;
    text-shadow: 1px 1px 2px #000;
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
    background-color: #8b0000;
    padding: 10px;
    border-radius: 5px;
    border: 2px solid #d4af37;
  }
  ul {
    list-style: none;
    padding: 0;
  }
  li {
    background: #fdf5e6;
    color: #333;
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #d4af37;
  }
  button {
    background: #8b0000;
    color: #d4af37;
    border: 2px solid #d4af37;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 4px;
    font-weight: bold;
    font-family: 'Times New Roman', Times, serif;
    text-transform: uppercase;
  }
  button:hover:not(:disabled) {
    background: #a52a2a;
  }
  button:disabled {
    background: #555;
    color: #888;
    border-color: #444;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <h1>KColosseum - Ludus Management</h1>
  <div class="funds">Treasury: <span id="fundsDisplay">1000</span> Denarii | League: <span id="leagueDisplay">Local Pits (Level 1)</span></div>
  
  <div class="dashboard" id="dashboard">
    <div class="panel">
      <h2 style="display:flex; justify-content:space-between; align-items:center;">
        Available Recruits
        <button id="refreshBtn" onclick="refreshMarket()" style="font-size:0.6em; padding:2px 5px;">Refresh (50D)</button>
      </h2>
      <ul id="marketList"></ul>
    </div>
    <div class="panel">
      <h2>Your Gladiators</h2>
      <ul id="ownedList"></ul>
    </div>
    </div>
  </div>

  <div id="arenaPanel" style="display:none; margin:0 auto; width:80%;" class="panel">
    <h2>Arena Combat</h2>
    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
      <div id="playerCombat" style="width:45%; padding:10px; background:#fdf5e6; border:1px solid #d4af37; border-radius:5px;"></div>
      <div id="enemyCombat" style="width:45%; padding:10px; background:#fdf5e6; border:1px solid #d4af37; border-radius:5px;"></div>
    </div>
    <div style="text-align:center;">
      <div id="favorDisplay" style="font-weight:bold; color:#d4af37; background:#8b0000; padding:5px; margin-bottom:10px; border-radius:5px; border:1px solid #d4af37;">Crowd Favor: 0%</div>
      <button onclick="combatAction('attack')">Attack</button>
      <button onclick="combatAction('defend')">Defend</button>
      <button onclick="combatAction('showboat')">Showboat</button>
      <button onclick="combatAction('flee')">Flee</button>
    </div>
    <div id="combatLog" style="margin-top:20px; height:150px; overflow-y:auto; background:#fff; color:#333; padding:10px; border:1px solid #ccc; font-family:monospace;"></div>
  </div>

  <script>
    let funds = 1000;
    let nextId = 1;
    let arenaLevel = 1;
    
    function getLeagueName(level) {
      if (level < 3) return "Local Pits";
      if (level < 6) return "Provincial Arena";
      if (level < 9) return "Capital Amphitheatre";
      if (level < 10) return "The Grand Colosseum";
      return "Champion of Rome";
    }

    const firstNames = ["Titus", "Flamma", "Spiculus", "Marcus", "Lucius", "Gaius", "Quintus", "Aulus"];
    const epithets = ["the Strong", "the Swift", "the Bear", "the Lion", "the Fierce", "the Giant"];

    function generateGladiator(forArena = false) {
      const name = firstNames[Math.floor(Math.random() * firstNames.length)] + 
                   (Math.random() > 0.5 ? " " + epithets[Math.floor(Math.random() * epithets.length)] : "");
      const str = Math.floor(Math.random() * 10) + 1;
      const agi = Math.floor(Math.random() * 10) + 1;
      const vit = Math.floor(Math.random() * 10) + 1;
      let weapon = 0, armor = 0, shield = 0;
      if (forArena || Math.random() < 0.3) {
          if (Math.random() < 0.3) weapon = Math.floor(Math.random() * 2) + 1;
          if (Math.random() < 0.3) armor = 1;
          if (Math.random() < 0.3) shield = 1;
      }
      const cost = (str + agi + vit) * 20 + Math.floor(Math.random() * 50) + (weapon ? 50 : 0) + (armor ? 50 : 0) + (shield ? 30 : 0);
      let g = { id: nextId++, name, cost, str, agi, vit, weapon, armor, shield, damageTaken: 0 };
      updateDesc(g);
      return g;
    }

    function getEffStr(g) { return g.str + (g.weapon === 1 ? 3 : 0); }
    function getEffAgi(g) { return g.agi + (g.weapon === 2 ? 3 : 0); }
    function getEffVit(g) { return g.vit + (g.armor === 1 ? 5 : 0); }

    function updateDesc(g) {
      let eqStr = "";
      if (g.weapon === 1) eqStr += " [Glad]";
      else if (g.weapon === 2) eqStr += " [Trid]";
      if (g.armor === 1) eqStr += " [Armr]";
      if (g.shield === 1) eqStr += " [Shld]";
      let maxHp = getEffVit(g) * 10;
      let hp = maxHp - g.damageTaken;
      g.desc = `HP:${hp}/${maxHp} STR:${g.str} AGI:${g.agi} VIT:${g.vit}${eqStr}`;
    }

    const market = [generateGladiator(), generateGladiator(), generateGladiator()];
    const owned = [];

    function refreshMarket() {
      if (funds >= 50) {
        funds -= 50;
        market.length = 0;
        market.push(generateGladiator(), generateGladiator(), generateGladiator());
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('fundsDisplay').innerText = funds;
      document.getElementById('leagueDisplay').innerText = `${getLeagueName(arenaLevel)} (Level ${arenaLevel})`;
      document.getElementById('refreshBtn').disabled = funds < 50;
      
      const marketList = document.getElementById('marketList');
      marketList.innerHTML = '';
      market.forEach(g => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div>
            <strong>${g.name}</strong> - ${g.desc}
          </div>
          <button onclick="buyGladiator(${g.id})" ${funds < g.cost ? 'disabled' : ''}>Buy (${g.cost}D)</button>
        `;
        marketList.appendChild(li);
      });

      const ownedList = document.getElementById('ownedList');
      ownedList.innerHTML = '';
      if (owned.length === 0) {
        ownedList.innerHTML = '<li><em>No gladiators owned.</em></li>';
      }
      owned.forEach(g => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div style="margin-bottom:5px;"><strong>${g.name}</strong> - ${g.desc}</div>
          <div style="display:flex; gap:5px; flex-wrap:wrap; margin-bottom:5px;">
            <button style="font-size:0.7em" onclick="equipItem(${g.id}, 'glad')" ${funds < 50 || g.weapon === 1 ? 'disabled' : ''}>Glad(50D)</button>
            <button style="font-size:0.7em" onclick="equipItem(${g.id}, 'trid')" ${funds < 50 || g.weapon === 2 ? 'disabled' : ''}>Trid(50D)</button>
            <button style="font-size:0.7em" onclick="equipItem(${g.id}, 'armr')" ${funds < 50 || g.armor === 1 ? 'disabled' : ''}>Armr(50D)</button>
            <button style="font-size:0.7em" onclick="equipItem(${g.id}, 'shld')" ${funds < 30 || g.shield === 1 ? 'disabled' : ''}>Shld(30D)</button>
          </div>
          <div style="display:flex; gap:5px;">
            <button style="font-size:0.7em" onclick="trainGladiator(${g.id}, 'str')" ${funds < 20 ? 'disabled' : ''}>+STR (20D)</button>
            <button style="font-size:0.7em" onclick="trainGladiator(${g.id}, 'agi')" ${funds < 20 ? 'disabled' : ''}>+AGI (20D)</button>
            <button style="font-size:0.7em" onclick="trainGladiator(${g.id}, 'vit')" ${funds < 20 ? 'disabled' : ''}>+VIT (20D)</button>
          </div>
          <div style="margin-top:5px; display:flex; gap:5px;">
            <button style="font-size:0.7em; background:#228b22; color:#fff;" onclick="enterArena(${g.id})" ${g.damageTaken >= getEffVit(g) * 10 ? 'disabled' : ''}>Fight in Arena</button>
            ${g.damageTaken > 0 ? `<button style="font-size:0.7em; background:#4169e1; color:#fff;" onclick="healGladiator(${g.id})" ${(funds < g.damageTaken) ? 'disabled' : ''}>Heal (${g.damageTaken}D)</button>` : ''}
          </div>
        `;
        li.style.flexDirection = 'column';
        li.style.alignItems = 'flex-start';
        ownedList.appendChild(li);
      });
    }

    function buyGladiator(id) {
      const index = market.findIndex(g => g.id === id);
      if (index !== -1 && funds >= market[index].cost) {
        funds -= market[index].cost;
        owned.push(market[index]);
        market.splice(index, 1);
        updateUI();
      }
    }

    function equipItem(id, type) {
      const g = owned.find(g => g.id === id);
      if (!g) return;
      let cost = (type === 'shld') ? 30 : 50;
      if (funds >= cost) {
          funds -= cost;
          if (type === 'glad') g.weapon = 1;
          if (type === 'trid') g.weapon = 2;
          if (type === 'armr') g.armor = 1;
          if (type === 'shld') g.shield = 1;
          updateDesc(g);
          updateUI();
      }
    }

    function trainGladiator(id, stat) {
      if (funds >= 20) {
        const gladiator = owned.find(g => g.id === id);
        if (gladiator) {
          funds -= 20;
          if (stat === 'str') gladiator.str++;
          if (stat === 'agi') gladiator.agi++;
          if (stat === 'vit') gladiator.vit++;
          updateDesc(gladiator);
          updateUI();
        }
      }
    }

    function healGladiator(id) {
      const g = owned.find(g => g.id === id);
      if (g && g.damageTaken > 0 && funds >= g.damageTaken) {
        funds -= g.damageTaken;
        g.damageTaken = 0;
        updateDesc(g);
        updateUI();
      }
    }

    let currentFighter = null;
    let enemyFighter = null;
    let playerDefending = false;
    let combatOver = false;
    let crowdFavor = 0;

    function enterArena(id) {
      currentFighter = owned.find(g => g.id === id);
      if (!currentFighter) return;
      
      currentFighter.maxHp = getEffVit(currentFighter) * 10;
      currentFighter.hp = currentFighter.maxHp - currentFighter.damageTaken;
      
      enemyFighter = generateGladiator(true);
      
      let isSpecial = (arenaLevel > 2 && Math.random() < 0.3);
      if (isSpecial) {
        let eventType = Math.floor(Math.random() * 3);
        if (eventType === 0) {
          enemyFighter.name = "Ferocious Lion";
          enemyFighter.str += Math.floor(arenaLevel * 2);
          enemyFighter.agi += Math.floor(arenaLevel * 2);
          enemyFighter.vit += Math.floor(arenaLevel * 2);
          enemyFighter.weapon = 0; enemyFighter.shield = 0; enemyFighter.armor = 0;
          enemyFighter.isBeast = true;
        } else if (eventType === 1) {
          enemyFighter.name = "Armed Chariot";
          enemyFighter.vit += Math.floor(arenaLevel * 3);
          enemyFighter.str += Math.floor(arenaLevel * 1.5);
          enemyFighter.armor = 1; enemyFighter.shield = 1;
        } else {
          enemyFighter.name = "Twin Gladiators";
          enemyFighter.vit += Math.floor(arenaLevel * 1.5);
          enemyFighter.str += Math.floor(arenaLevel * 1.5);
          enemyFighter.isTwins = true;
        }
      } else {
        enemyFighter.str += Math.floor(arenaLevel * 1.5);
        enemyFighter.agi += Math.floor(arenaLevel * 1.5);
        enemyFighter.vit += Math.floor(arenaLevel * 1.5);
        if (arenaLevel > 2 && Math.random() < 0.5) enemyFighter.weapon = Math.floor(Math.random() * 2) + 1;
        if (arenaLevel > 4 && Math.random() < 0.5) enemyFighter.shield = 1;
        if (arenaLevel > 6 && Math.random() < 0.5) enemyFighter.armor = 1;
        if (arenaLevel > 8) { enemyFighter.weapon = Math.floor(Math.random() * 2) + 1; enemyFighter.shield = 1; enemyFighter.armor = 1; }
      }
      
      updateDesc(enemyFighter);
      
      enemyFighter.hp = getEffVit(enemyFighter) * 10;
      enemyFighter.maxHp = enemyFighter.hp;
      
      combatOver = false;
      playerDefending = false;
      enemyDefending = false;
      crowdFavor = 0;
      
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('arenaPanel').style.display = 'block';
      
      const log = document.getElementById('combatLog');
      log.innerHTML = `<em>Match starts! ${currentFighter.name} vs ${enemyFighter.name}</em><br>`;
      
      updateCombatUI();
    }
    
    function updateCombatUI() {
      document.getElementById('playerCombat').innerHTML = `
        <h3 style="margin-top:0;">${currentFighter.name}</h3>
        <div style="font-weight:bold; color:#8b0000;">HP: ${currentFighter.hp} / ${currentFighter.maxHp}</div>
        <div style="font-size:0.9em; margin-top:5px;">STR:${getEffStr(currentFighter)} AGI:${getEffAgi(currentFighter)} VIT:${getEffVit(currentFighter)}</div>
      `;
      document.getElementById('enemyCombat').innerHTML = `
        <h3 style="margin-top:0;">${enemyFighter.name}</h3>
        <div style="font-weight:bold; color:#8b0000;">HP: ${enemyFighter.hp} / ${enemyFighter.maxHp}</div>
        <div style="font-size:0.9em; margin-top:5px;">STR:${getEffStr(enemyFighter)} AGI:${getEffAgi(enemyFighter)} VIT:${getEffVit(enemyFighter)}</div>
      `;
      document.getElementById('favorDisplay').innerText = `Crowd Favor: ${crowdFavor}%`;
    }
    
    function checkCrowdFavor() {
      if (crowdFavor >= 100) {
        crowdFavor = 0;
        if (Math.random() < 0.5) {
          let gold = 50 + Math.floor(Math.random() * 51);
          funds += gold;
          logCombat(`<strong>The crowd goes wild! They throw <span style="color:#d4af37;">${gold} Denarii</span> into the arena!</strong>`);
        } else {
          let heal = 20 + Math.floor(Math.random() * 21);
          currentFighter.hp = Math.min(currentFighter.maxHp, currentFighter.hp + heal);
          logCombat(`<strong>The crowd cheers! A medical sponge is thrown! Healed <span style="color:#228b22;">${heal} HP</span>!</strong>`);
        }
        updateCombatUI();
        updateUI();
      }
    }
    
    function logCombat(msg) {
      const log = document.getElementById('combatLog');
      log.innerHTML += msg + '<br>';
      log.scrollTop = log.scrollHeight;
    }
    
    let enemyDefending = false;

    function combatAction(action) {
      if (combatOver) return;
      
      if (action === 'flee') {
        logCombat(`${currentFighter.name} flees the arena in disgrace!`);
        if (arenaLevel > 1) {
          arenaLevel--;
          logCombat(`<em>Your ludus drops to level ${arenaLevel}...</em>`);
        }
        combatOver = true;
        setTimeout(exitArena, 1500);
        return;
      }
      
      playerDefending = (action === 'defend');
      if (playerDefending) {
        logCombat(`${currentFighter.name} takes a defensive stance.`);
        crowdFavor = Math.max(0, crowdFavor - 5);
      }
      
      if (action === 'showboat') {
        let favorGain = 30 + Math.floor(Math.random() * 21);
        crowdFavor += favorGain;
        logCombat(`${currentFighter.name} plays to the crowd!`);
        checkCrowdFavor();
      }
      
      if (action === 'attack') {
        let hitChance = 75 + (getEffAgi(currentFighter) - getEffAgi(enemyFighter)) * 5;
        if (enemyDefending) hitChance -= (enemyFighter.shield === 1 ? 50 : 30);
        if (Math.random() * 100 < hitChance) {
          let dmg = Math.max(1, getEffStr(currentFighter) + Math.floor(Math.random() * 4));
          if (enemyDefending) dmg = Math.max(1, dmg - (enemyFighter.shield === 1 ? 5 : 3));
          enemyFighter.hp -= dmg;
          crowdFavor += 5 + Math.floor(Math.random() * 11);
          logCombat(`<strong>${currentFighter.name}</strong> hits for <span style="color:#8b0000;">${dmg} damage</span>!`);
          checkCrowdFavor();
        } else {
          crowdFavor = Math.max(0, crowdFavor - 5);
          logCombat(`<strong>${currentFighter.name}</strong> misses!`);
        }
      }
      
      if (enemyFighter.hp <= 0) {
        enemyFighter.hp = 0;
        updateCombatUI();
        let reward = 100 + (arenaLevel * 50);
        if (enemyFighter.isBeast || enemyFighter.isTwins || enemyFighter.name === "Armed Chariot") {
            reward += 100 + (arenaLevel * 20);
        }
        logCombat(`<strong>${enemyFighter.name} is defeated! You win ${reward} Denarii!</strong>`);
        funds += reward;
        if (arenaLevel < 10) {
          arenaLevel++;
          logCombat(`<em>Your ludus advances to level ${arenaLevel}!</em>`);
        }
        updateUI();
        combatOver = true;
        setTimeout(exitArena, 2000);
        return;
      }
      
      enemyDefending = Math.random() < 0.25;
      if (enemyDefending) {
        logCombat(`${enemyFighter.name} takes a defensive stance.`);
      } else {
        let hitChance = 75 + (getEffAgi(enemyFighter) - getEffAgi(currentFighter)) * 5;
        if (playerDefending) hitChance -= (currentFighter.shield === 1 ? 50 : 30);
        
        if (Math.random() * 100 < hitChance) {
          let dmg = Math.max(1, getEffStr(enemyFighter) + Math.floor(Math.random() * 4));
          if (playerDefending) dmg = Math.max(1, dmg - (currentFighter.shield === 1 ? 5 : 3));
          currentFighter.hp -= dmg;
          currentFighter.damageTaken += dmg;
          logCombat(`<strong>${enemyFighter.name}</strong> hits for <span style="color:#8b0000;">${dmg} damage</span>!`);
        } else {
          logCombat(`<strong>${enemyFighter.name}</strong> misses!`);
        }
        
        if (enemyFighter.isTwins && currentFighter.hp > 0) {
          if (Math.random() * 100 < hitChance) {
            let dmg = Math.max(1, getEffStr(enemyFighter) + Math.floor(Math.random() * 4));
            if (playerDefending) dmg = Math.max(1, dmg - (currentFighter.shield === 1 ? 5 : 3));
            currentFighter.hp -= dmg;
            currentFighter.damageTaken += dmg;
            logCombat(`<strong>${enemyFighter.name} (Twin 2)</strong> hits for <span style="color:#8b0000;">${dmg} damage</span>!`);
          } else {
            logCombat(`<strong>${enemyFighter.name} (Twin 2)</strong> misses!`);
          }
        }
      }
      
      if (currentFighter.hp <= 0) {
        currentFighter.hp = 0;
        updateCombatUI();
        logCombat(`<strong>${currentFighter.name} is DEAD.</strong>`);
        owned.splice(owned.findIndex(g => g.id === currentFighter.id), 1);
        if (arenaLevel > 1) {
          arenaLevel--;
          logCombat(`<em>Your ludus drops to level ${arenaLevel}...</em>`);
        }
        updateUI();
        combatOver = true;
        setTimeout(exitArena, 2000);
        return;
      }
      
      updateCombatUI();
    }
    
    function exitArena() {
      document.getElementById('arenaPanel').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      
      // Pass time slightly - all gladiators NOT fighting heal by 2 HP
      owned.forEach(g => {
        if (!currentFighter || g.id !== currentFighter.id) {
          if (g.damageTaken > 0) {
            g.damageTaken -= 2;
            if (g.damageTaken < 0) g.damageTaken = 0;
            updateDesc(g);
          }
        }
      });
      updateUI();
    }

    updateUI();
  </script>
</body>
</html>
