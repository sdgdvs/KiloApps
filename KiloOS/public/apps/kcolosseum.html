<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KColosseum</title>
<style>
  body {
    background-color: #1a1a1a;
    color: #e0e0e0;
    font-family: 'Times New Roman', Times, serif;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  h1, h2 {
    color: #d4af37;
    text-align: center;
    border-bottom: 1px solid #444;
    padding-bottom: 10px;
  }
  .dashboard {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .panel {
    background: #2a2a2a;
    border: 2px solid #553311;
    border-radius: 8px;
    padding: 15px;
    width: 48%;
  }
  .funds {
    font-size: 1.2em;
    color: #ffd700;
    text-align: center;
    margin-bottom: 15px;
  }
  ul {
    list-style: none;
    padding: 0;
  }
  li {
    background: #333;
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  button {
    background: #8b0000;
    color: white;
    border: 1px solid #ff4500;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 4px;
    font-weight: bold;
  }
  button:hover:not(:disabled) {
    background: #a52a2a;
  }
  button:disabled {
    background: #555;
    color: #888;
    border-color: #444;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <h1>KColosseum - Ludus Management</h1>
  <div class="funds">Treasury: <span id="fundsDisplay">1000</span> Denarii</div>
  
  <div class="dashboard">
    <div class="panel">
      <h2>Available Recruits</h2>
      <ul id="marketList"></ul>
    </div>
    <div class="panel">
      <h2>Your Gladiators</h2>
      <ul id="ownedList"></ul>
    </div>
  </div>

  <script>
    let funds = 1000;
    const market = [
      { id: 1, name: "Titus", cost: 300, desc: "A strong but slow fighter." },
      { id: 2, name: "Flamma", cost: 500, desc: "Fierce veteran with many scars." },
      { id: 3, name: "Spiculus", cost: 700, desc: "Highly agile, crowd favorite." }
    ];
    const owned = [];

    function updateUI() {
      document.getElementById('fundsDisplay').innerText = funds;
      
      const marketList = document.getElementById('marketList');
      marketList.innerHTML = '';
      market.forEach(g => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div>
            <strong>${g.name}</strong> - ${g.desc}
          </div>
          <button onclick="buyGladiator(${g.id})" ${funds < g.cost ? 'disabled' : ''}>Buy (${g.cost}D)</button>
        `;
        marketList.appendChild(li);
      });

      const ownedList = document.getElementById('ownedList');
      ownedList.innerHTML = '';
      if (owned.length === 0) {
        ownedList.innerHTML = '<li><em>No gladiators owned.</em></li>';
      }
      owned.forEach(g => {
        const li = document.createElement('li');
        li.innerHTML = `<div><strong>${g.name}</strong> - ${g.desc}</div>`;
        ownedList.appendChild(li);
      });
    }

    function buyGladiator(id) {
      const index = market.findIndex(g => g.id === id);
      if (index !== -1 && funds >= market[index].cost) {
        funds -= market[index].cost;
        owned.push(market[index]);
        market.splice(index, 1);
        updateUI();
      }
    }

    updateUI();
  </script>
</body>
</html>
