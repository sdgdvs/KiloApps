<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVoid</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020202;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            text-shadow: 0 0 5px #0f0, 0 0 10px #0f0;
            animation: flicker 4s infinite;
        }
        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.2; }
        }
        #canvas-wrapper {
            position: relative;
        }
        canvas {
            background-color: #050505;
            border: 2px solid #0f0;
            box-shadow: 0 0 15px #0f0;
            image-rendering: pixelated;
        }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 11;
        }
        #stats {
            display: flex;
            justify-content: space-between;
            width: 640px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        #message {
            margin-top: 10px;
            font-size: 16px;
            height: 20px;
            text-shadow: 0 0 3px #0f0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>KVoid</h1>
        <div id="stats">
            <div>OXYGEN: <span id="oxy-val" style="color: #0f0;">100</span>%</div>
            <div>BATTERY: <span id="bat-val" style="color: #0f0;">100</span>%</div>
        </div>
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="640" height="480"></canvas>
            <div class="scanlines"></div>
            <div class="crt-overlay"></div>
        </div>
        <div id="message">Use WASD or Arrow Keys to move.</div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const TILE_SIZE = 16;
        const COLS = Math.floor(canvas.width / TILE_SIZE);
        const ROWS = Math.floor(canvas.height / TILE_SIZE);

        let map = [];
        let player = { x: 2, y: 2 };
        let rooms = [];

        function generateMap() {
            map = [];
            for (let y = 0; y < ROWS; y++) {
                map[y] = [];
                for (let x = 0; x < COLS; x++) {
                    map[y][x] = 1;
                }
            }
            rooms = [];
            for (let i = 0; i < 15; i++) {
                let w = Math.floor(Math.random() * 5) + 4;
                let h = Math.floor(Math.random() * 5) + 4;
                let x = Math.floor(Math.random() * (COLS - w - 2)) + 1;
                let y = Math.floor(Math.random() * (ROWS - h - 2)) + 1;
                let failed = false;
                for (let r of rooms) {
                    if (x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y) {
                        failed = true;
                        break;
                    }
                }
                if (!failed) {
                    rooms.push({x, y, w, h});
                    for (let ry = y; ry < y + h; ry++) {
                        for (let rx = x; rx < x + w; rx++) {
                            map[ry][rx] = 0;
                        }
                    }
                }
            }

            for (let i = 1; i < rooms.length; i++) {
                let r1 = rooms[i-1];
                let r2 = rooms[i];
                let cx1 = Math.floor(r1.x + r1.w/2);
                let cy1 = Math.floor(r1.y + r1.h/2);
                let cx2 = Math.floor(r2.x + r2.w/2);
                let cy2 = Math.floor(r2.y + r2.h/2);
                
                let x = cx1;
                let y = cy1;
                while (x !== cx2) {
                    map[y][x] = 0;
                    x += Math.sign(cx2 - cx1);
                }
                while (y !== cy2) {
                    map[y][x] = 0;
                    y += Math.sign(cy2 - cy1);
                }
            }

            for (let y = 1; y < ROWS - 1; y++) {
                for (let x = 1; x < COLS - 1; x++) {
                    if (map[y][x] === 0) {
                        let wallsVert = (map[y-1][x] === 1 && map[y+1][x] === 1 && map[y][x-1] === 0 && map[y][x+1] === 0);
                        let wallsHoriz = (map[y][x-1] === 1 && map[y][x+1] === 1 && map[y-1][x] === 0 && map[y+1][x] === 0);
                        if (wallsVert || wallsHoriz) {
                            if (Math.random() < 0.2) {
                                map[y][x] = (Math.random() < 0.33) ? 3 : 2;
                            }
                        }
                    }
                }
            }

            if (rooms.length > 0) {
                player.x = Math.floor(rooms[0].x + rooms[0].w / 2);
                player.y = Math.floor(rooms[0].y + rooms[0].h / 2);
            }
        }
        generateMap();

        let oxygen = 100.0;
        let battery = 100.0;
        let isDead = false;

        function updateStatsDisplay() {
            document.getElementById('oxy-val').innerText = Math.ceil(oxygen);
            document.getElementById('bat-val').innerText = Math.ceil(battery);
            
            document.getElementById('oxy-val').style.color = (oxygen <= 20) ? '#f00' : '#0f0';
            document.getElementById('bat-val').style.color = (battery <= 20) ? '#f00' : '#0f0';
        }

        function gameTick() {
            if (isDead) return;
            oxygen -= 0.5;
            battery -= 0.2;
            
            if (oxygen <= 0) { oxygen = 0; die("OXYGEN DEPLETED. YOU SUFFOCATED."); }
            else if (battery <= 0) { battery = 0; die("BATTERY DEPLETED. CONSUMED BY THE DARK."); }
            
            updateStatsDisplay();
        }
        
        setInterval(gameTick, 1000);

        function die(msg) {
            isDead = true;
            document.getElementById('message').innerText = msg;
            document.getElementById('message').style.color = '#f00';
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#f00';
            ctx.font = '30px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText("SIGNAL LOST", canvas.width/2, canvas.height/2);
        }

        function drawMap() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (map[y][x] === 1) {
                        ctx.fillStyle = '#0a0';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#030';
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (map[y][x] === 2) {
                        ctx.fillStyle = '#aa0';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#550';
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (map[y][x] === 3) {
                        ctx.fillStyle = '#a00';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#500';
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else {
                        ctx.fillStyle = '#050505';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
        }

        function drawPlayer() {
            ctx.fillStyle = '#0f0';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0f0';
            ctx.beginPath();
            ctx.arc(player.x * TILE_SIZE + TILE_SIZE / 2, player.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMap();
            drawPlayer();
        }

        function showMessage(msg, color='#0f0') {
            document.getElementById('message').innerText = msg;
            document.getElementById('message').style.color = color;
        }

        function movePlayer(dx, dy) {
            if (isDead) return;
            let newX = player.x + dx;
            let newY = player.y + dy;
            
            if (newX >= 0 && newX < COLS && newY >= 0 && newY < ROWS) {
                let target = map[newY][newX];
                if (target === 2) {
                    map[newY][newX] = 0; // open door
                    showMessage("Door opened.");
                    draw();
                } else if (target === 3) {
                    showMessage("DOOR LOCKED. KEYCARD REQUIRED.", "#f00");
                } else if (target === 0) {
                    player.x = newX;
                    player.y = newY;
                    oxygen -= 0.2;
                    showMessage("Use WASD or Arrow Keys to move.");
                    if (oxygen <= 0) {
                        oxygen = 0;
                        updateStatsDisplay();
                        die("OXYGEN DEPLETED. YOU SUFFOCATED.");
                        return;
                    }
                    updateStatsDisplay();
                    draw();
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    movePlayer(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    movePlayer(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    movePlayer(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    movePlayer(1, 0);
                    break;
            }
        });

        draw();
    </script>
</body>
</html>
