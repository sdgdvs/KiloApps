<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVoid</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020202;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            text-shadow: 0 0 5px #0f0, 0 0 10px #0f0;
            animation: flicker 4s infinite;
        }
        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.2; }
        }
        #canvas-wrapper {
            position: relative;
        }
        canvas {
            background-color: #050505;
            border: 2px solid #0f0;
            box-shadow: 0 0 15px #0f0;
            image-rendering: pixelated;
        }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 11;
        }
        #stats {
            display: flex;
            justify-content: space-between;
            width: 640px;
            margin-bottom: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        #inventory {
            display: flex;
            justify-content: center;
            width: 640px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }
        .inv-item { color: #fff; margin-left: 15px; }
        .has-key { color: #fff; text-shadow: 0 0 5px #fff; }
        .key-red.has-key { color: #f55; text-shadow: 0 0 5px #f00; }
        .key-green.has-key { color: #5f5; text-shadow: 0 0 5px #0f0; }
        .key-blue.has-key { color: #77f; text-shadow: 0 0 5px #00f; }
        #message {
            margin-top: 10px;
            font-size: 16px;
            height: 20px;
            text-shadow: 0 0 3px #0f0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>KVoid</h1>
        <div id="stats">
            <div>DECK: <span id="deck-val" style="color: #ff0;">1</span></div>
            <div>OXYGEN: <span id="oxy-val" style="color: #0f0;">100</span>%</div>
            <div>BATTERY: <span id="bat-val" style="color: #0f0;">100</span>%</div>
        </div>
        <div id="inventory">
            KEYS: 
            <span id="key-r" class="key-red" style="margin-left:10px;">[RED]</span>
            <span id="key-g" class="key-green" style="margin-left:10px;">[GREEN]</span>
            <span id="key-b" class="key-blue" style="margin-left:10px;">[BLUE]</span>
            <span class="inv-item">EMP: <span id="emp-val">0</span></span>
        </div>
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="640" height="480"></canvas>
            <div class="scanlines"></div>
            <div class="crt-overlay"></div>
        </div>
        <div id="message">Use WASD to move. Space to use EMP.</div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const TILE_SIZE = 16;
        const COLS = Math.floor(canvas.width / TILE_SIZE);
        const ROWS = Math.floor(canvas.height / TILE_SIZE);

        let map = [];
        let player = { x: 2, y: 2 };
        let rooms = [];
        let aliens = [];

        let oxygen = 100.0;
        let battery = 100.0;
        let deck = 1;
        let isDead = false;
        let keys = { r: false, g: false, b: false };
        let emps = 0;
        let alienInterval;
        let totalTime = 0;
        let selfDestructActive = false;
        let selfDestructTimer = 0;
        let wonGame = false;
        let winEnding = "";

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(freq, type, duration, vol=0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playHeartbeat() {
            playBeep(40, 'sine', 0.5, 0.5);
            setTimeout(() => playBeep(40, 'sine', 0.5, 0.5), 200);
        }

        function playAlarm() {
            playBeep(800, 'square', 0.3, 0.2);
            setTimeout(() => playBeep(600, 'square', 0.3, 0.2), 300);
        }

        function playAlienScreech() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(2000, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function generateMap() {
            map = [];
            for (let y = 0; y < ROWS; y++) {
                map[y] = [];
                for (let x = 0; x < COLS; x++) {
                    map[y][x] = 1;
                }
            }
            rooms = [];
            for (let i = 0; i < 15; i++) {
                let w = Math.floor(Math.random() * 5) + 4;
                let h = Math.floor(Math.random() * 5) + 4;
                let x = Math.floor(Math.random() * (COLS - w - 2)) + 1;
                let y = Math.floor(Math.random() * (ROWS - h - 2)) + 1;
                let failed = false;
                for (let r of rooms) {
                    if (x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y) {
                        failed = true;
                        break;
                    }
                }
                if (!failed) {
                    rooms.push({x, y, w, h});
                    for (let ry = y; ry < y + h; ry++) {
                        for (let rx = x; rx < x + w; rx++) {
                            map[ry][rx] = 0;
                        }
                    }
                }
            }

            for (let i = 1; i < rooms.length; i++) {
                let r1 = rooms[i-1];
                let r2 = rooms[i];
                let cx1 = Math.floor(r1.x + r1.w/2);
                let cy1 = Math.floor(r1.y + r1.h/2);
                let cx2 = Math.floor(r2.x + r2.w/2);
                let cy2 = Math.floor(r2.y + r2.h/2);
                
                let x = cx1;
                let y = cy1;
                while (x !== cx2) {
                    map[y][x] = 0;
                    x += Math.sign(cx2 - cx1);
                }
                while (y !== cy2) {
                    map[y][x] = 0;
                    y += Math.sign(cy2 - cy1);
                }
            }

            for (let y = 1; y < ROWS - 1; y++) {
                for (let x = 1; x < COLS - 1; x++) {
                    if (map[y][x] === 0) {
                        let wallsVert = (map[y-1][x] === 1 && map[y+1][x] === 1 && map[y][x-1] === 0 && map[y][x+1] === 0);
                        let wallsHoriz = (map[y][x-1] === 1 && map[y][x+1] === 1 && map[y-1][x] === 0 && map[y+1][x] === 0);
                        if (wallsVert || wallsHoriz) {
                            if (Math.random() < 0.2) {
                                let r = Math.random();
                                if (r < 0.2) map[y][x] = 3;
                                else if (r < 0.3) map[y][x] = 4;
                                else if (r < 0.4) map[y][x] = 5;
                                else map[y][x] = 2;
                            }
                        }
                    }
                }
            }

            if (rooms.length > 0) {
                player.x = Math.floor(rooms[0].x + rooms[0].w / 2);
                player.y = Math.floor(rooms[0].y + rooms[0].h / 2);
            }

            for (let i = 0; i < 3; i++) {
                let placed = false;
                while (!placed) {
                    let rx = Math.floor(Math.random() * COLS);
                    let ry = Math.floor(Math.random() * ROWS);
                    if (map[ry][rx] === 0 && (rx !== player.x || ry !== player.y)) {
                        map[ry][rx] = 6 + i;
                        placed = true;
                    }
                }
            }

            for (let i = 0; i < 3; i++) {
                let placed = false;
                while (!placed) {
                    let rx = Math.floor(Math.random() * COLS);
                    let ry = Math.floor(Math.random() * ROWS);
                    if (map[ry][rx] === 0 && (rx !== player.x || ry !== player.y)) {
                        map[ry][rx] = 9; // Terminal
                        placed = true;
                    }
                }
            }

            for (let i = 0; i < 5; i++) {
                let placed = false;
                while (!placed) {
                    let rx = Math.floor(Math.random() * COLS);
                    let ry = Math.floor(Math.random() * ROWS);
                    if (map[ry][rx] === 0 && (rx !== player.x || ry !== player.y)) {
                        map[ry][rx] = 11; // Locker
                        placed = true;
                    }
                }
            }

            for (let i = 0; i < 3; i++) {
                let placed = false;
                while (!placed) {
                    let rx = Math.floor(Math.random() * COLS);
                    let ry = Math.floor(Math.random() * ROWS);
                    if (map[ry][rx] === 0 && (rx !== player.x || ry !== player.y)) {
                        map[ry][rx] = 12; // EMP
                        placed = true;
                    }
                }
            }

            if (deck === 5) {
                let placed = false;
                while (!placed) {
                    let rx = Math.floor(Math.random() * COLS);
                    let ry = Math.floor(Math.random() * ROWS);
                    if (map[ry][rx] === 0 && (Math.abs(rx - player.x) > 10 || Math.abs(ry - player.y) > 10)) {
                        map[ry][rx] = 14; // Escape Pod
                        placed = true;
                    }
                }
                placed = false;
                while (!placed) {
                    let rx = Math.floor(Math.random() * COLS);
                    let ry = Math.floor(Math.random() * ROWS);
                    if (map[ry][rx] === 0 && (Math.abs(rx - player.x) > 10 || Math.abs(ry - player.y) > 10)) {
                        map[ry][rx] = 15; // Self Destruct
                        placed = true;
                    }
                }
            } else {
                let elevatorPlaced = false;
                let attempts = 0;
                while (!elevatorPlaced && attempts < 1000) {
                    let rx = Math.floor(Math.random() * COLS);
                    let ry = Math.floor(Math.random() * ROWS);
                    if (map[ry][rx] === 0 && (Math.abs(rx - player.x) > 5 || Math.abs(ry - player.y) > 5)) {
                        map[ry][rx] = 13; // Elevator
                        elevatorPlaced = true;
                    }
                    attempts++;
                }
                if (!elevatorPlaced) {
                    for(let y=1; y<ROWS-1; y++) {
                        for(let x=1; x<COLS-1; x++) {
                            if(map[y][x] === 0 && (x!==player.x || y!==player.y)) {
                                map[y][x] = 13; elevatorPlaced = true; break;
                            }
                        }
                        if(elevatorPlaced) break;
                    }
                }
            }

            aliens = [];
            let numAliens = Math.min(20, 3 + deck);
            for (let i = 0; i < numAliens; i++) {
                let placed = false;
                while (!placed) {
                    let rx = Math.floor(Math.random() * COLS);
                    let ry = Math.floor(Math.random() * ROWS);
                    if (map[ry][rx] === 0 && (Math.abs(rx - player.x) > 5 || Math.abs(ry - player.y) > 5)) {
                        aliens.push({x: rx, y: ry, state: 'patrol', stunTimer: 0});
                        placed = true;
                    }
                }
            }
        }
        generateMap();

        // Duplicate var declarations removed

        function updateInventoryDisplay() {
            document.getElementById('key-r').classList.toggle('has-key', keys.r);
            document.getElementById('key-g').classList.toggle('has-key', keys.g);
            document.getElementById('key-b').classList.toggle('has-key', keys.b);
            document.getElementById('emp-val').innerText = emps;
            document.getElementById('emp-val').style.color = emps > 0 ? '#0ff' : '#555';
        }

        function updateStatsDisplay() {
            document.getElementById('deck-val').innerText = deck;
            document.getElementById('oxy-val').innerText = Math.ceil(oxygen);
            document.getElementById('bat-val').innerText = Math.ceil(battery);
            
            document.getElementById('oxy-val').style.color = (oxygen <= 20) ? '#f00' : '#0f0';
            document.getElementById('bat-val').style.color = (battery <= 20) ? '#f00' : '#0f0';
        }

        function gameTick() {
            if (isDead || wonGame) return;
            totalTime++;
            oxygen -= 0.5;
            battery -= 0.2;
            
            let chasing = aliens.some(a => a.state === 'chase');
            
            if (oxygen <= 0) { oxygen = 0; die("OXYGEN DEPLETED. YOU SUFFOCATED."); }
            else if (battery <= 0) { battery = 0; die("BATTERY DEPLETED. CONSUMED BY THE DARK."); }
            
            if (selfDestructActive) {
                selfDestructTimer--;
                showMessage(`SELF DESTRUCT IN ${selfDestructTimer}s`, "#f00");
                playAlarm();
                if (selfDestructTimer <= 0) {
                    die("STATION DESTROYED. YOU WERE INCINERATED.");
                }
            } else if (oxygen <= 20 || battery <= 20 || chasing) {
                playHeartbeat();
            }
            
            updateStatsDisplay();
        }
        
        setInterval(gameTick, 1000);

        function die(msg) {
            isDead = true;
            document.getElementById('message').innerText = msg;
            document.getElementById('message').style.color = '#f00';
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#f00';
            ctx.font = '30px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText("SIGNAL LOST", canvas.width/2, canvas.height/2);
        }

        function drawMap() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (map[y][x] === 1) {
                        ctx.fillStyle = '#0a0';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#030';
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (map[y][x] === 2) {
                        ctx.fillStyle = '#aa0';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#550';
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (map[y][x] >= 3 && map[y][x] <= 5) {
                        let c1 = map[y][x] === 3 ? '#c00' : map[y][x] === 4 ? '#0c0' : '#00c';
                        let c2 = map[y][x] === 3 ? '#600' : map[y][x] === 4 ? '#060' : '#006';
                        ctx.fillStyle = c1;
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = c2;
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (map[y][x] >= 6 && map[y][x] <= 8) {
                        ctx.fillStyle = '#050505';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        let kc = map[y][x] === 6 ? '#f00' : map[y][x] === 7 ? '#0f0' : '#55f';
                        ctx.fillStyle = kc;
                        ctx.fillRect(x * TILE_SIZE + 4, y * TILE_SIZE + 6, 8, 5);
                    } else if (map[y][x] === 9 || map[y][x] === 10) {
                        ctx.fillStyle = '#050505';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = map[y][x] === 9 ? '#fff' : '#555';
                        ctx.fillRect(x * TILE_SIZE + 4, y * TILE_SIZE + 4, 8, 8);
                        ctx.fillStyle = map[y][x] === 9 ? '#0f0' : '#222';
                        ctx.fillRect(x * TILE_SIZE + 5, y * TILE_SIZE + 5, 6, 6);
                    } else if (map[y][x] === 11) {
                        // Locker
                        ctx.fillStyle = '#050505';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#666';
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        ctx.fillStyle = '#222';
                        ctx.fillRect(x * TILE_SIZE + TILE_SIZE/2 - 1, y * TILE_SIZE + 2, 2, TILE_SIZE - 4);
                    } else if (map[y][x] === 12) {
                        // EMP
                        ctx.fillStyle = '#050505';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#0ff';
                        ctx.fillRect(x * TILE_SIZE + 5, y * TILE_SIZE + 6, 6, 4);
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(x * TILE_SIZE + 7, y * TILE_SIZE + 6, 2, 4);
                    } else if (map[y][x] === 13) {
                        // Elevator
                        ctx.fillStyle = '#555';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#ff0';
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        ctx.fillStyle = '#000';
                        ctx.fillRect(x * TILE_SIZE + 6, y * TILE_SIZE + 6, TILE_SIZE - 12, TILE_SIZE - 12);
                    } else if (map[y][x] === 14) {
                        // Escape Pod
                        ctx.fillStyle = '#555';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#0ff';
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(x * TILE_SIZE + 6, y * TILE_SIZE + 6, TILE_SIZE - 12, TILE_SIZE - 12);
                    } else if (map[y][x] === 15) {
                        // Self Destruct Terminal
                        ctx.fillStyle = '#050505';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#f55';
                        ctx.fillRect(x * TILE_SIZE + 4, y * TILE_SIZE + 4, 8, 8);
                        ctx.fillStyle = '#f00';
                        ctx.fillRect(x * TILE_SIZE + 5, y * TILE_SIZE + 5, 6, 6);
                    } else {
                        ctx.fillStyle = '#050505';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
        }

        function drawPlayer() {
            ctx.fillStyle = '#0f0';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0f0';
            ctx.beginPath();
            ctx.arc(player.x * TILE_SIZE + TILE_SIZE / 2, player.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawAliens() {
            ctx.fillStyle = '#f0f';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f0f';
            for (let a of aliens) {
                if (a.state === 'stunned') {
                    ctx.fillStyle = '#55f';
                    ctx.shadowColor = '#55f';
                } else {
                    ctx.fillStyle = '#f0f';
                    ctx.shadowColor = '#f0f';
                }
                ctx.beginPath();
                ctx.arc(a.x * TILE_SIZE + TILE_SIZE / 2, a.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMap();
            drawAliens();
            drawPlayer();
            if (wonGame) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#0f0';
                ctx.font = '16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(winEnding, canvas.width/2, canvas.height/2);
            }
        }

        function updateAliens() {
            if (isDead || wonGame) return;
            let hidden = (map[player.y][player.x] === 11);
            if (hidden) {
                showMessage("HIDDEN IN LOCKER.", "#888");
            }
            for (let a of aliens) {
                if (a.state === 'stunned') {
                    a.stunTimer--;
                    if (a.stunTimer <= 0) a.state = 'patrol';
                    continue;
                }

                let dist = Math.abs(a.x - player.x) + Math.abs(a.y - player.y);
                let canSee = dist <= 6 && !hidden;
                a.state = canSee ? 'chase' : 'patrol';

                let dx = 0, dy = 0;
                if (a.state === 'chase') {
                    if (Math.abs(player.x - a.x) > Math.abs(player.y - a.y)) {
                        dx = Math.sign(player.x - a.x);
                        let nextTarget = map[a.y][a.x + dx];
                        if (nextTarget !== 0 && (nextTarget < 6 || nextTarget > 8)) {
                            dx = 0; dy = Math.sign(player.y - a.y);
                        }
                    } else {
                        dy = Math.sign(player.y - a.y);
                        let nextTarget = map[a.y + dy][a.x];
                        if (nextTarget !== 0 && (nextTarget < 6 || nextTarget > 8)) {
                            dy = 0; dx = Math.sign(player.x - a.x);
                        }
                    }
                } else {
                    if (Math.random() < 0.4) {
                        let dirs = [[0,1],[0,-1],[1,0],[-1,0]];
                        let d = dirs[Math.floor(Math.random()*4)];
                        dx = d[0]; dy = d[1];
                    }
                }
                
                if (dx !== 0 || dy !== 0) {
                    let nx = a.x + dx;
                    let ny = a.y + dy;
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        let target = map[ny][nx];
                        if (target === 0 || (target >= 6 && target <= 8) || target === 11 || target === 12) {
                            a.x = nx;
                            a.y = ny;
                        }
                    }
                }
                
                if (a.x === player.x && a.y === player.y && !hidden) {
                    playAlienScreech();
                    die("CAUGHT BY ALIEN. YOU ARE DEAD.");
                    return;
                }
            }
            draw();
        }

        function startAlienInterval() {
            if (alienInterval) clearInterval(alienInterval);
            let speed = Math.max(200, 650 - deck * 50);
            alienInterval = setInterval(updateAliens, speed);
        }
        startAlienInterval();

        function showMessage(msg, color='#0f0') {
            document.getElementById('message').innerText = msg;
            document.getElementById('message').style.color = color;
        }

        function movePlayer(dx, dy) {
            if (isDead || wonGame) return;
            let newX = player.x + dx;
            let newY = player.y + dy;
            
            if (newX >= 0 && newX < COLS && newY >= 0 && newY < ROWS) {
                let target = map[newY][newX];
                if (target === 2) {
                    map[newY][newX] = 0; // open door
                    showMessage("Door opened.");
                    draw();
                } else if (target >= 3 && target <= 5) {
                    let hasKey = (target === 3 && keys.r) || (target === 4 && keys.g) || (target === 5 && keys.b);
                    if (hasKey) {
                        map[newY][newX] = 0;
                        showMessage("LOCKED DOOR OPENED.");
                        draw();
                    } else {
                        let colorName = target === 3 ? "RED" : target === 4 ? "GREEN" : "BLUE";
                        let colorHex = target === 3 ? "#f00" : target === 4 ? "#0f0" : "#55f";
                        showMessage(`LOCKED. ${colorName} KEYCARD REQUIRED.`, colorHex);
                    }
                } else if (target === 9) {
                    const lores = [
                        "LOG: EXPERIMENT FAILED.",
                        "LOG: THEY ARE IN THE VENTS.",
                        "LOG: OXYGEN LEAK DETECTED.",
                        "LOG: DIRECTOR IS DEAD."
                    ];
                    let colors = [3, 4, 5];
                    let colorNames = {3: "RED", 4: "GREEN", 5: "BLUE"};
                    let unlockColor = colors[Math.floor(Math.random() * colors.length)];
                    let msg = lores[Math.floor(Math.random() * lores.length)] + ` ${colorNames[unlockColor]} DOORS OPENED.`;
                    for (let y = 1; y < ROWS - 1; y++) {
                        for (let x = 1; x < COLS - 1; x++) {
                            if (map[y][x] === unlockColor) map[y][x] = 0;
                        }
                    }
                    map[newY][newX] = 10;
                    showMessage(msg, "#0ff");
                    draw();
                } else if (target === 10) {
                    showMessage("TERMINAL ALREADY ACCESSED.", "#555");
                } else if (target === 13) {
                    deck++;
                    keys = { r: false, g: false, b: false };
                    oxygen = 100.0;
                    battery = 100.0;
                    generateMap();
                    updateInventoryDisplay();
                    updateStatsDisplay();
                    startAlienInterval();
                    showMessage(`ELEVATOR TO DECK ${deck}. STATS RESTORED.`, "#ff0");
                    draw();
                } else if (target === 14) {
                    wonGame = true;
                    if (selfDestructActive) {
                        if (totalTime < 300) {
                            winEnding = "S-RANK: STATION DESTROYED, SPEEDRUN ESCAPE!";
                        } else {
                            winEnding = "HERO: STATION DESTROYED, YOU ESCAPED.";
                        }
                    } else {
                        if (totalTime < 300) {
                            winEnding = "COWARD (FAST): YOU ESCAPED, BUT THE THREAT REMAINS.";
                        } else {
                            winEnding = "COWARD: YOU ESCAPED, BUT THE THREAT REMAINS.";
                        }
                    }
                    showMessage("YOU ESCAPED.", "#0f0");
                    draw();
                } else if (target === 15) {
                    if (!selfDestructActive) {
                        selfDestructActive = true;
                        selfDestructTimer = 45;
                        map[newY][newX] = 10;
                        showMessage("SELF DESTRUCT ACTIVATED. 45 SECONDS TO ESCAPE!", "#f00");
                        draw();
                    }
                } else if (target === 0 || (target >= 6 && target <= 8) || target === 11 || target === 12) {
                    if (target >= 6 && target <= 8) {
                        if (target === 6) { keys.r = true; showMessage("PICKED UP RED KEYCARD.", "#f00"); }
                        if (target === 7) { keys.g = true; showMessage("PICKED UP GREEN KEYCARD.", "#0f0"); }
                        if (target === 8) { keys.b = true; showMessage("PICKED UP BLUE KEYCARD.", "#55f"); }
                        map[newY][newX] = 0;
                        updateInventoryDisplay();
                    }
                    if (target === 12) {
                        emps++;
                        showMessage("PICKED UP EMP CHARGE.", "#0ff");
                        map[newY][newX] = 0;
                        updateInventoryDisplay();
                    }
                    player.x = newX;
                    player.y = newY;
                    for (let a of aliens) {
                        if (a.x === player.x && a.y === player.y && map[player.y][player.x] !== 11) {
                            playAlienScreech();
                            die("CAUGHT BY ALIEN. YOU ARE DEAD.");
                            return;
                        }
                    }
                    oxygen -= 0.2;
                    if (target === 0) showMessage("Use WASD to move. Space to use EMP.");
                    if (oxygen <= 0) {
                        oxygen = 0;
                        updateStatsDisplay();
                        die("OXYGEN DEPLETED. YOU SUFFOCATED.");
                        return;
                    }
                    updateStatsDisplay();
                    draw();
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    movePlayer(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    movePlayer(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    movePlayer(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    movePlayer(1, 0);
                    break;
                case ' ':
                    if (emps > 0) {
                        emps--;
                        showMessage("EMP DEPLOYED. ALIENS STUNNED.", "#0ff");
                        for (let a of aliens) {
                            if (Math.abs(a.x - player.x) + Math.abs(a.y - player.y) <= 8) {
                                a.state = 'stunned';
                                a.stunTimer = 10;
                            }
                        }
                        updateInventoryDisplay();
                        draw();
                    }
                    break;
            }
        });

        draw();
    </script>
</body>
</html>
