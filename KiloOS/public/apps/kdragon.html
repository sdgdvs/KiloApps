        body { margin: 0; padding: 20px; font-family: 'Uncial Antiqua', serif; background-color: #dcb881; color: #3b240b; user-select: none; }
        h1 { color: #2a1704; text-align: center; text-shadow: 1px 1px #e6cca0; }
        .container { max-width: 600px; margin: 0 auto; text-align: center; background: #ebd0a5; padding: 20px; border: 4px solid #5a3814; border-radius: 5px; box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.5); }
        .stats { display: flex; justify-content: space-around; margin-top: 20px; padding: 10px; background: rgba(90, 56, 20, 0.2); border: 2px solid #5a3814; border-radius: 3px; flex-wrap: wrap; gap: 5px; }
        .stat { font-size: 18px; font-weight: bold; }
        .controls { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #8b5a2b; color: #f5deb3; border: 2px solid #3b240b; border-radius: 3px; font-family: 'Uncial Antiqua', serif; text-shadow: 1px 1px #000; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        button:hover { background: #a06b38; }
        button:disabled { background: #5a4b3c; color: #888; cursor: not-allowed; }
        .entity-display { margin: 30px 0; min-height: 128px; display: flex; justify-content: center; align-items: center; }
        .message-log { margin-top: 20px; height: 100px; overflow-y: auto; background: rgba(255,255,255,0.3); padding: 10px; text-align: left; font-family: 'Courier New', monospace; border: 2px inset #5a3814; color: #2a1704; font-weight: bold; }
        .message { margin: 5px 0; }
    </style>

                document.getElementById('btn-sleep').addEventListener('click', () => this.action('sleep'));
                document.getElementById('btn-hoard').addEventListener('click', () => this.action('hoard'));
                document.getElementById('btn-battle').addEventListener('click', () => this.startBattle());
                document.getElementById('btn-shop').addEventListener('click', () => {
                    if (this.state === 'egg') return;
                    this.isBusy = true;
                    document.getElementById('controls').style.display = 'none';
                    document.getElementById('shop-controls').style.display = 'flex';
                });
                
                document.getElementById('btn-shop-back').addEventListener('click', () => {
                    this.isBusy = false;
                    document.getElementById('shop-controls').style.display = 'none';
                    document.getElementById('controls').style.display = 'flex';
                });
                document.getElementById('btn-shop-food').addEventListener('click', () => this.buyItem('food'));

                    if (this.element === 'Water') {
                        svgStr = svgStr.replace(/rgb\(180,30,30\)/g, "rgb(30,60,180)").replace(/rgb\(220,60,60\)/g, "rgb(60,120,220)");
                    } else if (this.element === 'Earth') {
                        svgStr = svgStr.replace(/rgb\(180,30,30\)/g, "rgb(100,60,30)").replace(/rgb\(220,60,60\)/g, "rgb(150,100,60)");
                    }
                    document.getElementById('entity-art').innerHTML = svgStr;
                    if (!this.isBusy) document.getElementById('controls').style.display = 'flex';
                }
            },
            
            hatch() {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                this.state = 'dragon';
                this.log("The egg hatched! A baby dragon emerged.");
                this.updateUI();
                
                this.tickInterval = setInterval(() => this.tick(), 3000);
            },
            
            action(type) {
                if (type === 'feed') {
                    if (this.stats.hunger >= 100) {
                        this.log("Dragon is full and refuses to eat.");
                        return;
                    }
                    this.feedCount++;
                    this.stats.hunger = Math.min(100, this.stats.hunger + 20);
                    this.stats.energy = Math.max(0, this.stats.energy - 5);
                    this.log("You fed the dragon. It looks satisfied.");
                } else if (type === 'play') {
                    if (this.stats.energy < 20) {
                        this.log("Dragon is too tired to play.");
                        return;
                    }
                    this.playCount++;
                    this.stats.happiness = Math.min(100, this.stats.happiness + 20);
                    this.stats.energy = Math.max(0, this.stats.energy - 20);
                    this.stats.hunger = Math.max(0, this.stats.hunger - 10);
                    this.log("You played with the dragon! It's happy.");
                } else if (type === 'sleep') {
                    this.sleepCount++;
                    this.stats.energy = Math.min(100, this.stats.energy + 40);
                    this.stats.hunger = Math.max(0, this.stats.hunger - 10);
                    this.log("Dragon took a nap and regained energy.");
                } else if (type === 'hoard') {
                    if (this.stats.energy < 30) {
                        this.log("Dragon is too tired for an expedition.");
                        return;
                    }
                    this.stats.energy -= 30;
                    this.stats.hunger = Math.max(0, this.stats.hunger - 15);
                    this.log("Dragon departed on an expedition...");
                    this.isBusy = true;
                    document.getElementById('controls').style.display = 'none';
                    
                    setTimeout(() => {
                        let foundGold = Math.floor(Math.random() * 20) + 10;
                        this.stats.gold += foundGold;
                        this.stats.happiness = Math.min(100, this.stats.happiness + 5);
                        this.log(`Dragon returned with ${foundGold} gold!`);
                        
                        if (Math.random() < 0.3) {
                            const items = ["Shiny Scale", "Gemstone", "Old Bone", "Mystery Eggshell"];
                            const item = items[Math.floor(Math.random() * items.length)];
                            this.log(`Dragon also found a rare item: ${item}!`);
                        }
                        
                        this.isBusy = false;
                        document.getElementById('controls').style.display = 'flex';
                        this.updateUI();
                    }, 5000);
                }
                this.updateUI();
            },
            
            startMinigame(type) {
                document.getElementById('train-controls').style.display = 'none';
                this.stats.energy = Math.max(0, this.stats.energy - 15);
                this.stats.hunger = Math.max(0, this.stats.hunger - 5);
                
                if (type === 'str') {
                    document.getElementById('minigame-str').style.display = 'flex';
                    this.minigameValue = 0;
                    let goingUp = true;
                    this.minigameInterval = setInterval(() => {
                        if (goingUp) {
                            this.minigameValue += 5;
                            if (this.minigameValue >= 100) goingUp = false;
                        } else {
                            this.minigameValue -= 5;
                            if (this.minigameValue <= 0) goingUp = true;
                        }
                        let barLength = Math.floor(this.minigameValue / 5);
                        let bar = "[" + "=".repeat(barLength) + " ".repeat(20 - barLength) + "]";
                        document.getElementById('str-power').innerText = bar;
                    }, 50);
                    
                    document.getElementById('btn-str-hit').onclick = () => {
                        clearInterval(this.minigameInterval);
                        let gain = Math.floor(this.minigameValue / 20);
                        this.stats.strength += gain;
                        this.log(`You hit with power ${this.minigameValue}! Strength +${gain}`);
                        this.endMinigame('str');
                    };
                } else if (type === 'spd') {
                    document.getElementById('minigame-spd').style.display = 'flex';
                    document.getElementById('spd-status').innerText = 'Wait for it...';
                    this.minigameState = 'waiting';
                    
                    let delay = 1000 + Math.random() * 2000;
                    this.minigameTimeout = setTimeout(() => {
                        this.minigameState = 'ready';
                        document.getElementById('spd-status').innerText = 'NOW!';
                        this.minigameValue = Date.now();
                    }, delay);
                    
                    document.getElementById('btn-spd-react').onclick = () => {
                        if (this.minigameState === 'waiting') {
                            clearTimeout(this.minigameTimeout);
                            this.log("Too early! You missed.");
                            this.endMinigame('spd');
                        } else if (this.minigameState === 'ready') {
                            let time = Date.now() - this.minigameValue;
                            let gain = time < 300 ? 5 : (time < 500 ? 3 : 1);
                            this.stats.speed += gain;
                            this.log(`Reaction time: ${time}ms! Speed +${gain}`);
                            this.endMinigame('spd');
                        }
                    };
                } else if (type === 'loy') {
                    document.getElementById('minigame-loy').style.display = 'flex';
                    let correctBox = Math.floor(Math.random() * 3);
                    
                    document.querySelectorAll('.btn-loy-box').forEach(btn => {
                        btn.onclick = () => {
                            let picked = parseInt(btn.getAttribute('data-box'));
                            if (picked === correctBox) {
                                this.stats.loyalty += 5;
                                this.log("You found the treat! Loyalty +5");
                            } else {
                                this.stats.loyalty += 1;
                                this.log("Empty box. Loyalty +1");
                            }
                            this.endMinigame('loy');
                        };
                    });
                }
            },
            
            buyItem(type) {
                if (type === 'food') {
                    if (this.stats.gold >= 20) {
                        this.stats.gold -= 20;
                        this.stats.hunger = Math.min(100, this.stats.hunger + 50);
                        this.stats.energy = Math.min(100, this.stats.energy + 20);
                        this.log("Bought Premium Meat! Hunger +50, Energy +20.");
                    } else { this.log("Not enough gold."); }
                } else if (type === 'toy') {
                    if (this.stats.gold >= 30) {
                        this.stats.gold -= 30;
                        this.stats.happiness = Math.min(100, this.stats.happiness + 50);
                        this.stats.energy = Math.min(100, this.stats.energy + 10);
                        this.log("Bought Mystery Toy! Happiness +50, Energy +10.");
                    } else { this.log("Not enough gold."); }
                } else if (type === 'str') {
                    if (this.stats.gold >= 50) {
                        this.stats.gold -= 50;
                        this.stats.strength += 5;
                        this.log("Bought Power Bracer! Strength +5.");
                    } else { this.log("Not enough gold."); }
                } else if (type === 'spd') {
                    if (this.stats.gold >= 50) {
                        this.stats.gold -= 50;
                        this.stats.speed += 5;
                        this.log("Bought Swift Boots! Speed +5.");
                    } else { this.log("Not enough gold."); }
                }
                this.updateUI();
            },
            
            startBattle() {
                if (this.state === 'egg') return;
                if (this.stats.energy < 20) {
                    this.log("Dragon is too tired to battle.");
                    return;
                }
                this.stats.energy -= 20;
                this.stats.hunger = Math.max(0, this.stats.hunger - 10);
                
                this.battleState = {
                    playerMaxHp: 100 + this.stats.strength * 5,
                    enemyStr: Math.max(5, this.stats.strength - 2 + Math.floor(Math.random() * 5)),
                    enemySpd: Math.max(5, this.stats.speed - 2 + Math.floor(Math.random() * 5))
                };
                this.battleState.playerHp = this.battleState.playerMaxHp;
                this.battleState.enemyMaxHp = 100 + this.battleState.enemyStr * 5;
                this.battleState.enemyHp = this.battleState.enemyMaxHp;
                
                this.log(`A wild enemy dragon appears! (HP: ${this.battleState.enemyHp})`);
                
                this.isBusy = true;
                document.getElementById('controls').style.display = 'none';
                document.getElementById('battle-controls').style.display = 'flex';
                document.getElementById('btn-battle-special').style.display = (this.element === 'None') ? 'none' : 'inline-block';
                this.updateUI();
            },
            
            battleTurn(action) {
                if (action === 'flee') {
                    this.log("You fled the battle!");
                    this.endBattle(false);
                    return;
                }
                
                let playerDefending = (action === 'defend');
                let enemyDefending = (Math.random() < 0.3);
                
                if (action === 'attack') {
                    let hitChance = 0.8 + (this.stats.speed - this.battleState.enemySpd) * 0.05;
                    if (Math.random() < hitChance) {
                        let dmg = Math.max(1, this.stats.strength * 2 + Math.floor(Math.random() * 5));
                        if (enemyDefending) dmg = Math.floor(dmg / 2);
                        this.battleState.enemyHp -= dmg;
                        this.log(`You hit the enemy for ${dmg} damage!`);
                    } else {
                        this.log("You missed!");
                    }
                } else if (action === 'special') {
                    if (this.element === 'Fire') {
                        let dmg = Math.max(1, this.stats.strength * 3 + 10);
                        if (enemyDefending) dmg = Math.floor(dmg / 2);
                        this.battleState.enemyHp -= dmg;
                        this.log(`You used Fireball! Dealt ${dmg} damage.`);
                    } else if (this.element === 'Water') {
                        let heal = 30 + this.stats.loyalty;
                        this.battleState.playerHp = Math.min(this.battleState.playerMaxHp, this.battleState.playerHp + heal);
                        this.log(`You used Healing Stream! Restored ${heal} HP.`);
                    } else if (this.element === 'Earth') {
                        let dmg = Math.max(1, this.stats.strength * 2);
                        if (enemyDefending) dmg = Math.floor(dmg / 2);
                        this.battleState.enemyHp -= dmg;
                        this.battleState.enemySpd = Math.max(1, this.battleState.enemySpd - 5);
                        this.log(`You used Earthquake! Dealt ${dmg} damage and slowed enemy.`);
                    }
                } else if (action === 'defend') {
                    this.log("You are defending.");
                }
                
                if (this.battleState.enemyHp <= 0) {
                    this.log("Enemy dragon defeated!");
                    this.endBattle(true);
                    return;
                }
                
                if (!enemyDefending) {
                    let hitChance = 0.8 + (this.battleState.enemySpd - this.stats.speed) * 0.05;
                    if (Math.random() < hitChance) {
                        let dmg = Math.max(1, this.battleState.enemyStr * 2 + Math.floor(Math.random() * 5));
                        if (playerDefending) dmg = Math.floor(dmg / 2);
                        this.battleState.playerHp -= dmg;
                        this.log(`Enemy hit you for ${dmg} damage! (HP: ${this.battleState.playerHp}/${this.battleState.playerMaxHp})`);
                    } else {
                        this.log("Enemy missed!");
                    }
                } else {
                    this.log("Enemy is defending.");
                }
                
                if (this.battleState.playerHp <= 0) {
                    this.log("Your dragon was defeated and fled!");
                    this.endBattle(false);
                }
            },
            
            endBattle(won) {
                if (won) {
                    let goldGain = 20 + Math.floor(Math.random() * 20);
                    this.stats.gold += goldGain;
                    this.stats.happiness = Math.min(100, this.stats.happiness + 10);
                    this.log(`You won the battle and earned ${goldGain} gold!`);
                } else {
                    this.stats.happiness = Math.max(0, this.stats.happiness - 15);
                }
                this.battleState = null;
                this.isBusy = false;
                document.getElementById('battle-controls').style.display = 'none';
                document.getElementById('controls').style.display = 'flex';
                this.updateUI();
            },
            
            endMinigame(type) {
                this.isBusy = false;
                document.getElementById(`minigame-${type}`).style.display = 'none';
                document.getElementById('controls').style.display = 'flex';
                this.updateUI();
            },
            
            tick() {
                if (this.state === 'egg') return;
                
                this.stats.hunger = Math.max(0, this.stats.hunger - 2);
                this.stats.happiness = Math.max(0, this.stats.happiness - 1);
                this.stats.age += 1;
                
                if (this.stats.hunger < 20) this.log("Dragon is getting hungry...");
                if (this.stats.happiness < 20) this.log("Dragon is feeling sad...");
                
                if (this.state === 'dragon' && this.stats.age >= 10) {
                    this.state = 'adult';
                    let max = Math.max(this.feedCount, this.playCount, this.sleepCount);
                    if (max === this.feedCount) this.element = 'Earth';
                    else if (max === this.playCount) this.element = 'Fire';
                    else this.element = 'Water';
                    this.log(`Your baby dragon evolved into an ADULT ${this.element.toUpperCase()} DRAGON!`);
                }
                
                this.updateUI();
            }
        };
        
        Game.init();
    </script>
