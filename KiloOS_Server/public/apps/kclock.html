<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KClock - Clock, World Clock, Stopwatch, Timer & Alarms</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: hsl(220, 20%, 10%);
    --card-bg: hsl(220, 18%, 15%);
    --card-hover: hsl(220, 18%, 20%);
    --primary: hsl(200, 85%, 55%);
    --primary-hover: hsl(200, 85%, 65%);
    --accent-red: hsl(350, 80%, 60%);
    --accent-green: hsl(140, 70%, 50%);
    --border-color: rgba(255, 255, 255, 0.12);
    --text-main: #f0f4f8;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* Header & Navigation */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border-color);
    padding: 0 16px;
    height: 52px;
    flex-shrink: 0;
  }

  .tabs {
    display: flex;
    gap: 4px;
    height: 100%;
  }

  .tab {
    display: inline-flex;
    align-items: center;
    padding: 0 16px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    transition: all 0.2s ease;
    border: none;
    border-bottom: 3px solid transparent;
    background: transparent;
    outline: none;
  }

  .tab:hover, .tab:focus-visible {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.05);
  }

  .tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  /* Main Container */
  .content-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .tab-panel {
    display: none;
    width: 100%;
    height: 100%;
    padding: 24px;
    overflow-y: auto;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .tab-panel.active {
    display: flex;
  }

  /* Digital Displays */
  .digital-clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 0 0 24px rgba(56, 189, 248, 0.25);
  }

  .date-display {
    font-size: 15px;
    color: var(--text-muted);
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 500;
  }

  .tz-badge {
    margin-top: 12px;
    background: rgba(56, 189, 248, 0.1);
    color: var(--primary);
    border: 1px solid rgba(56, 189, 248, 0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button.btn {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 10px 24px;
    border-radius: 24px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
    outline: none;
  }

  button.btn:hover, button.btn:focus-visible {
    background: rgba(255, 255, 255, 0.18);
    transform: translateY(-1px);
  }

  button.btn.primary {
    background: var(--primary);
    color: #0f172a;
    border-color: var(--primary);
  }

  button.btn.primary:hover {
    background: var(--primary-hover);
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
  }

  button.btn.danger {
    background: rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.4);
  }

  button.btn.danger:hover {
    background: rgba(239, 68, 68, 0.4);
  }

  /* Inputs */
  input[type="number"], input[type="time"], input[type="text"], select {
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }

  input:focus, select:focus {
    border-color: var(--primary);
  }

  /* World Clock Cards */
  .world-clock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 900px;
    overflow-y: auto;
    padding: 8px;
  }

  .city-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: transform 0.2s, background 0.2s;
  }

  .city-card:hover {
    background: var(--card-hover);
    transform: translateY(-2px);
  }

  .city-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .city-name {
    font-weight: 700;
    font-size: 15px;
    color: #ffffff;
  }

  .city-daydiff {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
  }

  .city-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    margin-top: 4px;
    color: var(--primary);
  }

  .city-date {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Stopwatch & Timer Extras */
  .lap-container {
    margin-top: 20px;
    width: 100%;
    max-width: 400px;
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.2);
  }

  .lap-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }

  .timer-presets {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .preset-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .preset-btn:hover {
    background: rgba(56, 189, 248, 0.2);
    border-color: var(--primary);
  }

  /* Alarm List */
  .alarm-list {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 16px;
    overflow-y: auto;
  }

  .alarm-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px 20px;
  }

  .alarm-time {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 24px;
  }

  .alarm-card.disabled .alarm-time {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  /* Notification Modal Overlay */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-box {
    background: var(--card-bg);
    border: 2px solid var(--primary);
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 0 32px rgba(56, 189, 248, 0.4);
    animation: modalPop 0.3s ease-out;
  }

  @keyframes modalPop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-title {
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 8px;
  }

  .modal-desc {
    font-size: 16px;
    color: var(--primary);
    margin-bottom: 24px;
    font-weight: 600;
  }
</style>
</head>
<body>

  <!-- Top Header Navigation -->
  <div class="header">
    <div class="tabs" role="tablist" aria-label="Clock Tabs">
      <button class="tab active" role="tab" id="tab-btn-clock" aria-selected="true" aria-controls="tab-clock" onclick="switchTab('clock')">Clock</button>
      <button class="tab" role="tab" id="tab-btn-world" aria-selected="false" aria-controls="tab-world" onclick="switchTab('world')">World Clock</button>
      <button class="tab" role="tab" id="tab-btn-stopwatch" aria-selected="false" aria-controls="tab-stopwatch" onclick="switchTab('stopwatch')">Stopwatch</button>
      <button class="tab" role="tab" id="tab-btn-timer" aria-selected="false" aria-controls="tab-timer" onclick="switchTab('timer')">Timer</button>
      <button class="tab" role="tab" id="tab-btn-alarms" aria-selected="false" aria-controls="tab-alarms" onclick="switchTab('alarms')">Alarms</button>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="sound-toggle-btn" onclick="toggleSound()" aria-label="Toggle Sound">🔊 Sound On</button>
      <button class="icon-btn" id="format-toggle-btn" onclick="toggleFormat()" aria-label="Toggle 12/24 Hour Format">24H</button>
    </div>
  </div>

  <!-- Content Panels -->
  <div class="content-area">

    <!-- Tab 1: Local Clock -->
    <div id="tab-clock" class="tab-panel active" role="tabpanel" aria-labelledby="tab-btn-clock">
      <div class="digital-clock" id="main-clock">00:00:00</div>
      <div class="date-display" id="main-date">Loading...</div>
      <div class="tz-badge" id="tz-display">Local Timezone</div>
    </div>

    <!-- Tab 2: World Clock -->
    <div id="tab-world" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-world" style="justify-content: flex-start;">
      <div style="margin-bottom: 16px; display: flex; gap: 10px; width: 100%; max-width: 900px;">
        <select id="city-select" style="flex: 1;">
          <option value="America/New_York">New York (EDT/EST)</option>
          <option value="Europe/London">London (BST/GMT)</option>
          <option value="Europe/Paris">Paris (CEST/CET)</option>
          <option value="Asia/Tokyo">Tokyo (JST)</option>
          <option value="Australia/Sydney">Sydney (AEST/AEDT)</option>
          <option value="Asia/Kolkata">New Delhi (IST)</option>
          <option value="Pacific/Honolulu">Honolulu (HST)</option>
          <option value="America/Los_Angeles">Los Angeles (PDT/PST)</option>
          <option value="UTC">UTC (Coordinated Universal Time)</option>
        </select>
        <button class="btn primary" onclick="addWorldCity()">Add City</button>
      </div>
      <div class="world-clock-grid" id="world-grid"></div>
    </div>

    <!-- Tab 3: Stopwatch -->
    <div id="tab-stopwatch" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-stopwatch">
      <div class="digital-clock" id="stopwatch-display">00:00.00</div>
      <div class="btn-row">
        <button onclick="toggleStopwatch()" id="sw-btn" class="btn primary">Start</button>
        <button onclick="lapStopwatch()" id="sw-lap-btn" class="btn">Lap</button>
        <button onclick="resetStopwatch()" class="btn">Reset</button>
      </div>
      <div class="lap-container" id="lap-container" style="display:none;">
        <div id="lap-list"></div>
      </div>
    </div>

    <!-- Tab 4: Timer -->
    <div id="tab-timer" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-timer">
      <div class="digital-clock" id="timer-display">05:00</div>
      
      <div class="timer-presets">
        <button class="preset-btn" onclick="setTimerPreset(1)">1 min</button>
        <button class="preset-btn" onclick="setTimerPreset(5)">5 min</button>
        <button class="preset-btn" onclick="setTimerPreset(10)">10 min</button>
        <button class="preset-btn" onclick="setTimerPreset(15)">15 min</button>
        <button class="preset-btn" onclick="setTimerPreset(30)">30 min</button>
      </div>

      <div style="margin-top: 16px; display: flex; align-items: center; gap: 8px;">
        <label for="timer-mins" style="font-size: 14px; color: var(--text-muted);">Custom Mins:</label>
        <input type="number" id="timer-mins" value="5" min="1" max="999" style="width: 70px; text-align: center;">
      </div>

      <div class="btn-row">
        <button onclick="toggleTimer()" id="tm-btn" class="btn primary">Start</button>
        <button onclick="resetTimer()" class="btn">Reset</button>
      </div>
    </div>

    <!-- Tab 5: Alarms -->
    <div id="tab-alarms" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-alarms" style="justify-content: flex-start;">
      <div style="display: flex; gap: 10px; align-items: center; width: 100%; max-width: 500px;">
        <input type="time" id="alarm-time" style="flex: 1;" value="08:00">
        <input type="text" id="alarm-label" placeholder="Alarm label (optional)" style="flex: 1.5;">
        <button onclick="addAlarm()" class="btn primary">Add Alarm</button>
      </div>
      <div class="alarm-list" id="alarm-list"></div>
    </div>

  </div>

  <!-- Non-Blocking Alert Modal Overlay -->
  <div class="modal-overlay" id="alert-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-title" id="modal-title">⏰ Alarm</div>
      <div class="modal-desc" id="modal-desc">Time is up!</div>
      <div class="btn-row" style="margin-top: 0;">
        <button class="btn primary" onclick="dismissModal()">Dismiss</button>
        <button class="btn" id="snooze-btn" onclick="snoozeAlarm()" style="display:none;">Snooze 5m</button>
      </div>
    </div>
  </div>

  <script>
    // System & Audio Settings
    let soundEnabled = true;
    let use24Hour = false;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    document.addEventListener('click', initAudio, { once: true });

    function playChime(frequencies = [587.33, 880], duration = 0.25) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      try {
        frequencies.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          
          const now = audioCtx.currentTime + (idx * duration);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration - 0.02);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + duration);
        });
      } catch (e) {
        console.warn('Audio playback error:', e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-toggle-btn');
      btn.innerText = soundEnabled ? '🔊 Sound On' : '🔇 Muted';
    }

    function toggleFormat() {
      use24Hour = !use24Hour;
      document.getElementById('format-toggle-btn').innerText = use24Hour ? '12H' : '24H';
      updateClock();
      updateWorldClock();
    }

    // Navigation Tabs
    const tabOrder = ['clock', 'world', 'stopwatch', 'timer', 'alarms'];
    
    function switchTab(tabId) {
      tabOrder.forEach(id => {
        const btn = document.getElementById('tab-btn-' + id);
        const panel = document.getElementById('tab-' + id);
        if (id === tabId) {
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          panel.classList.add('active');
        } else {
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
          panel.classList.remove('active');
        }
      });
    }

    // Keyboard accessibility for tablist
    document.querySelector('.tabs').addEventListener('keydown', (e) => {
      const activeBtn = document.activeElement;
      const currentId = activeBtn.id ? activeBtn.id.replace('tab-btn-', '') : null;
      let index = tabOrder.indexOf(currentId);
      if (index === -1) return;

      if (e.key === 'ArrowRight') {
        index = (index + 1) % tabOrder.length;
        switchTab(tabOrder[index]);
        document.getElementById('tab-btn-' + tabOrder[index]).focus();
      } else if (e.key === 'ArrowLeft') {
        index = (index - 1 + tabOrder.length) % tabOrder.length;
        switchTab(tabOrder[index]);
        document.getElementById('tab-btn-' + tabOrder[index]).focus();
      }
    });

    // --- Tab 1: Local Clock ---
    function updateClock() {
      const now = new Date();
      const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: !use24Hour };
      document.getElementById('main-clock').innerText = now.toLocaleTimeString('en-US', options);
      document.getElementById('main-date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      
      try {
        const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
        document.getElementById('tz-display').innerText = tzName;
      } catch (e) {
        document.getElementById('tz-display').innerText = 'Local Time';
      }

      checkAlarms(now);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Tab 2: World Clock ---
    let worldCities = [
      'America/New_York',
      'Europe/London',
      'Asia/Tokyo',
      'Australia/Sydney'
    ];

    function addWorldCity() {
      const sel = document.getElementById('city-select').value;
      if (!worldCities.includes(sel)) {
        worldCities.push(sel);
        updateWorldClock();
      }
    }

    function removeWorldCity(tz) {
      worldCities = worldCities.filter(c => c !== tz);
      updateWorldClock();
    }

    function updateWorldClock() {
      const grid = document.getElementById('world-grid');
      grid.innerHTML = '';
      const now = new Date();

      worldCities.forEach(tz => {
        try {
          const timeStr = now.toLocaleTimeString('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: !use24Hour });
          const dateStr = now.toLocaleDateString('en-US', { timeZone: tz, weekday: 'short', month: 'short', day: 'numeric' });
          
          // Calculate day difference bound relative to local day
          const localDay = now.getDate();
          const targetDayStr = now.toLocaleDateString('en-US', { timeZone: tz, day: 'numeric' });
          const targetDay = parseInt(targetDayStr, 10);
          
          let dayDiffLabel = 'Today';
          if (targetDay !== localDay) {
            // Check month roll boundary roughly
            const localHour = now.getHours();
            const targetHourStr = now.toLocaleTimeString('en-US', { timeZone: tz, hour: '2-digit', hour12: false });
            const targetHour = parseInt(targetHourStr, 10);
            if (targetHour > localHour || (targetDay > localDay && !(localDay > 25 && targetDay === 1))) {
              dayDiffLabel = '+1 Day';
            } else {
              dayDiffLabel = '-1 Day';
            }
          }

          const card = document.createElement('div');
          card.className = 'city-card';
          const cityName = tz.split('/')[1] ? tz.split('/')[1].replace('_', ' ') : tz;
          
          card.innerHTML = `
            <div class="city-header">
              <span class="city-name">${cityName}</span>
              <span class="city-daydiff">${dayDiffLabel}</span>
            </div>
            <div class="city-time">${timeStr}</div>
            <div class="city-date">${dateStr} (${tz})</div>
            <button onclick="removeWorldCity('${tz}')" class="btn danger" style="margin-top: 8px; padding: 2px 8px; font-size: 11px; align-self: flex-end;">Remove</button>
          `;
          grid.appendChild(card);
        } catch (e) {
          console.warn('World clock calculation error for timezone:', tz, e);
        }
      });
    }
    setInterval(updateWorldClock, 1000);
    updateWorldClock();

    // --- Tab 3: Stopwatch ---
    let swStart = 0;
    let swElapsed = 0;
    let swRaf = null;
    let swRunning = false;
    let swLapCount = 0;
    let swLastLapTime = 0;

    function formatSw(ms) {
      const totalSec = Math.floor(ms / 1000);
      const mins = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const secs = (totalSec % 60).toString().padStart(2, '0');
      const centis = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
      return `${mins}:${secs}.${centis}`;
    }

    function renderSw() {
      if (swRunning) {
        const current = Date.now() - swStart + swElapsed;
        document.getElementById('stopwatch-display').innerText = formatSw(current);
        swRaf = requestAnimationFrame(renderSw);
      }
    }

    function toggleStopwatch() {
      if (swRunning) {
        swElapsed += Date.now() - swStart;
        cancelAnimationFrame(swRaf);
        swRunning = false;
        document.getElementById('sw-btn').innerText = 'Start';
        document.getElementById('sw-btn').classList.add('primary');
      } else {
        swStart = Date.now();
        swRunning = true;
        renderSw();
        document.getElementById('sw-btn').innerText = 'Stop';
        document.getElementById('sw-btn').classList.remove('primary');
      }
    }

    function lapStopwatch() {
      if (swRunning) {
        swLapCount++;
        const current = Date.now() - swStart + swElapsed;
        const splitTime = current - swLastLapTime;
        swLastLapTime = current;

        const container = document.getElementById('lap-container');
        container.style.display = 'block';
        
        const list = document.getElementById('lap-list');
        const row = document.createElement('div');
        row.className = 'lap-row';
        row.innerHTML = `<span>Lap ${swLapCount}</span> <span>+${formatSw(splitTime)}</span> <span>${formatSw(current)}</span>`;
        list.prepend(row);
      }
    }

    function resetStopwatch() {
      swRunning = false;
      cancelAnimationFrame(swRaf);
      swElapsed = 0;
      swLapCount = 0;
      swLastLapTime = 0;
      document.getElementById('stopwatch-display').innerText = '00:00.00';
      document.getElementById('lap-list').innerHTML = '';
      document.getElementById('lap-container').style.display = 'none';
      document.getElementById('sw-btn').innerText = 'Start';
      document.getElementById('sw-btn').classList.add('primary');
    }

    // --- Tab 4: Timer ---
    let tmStart = 0;
    let tmDuration = 0;
    let tmRemaining = 0;
    let tmInterval = null;
    let tmRunning = false;

    function formatTm(ms) {
      if (ms < 0) ms = 0;
      const totalSec = Math.ceil(ms / 1000);
      const mins = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const secs = (totalSec % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function setTimerPreset(mins) {
      document.getElementById('timer-mins').value = mins;
      resetTimer();
      tmDuration = mins * 60000;
      tmRemaining = tmDuration;
      document.getElementById('timer-display').innerText = formatTm(tmDuration);
    }

    function updateTmDisplay() {
      const current = tmRunning ? tmDuration - (Date.now() - tmStart) : tmRemaining;
      if (current <= 0 && tmRunning) {
        clearInterval(tmInterval);
        tmRunning = false;
        tmRemaining = 0;
        document.getElementById('timer-display').innerText = "00:00";
        document.getElementById('tm-btn').innerText = 'Start';
        document.getElementById('tm-btn').classList.add('primary');
        
        playChime([600, 800, 1000], 0.3);
        showModal("⏲️ Timer Finished!", "Your timer countdown has completed.");
      } else {
        document.getElementById('timer-display').innerText = formatTm(current);
      }
    }

    function toggleTimer() {
      if (tmRunning) {
        tmRemaining = tmDuration - (Date.now() - tmStart);
        clearInterval(tmInterval);
        tmRunning = false;
        document.getElementById('tm-btn').innerText = 'Resume';
        document.getElementById('tm-btn').classList.add('primary');
      } else {
        if (tmRemaining <= 0) {
          let mins = parseInt(document.getElementById('timer-mins').value, 10) || 5;
          if (mins < 1) mins = 1;
          if (mins > 999) mins = 999;
          tmDuration = mins * 60000;
          tmRemaining = tmDuration;
        } else {
          tmDuration = tmRemaining;
        }
        if (tmDuration > 0) {
          tmStart = Date.now();
          tmInterval = setInterval(updateTmDisplay, 100);
          tmRunning = true;
          document.getElementById('tm-btn').innerText = 'Pause';
          document.getElementById('tm-btn').classList.remove('primary');
        }
      }
    }

    function resetTimer() {
      tmRunning = false;
      clearInterval(tmInterval);
      tmRemaining = 0;
      let mins = parseInt(document.getElementById('timer-mins').value, 10) || 5;
      document.getElementById('timer-display').innerText = formatTm(mins * 60000);
      document.getElementById('tm-btn').innerText = 'Start';
      document.getElementById('tm-btn').classList.add('primary');
    }

    // --- Tab 5: Alarms ---
    let alarms = [];
    let activeAlarmIndex = -1;

    function addAlarm() {
      const timeVal = document.getElementById('alarm-time').value;
      const labelVal = document.getElementById('alarm-label').value.trim() || 'Alarm';
      if (!timeVal) return;

      if (!alarms.some(a => a.time === timeVal && a.label === labelVal)) {
        alarms.push({ time: timeVal, label: labelVal, active: true, triggered: false });
        renderAlarms();
        document.getElementById('alarm-label').value = '';
      }
    }

    function toggleAlarm(index) {
      alarms[index].active = !alarms[index].active;
      alarms[index].triggered = false;
      renderAlarms();
    }

    function deleteAlarm(index) {
      alarms.splice(index, 1);
      renderAlarms();
    }

    function renderAlarms() {
      const list = document.getElementById('alarm-list');
      list.innerHTML = '';

      alarms.sort((a, b) => a.time.localeCompare(b.time)).forEach((a, i) => {
        const card = document.createElement('div');
        card.className = `alarm-card ${a.active ? '' : 'disabled'}`;
        card.innerHTML = `
          <div>
            <div class="alarm-time">${a.time}</div>
            <div style="font-size: 12px; color: var(--text-muted);">${a.label}</div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="btn" onclick="toggleAlarm(${i})">${a.active ? 'Disable' : 'Enable'}</button>
            <button class="btn danger" onclick="deleteAlarm(${i})">Delete</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function checkAlarms(now) {
      const hh = now.getHours().toString().padStart(2, '0');
      const mm = now.getMinutes().toString().padStart(2, '0');
      const hhmm = `${hh}:${mm}`;

      alarms.forEach((a, index) => {
        if (a.active && a.time === hhmm && !a.triggered) {
          a.triggered = true;
          activeAlarmIndex = index;
          playChime([523.25, 659.25, 783.99], 0.35);
          showModal(`⏰ ${a.label}`, `Alarm set for ${a.time}`, true);
        }
        if (a.time !== hhmm) {
          a.triggered = false;
        }
      });
    }

    function snoozeAlarm() {
      dismissModal();
      if (activeAlarmIndex >= 0 && alarms[activeAlarmIndex]) {
        const now = new Date(Date.now() + 5 * 60000);
        const hh = now.getHours().toString().padStart(2, '0');
        const mm = now.getMinutes().toString().padStart(2, '0');
        alarms.push({
          time: `${hh}:${mm}`,
          label: `${alarms[activeAlarmIndex].label} (Snoozed)`,
          active: true,
          triggered: false
        });
        renderAlarms();
      }
    }

    // --- Modal Non-Blocking Notification System ---
    let alertAudioLoop = null;

    function showModal(title, desc, allowSnooze = false) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('snooze-btn').style.display = allowSnooze ? 'inline-block' : 'none';
      document.getElementById('alert-modal').classList.add('active');

      if (soundEnabled) {
        if (alertAudioLoop) clearInterval(alertAudioLoop);
        alertAudioLoop = setInterval(() => {
          playChime([587.33, 880], 0.2);
        }, 1200);
      }
    }

    function dismissModal() {
      document.getElementById('alert-modal').classList.remove('active');
      if (alertAudioLoop) {
        clearInterval(alertAudioLoop);
        alertAudioLoop = null;
      }
    }
  </script>
</body>
</html>
