<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KiloApps Visual Audit & Performance Gallery</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --pass: #238636;
      --warn: #d29922;
      --fail: #da3633;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 24px; color: #fff; margin-bottom: 8px; }
    p.sub { color: var(--text-muted); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
    }
    .app-card:hover { transform: translateY(-3px); }
    .card-warn { border-color: var(--warn); }
    .card-fail { border-color: var(--fail); }
    .card-img-wrap {
      width: 100%;
      height: 180px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .card-header h3 { font-size: 16px; color: #fff; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-pass { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid var(--pass); }
    .badge-warn { background: rgba(210, 153, 34, 0.2); color: #e3b341; border: 1px solid var(--warn); }
    .badge-fail { background: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid var(--fail); }
    .card-metrics {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 6px;
    }
    .card-metrics strong { color: #fff; }
    .card-errors {
      font-size: 11px;
      color: #f85149;
      background: rgba(218, 54, 51, 0.1);
      padding: 4px;
      border-radius: 4px;
      font-family: monospace;
    }
    .card-actions { margin-top: auto; padding-top: 8px; }
    .play-btn {
      display: block;
      text-align: center;
      background: #21262d;
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .play-btn:hover { background: #30363d; }
  </style>
</head>
<body>
  <header>
    <h1>KiloApps Visual Audit & Performance Gallery</h1>
    <p class="sub">Automated headless visual capture and 60 FPS pacing analysis across all registered web applications.</p>
  </header>
  <div class="grid">
    
      <div class="app-card ">
        <div class="card-img-wrap">
          <img src="screenshots/contribute.png" alt="CONTRIBUTE" loading="lazy">
        </div>
        <div class="card-body">
          <div class="card-header">
            <h3>CONTRIBUTE</h3>
            <span class="badge badge-pass">60 FPS PASS</span>
          </div>
          <div class="card-metrics">
            <span>FPS: <strong>60</strong></span>
            <span>Max Delta: <strong>17ms</strong></span>
            <span>Size: <strong>14 KB</strong></span>
          </div>
          <div class="card-metrics">
            <span>Interactive: <strong>4</strong></span>
            <span>Clicked: <strong>1</strong></span>
            <span>Reactive: <strong>1/1</strong></span>
          </div>
          
          <div class="card-actions">
            <a href="../../KiloOS/public/apps/contribute.html" target="_blank" class="play-btn">▶ Play App</a>
          </div>
        </div>
      </div>
    
  </div>
</body>
</html>
